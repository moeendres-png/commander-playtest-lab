technical_decisions:
- 'STATE_REPAIR (2026-09-27, identity field): the `ownership` field held the descriptive
  sentence "WSR23 is the sole writer of branch wsr23/project-integration-hygiene-20260927
  in worktree /home/moeen/code/wsr23-project-integration-hygiene. Its mutation surface
  is docs/project_integration_hygiene_20260927/** plus exactly one existing file,
  docs/foundry-execution/GOVERNANCE_SUPERSESSION.md. Verified disjoint from the diffs
  of PR #260, #261, #262 and the WSR22 branch." `ownership` is an identity token:
  bootstrap.py compares it to the launching workstream and safe_push.py records it
  as the push task id, so prose is a different value from the token and the bootstrap
  gate refused with BOOTSTRAP_FAIL / LAUNCH_REFUSED. The field now holds the exact
  workstream identity `wsr23-project-integration-hygiene-20260927`; this entry preserves
  the original sentence verbatim, and its substance is unchanged in WORKSTREAM_CONTRACT.md,
  in_scope and files_modified.'
- Built a lock-faithful venv outside the worktree instead of changing repository dependencies,
  so validation matches CI and the working tree stays clean.
- 'Declined to add a repository link checker under the reuse-first gate: it would
  add a permanent maintenance surface for a defect class with zero live instances.'
- 'Declined to add a test asserting AGENTS.md section numbers, because open PR #261
  is editing AGENTS.md right now and such a test would create a new CI failure on
  an active surface.'
- 'Corrected the delegated PR audit''s over-broad claim on PR #162 by re-running the
  blob comparison and narrowing the integrated scope to the WS-47 deliverable before
  classifying it.'
- 'Downgraded PRs #163 and #164 from ACTIVE_CURRENT_WORK to STALE_BUT_UNADJUDICATED:
  their only ''active'' evidence was a 2026-09-10 handoff sentence, and their branch
  heads are not descendants of their own PR heads.'
- Chose NOT_READY over PUBLICATION_READY for every foreign unpublished branch, because
  section 12 conditions 9 and 10 cannot be proven for any of them.
- Did not self-acquire the Foundry writer lock to satisfy safe_push gate 6. Doing
  so would make this process the recorded holder and would let any process self-authorize
  as a worktree's exclusive writer, collapsing the single-writer guarantee the Foundry
  ownership model depends on. Recorded BLOCKED_BY_PUSH_POLICY_GATE with exactly one
  verified safe command instead.
- 'Absorbed three mid-run main merges (#261, #260, #268) by fetching, adjudicating
