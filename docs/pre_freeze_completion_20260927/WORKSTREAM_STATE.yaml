      runs under a real wall-clock deadline via a bounded reader thread, because the
      stream is a buffered TextIOWrapper whose fd readiness does not imply a complete
      line. On expiry the child is terminated and reaped, TIMEOUT is recorded, and
      BridgeTimeout is raised as a BridgeLaunchError subclass.
