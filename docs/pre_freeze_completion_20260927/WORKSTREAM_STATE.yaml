technical_decisions:
- Main was merged as the base and main moved three times during the WSR23 stage, so
  this branch binds the exact post-merge main 7d50937d TREE 15c47157 rather than the
  Coordinator-stated 8d2aacd5 or the dispatch-prompt b786fbf2.
- 'All 41 transplanted paths are new to main, so the transplant cannot regress newer
  content. The five paths WSR22 also modified are handled deliberately rather than
  bulk-copied: the receipt is written fresh, the live pins move with their subject,
  and the two manifests are recomputed.'
- byte_identity_claim moves false -> true. That is a stronger claim backed by a recorded
  sha256 and an independent re-fetch, not a weakened assertion.
- The superseded 2026-08-07 receipt is preserved in a supersedes block with its original
  schema version, effective date, byte-exact status and the reason it was wrong, so
  the correction is auditable rather than silent.
- The 4 strict-mypy errors in the transplanted package are fixed by narrowing. Suppressing
  them would have hidden exactly the kind of gap CI exists to catch.
- Did not resolve the P1 threads to force a merge. The ruleset requires thread resolution
  and section 10 forbids an unresolved P1/P2 at merge; resolving them dishonestly
  would integrate fabricated evidence into canonical main, which is a far worse outcome
  than an unmerged PR.
- Resealed the three SOURCE_LOCK contract_blobs I invalidated, and recorded a known_evidence_defects
  block inside the lock itself, so the defect travels with the artifact instead of
  living only in a PR comment that a later session might never read.
