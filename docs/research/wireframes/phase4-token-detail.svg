<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chulane Token- und Decision-Fokus" viewBox="0 0 1280 800"><title>Chulane Token- und Decision-Fokus</title><desc>Erweitertes Clue-Token-Band, vollständige Details auf Anforderung und transparente XMage-Entscheidungen.</desc><rect width="1280" height="800" fill="#101d2a"/><style>text{font-family:Inter,Arial,sans-serif}</style><rect x="20" y="16" width="1240" height="56" rx="10" fill="#162a3a" stroke="#456275" stroke-width="1.6"/><text x="40" y="51" font-size="21" fill="#eef4f9" font-weight="700">Commander Playtest Lab · 4 Spieler · Token-Fokus</text><rect x="1010" y="27" width="226" height="34" rx="8" fill="#263c4b" stroke="#3e657c" stroke-width="1.6"/><text x="1022" y="50" font-size="14" fill="#e4edf7" font-weight="500">XMage · Entscheidungsfenster</text><rect x="20" y="88" width="625" height="576" rx="12" fill="#1b3240" stroke="#5e8896" stroke-width="1.6"/><text x="40" y="122" font-size="23" fill="#effaf5" font-weight="700">Chulane · großes Battlefield</text><rect x="38" y="146" width="584" height="102" rx="12" fill="#234c57" stroke="#70a7af" stroke-width="1.6"/><text x="56" y="184" font-size="20" fill="#e4edf7" font-weight="500">Kreaturen</text><rect x="55" y="196" width="166" height="34" rx="8" fill="#273d50" stroke="#3e657c" stroke-width="1.6"/><text x="67" y="219" font-size="14" fill="#e4edf7" font-weight="500">13 sichtbar · 4 gruppiert</text><rect x="38" y="263" width="584" height="102" rx="12" fill="#294f50" stroke="#70a7af" stroke-width="1.6"/><text x="56" y="300" font-size="21" fill="#e5f6e9" font-weight="700">Clues × 24</text><rect x="55" y="315" width="178" height="34" rx="8" fill="#273d50" stroke="#3e657c" stroke-width="1.6"/><text x="67" y="338" font-size="14" fill="#e4edf7" font-weight="500">Gruppe öffnen · 24</text><rect x="260" y="315" width="187" height="34" rx="8" fill="#273d50" stroke="#3e657c" stroke-width="1.6"/><text x="272" y="338" font-size="14" fill="#e4edf7" font-weight="500">Fokus auf Quellen</text><rect x="38" y="383" width="584" height="102" rx="12" fill="#294f50" stroke="#70a7af" stroke-width="1.6"/><text x="56" y="418" font-size="21" fill="#e4edf7" font-weight="500">Treasures × 11</text><rect x="55" y="436" width="159" height="34" rx="8" fill="#273d50" stroke="#3e657c" stroke-width="1.6"/><text x="67" y="459" font-size="14" fill="#e4edf7" font-weight="500">Details anzeigen</text><rect x="38" y="502" width="584" height="144" rx="12" fill="#283f4b" stroke="#63869a" stroke-width="1.6"/><text x="56" y="541" font-size="21" fill="#e4edf7" font-weight="500">Länder × 10 · freie Fläche</text><text x="56" y="569" font-size="15" fill="#e4edf7" font-weight="500">Kein einzelner visueller Marker pro Token nötig</text><text x="56" y="593" font-size="14" fill="#aed5d2" font-weight="500">Engine kennt alle 24 individuellen Objekte</text><rect x="665" y="88" width="595" height="325" rx="12" fill="#1b3444" stroke="#5e8c9d" stroke-width="1.6"/><text x="687" y="125" font-size="21" fill="#f4fafb" font-weight="700">XMAGE DECISION – legal, id-gebunden</text><text x="687" y="167" font-size="17" fill="#e4edf7" font-weight="500">Wähle die Aktion auf einem bestimmten Clue:</text><rect x="687" y="194" width="240" height="34" rx="8" fill="#273d50" stroke="#3e657c" stroke-width="1.6"/><text x="699" y="217" font-size="14" fill="#e4edf7" font-weight="500">Clue A · Opfern</text><rect x="934" y="194" width="289" height="34" rx="8" fill="#273d50" stroke="#3e657c" stroke-width="1.6"/><text x="946" y="217" font-size="14" fill="#e4edf7" font-weight="500">Andere verfügbare Optionen</text><text x="687" y="265" font-size="16" fill="#c8e9de" font-weight="500">Nur angezeigte Optionen sind ausführbar.</text><text x="687" y="294" font-size="15" fill="#e4edf7" font-weight="500">UI erzeugt keine eigenen Mana- oder Zielregeln.</text><rect x="665" y="429" width="595" height="235" rx="12" fill="#1b3444" stroke="#5e8c9d" stroke-width="1.6"/><text x="687" y="465" font-size="21" fill="#f4fafb" font-weight="700">Ereignislog / Details</text><text x="687" y="506" font-size="15" fill="#e4edf7" font-weight="500">Clue erzeugt · Trigger aufgelöst · Ziel gewählt</text><text x="687" y="538" font-size="14" fill="#e4edf7" font-weight="500">Objekt-IDs bleiben separat, auch wenn gerendert gruppiert.</text><text x="687" y="568" font-size="15" fill="#c8e9de" font-weight="500">Keine Informationen aus fremder Hand/Bibliothek.</text><rect x="20" y="682" width="1240" height="65" rx="12" fill="#1d3d42" stroke="#78b4a0" stroke-width="1.6"/><text x="41" y="720" font-size="20" fill="#e9fff3" font-weight="700">UX-Grundsatz: Darstellung gruppieren, XMage-Spielobjekte niemals zusammenlegen.</text><text x="24" y="783" font-size="13" fill="#8ca6b8" font-weight="500">Konzept, keine laufende Anwendung · Pinned XMage = einzige Regelautorität</text></svg>
