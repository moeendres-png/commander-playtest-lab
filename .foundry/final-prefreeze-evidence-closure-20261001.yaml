technical_decisions:
- 'AF04 (Forge): the same-epoch PLAYER_CARDINALITY_FORGE decision tape records externally
  answered STARTING_PLAYER/MULLIGAN/PRIORITY frames at 2P-6P with per-frame actor+revision
  and engine-offered option ids, and every answered frame has a recorded engine acceptance
  payload. The assembler hard-code was therefore replaced by a measured derivation
  (decision_boundary.derive_decision_boundary). Both candidates derive PASS from real
  evidence; XMage is strengthened, not weakened.'
- 'MULLIGAN is not option-id-addressed at the harness boundary on either candidate:
  XMage filters the offered mulligan actions by metadata.option_type and Forge filters
  the parked frame by isKeep, and both engines reject a mismatched actor/revision.
  The derivation therefore requires the engine executed option (XMage) or the engine
  executed flag plus the keep-all actor progression (Forge) instead of a raw chosen
  option id.'
- Successor contract 1.0.7 re-applies all overlays to the same 1.0.5 base; the record
  shape is unchanged so the materialization schema version moved with it but the predecessor
  contract is preserved byte-for-byte.
- 'The typed unsupported-decision refusal is a control-plane mechanism (not a new
  Protocol-2 message): Protocol 2.0.0 has no refusal message, adding one would change
  the shared transport for both candidates, and the obligation is about handler behaviour.
  No-mutation is proven from the transport window and the unchanged event offset/pending
  decision.'
- 'Three corrected rows (MICRO_COSTS, PILOT_TARGET_AMOUNT, PILOT_MULTI_AMOUNT) are
  not registered in the lane: the engine frame is a multi-select choose_targets offer
  followed by the assignment leg, and implementing a divided-damage selector without
  a negative control risks a wrong-reason PASS. Left UNKNOWN with the exact mechanism
  observed on the production lane.'
- 'Pin drift (#446/#447) was classified RELEVANT_REQUALIFICATION_REQUIRED: current
  main was merged normally and the PB-03 workflow was re-run on the merged head rather
  than carrying the #441-locked-pin results forward. The superseded workstream epochs
  remain in branch history only.'
