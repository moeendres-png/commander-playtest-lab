objective: >-
  Issue #689 follow-up repair. S1 in the decision-class matrix must prove that the
  value each native callback returned to, or applied in, XMage is the value
  derived from the option the pilot actually selected, and the branch must pass
  CI. Close the blocking review findings on feat/689-s1-native-return-witness:
  P1 the target witness recorded response.selectedOptionIds() instead of the ids
  XMage actually applied (a callback adding a different offered id, or an add
  vetoed by replaceEvent(TargetEvent), passed S1); P1 the workstream state file
  did not parse and carried no schema 2.0 fields; P2 assertManaPoolSpent never
  ran because the only mana_payment scenario reaches the frame with an empty
  pool; P2 cardinalityAccepted skipped assertNativeReturn for the empty and
  multi-selection S1 acceptances; P3 the answered offset was read after engine
  work that can raise a nested frame; P3 the pile expectation read the display
  label and the tapped-source check silently skipped on a null source.
