technical_decisions:
- The target witness records the ids the engine actually applied, derived by
  snapshotting target.getTargets() before the add loop and diffing after it, so a
  vetoed add (TargetImpl.addTarget runs game.replaceEvent first and puts nothing when
  it is vetoed) or an add of a different offered id is visible to S1.
- The answered offset is read immediately after request() returns, before
  addTarget/add can run game.replaceEvent and bind a nested frame.
- chooseMode records its null return, so an empty-selection acceptance is witnessed
  rather than reading as "no callback answered".
- The pool-delta check runs through a scenario that actually floats mana, because
  the pool branch was previously unreachable.
