  foundry.state.validate returns an empty error list.
- >-
  classification LOCAL_OBSERVED, P1-a paired red control (the decisive one). The
  identical deliberate mis-route (the target callback additionally applies a
  different offered id; nothing else changed) was run against both recordings.
  With the 8002ea2 recording (response.selectedOptionIds() recorded as the
  applied set) the matrix was EXIT=0, Tests run 28, Failures 0 - the hole the
  finding describes, observed directly. With the repaired recording the same
  mis-route is EXIT=1, exactly 1 failure, all of it in the new assertion:
  "choose_object S1 empty selection: the ids applied to the native target must
  be the selected options ==> expected: <[]> but was: <[9b7ab86e-...]>".
- >-
  classification LOCAL_OBSERVED, P1-a permanent control non-vacuity: with the
  applied-ids comparison removed, targetNativeReturnRejectsIdsTheEngineNeverApplied
  is EXIT=1, "a callback that applied a different offered id must fail S1 ==>
  Expected java.lang.AssertionError to be thrown, but nothing was thrown."
- >-
  classification LOCAL_OBSERVED, P2 pool branch reachability. The only
  mana_payment scenario reached the frame with an empty pool. A temporary probe
  in the pool branch proved the repaired scenario really executes it:
  "PROBE-POOL-BRANCH-RAN red before=BLACK=0;BLUE=0;GREEN=0;RED=1;WHITE=0;COLORLESS=0;",
  EXIT=1 by the probe itself; probe reverted. Mechanism: userData
  .setManaPoolAutomatic(false) leaves XMage's ManaCostsImpl.pay asking playMana
  again after a land is tapped, and ManaCostsImpl.assignPayment returns early
  while no mana type is unlocked, so the tapped mana reaches the next frame as
  a pool option.
- >-
  classification LOCAL_OBSERVED, P2 permanent control non-vacuity: with the
  pool-delta comparison removed, manaPoolDeltaRejectsASpendThatDidNotHappen is
  EXIT=1, "an unspent pool must fail the delta check ==> Expected
  java.lang.AssertionError to be thrown, but nothing was thrown."
- >-
  classification LOCAL_OBSERVED, P2 latent defect found by making the branch
  reachable: assertManaPoolSpent compared the option's mana_type
  (ManaType.toString(), "red") against a signature keyed by ManaType.name()
  ("RED"), so it threw IllegalArgument "No enum constant
  mage.constants.ManaType.red" instead of comparing anything. Repaired by
  resolving both sides to the ManaType enum. This is a real defect the finding's
  scenario exposed; it could not have been observed while the branch was dead.
- >-
  classification LOCAL_OBSERVED, P3 pile: the selected pile's engine card ids
  are recorded beside the boolean and compared to the offered pile. Probe of the
  live matrix: "Pile 2 offered=[d34e09b1-..., 085a6896-..., 3fc58c43-...,
  9022fcf5-..., 05752dfb-...] chosen=[same five ids]" - a 5-card pile, so the
  comparison is substantive, and Pile 1 is legitimately empty because the
  scripted separating player selects nothing.
- >-
  classification LOCAL_OBSERVED, red controls that turned red OUTSIDE the new
  assertion are recorded as collateral and were not used as evidence: replacing
  the selected id instead of adding one derails the whole game (24-27 failures),
  vetoing every add ends the engine terminal, and unlocking a different pool
  type loops payment. The accepted controls are the paired applied-ids control
  above and the two non-vacuity neuterings.
