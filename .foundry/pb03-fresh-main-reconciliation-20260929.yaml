  - "PROBE: canonical launch plan (bridge_launcher lane=midgame, isolated runtime cwd, cleared JAVA_TOOL_OPTIONS), runner identity + content digest sealed, raw principal UUIDs removed (counts only), causal rejection entry_mode fixed, first-option discard fallback removed, and the receipt must name the canonical engine pin."
  - "PB-03 RUNTIME LEDGER: exact class+method binding, all-green requirement, content receipt digest, runner digest + candidate commit freshness; the assembler reports native_receipt classification and zeroes runtime credit unless FRESH_EXACT. The runner clears surefire reports first so a stale report cannot be credited, and the runtime engine fingerprint test is bound in the mechanism suite."
  - "ASSEMBLER: refuses to cite a stale auxiliary full-game-lane AF01 artifact (different engine epoch) and derives the AF01 seed limitation text from the artifact instead of hard-coding a stale claim."
  - "CURRENT-BOUNDARY REQUALIFICATION: XMage fresh on the live pin (native 213 tests, AF11 FAIL->UNKNOWN, hidden information now PRINCIPAL_SCOPED with 4 distinct views, seed acknowledged at the creation transaction); Forge re-executed in the documented bridge/evidence checkout e15f37d6 (Rules Core trees proven identical to ef958ee9; native 217 tests) after the default workspace was found on a divergent WSR20 branch whose bridge lacks the Commander-legality repair. Historical WSR22 positions retained as history in the readiness packet."
