  - "ADMISSION: declared object attributes now govern admission from the live manifest. WS05-MP-ELIM-CONTROL-3 and WS05-CMD-DMG-CONTROL declare owner != controller, the manifest marks controller/owner divergence unsupported, and the seam rejects both, so admission is 12 admitted / 18 blocked (was 14/16). Attribute tokens: controller/owner divergence, tapped permanents, attachments and counters."
