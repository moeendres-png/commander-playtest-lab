  - "RUNNER DIGEST DEFECT REPAIRED: RunnerIdentity.digest() included built_utc, so runner and assembler could never agree and every real post-#344 receipt was stale. built_utc remains recorded; the digest is now content-bound (commit/tree/dirty/executed inputs) and regression-locked."
