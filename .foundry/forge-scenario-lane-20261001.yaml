decisions:
  - id: DEC-1
    decision: >-
      A fixture decision_script is an execution requirement, not a neutral-state
      injection request. Families this lane does not implement are recorded as
      decision_execution.* blockers owned by the shared mid-game selector
      surface; the lane does not build a second selector.
  - id: DEC-2
    decision: >-
      ALLOWED_VARIANCE is permitted only where the fixture declares the native
      cause (NATIVE_CAUSE_DECLARED_PLAYER_LOSS) and the exact cause transition is
      observed; variance source is recorded per field and never labelled EXACT.
  - id: DEC-3
    decision: >-
      Counter keys map between the contract vocabulary and the bridge display
      names (P1P1 <-> +1/+1, M1M1 <-> -1/-1); unknown counters compare verbatim
      and fail closed.
  - id: DEC-4
    decision: >-
      SUPERSEDED by the Coordinator resume gate (issue #455 comment 5946447167):
      PR 450 and all foreign writers are terminal; Phase 2 is entered. The
      historical statement is preserved as the Phase-1 gate record.
  - id: DEC-5
    decision: >-
      The scenario lane is the Forge-candidate producer on the canonical R-4
      positive-receipt contract. It is wired into the shared current-boundary
      runner after the clean runner identity is captured and credited by the
      canonical assembler; no second assembler, selector, or Rules engine is
      created. Only an engine-observed obligation writes a receipt; the
      fixture-declared NATIVE_CAUSE_DECLARED_PLAYER_LOSS variance is labelled
      per receipt and never relabelled EXACT.
  - id: DEC-6
    decision: >-
      The seven-row wave keeps its blocker classes split explicitly into
      STATE_CONSTRUCTION_BLOCKER / DECISION_EXECUTION_BLOCKER /
      OBSERVATION_BLOCKER. Selector improvements in the shared lane do not
      remove a ScenarioBootstrap state-construction limitation; rows owned by
      the shared selector surface are not re-implemented here.

