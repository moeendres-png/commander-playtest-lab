current_hypothesis: >-
  Not a defect workstream: the sweep runner already exists and passes its unit tests on main. The
  only design question was how the new workflow may learn the engine pin. The issue text says
  XMAGE_COMMIT is read the way xmage-real-4p-smoke.yml reads it, but that workflow is one of the
  five ALLOWED_LITERAL_CONSUMERS in tests/unit/test_current_pin_fanout_ratchet.py, so restating the
  pin literally in a new file fails that ratchet. Resolution: resolve the pin at runtime from
  config/rules_engines.json into $GITHUB_ENV, then read ${{ env.XMAGE_COMMIT }} everywhere - the
  same expression the smoke workflow uses, with no second literal copy. pb03-runtime-qualification.yml
  (lines 103-120) and h4-docker-materialization.yml (lines 249-254) are the in-repo precedents for
  exactly this pattern.
hypotheses_rejected:
- >-
  Hardcoding the pin in the new workflow's env: block - rejected because
  tests/unit/test_current_pin_fanout_ratchet.py::test_no_new_literal_copy_of_the_live_pin sweeps
  .github with git grep for the live pin and would fail the build. Registering the new file in
  ALLOWED_LITERAL_CONSUMERS was rejected as weakening a test to get green.
- >-
  Reusing the smoke workflow's pull_request/push triggers plus a change-scope gate: rejected
  because the deliverable is workflow_dispatch only, and a PR-triggered sweep would turn a
  35-minute measurement into a per-PR cost while making it look like a gate.
- >-
  Passing dispatch inputs straight into the sweep command line as ${{ inputs.* }}: rejected in
  favour of workflow-level env vars (COVERAGE_SIZES/SEEDS/WORKERS) read as shell variables, which
  keeps untrusted-shaped text out of the shell string entirely and matches
  external-engine-integration.yml's inputs-to-env convention.
technical_decisions:
- >-
  Resolve XMAGE_COMMIT at runtime from config/rules_engines.json (pb03 pattern) instead of copying
  the literal, so the pin has exactly one machine-readable authority and the pin ratchet stays
  green without touching any test.
- >-
  Concurrency group collection-coverage-${{ github.sha }} with cancel-in-progress: true - the
  workflow has no pull_request event, so test_non_pull_request_runs_never_share_a_concurrency_group
  requires a github.sha key; keying on the run instead would let one dispatch displace another.
- >-
  Artifact named collection-coverage-${{ github.run_id }} with if: always() and
  if-no-files-found: warn. The run_id keeps two dispatches of one commit from colliding (the
  concurrency group is per-commit), and warn avoids double-reporting one cause: the sweep step
  already fails the job on a failed game or a diverged twin, so a missing report adds no signal
  that the sweep exit code did not already give.
- >-
  ubuntu-24.04 and JDK 17 temurin, copied from xmage-real-4p-smoke.yml's heavy job so the sweep
  runs on the same engine topology the qualification lanes use.
- >-
  timeout-minutes 180 (the deliverable's ceiling): the default sweep is 12 pods x 3 seeds x 2
  runs = 72 games, about 35 minutes of 4-core work locally, and the runner also pays for the
  engine checkout, the cache-miss engine build and the bridge package.
