current_failure: >-
  PR 759 required check quality red at 28ca03166 with a single failure: assert 11.25 == 9.0
  for the commander base power of Sauron, Lord of the Rings.
failure_class: HARNESS_DEFECT
current_hypothesis: >-
  RESOLVED (root cause): commander_stats filled commander_base_power from
  CardFacts.combat_power(), which adds 25 percent for evasion text. commander_base_power is
  the printed card fact (the opponents JSON, tests/integration/test_lorehold_spirit_opponent.py
  and tests/unit/test_g_modeling_quality.py pin it against the real card) from which the
  simulator derives commander damage, so a 9-power trampler was restated as 11.25 and its
  evasion counted twice. Fix: use the card's own power; a commander whose facts carry no
  power (planeswalker commander Quintorius, History Chaser) stays unknown so the deck's
  curated value survives instead of being forced to 0.0.
hypotheses_rejected:
- >-
  The expectation is stale and should become 11.25 - rejected: the mirrored field
  commander_base_costs is the card's mana value (8.0) and both existing commander-power
  tests assert printed power (Doctor Doom 3.0; Quintorius kept at its curated 0.0 while its
  facts carry power=None), so the contract is the card's own stat. Card-level base_power
  deliberately IS the evasion-bumped combat value
  (test_facts_give_uncurated_creatures_their_power_and_keep_curated_values asserts
  Serra Angel 4/4 becomes 5.0), which is why the defect is commander-specific.
- >-
  The Forge removal (main 9c6594497) caused the failure - rejected by the Owner comment and
  by the failing node's subject matter; the check fails on this PR's own opponent-profile
  code path.
technical_decisions:
- >-
  Fix commander_stats rather than the test: commander_base_power is a printed card fact, not
  a combat-model value; combat_power stays the card-body value it already is.
- >-
  commander_stats returns None when the facts know the commander but carry no power, so
  apply_facts_to_deck keeps the deck value instead of writing 0.0 (fail closed).
- >-
  fact_deck_profile (calibration harness) reads the same commander_stats instead of
  reimplementing the semantics, so the harness measures the same model the project loader
  builds; unknown commanders keep the harness defaults 4.0 cost / 2.0 power.
- >-
  Merged origin/main into the PR branch as a normal merge (33e3a65b2) per the Owner comment;
  no rebase, no force push, no rewritten PR history.
