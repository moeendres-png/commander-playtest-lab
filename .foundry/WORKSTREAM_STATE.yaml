  evidence: integrations/forge/README disclaims runtime; no forge bridge source/artifact/build command in canonical source; only placeholder jar path in legacy docs; J-P3D production_bridge=not_built (Forge P3C was feasibility spike, HISTORICAL_ONLY, not a protocol-2.0.0 JSONL bridge).
- id: TD-H4-05-engine-verify-bar
  decision: engine-verify HEALTHY is unreachable against the honest B4-D bridge (requires legal_actions_supported + action_submission_supported; bridge truthfully reports false); expected outcome is DEGRADED, not failure of the container path. Dockerfile HEALTHCHECK outcome must be recorded honestly; no production HEALTHCHECK semantic change without runtime evidence (not available locally).
  evidence: EngineProcessManager.healthcheck required-capability list vs XmageProvider capabilities flags; manifest missing_required_capabilities.
- id: TD-H4-06-phase85-not-h4-authority
  decision: commander-lab validate-engine-phase85 is NOT H4 evidence (historical Phase-8.5 scope per WS-A1D H5); H4 uses handshake + providerVersion identity + provenance gate + engine-verify outcome.
  evidence: contract scope rule; external_runtime_setup.md step 7 reference treated as stale for H4 purposes.
- id: TD-H4-07-container-bridge-path
  decision: Supported H4B-xmage ENGINE_START_COMMAND is the operator-built shaded jar at the documented vendor/engine-binaries/xmage/bridge.jar location (workspace mount); Dockerfiles correctly do NOT bundle the Lab bridge (building upstream engine alone does not create the bridge per docs/engine_setup.md). CI lane builds the jar from the pinned vendor checkout. vendor/ currently holds only README.md.
  evidence: docs/engine_setup.md Docker section; vendor/README.md; Dockerfiles build engine-source only; pom shade config proves jar self-containment.
- id: TD-H4-08-sysmodules-registration
  decision: 'Fixed a real defect in the new H4 verifier harness (same latent pattern documented in the WS-A1D battery): script modules loaded via spec_from_file_location must be registered in sys.modules before exec, or @dataclass processing crashes on Python 3.14. Found by the new unit tests (14 errors + 2 failures), fixed in both the script and the test, 17/17 green after.'
  evidence: 'pytest output before/after; mirrors tests/unit/test_ws_a1d_docker_pin_authority.py _load_script comment.'
- id: TD-H4-09-docs-inspect-command
  decision: 'Corrected the stale docs/engine_setup.md image-inspect command (bounded qualification-doc fix, no semantic change): the merged entrypoint requires ENGINE_START_COMMAND (exit 64) and ignores container args, so the documented docker run inspect form could never print provenance. Replaced with --entrypoint overrides; the CI lane uses the corrected form.'
  evidence: 'scripts/engine_container_entrypoint.sh lines 3 and 18 (CODE_DERIVED certainty).'
- id: TD-H4-10-compose-env-forwarding
  decision: 'CI lane passes PIN_MANIFEST_PATH overrides via compose run -e (found by static review): compose does not forward host env into containers except through interpolation or -e, so an inline host export would never reach the entrypoint and the tampered-manifest negative would have wrongly passed the gate. ENGINE_START_COMMAND needs no -e (compose interpolates it on the host into the service environment).'
  evidence: 'docker-compose.engine.yml environment/interpolation review; no Docker host to execute, so this stays a reviewed-not-executed step (flagged for first remote run).'
- id: TD-H4-11-remote-review-verdict
  decision: 'Initial publication 98f3f6a0 received Coordinator remote review FAIL_REMEDIATION_REQUIRED with three publication-blocking lane defects (TD-H4-12/13/14). Repaired locally as remediation 01; remote execution remains NOT_RUN; H4 remains UNKNOWN / NOT_RUN; PR creation remains NOT AUTHORIZED pending remediation review. No push performed in this session.'
  evidence: 'Coordinator REMOTE REVIEW REMEDIATION 01 contract; local branch published at 98f3f6a0 and unchanged remotely.'
- id: TD-H4-12-build-time-interpolation
  decision: 'Both Docker jobs now declare benign job-level ENGINE_START_COMMAND true plus unique explicit COMPOSE_PROJECT_NAME (h4-xmage / h4-forge suffixed by run id) so Compose resolves the service model before build. The benign value is build-time interpolation only, never bridge evidence: the XMage handshake step still overrides it with the real bridge jar command and negatives still override it with the sentinel touch command. The Compose required-value guard and docker-compose.engine.yml are untouched.'
  evidence: 'Coordinator Finding 1; repaired workflow job env blocks; locked by structural tests 1, 2 and 6.'
- id: TD-H4-13-exact-image-binding
  decision: 'Image evidence now binds to the exact deterministic Compose reference COMPOSE_PROJECT_NAME plus service name, with immutable image-ID resolution via docker image inspect, recorded image-ref.txt and image-id.txt, and the verifier receiving the recorded truthful ref and ID. Provider-label discovery (docker images plus filter plus head) and invented verdict tags (h4-provider plus short-SHA) are removed. Engine pin authority untouched.'
  evidence: 'Coordinator Finding 2; repaired capture and adjudicate steps in both jobs; locked by structural tests 3, 4 and 5.'
