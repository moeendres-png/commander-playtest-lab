technical_decisions:
- id: TD-WS78-01-source-lock-verified
  decision: Source lock holds at entry; proceed with placeholder replacement (no STOP).
  evidence: branch ws78/foundry-token-economy-20260913; HEAD e893ee45; audit base
    90f95c11 is-ancestor rc 0; tree clean; launcher state path placeholder validated
    schema 2.0 VALIDATED_NONE.
- id: TD-WS78-02-state-placement
  decision: Launcher-provided external state path is the run continuation map; the
    in-worktree .foundry/WORKSTREAM_STATE.yaml (stale WS-A1D-H4 inheritance) is rebound
    to identical WS78 content via explicit --allow-identity-change so the branch stays
    resumable from Git plus contract plus state file.
  evidence: launcher context state_path outside worktree; in-worktree file history
    shows H4 lineage (9ee55eb4); both paths carry the same WS78 document after rebind.
- id: TD-WS78-03-capsule-new-helper
  decision: New read-only tools/foundry/context_capsule.py rather than extending state.py,
    so the state validator/writer stays the single structured authority choke point
    and the capsule cannot become a second store (STATE_AUTHORITY).
  evidence: state.py write paths untouched (git diff); capsule imports state validation
    read-only; tests lock DERIVED label plus fail-closed cases.
- id: TD-WS78-04-tool-output-keep-defaults
  decision: Pin tool_output max_lines 2000 / max_bytes 51200 explicitly (pinned 1.18.30
    defaults, DIRECTLY_VERIFIED in research) instead of lowering. No evidence supports
    smaller robust bounds, and representative Foundry outputs sit far below them.
    Further tuning stays UNKNOWN, never estimated savings.
  evidence: pinned CLI debug config resolves tool_output 2000/51200 rc 0; structural
    output sizes recorded in TOKEN_ECONOMY.md.
- id: TD-WS78-05-prune-not-enabled
  decision: Project config leaves compaction unset (safe default). Effective prune:true
    in the launch environment comes from operator-global ~/.config/opencode/opencode.json
    (pre-existing, out of scope, not modified); the launcher bundle carries no compaction
    key so it neither enables nor overrides it.
  evidence: debug config resolution; global config keys inspected without reading
    provider values; TOKEN_ECONOMY.md records provenance.
- id: TD-WS78-06-dedup-keep-layers
  decision: Keep all three always-on layers (AGENTS.md, ROUTING_AND_EFFORT.md via
    instructions, foundry-implementer.md). No prose was provably redundant while keeping
    its invariant machine-enforced elsewhere; stable policy is cheap when cached.
    Single additive agent line for truncation recovery.
  evidence: test_policy_layers_kept asserts all layers plus the saved-output line.
- id: TD-WS78-07-resume-explicit-only
  decision: Document explicit opencode run --session <OpenCode session ID> for headless
    resume plus TUI relaunch-plus-/work; never blind --continue; FOUNDRY_SESSION is
    a workstream label, never an OpenCode session ID. Automatic session capture stays
    a follow-up.
  evidence: pinned 1.18.30 binary run --help shows -s/--session and -c/--continue
    plus session list/export/import; TOKEN_ECONOMY.md documents the path.
- id: TD-WS78-08-permission-battery-adjudicated-unaffected
  decision: No full permission-battery rerun. The opencode.json permission object
    is untouched (additive tool_output key only) and the agent prose change adds no
    permission rule. Structural guard test_safety_permissions_intact locks the deny/ask
    rules.
  evidence: git diff shows permission section untouched; WS75 1.18.30 battery record
    stands.
