technical_decisions:
  - "Audit base is the merged successor main 5c69b999 (tree 30addb02); PB-03 successor and terminal receipt are canonical on main."
  - "Engine artifact identity is provider-reported (computed by the bridge from the loaded Game code source), not harness-derived, so it proves what actually executed."
  - "A directory or unreadable code source reports kind/sha256 explicitly; consumers fail closed rather than inventing an identity."
  - "Observed loaded artifact on the canonical pin: kind=file, sha256=e04062d2e180c8e322256bd92675c5cd49d73f5f6894140e5a86e45764661603, size=7112962, path=file:/home/moeen/.m2/repository/org/mage/mage/1.4.61/mage-1.4.61.jar. Bound through admission provider_identity, PB03_RUNTIME_EXECUTION, the midgame probe receipt and PB03_RUNTIME_EXECUTION_MATRIX (artifact_identity_consistent=true)."
  - "Runtime freshness now requires the artifact digest: missing/empty -> MISSING, directory/malformed -> INVALID, different artifact -> STALE; an unavailable expected digest is never fresh."
  - "The workflow asserts provider_identity, ledger and matrix carry the same file-backed 64-hex digest."
  - "MAIN DRIFT (F-30/F-37, stable option order) merged normally at 0488259a and requalified. F-37 made AF01 discriminating: XMage AF01 FAIL->PASS on the live pin; Forge AF01 PASS->FAIL (fail_closed_unsupported_decision: the bridge accepted a request for an unsupported decision class for a live game). Boundary counts unchanged 5/58/44; the Forge finding is recorded as a provider gap, not masked."

