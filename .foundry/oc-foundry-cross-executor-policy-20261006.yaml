hypotheses_rejected:
- Guessing the legacy alias from history instead of inspecting the live pinned CLI
  catalog
- Treating the legacy alias as a third logical executor instead of a runtime identity
  of space-bunny
- Letting DeepSeek or a writable verifier satisfy the cross-executor gate
- Trusting a self-declared Space Bunny identity/verdict in a record the implementation
  executor writes (review evidence must cross a trust boundary)
- Treating ordinary docs/** changes, governing policy docs, or unknown docs as documentation-only
  closeout
- Granting NON_MATERIAL from an empty delta after rebinding audit_base_sha onto validated_head
- Letting a policy-less COMPLETE state bypass the completion gate
- Treating a pushed WIP as qualification PASS
- Enforcing the new policy retroactively on historical COMPLETE states
- 'Treating a comment-body substring link as proof that the comment belongs to the cited run (PR #590 P1-a)'
- 'Admitting a writable top-level lane (bunny-verifier) or its bunny-auditor subreview as review evidence (PR #590 P1-b)'
- 'Treating an unknown/lowercase/blank materiality declaration as a NON_MATERIAL exemption (PR #590 P2)'
- 'Letting state.repository be blank or foreign so review evidence could bind to any repository (PR #590 P3-a)'
technical_decisions:
- 'Materiality is fail-safe: unknown paths, tools/, tests/, schemas, CI, evidence
  semantics and ordinary docs/** are MATERIAL; only the explicit workstream state
  path, canonical .foundry/reviews/** receipts, and explicitly named documentation-closeout
  reports under docs/ (basename contains closeout, no policy/authority/mission/qualification/evidence/routing/security
  keyword) are NON_MATERIAL, and NON_MATERIAL is verified against the Git change set.'
- A PASS review record is only admissible with independently verified GitHub review_evidence
  (trusted trigger comment, trusted Space Bunny workflow run + expected job conclusion,
  workflow and read-only agent files fetched at the run head_sha, and the OpenCode
  bot receipt with the exact marker/SHA/TREE/verdict); self-declared record fields
  can never fabricate a review, and network/API/parse failures fail closed.
- 'The receipt is bound to the run, not to a substring: the result comment created_at
  must fall inside the run run_started_at..updated_at window, the trigger comment must
  precede the run and be the newest issue comment created before it, and the comment''s
  own footer /actions/runs link must be the last run link in the body. REVIEWER_MODEL/REVIEWER_VARIANT/READ_ONLY
  are self-reported text; the run/job identity, timing, workflow pin and read-only
  agent file are the observed facts, and the runtime alias is never observed.'
- 'One carrier only: the direct /bunny-review lane with foundry-reviewer (BUNNY_DIRECT_READ_ONLY_REVIEW).
  The writable bootstrap /bunny lane and any bunny-auditor subagent attestation are
  removed because a review that can write is not review evidence. Issue-comment workflows
  run from main, so the direct lane is only reachable after this PR merges.'
- An invalid declared materiality (UNKNOWN, lowercase, blank, N/A) is UNSATISFIED and
  only an exact NON_MATERIAL declaration may seek the Git-verified exemption.
- The bootstrap state repository is bound to the profile repo_slug; init_state requires
  an explicit owner/name slug, so no review evidence can be bound to "any repository".
- A NON_MATERIAL claim from an empty or self-rebound audit base is refused (MATERIALITY_SELF_EXEMPT),
  and a policy-less state cannot certify a new PR_READY/COMPLETE claim (completion
  gate and safe_push always gate COMPLETE).
- Review records live at .foundry/reviews/<workstream>.json; the state mirrors the
  verdict and exact reviewed identities and fails closed on any mirror/record mismatch.
- A generated-state-only checkpoint commit preserves the reviewed validated implementation
  identity (reviewed_sha == validated_head) without pretending the later state commit
  was reviewed.
- The legacy runtime id opencode-go/space-bunny-free is admitted only as a runtime
  identity (LEGACY_ALIAS) of the same logical space-bunny profile; canonical wins
  when both are present.
- "The takeover PR #590 branch is tooling/cross-executor-policy-hardening-20261007, created by the owner from #579's head 58ccfb8e; this state file was moved to that branch identity and now validates under bootstrap against the profile repo_slug."
- A MATERIAL workstream cannot self-exempt by setting cross_executor_review.required=false;
  the gate refuses it explicitly.
