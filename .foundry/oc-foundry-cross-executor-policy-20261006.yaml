  Git change set.'
- Review records live at .foundry/reviews/<workstream>.json; the state mirrors the
  verdict and exact reviewed identities and fails closed on any mirror/record mismatch.
- A generated-state-only checkpoint commit preserves the reviewed validated implementation
  identity (reviewed_sha == validated_head) without pretending the later state commit
  was reviewed.
- The legacy runtime id opencode-go/space-bunny-free is admitted only as a runtime
  identity (LEGACY_ALIAS) of the same logical space-bunny profile; canonical wins
  when both are present.
- Actual branch is the infrastructure-created opencode/issue578-20261006204641; the
  requested tooling/... branch name was not available in this runner and is recorded
  honestly.
- A MATERIAL workstream cannot self-exempt by setting cross_executor_review.required=false;
  the gate refuses it explicitly (review_gate fix ab02ba33).
