technical_decisions:
- 'Materiality is fail-safe: unknown paths, tools/, tests/, schemas, CI, evidence
  semantics and ordinary docs/** are MATERIAL; only the explicit workstream state
  path, canonical .foundry/reviews/** receipts, and explicitly named documentation-closeout
  reports under docs/ (basename contains closeout, no policy/authority/mission/qualification/evidence/routing/security
  keyword) are NON_MATERIAL, and NON_MATERIAL is verified against the Git change set.'
- A PASS review record is only admissible with independently verified GitHub review_evidence
  (trusted trigger comment, trusted Space Bunny workflow run + expected job conclusion,
  workflow and read-only agent files fetched at the run head_sha, and the OpenCode
  bot receipt with the exact marker/SHA/TREE/verdict); self-declared record fields
  can never fabricate a review, and network/API/parse failures fail closed.
- 'Two carriers are admitted: the bootstrap /bunny lane attesting a read-only bunny-auditor
  subreview (BUNNY_AUDITOR_SUBAGENT_REVIEW) with the top-level lane pinned to Space
  Bunny MAX, and the future direct /bunny-review lane with foundry-reviewer (BUNNY_DIRECT_READ_ONLY_REVIEW).
  Issue-comment workflows run from main, so the direct lane is only reachable after
  this PR merges; the current PR dogfoods the bootstrap carrier.'
- A NON_MATERIAL claim from an empty or self-rebound audit base is refused (MATERIALITY_SELF_EXEMPT),
  and a policy-less state cannot certify a new PR_READY/COMPLETE claim (completion
  gate and safe_push always gate COMPLETE).
- Review records live at .foundry/reviews/<workstream>.json; the state mirrors the
  verdict and exact reviewed identities and fails closed on any mirror/record mismatch.
- A generated-state-only checkpoint commit preserves the reviewed validated implementation
  identity (reviewed_sha == validated_head) without pretending the later state commit
  was reviewed.
- The legacy runtime id opencode-go/space-bunny-free is admitted only as a runtime
  identity (LEGACY_ALIAS) of the same logical space-bunny profile; canonical wins
  when both are present.
- Actual branch is the infrastructure-created opencode/issue578-20261006204641; the
  requested tooling/... branch name was not available in this runner and is recorded
  honestly.
- A MATERIAL workstream cannot self-exempt by setting cross_executor_review.required=false;
  the gate refuses it explicitly.
