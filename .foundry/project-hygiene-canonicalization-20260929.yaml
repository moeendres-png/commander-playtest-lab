dead_code_candidates:
  disposition: FALSIFIED_AS_DEAD_RETAINED
  method: >-
    A dedicated adversarial falsification pass was run over every candidate. It searched for
    dynamic imports, string references, workflow/test/config consumers, package re-exports,
    coverage/mutation gates, and git history intent. The overwhelming majority of "unreferenced"
    files are deliberate retention-bound artifacts or manual operator tools.
  falsification_result:
    KEEP_PROVENANCE_but_appear_unreferenced:
      - path: src/commander_lab/semantic_replay/consumer.py
        killer: >-
          qualification/ws232-retention-nscoped-requalification/RETENTION_PREDICATES.json:4113-4118
          binds its SHA-256 and declares it owns the 14-step replay algorithm. Also
          re-baselined by REQUALIFICATION_RECORD_R21.md:57-79. It is a fresh-process entrypoint,
          so zero in-process imports is expected, not evidence of deadness.
      - path: src/commander_lab/semantic_replay/capability.py
        killer: >-
          RETENTION_PREDICATES.json:4137-4142 binds its SHA-256 as capability truth
          (supported counts, tamper matrix). It is the single truthful advertisement of the
          WS218 replay lane.
      - path: src/commander_lab/whole_deck/decision_authority.py
        killer: >-
          ARCHITECTURE_MIGRATION_REPORT.md:34 records it as the deckbuilding/simulation
          authority boundary; two workflows use it as a path trigger.
      - path: scripts/rules_evidence_campaign.py
        killer: 668-line unique tactical rules-evidence classifier with no proven successor.
      - path: scripts/diagnose_engine_environment.py
        killer: manual operator diagnostic by construction; no code caller is the point.
      - path: scripts/run_isolated_pytest_suite.py
        killer: >-
          implements the process-isolated batch execution that AGENTS.md section 1 names as an
          intended end state. CI running bare pytest does not replace it.
    UNCERTAIN_RETAINED:
      - src/commander_lab/optimizer_cli.py
      - src/commander_lab/observability/__init__.py
      - src/commander_lab/observability/local.py
      - scripts/run_j_p6_profile.py
      - scripts/apply_candidate_resolution_gate.py
      - scripts/build_robustness_registry.py
      - requirements/runtime.lock
      - requirements/quality-tools.requested.txt
      - requirements/quality-tools.verified-upstream.txt
    UNCERTAIN_RETAINED_reason: >-
      No proven replacement and non-empty unique content. Per campaign policy, UNKNOWN is
      never deleted. Recorded for Coordinator adjudication instead.
  conclusion: >-
    The repository's apparent "dead code" is overwhelmingly deliberate retention. Zero source
    modules were deleted by this campaign.

