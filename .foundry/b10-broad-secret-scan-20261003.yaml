milestones:
  - id: M1
    result: >-
      Scanner selection: gitleaks 8.28.0, linux_x64 archive sha256
      a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb (matches
      the release checksums file). Full upstream rule set; 3009 tracked files
      scanned in about 9 s including the controls.
  - id: M2
    result: >-
      Fail-before: without exclusions the tree has two generic-api-key findings,
      both fabricated redaction fixtures in tests. A top-level path+value
      allowlist (condition AND) hid a different random key in the same file; the
      value-scoped red control caught this, so the exclusions are rule-scoped.
  - id: M3
    result: >-
      Red controls: github-pat, aws-access-token, private-key, slack-bot-token,
      stripe-access-token and generic-api-key are each found; both exclusions
      still find their value elsewhere and a different value in their own file;
      a clean tree yields nothing. A generated GitHub token added to a tracked
      file fails the scan. Two runs produced byte-identical summaries.
  - id: M4
    result: >-
      Review repair: every gitleaks suppression channel besides .gitleaks.toml is
      closed (--ignore-gitleaks-allow; a .gitleaksignore is refused and a tracked
      one fails the run; paths holding gitleaks.toml are reported). Malformed
      reports are NOT_RUN; a supplied binary must match the pinned binary digest;
      the summary binds head, tree, tracked-change flag and a manifest digest;
      decode and archive depth 3. 13/13 controls PASS, 3017 files, PASS in 20 s.
