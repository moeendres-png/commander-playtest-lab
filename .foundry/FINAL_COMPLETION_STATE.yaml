first_failing_boundary: >-
  For the end product, the first boundary that cannot yet be crossed is terminal state: a
  real 100-card Commander game has not been driven to a terminal state. Full-game conformance
  reaches game-over only with a synthetic technical deck (Isamaru + 99 Plains), and the real
  4-deck 100-card smoke stops at 40 decisions with terminal_reached=false.
root_cause_class: >-
  UNKNOWN
failure_class: UNKNOWN
current_failure: >-
  A real 100-card Commander game does not reach a terminal state through the production
  path. The real 4-deck bounded smoke stops at 40 decisions with terminal_reached=false,
  and full-game conformance reaches game-over only with a synthetic technical deck
  (Isamaru + 99 Plains). Not yet root-caused: it is not established whether the limit is
  pilot decision quality, an unhandled decision class, decision-loop throughput, or a
  genuine engine-side blocker. Diagnose before repairing.
current_hypothesis: >-
  Leading hypothesis, to be tested rather than assumed: the external pilot policy is
  correct but not game-completing, so games stall rather than misbehave. The strongest
  discriminator is a long real-deck run with per-decision class/option logging to find the
  first decision the policy cannot answer or the first turn on which no progress is made.
  Competing hypotheses to falsify: an unhandled decision class fails closed mid-game
  (would raise, not stall); a per-decision legal-action ceiling blocks mandatory
  progression; or the seed/deck combination produces an unwinnable early board.


