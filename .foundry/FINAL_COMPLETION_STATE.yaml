failure_class: UNKNOWN
current_hypothesis: 'Leading hypothesis, to be tested rather than assumed: the manifest is sufficient
  for per-obligation admission. MID_GAME_MECHANISM_FAMILIES already names the seven mechanisms, and each
  maps onto manifest dimensions (for example stack_response onto ''stack spells'', which is unsupported,
  and combat_declaration onto the qualified turn-1 allow-list, which is supported). Design constraint
  that must hold: the manifest may decide ADMISSIBILITY only. It must never decide OUTCOME. A row whose
  dimensions are all supported becomes attemptable, and its outcome is whatever execution reports. Competing
  hypotheses to falsify: some family has no clean dimension mapping, in which case admission must fail
  closed for that family rather than guess; or the supported dimensions are sufficient but the native
  restore path still cannot construct the position, in which case the rows stay blocked for a real capability
  reason and PB-03 must be reclassified from a Lab harness defect to an engine/bridge capability limit.'
