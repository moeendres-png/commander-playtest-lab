technical_decisions:
- id: EXEC-IDENTITY
  decision: >-
    Accept built-in explore/general as the conformant Space Bunny MAX child path and fail
    closed on the two committed Muse XHIGH subagent roles.
  reasoning: >-
    .opencode/agents/foundry-adjudicator.md and foundry-reviewer.md are pinned to
    opencode-go/muse-spark-1.3-contributor at xhigh. The campaign contract forbids invoking
    Muse, and requires every child to remain Space Bunny MAX. Built-in agents inherit the
    session model, which launch-context.json confirms is space-bunny-free at
    variant_resolution=native_max. No child can therefore run below MAX or on another model.
  rejected_alternative: invoking the committed Muse roles because they are the natural
    review roles; rejected as a direct contract violation.
- id: PB09-ORDERING
  decision: >-
    REVERSE the recorded ordering "PB-09 before PB-03" for execution purposes. Execute
    PB-03, the capability gap and terminal-state reachability first; prepare PB-09 only as
    Coordinator decision input.
  reasoning: >-
    PB09_FORGE_CANDIDATE_IDENTITY.md section 6 states the open question is which artifact is
    the Forge candidate for Architecture Freeze, and that the Coordinator owns provider and
    candidate identity. This executor cannot resolve it, so it cannot gate executable work.
    It invalidates the Forge column of a cross-candidate comparison, not primary-engine
    progress. The admissible half that IS executable without the decision is to re-execute
    the Forge column at pinned upstream a37a865a with pinned bridge 4753bb7c, which is
    evidence generation, not selection. PB-03 is entirely Lab-owned, needs no reserved
    authority, and its designed fix is unimplemented even on its own branch.
  contract_basis: 'Workstream contract section 13 explicitly requires revalidating this ordering.'
- id: ENGINE-CWD
  decision: >-
    Resolve the external engine process working directory to a single shared, configurable,
    absolute runtime-state directory (.runtime/engine by default, ENGINE_RUNTIME_DIRECTORY
    to override) instead of inheriting the caller CWD; remove all 13 engine-lane cwd=ROOT
    pins; honour an explicit cwd; fail closed if the directory cannot be created.
  reasoning: >-
    XMage hardcodes jdbc:h2:file:./db/cards.h2 relative to the process CWD, so the first real
    game wrote a ~254MB untracked database into the Git worktree. .env.example already
    declares the intended policy ("Mutable engine state and bridge logs are local runtime
    data" at .runtime/engine), so the code contradicted its own declared policy. An absolute
    pinned path removes the CWD coupling entirely rather than only moving the default.
  classification_of_defect: RUNTIME pollution of the Git worktree by the production run path.

hypotheses_rejected:
- 'REJECTED: "the pre-existing ~/.m2 org.mage 1.4.61 is the pinned engine because the version
  matches." Refuted by rebuilding from the pin: all 34 artifact hashes changed. Version
  equality is not identity equality; this is exactly the PB-09 reasoning error applied to
  XMage locally.'
- 'REJECTED: "the mage worktree HEAD can be built as the canonical pinned engine." Refuted:
  the pin is not an ancestor of HEAD and the trees diverge by 90 engine source files.'
- 'REJECTED: "the 52 full-suite failures after editing were caused by the edits." Refuted:
  they are the documented stale-canonical-input guard, which rejects canonical inputs when
  tracked_worktree_dirty. Confirmed by reading tools/service.py:752 and by re-running on a
  committed clean tree.'
- 'REJECTED: "the untracked 254MB db/ directory breaks the test suite." Refuted: the guard
  tests TRACKED dirtiness only. The harm is worktree pollution and accidental-commit hazard,
  which is still a real defect but was initially overstated as a functional break.'
- 'REJECTED: "PB-09 must be resolved before any other work because it is the highest-priority
  item." Refuted as an execution constraint: it is Coordinator-reserved, so it can only gate
  executable work by making the campaign wait, which the contract forbids.'

