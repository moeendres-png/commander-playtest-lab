hard_gates:
- Rules Core is the sole Magic legality and Rules-semantics authority; no second hidden Rules Engine in
  any pilot, adapter, harness, replay or qualification helper.
- Unsupported production-reachable paths fail closed. No first-option, random, default yes/no, silent
  skip, parent-class fallback, or requested-option legality reconstruction.
- Hidden information is principal-scoped in observations, errors, logs, evidence and replay.
- All Rules randomness originates in the Rules Core with explicit seed authority.
- Evidence is classified; UNKNOWN != PASS, PARTIAL != FULL, NOT_RUN != PASS, CODE_DERIVED != RUNTIME_VERIFIED.
- No test, denominator, assertion, immutable materialization or expected semantics is weakened to obtain
  green.
- PRODUCTION_PROVIDER selection and ARCHITECTURE_FREEZE are Coordinator decisions and are never claimed
  by this executor.
forbidden_shortcuts:
- Rebuilding a general Rules Core instead of qualifying the pinned engine.
- Editing config/rules_engines.json to make evidence consistent (would launder a Lab Rules-Core fork into
  a provider pin).
- Editing an executed commit into any provenance or evidence field.
- Promoting one candidate PASS to fill the other candidate UNKNOWN.
- Reading a modeled projection as an executed result.
- Mutating canonical data or weakening the stale-canonical-input guard to get green.
