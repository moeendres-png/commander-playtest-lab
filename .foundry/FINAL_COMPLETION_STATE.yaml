technical_decisions:
- id: EXEC-IDENTITY
  decision: Accept built-in explore/general as the conformant Space Bunny MAX child path and fail closed
    on the two committed Muse XHIGH subagent roles.
  reasoning: .opencode/agents/foundry-adjudicator.md and foundry-reviewer.md are pinned to opencode-go/muse-spark-1.3-contributor
    at xhigh. The campaign contract forbids invoking Muse, and requires every child to remain Space Bunny
    MAX. Built-in agents inherit the session model, which launch-context.json confirms is space-bunny-free
    at variant_resolution=native_max. No child can therefore run below MAX or on another model.
  rejected_alternative: invoking the committed Muse roles because they are the natural review roles; rejected
    as a direct contract violation.
- id: PB09-ORDERING
  decision: REVERSE the recorded ordering "PB-09 before PB-03" for execution purposes. Execute PB-03,
    the capability gap and terminal-state reachability first; prepare PB-09 only as Coordinator decision
    input.
  reasoning: PB09_FORGE_CANDIDATE_IDENTITY.md section 6 states the open question is which artifact is
    the Forge candidate for Architecture Freeze, and that the Coordinator owns provider and candidate
    identity. This executor cannot resolve it, so it cannot gate executable work. It invalidates the Forge
    column of a cross-candidate comparison, not primary-engine progress. The admissible half that IS executable
    without the decision is to re-execute the Forge column at pinned upstream a37a865a with pinned bridge
    4753bb7c, which is evidence generation, not selection. PB-03 is entirely Lab-owned, needs no reserved
    authority, and its designed fix is unimplemented even on its own branch.
  contract_basis: Workstream contract section 13 explicitly requires revalidating this ordering.
- id: ENGINE-CWD
  decision: Resolve the external engine process working directory to a single shared, configurable, absolute
    runtime-state directory (.runtime/engine by default, ENGINE_RUNTIME_DIRECTORY to override) instead
    of inheriting the caller CWD; remove all 13 engine-lane cwd=ROOT pins; honour an explicit cwd; fail
    closed if the directory cannot be created.
  reasoning: XMage hardcodes jdbc:h2:file:./db/cards.h2 relative to the process CWD, so the first real
    game wrote a ~254MB untracked database into the Git worktree. .env.example already declares the intended
    policy ("Mutable engine state and bridge logs are local runtime data" at .runtime/engine), so the
    code contradicted its own declared policy. An absolute pinned path removes the CWD coupling entirely
    rather than only moving the default.
  classification_of_defect: RUNTIME pollution of the Git worktree by the production run path.
- id: DONOR-VERIFY
  decision: Verify a donor branch before transplanting it; do not trust its own pre-authorization note.
    The RESUMPTION_KIT described a whole-file transplant as pre-authorized, but the donor branch head
    is internally inconsistent and would not import.
  evidence: origin/wsr22-successor/current-boundary-freeze-20260927 head cf06bc34. Its scripts/run_current_boundary_qualification.py
    imports build_deck and validate_principal_scoping from the package; its current_boundary/__init__.py
    exports neither. The transplanted runner raised ImportError until both re-exports were added.
  rejected_alternative: Transplanting the donor verbatim because a prior note called it pre-authorized;
    rejected because a pre-authorization is not a correctness proof.
- id: EVIDENCE-BOUNDARY
  decision: Transplant the current-boundary EXECUTOR and its code-level tests, but not the WSR22 evidence
    bundle, and not the tests whose subject is that bundle.
  reasoning: qualification/final-current-boundary-20260927/* is WSR22's result artifact. Adopting it here
    would present another workstream's results as current, and they are stale against this HEAD regardless.
    tests/qualification/test_wsr22_current_boundary.py is that bundle's integrity guard and travels with
    it; four PB-03 guards in test_current_boundary_pb03_starting_state.py read the same manifest and were
    split out and named in the file header. The PB-03 classifier they protect IS transplanted and guarded
    here.
- id: FAILURE-CLASS-BY-CAUSE
  decision: Classify engine-reported batch failures by cause, not by the Python exception type, and add
    an INFRASTRUCTURE failure class.
  reasoning: A live batch run recorded java.lang.NoClassDefFoundError as failure_class=conformance because
    every engine-reported failure arrives as FullGameConformanceError. That asserts a Magic Rules conclusion
    the evidence cannot support. Linkage, class-loading and resource faults are now INFRASTRUCTURE; genuine
    game failures remain CONFORMANCE.
  note: 'The triggering NoClassDefFoundError was self-inflicted: the bridge jar was rebuilt while the
    batch was running. The operational lesson is recorded separately.'
- id: PB03-MANIFEST-EXPOSURE
  decision: Publish the state-restoration dimensions manifest on the full-game capability payload, verbatim
    from the restoration code, changing only what the lane reports.
  reasoning: 'XmageNativeStateRestoration.dimensionsPayload() computed an itemised 11/11 supported/unsupported
    manifest that only a unit test called. Dead code, so it could inform no admission decision, which
    is the concrete reason the designed PB-03 fix was never implemented. A bare starting_state_injection_supported=false
    cannot support per-obligation admission. This changes reporting only: no game semantics, no capability
    promotion, no pin.'
- id: PB03-MANIFEST-ADMISSION
  decision: Consume the live engine restoration manifest and let it decide ADMISSIBILITY only, failing
    closed for any family without a declared dimension mapping; publish the manifest on both transport
    lanes; shape the game-creation request from the lane's declared seed support.
  reasoning: The 33 blocked rows rested on a Lab projection that a bare starting_state_injection_supported=false
    could not support. The engine's own manifest can, and it splits 30 starting-state rows into 14 engine-supported,
    7 engine-declared unsupported and 9 fail-closed-unmapped. Admissibility must never become an outcome,
    so no row is marked PASS from the manifest; only execution may do that.
- id: ENGINE-IDENTITY-SCOPE
  decision: Apply the Forge descendant-equivalence proof only to Forge, and add a distinct Lab-owned-bridge
    identity proof for a suite that runs in this repository's own module.
  reasoning: verify_engine_identity justifies a commit difference by comparing Forge engine module trees.
    The XMage bridge tests live in this repository, so it compared the XMage pin against the Lab commit,
    found zero Forge modules, compared nothing, and failed closed for the wrong reason. The honest proof
    for a Lab-owned module is the Lab commit bound by the runner receipt plus the separately pinned, separately
    hashed engine artifact.
- id: AF04-CAPABILITY-PRECISION
  decision: Add explicitly named, lane-scoped capability fields for the decision-scoped decision surface
    and the enumerated class list, and leave both global flags false.
  reasoning: 'The global flags mean a free-standing legal-action API queryable at any time, which this
    lane does not offer: get_legal_actions fails closed with STALE_DECISION when nothing is pending. But
    publishing only those flags under-reported a real capability, since the engine does enumerate and
    accept submissions for the decision it is currently asking about, across 17 enumerated classes. Precision
    without promotion: the class list is guarded by a build-failing test re-derived from the player source
    so it cannot drift.'
