known_findings:
  - id: F-AF09-1
    title: game_driver priority state-change fact is always null
    detail: >-
      In src/commander_lab/qualification/current_boundary/game_driver.py the
      terminal_facts["priority_pass_state_changed"] expression calls
      _payload(answer) on an already-unwrapped payload, so it always evaluates
      to None (both candidates' committed epochs record null). The engine DOES
      publish pre_state_hash/post_state_hash for Forge decisions and records
      them in the XMage event log. Out of this workstream's write scope;
      recorded for the owner of that surface.
  - id: F-AF09-2
    title: Forge WS227 fully-identical duplicate options are unreplayable by design
    detail: >-
      Forge's semantic option identity intentionally collides indistinguishable
      duplicate siblings (SemanticReplay.occurrenceIndex). A decision whose
      entire offered set collides has no authoritative occurrence identity, so
      external decision replay must fail closed. The twin uses real singleton
      deck lists to keep cleanup-discard decisions distinguishable and records
      the ambiguity when it cannot.

