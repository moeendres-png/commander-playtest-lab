technical_decisions:
- 'SP-CENSUS-1 (generic lane): game_driver._create_request never sends
  starting_player_seat; XMage JsonlBridge defaults 0. drive_commander_game defaults
  scripted_starting_seat="p1" and answers every STARTING_PLAYER frame with it.
  Callers: full107.run_cardinality (PLAYER_COUNT_*), full107.start2_row
  (WS05-CMD-START-2), full107.scripted_pregame_row (PILOT_MULLIGAN, WS05-CMD-MULL-2/4),
  runner af01_live and hidden_game probes.'
- 'SP-CENSUS-2 (Forge scenario lane): drive_scenario_game uses
  model.temporal_state.get("active_player") or "p1" and records basis
  LAB_SELECTED_ENGINE_OFFERED; evaluate_first_turn_draw requires
  FIXTURE_DECISION_SCRIPT so unscripted starter obligations are refused up front.'
- 'SP-CENSUS-3 (AF09 twins): replay_twins.gather_generic_lane_process defaults
  scripted_starting_seat="p1" and persists starting_seat_policy
  "fixture_scripted_seat:p1".'
- 'SP-CENSUS-4 (provider bridges): JsonlBridge:217, XmageFullGameJsonlBridge:180 and
  XmageMidgameJsonlBridge:324 all optionalInt(starting_player_seat, 0); the B4
  compatibility XmageBridgePlayer answers the engine CR 103.2 init choose with the
  declared chooser itself.'
- 'SP-CENSUS-5 (midgame/full-game call sites): create_midgame_game requests omit
  starting_player_seat (midgame_rows, actual_card_campaign, knowledge_projection,
  run_midgame_capability_probe); create_full_game callers (semantic_replay
  recorder/consumer) send seed %% N explicitly.'
- 'SP-CENSUS-6 (modeled lanes, out of Rules scope): StructuralMatchConfig callers
  (mulligan/lab.py, whole_deck/campaign.py, optimizer_v2_diagnostics.py), in-process
  tactical simulator (engine/rules/tactical.py) and RulesGameRequest default 0.
  Classified MODELED; no engine STARTING_PLAYER decision frame is reached there.'
- 'SP-CENSUS-7 (construction proof): generic_construction.compare always compares
  temporal_state.active_player/priority_player against first_priority_seat, with no
  channel-verification gate (issue #572).'
