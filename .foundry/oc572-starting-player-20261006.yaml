objective: >-
  #572 / #441 / #255 starting-player authority. Eliminate every production-reachable
  or qualification-credit path where the Lab or its provider bridge chooses the
  starting player by an implicit p1/seat-0 default; then close the impacted XMage
  AF08 starting-player obligations as far as current authoritative contracts permit.
  Owner binding decision: the starting seat must be explicitly declared by the
  authoritative record/contract and submitted only through the engine-authored legal
  decision frame, or the path must fail closed. No p1, seat 0, first element, random,
  GUI, engine-AI, implicit or provider-side default. A construction proof may credit
  active_player / priority_player / first_priority_seat only when the starting-player
  channel for that execution has been explicitly verified.
