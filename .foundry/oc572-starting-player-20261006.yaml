current_failure: >-
  #572 item 1. Multiple current paths choose the starting player by default:
  game_driver.drive_commander_game(scripted_starting_seat="p1");
  replay_twins.gather_generic_lane_process(scripted_starting_seat="p1") with a
  persisted fixture_scripted_seat:p1 policy; forge_scenario_lane.drive_scenario_game
  (temporal_state.active_player or "p1"); JsonlBridge / XmageFullGameJsonlBridge /
  XmageMidgameJsonlBridge optionalInt(starting_player_seat, 0); the generic
  construction proof compares temporal_state.active_player/priority_player against
  first_priority_seat, which can be EQUAL even when the starter came from the default.
  The latest sealed XMage epoch 39744c19198a-5f6a5fd34031 shows
  PLAYER_COUNT_2P/3P/4P/5P and PILOT_MULLIGAN construction proofs with
  temporal_state.active_player EQUAL P1/P1 where the starter was in fact the driver's
  default p1 (Forge) or the bridge's seat-0 default (XMage). AF08 XMage is UNKNOWN,
  blocked by WS05-CMD-MULL-2, WS05-CMD-MULL-4 and WS05-CMD-START-2.
failure_class: HARNESS_DEFECT
current_hypothesis: >-
  The defect is proven in source and in the sealed 39744c19198a epoch evidence, not
  suspected. Repair: remove every default; derive the declaration from the
  authoritative record; submit it through the engine-authored frame (or the
  provider's declared create channel with engine acknowledgement); mark construction
  temporal checks UNSUPPORTED unless the starter channel was verified; add
  mutation-killing negative controls; requalify only impacted rows.
