technical_decisions:
- 'SP-CENSUS-1 (generic lane): game_driver._create_request never sent starting_player_seat;
  XMage JsonlBridge defaulted 0. drive_commander_game defaulted scripted_starting_seat="p1"
  and answered every STARTING_PLAYER frame with it. Callers: full107.run_cardinality
  (PLAYER_COUNT_*), full107.start2_row (WS05-CMD-START-2), full107.scripted_pregame_row
  (PILOT_MULLIGAN, WS05-CMD-MULL-2/4), runner af01_live and hidden_game probes.'
- 'SP-CENSUS-2 (Forge scenario lane): drive_scenario_game used model.temporal_state.get("active_player")
  or "p1" and recorded basis LAB_SELECTED_ENGINE_OFFERED; evaluate_first_turn_draw
  requires FIXTURE_DECISION_SCRIPT so unscripted starter obligations are refused up
  front.'
- 'SP-CENSUS-3 (AF09 twins): replay_twins.gather_generic_lane_process defaulted scripted_starting_seat="p1"
  and persisted starting_seat_policy "fixture_scripted_seat:p1".'
- 'SP-CENSUS-4 (provider bridges): JsonlBridge, XmageFullGameJsonlBridge and XmageMidgameJsonlBridge
  used optionalInt(starting_player_seat, 0); the B4 compatibility XmageBridgePlayer
  answers the engine CR 103.2 init choose with the declared chooser itself (documented
  narrow init exception).'
- 'SP-CENSUS-5 (midgame/full-game call sites): create_midgame_game requests omitted
  starting_player_seat (midgame_rows, actual_card_campaign, knowledge_projection,
  run_midgame_capability_probe); create_full_game callers (semantic_replay recorder/consumer,
  engine/rules/full_game) send an explicit seed-derived seat.'
- 'SP-CENSUS-6 (modeled lanes): StructuralMatchConfig callers (mulligan/lab.py, whole_deck/campaign.py,
  optimizer_v2_diagnostics.py) and the in-process tactical simulator are MODELED;
  the RulesGameRequest default 0 was removed because all seven non-test callers already
  passed it explicitly.'
- 'SP-CENSUS-7 (construction proof): generic_construction.compare used to compare
  temporal_state.active_player/priority_player against first_priority_seat with no
  channel gate (#572).'
- 'SP-DECISION-1 (declaration sources): record_starting_seat (starting_player.py)
  accepts exactly three shapes: a decision_script starting_player step with its fail-closed
  selection contract, an explicit starting_player field, or temporal_state.active_player
  at turn 0. The expected-event token starting_player:Pn is never a declaration.'
- 'SP-DECISION-2 (verified channels): the construction proof credits temporal facts
  only on ENGINE_FRAME_FROM_RECORD_DECLARATION (engine published the frame and accepted
  the declared seat) or PROVIDER_ENGINE_CONFIRMED_STARTING_SEAT (the engine start
  readback named a player that resolves, through the engine seat roster, to the declared
  seat). A create-response echo alone is NOT a channel.'
- 'SP-DECISION-3 (review dispositions): fresh-context foundry-reviewer at 36d7dc12
  returned NO BLOCKING FINDINGS with P3 notes; Space Bunny MAX cross-model audit at
  6e757afc returned EVIDENCE INTEGRITY VIOLATED with one P1 (create echo is not engine
  confirmation) and P2s (replay channel, Java comments). The P1/P2 repairs are implemented
  in the working tree and are the reason this handoff is a WIP checkpoint.'
- 'SP-DECISION-4 (1.0.22): implementing the already-adjudicated contract 1.0.22 START-2/MULL-2/MULL-4
  erratum is a separate contract-successor milestone; it is NOT in this branch and
  is the exact next qualification action after merge.'
