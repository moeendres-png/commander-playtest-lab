technical_decisions:
- id: TD-WS75-01-headless-argv
  decision: Headless form is `opencode run --auto <extra...>` (run first, --auto second,
    extras verbatim); TUI form stays `opencode --auto <extra...>` via --ui-mode. No
    /tmp wrapper.
  evidence: opencode.ai CLI + permissions docs fetched 2026-09-12 (last updated 2026-09-10);
    exact-order unit + stub-exec tests.
- id: TD-WS75-02-telemetry-run-dir
  decision: Launcher telemetry moves to <run_dir>/metrics.jsonl; metrics.record creates
    missing parents; launch-context.json carries non-secret context.
  evidence: clean-tree launch test (porcelain empty, no .foundry/metrics.jsonl).
- id: TD-WS75-03-state-context
  decision: FOUNDRY_STATE_PATH/WORKTREE/RUN_DIR/MODE (+existing keys) expose the exact
    launcher paths; implementer instructions forbid guessing the state path.
  evidence: context tests asserting exact values and no secret-shaped content.
- id: TD-WS75-04-reference-roots
  decision: Declared JSON reference contract (label/root/slug/commit/tree/ cleanliness/read-only)
    verified read-only at bootstrap with CWD-based git (never git -C); exposed as
    FOUNDRY_REFERENCE_ROOTS; no broad code-tree allow.
  evidence: exact-match/mismatch/mutation/ignored-residue tests + bootstrap wiring.
- id: TD-WS75-05-doom-loop-deny
  decision: doom_loop ask->deny (auto would auto-approve repetition); ergonomics guidance
    added to foundry-implementer.md.
  evidence: live `opencode debug agent` resolution on 1.18.30 shows deny last (wins);
    battery D01 DENIED, 74 probes, zero UNKNOWN.
- id: TD-WS75-06-version-pin
  decision: tools/foundry/opencode_cli_version.py is the single pin authority (1.18.30);
    launcher verifies installed CLI fail-closed except bounded --version-audit-mode;
    workflow installs immutable assets with SHA256.
  evidence: downloaded linux x64/arm64 assets hashed locally; extracted x64 binary
    reports 1.18.30; mismatch/unparseable/audit-mode tests.
- id: TD-WS75-07-stale-wrapper-env
  decision: A stale FOUNDRY_OPENCODE_BIN pointing at the WS67/WS74 /tmp wrapper now
    fails closed at init (wrapper answers no --version). Operator follow-up - unset
    the var and remove the wrapper; hermetic tests pin opencode_bin explicitly.
  evidence: observed refusal FOUNDRY_OPENCODE_WRAPPER_FAIL unexpected argv (wrapper
    answers no --version).
- id: TD-WS75-08-test-impact-latent-defects
  decision: 'Repaired two real defects found by using test_impact.py: main() called
    `_run(["rev-parse", ...])` without git; changed_files() stripped porcelain via
    `_run`, corrupting the first line XY columns into a phantom `github/...` path.
    Minimal same-scope repair; conservative uncertain behavior kept.'
  evidence: impact mapper output before/after; full tests/foundry green.
- id: TD-WS75-09-full-tests-scope
  decision: 'Full `pytest tests/` is NOT_RUN here: collection needs third-party `typer`
    (absent, pre-existing); only tests/foundry imports the changed modules, so tests/foundry
    (215 passed) + live 1.18.30 battery is the complete affected surface. No out-of-surface
    reassurance runs; no mapper semantics weakened to dodge the uncertain research-dir
    entry.'
  evidence: import-graph grep; collection error text.
