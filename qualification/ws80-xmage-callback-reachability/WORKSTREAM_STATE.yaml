hypotheses_rejected:
- Three families is filename folklore; only one real entrypoint exists. Rejected: Main.java
    shows three disjoint dispatches with distinct bridges/players, Python spawners,
    and CI jobs.
- Full-game is just a flag preserving compat behavior. Rejected: separate XmageFullGameJsonlBridge
    class with disjoint message set, seed required, one-game-per-process, human=true
    blocking controller.
- Bridge stubs unreachable on claimed B4 bounded path. Rejected: incomplete submission_ready
    plus 64-pass loops plus no invocation log; passing B3/B4 assertions are CODE_DERIVED
    for non-invocation.
- Full-game lane has hidden defaults via chooseRingBearer/getMultiAmount/flip/roll. Rejected: delegations
    audited safe via externalized chooseUse plus engine RandomUtil plus reflection
    boundary test.
- Python pilot reconstructs legality. Rejected: Java publishes engine queries only;
    Python ranks among offered option_ids; Java re-validates allow-list plus bounds
    plus actor plus staleness.
- Capability inflation exists. Rejected: exhaustive grep shows false everywhere for
    compat production claims; tactical/phase85/fake hits are non-compat scopes.
- Shuffle no-op is engine-owned randomness. Rejected: compat no-op plus seed_supported=false
    plus seed null is explicitly not engine-owned; full-game super.shuffle plus setSeed
    is engine-owned.
- Unconditional fail-closed guard preserves validated B4 start. Rejected by implementer evidence: GameImpl.init
    starting-player selection is a validated bounded init choice that must self-select
    the requested seat; narrowed exception preserves it while keeping all other external
    discretionary callbacks fail-closed.
