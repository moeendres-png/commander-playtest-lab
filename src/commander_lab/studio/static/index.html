<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="ui.js"></script>
</head>
<body>
<header id="brand">
  <h1 class="brand-h1"><a class="logo" href="index.html">Commander Studio</a><span class="visually-hidden"> – Deckbau</span></h1>
  <nav id="areas" aria-label="Bereiche"><a href="index.html">Deckbau</a><a href="tierliste.html">Tierliste</a><a href="decks.html">Deck-Browser</a><a href="partie.html">Partien</a><a href="daten.html">Daten</a></nav>
  <span class="spacer"></span>
  <label>Commander <select id="commander-select"></select></label>
  <button id="theme-toggle" type="button" class="ghost"></button>
</header>
<header id="top">
  <label>Deck <select id="deck-select"></select></label>
  <button id="new-deck" type="button">Neues Deck</button>
  <button id="import-text" type="button">Deckliste einfügen</button>
  <label>Variante <select id="branch-select"></select></label>
  <button id="new-branch" type="button">Neue Variante</button>
  <span id="counter" class="pill">0 / 100</span>
  <span id="check-pill" class="pill">Prüfung</span>
  <span id="save-state" class="muted"></span>
  <span class="spacer"></span>
  <button id="save" type="button" class="primary">Als Stand speichern</button>
  <button id="deck-labels" type="button" title="Deine Archetyp-Marken für dieses Deck (nur zum Ordnen, keine Wertung)">Marken: keine</button>
  <button id="history" type="button">Verlauf</button>
  <button id="export" type="button">Export</button>
</header>
<div id="data-state"></div>
<div id="auto-deck-note" class="auto-deck-note" role="status" hidden></div>
<main>
  <section id="pool">
    <div id="filters">
      <input id="q" aria-label="Karten suchen" type="search" placeholder="Suche in Name, Typ und Text" autocomplete="off">
      <span id="color-filter" class="chips"></span>
      <button id="filter-toggle" type="button" aria-controls="filters-more" aria-expanded="true" title="Weitere Filter ein- oder ausklappen">Filter <span id="filter-count" class="pill warn" hidden></span></button>
      <div id="filters-more">
      <select id="type-filter" aria-label="Kartentyp"></select>
      <select id="role-filter" aria-label="Rolle"></select>
      <select id="label-filter" title="Nach deinen Archetyp-Marken filtern"></select>
      <label>Manawert <input id="mv-min" aria-label="Manawert von" type="number" min="0" max="20" placeholder="von">
        <input id="mv-max" aria-label="Manawert bis" type="number" min="0" max="20" placeholder="bis"></label>
      <label><input id="f-free" type="checkbox" checked> nur freie</label>
      <label><input id="f-notin" type="checkbox"> nicht im Deck</label>
      <label><input id="f-fav" type="checkbox"> Favoriten</label>
      <label><input id="f-excl" type="checkbox"> Ausgeschlossene zeigen</label>
      <label title="Zeigt an jeder Karte die aktuelle Stufe des Stärke-Index (Schätzung aus Nutzungsdaten, Einstellungen der Tierliste)."><input id="f-tier" type="checkbox" checked> Stufe zeigen</label>
      <label id="f-sim-label"><input id="f-sim" type="checkbox"> <span id="f-sim-text">Simulator-bereit</span></label>
      <label title="Ergänzt den Pool um fehlende Commander-legale Karten (Korpus, EDHREC, Planeswalker, Proliferate; reine Kartenliste)."><input id="f-unowned" type="checkbox"> Zukauf-Pool (fehlende Karten)</label>
      <label>Vergleichsgruppe <select id="cohort"></select></label>
      <span id="bracket-bar" class="chips" aria-label="Bracket-Schnellwahl"></span>
      <span id="gc-band-bar" class="chips" aria-label="Game-Changer-Band (regelabgeleitet, kein Bracket)"></span>
      <label>Universum <select id="universe"></select></label>
      <span id="universe-info" class="muted"></span>
      <label>Sortierung <select id="sort"></select></label>
      <span id="quick-filter-presets" class="chips" aria-label="Filter-Schnellansichten"></span>
      </div>
      <span class="chips" id="view-toggle"></span>
      <button id="columns" type="button">Spalten</button>
      <span id="pool-count" class="muted"></span>
    </div>
    <div id="column-menu" hidden></div>
    <div id="pool-body"></div>
  </section>
  <aside id="deck">
    <div id="play-row"><button id="play-state" type="button" title="Öffnet die Seite Partien mit diesem gespeicherten Stand als Deck auf Sitz 1.">Mit diesem Stand eine Partie spielen</button></div>
    <nav id="deck-tabs" class="chips"></nav>
    <div id="deck-body"></div>
  </aside>
</main>
<div id="preview" hidden><img alt="" referrerpolicy="no-referrer"></div>
<div id="modal" hidden><div id="modal-box"></div></div>
<div id="toast" hidden></div>
<script src="commander.js"></script>
<script src="search.js"></script>
<script src="cardduel.js"></script>
<script src="cutlab.js"></script>
<script src="allocation.js"></script>
<script src="buildlist.js"></script>
<script src="exportformats.js"></script>
<script src="zahl.js"></script>
<script src="kartenverstaendnis.js"></script>
<script src="diffimpact.js"></script>
<script src="deckfacts.js"></script>
<script src="deckevidence.js"></script>
<script src="castability.js"></script>
<script src="packages.js"></script>
<script src="paired.js"></script>
<script src="deckseries.js"></script>
<script src="experiments.js"></script>
<script src="corpusaudit.js"></script>
<script src="kartenauswertung.js"></script>
<script src="cardtrend.js"></script>
<script src="overview.js"></script>
<script src="gcband.js"></script>
<script src="wishlist.js"></script>
<script src="cohort.js"></script>
<script src="app.js"></script>
</body>
</html>
