<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander Studio: Tierliste</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tierliste.css">
<script src="ui.js"></script>
</head>
<body>
<header id="brand">
  <a class="logo" href="index.html">Commander Studio</a>
  <nav id="areas" aria-label="Bereiche"><a href="index.html">Deckbau</a><a href="tierliste.html">Tierliste</a><a href="partie.html">Partien</a></nav>
  <span class="spacer"></span>
  <label>Commander <select id="commander-select"></select></label>
  <button id="theme-toggle" type="button" class="ghost"></button>
</header>
<header id="top">
  <label>Ansicht <select id="view"></select></label>
  <span id="deck-pick" hidden title="Karten, die du in der Tabelle mit „+ Deck“ wählst, kommen in dieses Deck (als Entwurf).">
    <label>Ziel-Deck <select id="deck-select"></select></label>
    <label>Variante <select id="branch-select"></select></label>
  </span>
  <label>Universum <select id="universe-select" title="Deck-Universum für die gezählte Verbreitung"></select></label>
  <span id="tier-pill" class="pill warn" title="Ein Ergebnis-Tier aus Partien braucht ein Modell mit Ergebnisdaten. Ein solches Modell gibt es noch nicht. Die Stufen S bis D gehören zum Stärke-Index (Schätzung aus Nutzungsdaten).">Ergebnis aus Partien: noch nicht bewertet</span>
</header>
<div id="data-state"></div>
<div id="notice"></div>
<div id="universe-panel"></div>
<div id="strength-panel"></div>
<div id="filters">
  <input id="q" type="search" placeholder="Suche in Name und Typ" autocomplete="off">
  <select id="type-filter"></select>
  <select id="role-filter"></select>
  <select id="spread-filter" title="Nach gezählter Verbreitungs-Stufe im gewählten Universum filtern">
    <option value="">Verbreitung: alle Stufen</option>
    <option value="S">Verbreitung: Stufe S</option>
    <option value="A">Verbreitung: Stufe A</option>
    <option value="B">Verbreitung: Stufe B</option>
    <option value="C">Verbreitung: Stufe C</option>
    <option value="D">Verbreitung: Stufe D</option>
    <option value="U">Verbreitung: Stufe U (unbekannt)</option>
    <option value="F">Verbreitung: Filterkarten (ohne Stufe)</option>
  </select>
  <label><input id="f-free" type="checkbox" checked> nur freie</label>
  <label><input id="f-fav" type="checkbox"> Favoriten</label>
  <label><input id="f-excl" type="checkbox"> Ausgeschlossene zeigen</label>
  <label>Sortierung <select id="sort"></select></label>
  <span class="chips" id="tabs"></span>
  <span id="count" class="muted"></span>
</div>
<div id="pool-body"></div>
<div id="modal" hidden><div id="modal-box" class="plain"></div></div>
<div id="toast" hidden></div>
<script src="commander.js"></script>
<script src="tierliste.js"></script>
</body>
</html>
