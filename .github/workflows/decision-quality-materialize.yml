name: Decision Quality 1.18 Materializer

on:
  push:
    branches:
      - fix/decision-quality-1180

permissions:
  contents: write

concurrency:
  group: decision-quality-1180-materializer
  cancel-in-progress: false

jobs:
  materialize-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/decision-quality-1180
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Materialize focused implementation
        run: python .github/materialize_decision_quality.py
      - name: Apply strict guards and compatibility fields
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/commander_lab/optimization/experiments.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    pairs = sorted(observations, key=lambda row: int(row["index"]))\n    if not pairs:\n'''
          replacement = '''    def as_int(value: object, *, field: str) -> int:\n        if isinstance(value, bool) or not isinstance(value, int):\n            raise ValueError(f"paired observation {field} must be an integer")\n        return value\n\n    def as_float(value: object, *, field: str) -> float:\n        if isinstance(value, bool) or not isinstance(value, (int, float)):\n            raise ValueError(f"paired observation {field} must be numeric")\n        return float(value)\n\n    pairs = sorted(observations, key=lambda row: as_int(row["index"], field="index"))\n    if not pairs:\n'''
          if s.count(anchor) != 1:
              raise SystemExit('aggregate type guard anchor mismatch')
          s = s.replace(anchor, replacement, 1)
          s = s.replace('actual = [int(row["index"]) for row in pairs]', 'actual = [as_int(row["index"], field="index") for row in pairs]', 1)
          s = s.replace('return fmean(float(row[key]) for row in pairs)', 'return fmean(as_float(row[key], field=key) for row in pairs)', 1)
          s = s.replace('float(row["baseline_placement"]) - float(row["variant_placement"])', 'as_float(row["baseline_placement"], field="baseline_placement") - as_float(row["variant_placement"], field="variant_placement")', 1)
          s = s.replace('seeds=tuple(int(row["seed"]) for row in pairs)', 'seeds=tuple(as_int(row["seed"], field="seed") for row in pairs)', 1)
          p.write_text(s, encoding='utf-8')

          service = Path('src/commander_lab/tools/service.py')
          text = service.read_text(encoding='utf-8')
          method_old = '"method": "diverse_cut_hypothesis_and_role_package_profile_screening_only",\n                "recommendations": rows[: request.max_recommendations],'
          method_new = '"method": "role_profile_screening_only",\n                "cut_frontier_method": "diverse_cut_hypothesis_and_role_package_profile_screening_only",\n                "recommendations": rows[: request.max_recommendations],'
          if text.count(method_old) != 1:
              raise SystemExit('recommendation compatibility anchor mismatch')
          text = text.replace(method_old, method_new, 1)
          return_anchor = '"candidates": ready_rows,\n                "count": len(ready_rows),'
          return_replacement = '"candidates": ready_rows,\n                "all_screened_candidates": [*semantically_ready, *semantic_deferred],\n                "count": len(ready_rows),'
          if text.count(return_anchor) != 1:
              raise SystemExit('all_screened_candidates compatibility anchor mismatch')
          text = text.replace(return_anchor, return_replacement, 1)
          service.write_text(text, encoding='utf-8')

          # These are intentional 1.18 contract/naming changes, not regressions.
          updates = {
              'tests/unit/test_model_informativeness.py': (
                  'DIAGNOSE_BEFORE_BROAD_SEARCH', 'DIAGNOSE_BEFORE_MORE_SEED_WORK'
              ),
              'tests/unit/test_post117_semantic_execution_fixes.py': (
                  'validated_single_worker_until_issue_55_resolution', 'validated_single_worker_policy_1_18'
              ),
              'tests/unit/test_priority_workflows.py': (
                  'validated_single_worker_until_issue_55_resolution', 'validated_single_worker_policy_1_18'
              ),
          }
          for path, (old, new) in updates.items():
              f = Path(path)
              body = f.read_text(encoding='utf-8')
              if old not in body:
                  raise SystemExit(f'expected old test contract missing: {path}')
              f.write_text(body.replace(old, new), encoding='utf-8')
          PY
      - name: Install full validation extras
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Normalize changed Python
        run: |
          python -m ruff check --fix src/commander_lab tests
          python -m ruff format src/commander_lab tests
      - name: Strict static gates
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy src
          python -m compileall -q src tests
      - name: Create clean local validation snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve decision frontier and evidence routing [materialized]'
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Focused decision-quality regression
        run: |
          python -m pytest -q \
            tests/unit/test_decision_quality_1180.py \
            tests/integration/test_priority_prefix_and_frontier_1180.py
      - name: Existing priority acceptance smoke
        run: |
          python -m pytest -q tests/unit tests/integration --ignore=tests/integration/test_priority_prefix_and_frontier_1180.py
      - name: Remove temporary materializer controls
        run: |
          rm -f .github/materialize_decision_quality.py
          rm -f .github/workflows/decision-quality-materialize.yml
          git add -A
          git commit --amend --no-edit
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Push tested implementation
        run: git push origin HEAD:fix/decision-quality-1180
