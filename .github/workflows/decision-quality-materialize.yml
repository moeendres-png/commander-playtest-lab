name: Decision Quality 1.18 Materializer

on:
  push:
    branches:
      - fix/decision-quality-1180

permissions:
  contents: write

concurrency:
  group: decision-quality-1180-materializer
  cancel-in-progress: false

jobs:
  materialize-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/decision-quality-1180
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Materialize focused implementation
        run: python .github/materialize_decision_quality.py
      - name: Apply strict observation type guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/commander_lab/optimization/experiments.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    pairs = sorted(observations, key=lambda row: int(row["index"]))\n    if not pairs:\n'''
          replacement = '''    def as_int(value: object, *, field: str) -> int:\n        if isinstance(value, bool) or not isinstance(value, int):\n            raise ValueError(f"paired observation {field} must be an integer")\n        return value\n\n    def as_float(value: object, *, field: str) -> float:\n        if isinstance(value, bool) or not isinstance(value, (int, float)):\n            raise ValueError(f"paired observation {field} must be numeric")\n        return float(value)\n\n    pairs = sorted(observations, key=lambda row: as_int(row["index"], field="index"))\n    if not pairs:\n'''
          if s.count(anchor) != 1:
              raise SystemExit('aggregate type guard anchor mismatch')
          s = s.replace(anchor, replacement, 1)
          s = s.replace('actual = [int(row["index"]) for row in pairs]', 'actual = [as_int(row["index"], field="index") for row in pairs]', 1)
          s = s.replace('return fmean(float(row[key]) for row in pairs)', 'return fmean(as_float(row[key], field=key) for row in pairs)', 1)
          s = s.replace('float(row["baseline_placement"]) - float(row["variant_placement"])', 'as_float(row["baseline_placement"], field="baseline_placement") - as_float(row["variant_placement"], field="variant_placement")', 1)
          s = s.replace('seeds=tuple(int(row["seed"]) for row in pairs)', 'seeds=tuple(as_int(row["seed"], field="seed") for row in pairs)', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install full validation extras
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Normalize changed Python
        run: |
          python -m ruff check --fix src/commander_lab tests/unit/test_decision_quality_1180.py tests/integration/test_priority_prefix_and_frontier_1180.py
          python -m ruff format src/commander_lab tests/unit/test_decision_quality_1180.py tests/integration/test_priority_prefix_and_frontier_1180.py
      - name: Strict static gates
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy src
          python -m compileall -q src tests
      - name: Focused decision-quality regression
        run: |
          python -m pytest -q \
            tests/unit/test_decision_quality_1180.py \
            tests/integration/test_priority_prefix_and_frontier_1180.py
      - name: Existing priority acceptance smoke
        run: |
          python -m pytest -q tests/unit tests/integration --ignore=tests/integration/test_priority_prefix_and_frontier_1180.py
      - name: Remove temporary materializer controls
        run: |
          rm -f .github/materialize_decision_quality.py
          rm -f .github/workflows/decision-quality-materialize.yml
      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Improve decision frontier and evidence routing [materialized]'
          git push origin HEAD:fix/decision-quality-1180
