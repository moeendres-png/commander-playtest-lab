name: Audit F Post-Merge Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/f-postmerge-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-merged-closeout-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify containment and delete merged F closeout branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main docs/f-closeout-g-handoff
          git merge-base --is-ancestor origin/docs/f-closeout-g-handoff origin/main
          git push origin --delete docs/f-closeout-g-handoff
