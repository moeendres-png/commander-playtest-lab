name: J-P4 Materialize Frozen Implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'roadmap/j-p4-pilot-quality'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize frozen J-P4 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .jp4_payload.part0 .jp4_payload.part1 .jp4_payload.part2 .jp4_payload.part3 | base64 -d > /tmp/jp4_payload.tar.gz
          echo "798d990958e4a90e3cc1a847e847004da025ef2b4fd4f443e7379cd1bd363083  /tmp/jp4_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/jp4_payload.tar.gz -C .
          echo "426e184e2dd3ade9245dd4756ee58e796841e1fa71237c3239b55ab16b0859f2  data/evals/holdout/pilot_decisions_j_p4_v1.json" | sha256sum -c -
          echo "259cb59c70f86fe2117282c0751d218a9e9535b7121211117a1b504b81d49e78  data/evals/golden/pilot_decisions_j_p4_v1.json" | sha256sum -c -
          echo "a8a262ab91d42a7d38de79630cf5a1711878ecaf943c59361524c5474980bc39  src/commander_lab/agents/pilots.py" | sha256sum -c -
          echo "f2b14390a0215655ba9a3f350d47460dae33c27e504bde550ad82903e6db5ee7  src/commander_lab/models/pilots.py" | sha256sum -c -
          echo "1e198af9a00cdb7a6900a3f72793bd223cef2e0d00b05131db0678e0aa58db48  src/commander_lab/evals/models.py" | sha256sum -c -
          echo "23a481cf76c4e6efed802104feed3fd65fb750d3717de45d0219d88236d8fd84  src/commander_lab/evals/golden.py" | sha256sum -c -
          python -m compileall -q src scripts
          rm .jp4_payload.part0 .jp4_payload.part1 .jp4_payload.part2 .jp4_payload.part3
          rm .github/workflows/jp4-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Roadmap J-P4: materialize frozen pilot implementation"
          git push origin HEAD:${{ github.head_ref }}
