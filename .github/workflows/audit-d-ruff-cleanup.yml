name: Audit D Ruff cleanup

on:
  push:
    branches:
      - agent/audit-d-limitation-remediation

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply safe Ruff fixes and formatting only to D files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/commander_lab/counterfactual.py
            src/commander_lab/models/counterfactual.py
            src/commander_lab/models/tooling.py
            src/commander_lab/tools/service.py
            tests/unit/test_limitation_remediation_d.py
          )
          ruff check --fix -- "${files[@]}" || true
          ruff format -- "${files[@]}"
          git diff --check
      - name: Commit mechanical cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/counterfactual.py src/commander_lab/models/counterfactual.py src/commander_lab/models/tooling.py src/commander_lab/tools/service.py tests/unit/test_limitation_remediation_d.py
          git rm .github/workflows/audit-d-ruff-cleanup.yml
          git commit -m 'style: normalize audit D changed files'
          git push origin HEAD:agent/audit-d-limitation-remediation
