name: Dispatch Post-Fix Balance Campaign

on:
  push:
    branches:
      - runs/rogshai-postfix-opponent-balance-7680-20260825
    paths:
      - '.github/workflows/dispatch-postfix-balance.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch campaign on current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/rogshai-postfix-opponent-balance-7680.yml/dispatches \
            -d '{"ref":"runs/rogshai-postfix-opponent-balance-7680-20260825"}'
