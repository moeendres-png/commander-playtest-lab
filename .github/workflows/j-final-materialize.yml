name: J-FINAL Materializer

on:
  push:
    branches:
      - roadmap/j-final-closeout

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one-shot repair
        run: python scripts/materialize_j_final_repair.py
      - name: Verify syntax and targeted tests
        run: |
          python -m pip install -e '.[dev]'
          ruff check --fix src/commander_lab/tools/service.py src/commander_lab/candidate_screening.py tests/regressions/test_j_final_scope.py
          ruff format src/commander_lab/tools/service.py src/commander_lab/candidate_screening.py tests/regressions/test_j_final_scope.py
          python -m compileall -q src tests
          pytest -q tests/regressions/test_j_final_scope.py tests/unit/test_candidate_screening.py tests/unit/test_project_context.py tests/unit/test_priority_workflows.py
          ruff check src/commander_lab/tools/service.py src/commander_lab/candidate_screening.py tests/regressions/test_j_final_scope.py
          ruff format --check src/commander_lab/tools/service.py src/commander_lab/candidate_screening.py tests/regressions/test_j_final_scope.py
      - name: Commit materialized repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/tools/service.py src/commander_lab/candidate_screening.py tests/regressions/test_j_final_scope.py
          if git diff --cached --quiet; then
            echo 'No materialized changes detected.'
            exit 1
          fi
          git commit -m 'fix: reconcile final RogShai-only discovery scope'
          git push origin HEAD:roadmap/j-final-closeout
