# Non-consuming readiness only; this workflow never opens gameplay evidence partitions.
name: RogShai Official Fresh Optimizer-v2 Readiness Post PR113

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.run-tools/official_campaign_driver.py'
      - '.github/workflows/rogshai-official-fresh-post-pr113-readiness.yml'
      - '.github/workflows/rogshai-official-fresh-post-pr113-execute.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  FROZEN_MAIN_COMMIT: '03bad1717d6485d769cca70a6731b621a06f3658'
  FROZEN_MAIN_TREE: '3c6197abb31342f7a0cc368231d94658bfa33863'
  PRE_RUN_ARTIFACT_ID: '9483190545'
  PRE_RUN_ARTIFACT_SHA256: 'cc382e9dae7c59f32914189c76dda35f14255fa59968a493a27f8b9b38e5785c'
  MANIFEST_FILE_SHA256: 'e515ca2a5e23a6bbadb6f8bcd32ece2e65b1af0a17394f173076e2f13604e0cb'
  MANIFEST_HASH: '9d73226ce46f75c82d388ea026ad25579c8064b805f05b24ff4c2c2de44476b7'
  MANIFEST_SEED: '2026082301'
  READY_DIR: 'readiness-evidence'

jobs:
  non-consuming-readiness:
    if: >-
      github.event.pull_request.head.ref == 'runs/rogshai-official-fresh-ready-post-pr113-20260823' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout execution vehicle only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: vehicle
          fetch-depth: 1

      - name: Checkout exact canonical runtime separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.FROZEN_MAIN_COMMIT }}
          path: runtime
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime/pyproject.toml

      - name: Verify exact current main and separated execution identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C runtime rev-parse HEAD)" = "$FROZEN_MAIN_COMMIT"
          test "$(git -C runtime rev-parse HEAD^{tree})" = "$FROZEN_MAIN_TREE"
          git -C runtime fetch origin main --quiet
          test "$(git -C runtime rev-parse refs/remotes/origin/main)" = "$FROZEN_MAIN_COMMIT"
          test -z "$(git -C runtime status --porcelain=v1 --untracked-files=no)"
          test -f vehicle/.run-tools/official_campaign_driver.py
          test ! -e runtime/.run-tools/official_campaign_driver.py

      - name: Install exact canonical runtime
        run: python -m pip install -e './runtime[dev,api]'

      - name: Retrieve exact fresh frozen manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE_RUN_ARTIFACT_ID}/zip" \
            -o /tmp/pre-run-freeze.zip
          echo "${PRE_RUN_ARTIFACT_SHA256}  /tmp/pre-run-freeze.zip" | sha256sum -c -
          rm -rf /tmp/pre-run-freeze
          mkdir -p /tmp/pre-run-freeze
          unzip -q /tmp/pre-run-freeze.zip -d /tmp/pre-run-freeze
          test -f /tmp/pre-run-freeze/ROGSHAI_PRE_RUN_MANIFEST.json
          echo "${MANIFEST_FILE_SHA256}  /tmp/pre-run-freeze/ROGSHAI_PRE_RUN_MANIFEST.json" | sha256sum -c -
          cp /tmp/pre-run-freeze/PRE_RUN_FREEZE_SUMMARY.json "$READY_DIR-PRE_RUN_FREEZE_SUMMARY.json"
          cp /tmp/pre-run-freeze/CROSS_CAMPAIGN_DISJOINTNESS.json "$READY_DIR-CROSS_CAMPAIGN_DISJOINTNESS.json"

      - name: Compile execution driver
        run: python -m py_compile vehicle/.run-tools/official_campaign_driver.py

      - name: Regression gates for calibration-first and current-control anchor
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            runtime/tests/unit/test_optimizer_runtime_seed_anchor.py \
            runtime/tests/unit/test_optimizer_v2_release.py
          test -z "$(git -C runtime status --porcelain=v1 --untracked-files=no)"

      - name: Execute non-consuming exact-runtime readiness probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$READY_DIR"
          python vehicle/.run-tools/official_campaign_driver.py \
            --mode preflight \
            --root runtime \
            --manifest /tmp/pre-run-freeze/ROGSHAI_PRE_RUN_MANIFEST.json \
            --output-dir "$READY_DIR" \
            --expected-commit "$FROZEN_MAIN_COMMIT" \
            --expected-tree "$FROZEN_MAIN_TREE" \
            --expected-manifest-hash "$MANIFEST_HASH" \
            --expected-manifest-file-sha256 "$MANIFEST_FILE_SHA256" \
            --expected-seed "$MANIFEST_SEED" \
            --workers 4 \
            --max-turns 35

      - name: Assert armed readiness without evidence consumption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['READY_DIR'])
          ready = json.loads((root / 'RUN_READY.json').read_text())
          pre = json.loads((root / 'RUN_PREFLIGHT.json').read_text())
          anchor = json.loads((root / 'CURRENT_CONTROL_ANCHOR_AUDIT.json').read_text())
          assert ready['status'] == 'PASS_READY_NOT_STARTED'
          assert ready['RUN_STARTED'] is False
          assert ready['CURRENT_FREEZE_VALID'] is True
          assert ready['CURRENT_MANIFEST_EVIDENCE_CONSUMED'] is False
          assert ready['CURRENT_SEALED_HOLDOUT_OPENED'] is False
          assert ready['canonical_main_commit'] == os.environ['FROZEN_MAIN_COMMIT']
          assert ready['canonical_main_tree'] == os.environ['FROZEN_MAIN_TREE']
          assert ready['manifest_hash'] == os.environ['MANIFEST_HASH']
          assert ready['manifest_seed'] == int(os.environ['MANIFEST_SEED'])
          assert ready['operational_pod_size'] == 4
          assert ready['candidate_count'] == 795
          assert ready['semantic_unknown_count'] == 0
          assert ready['CURRENT_CONTROL_SEARCH_ANCHOR'] == 'present_exact_current_control'
          assert anchor['status'] == 'pass'
          assert anchor['exact_control_anchor_policy'] == 'CURRENT_CONTROL'
          assert anchor['evidence_consumed'] is False
          assert pre['status'] == 'pass'
          forbidden = (
              'calibration-report.json',
              'optimizer-search-report.json',
              'frontier-handoff.json',
              'confirmatory-report.json',
              'critical-diagnostics-report.json',
              'holdout-report.json',
          )
          assert not [name for name in forbidden if (root / name).exists()]
          PY
          test -z "$(git -C runtime status --porcelain=v1 --untracked-files=no)"
          git -C runtime diff --exit-code

      - name: Record readiness provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$READY_DIR-PRE_RUN_FREEZE_SUMMARY.json" "$READY_DIR/PRE_RUN_FREEZE_SUMMARY.json"
          cp "$READY_DIR-CROSS_CAMPAIGN_DISJOINTNESS.json" "$READY_DIR/CROSS_CAMPAIGN_DISJOINTNESS.json"
          printf 'vehicle_head=%s\ncanonical_main=%s\ncanonical_tree=%s\nmanifest_hash=%s\nmanifest_seed=%s\nrun_started=false\nevidence_consumed=false\nholdout_opened=false\n' \
            "${{ github.event.pull_request.head.sha }}" "$FROZEN_MAIN_COMMIT" "$FROZEN_MAIN_TREE" "$MANIFEST_HASH" "$MANIFEST_SEED" \
            > "$READY_DIR/READINESS_PROVENANCE.txt"
          (cd "$READY_DIR" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload immutable non-consuming readiness evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: rogshai-official-fresh-post-pr113-readiness-${{ github.event.pull_request.head.sha }}
          path: ${{ env.READY_DIR }}/
          if-no-files-found: error
          retention-days: 90
