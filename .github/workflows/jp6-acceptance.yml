name: J-P6 Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, roadmap/j-p6-performance-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with: {python-version: '3.12'}
      - name: Install dev/api/mcp surface
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Static integrity
        run: |
          git diff --check
          python -m compileall -q src tests scripts
      - name: Focused P4/P5/P6 decision and runtime regression
        run: |
          pytest -q \
            tests/unit/test_j_p6_hardening.py \
            tests/unit/test_j_p5_optimizer_validation.py \
            tests/unit/test_j_p0_run_identity.py \
            tests/unit/test_snapshot_reproducibility.py \
            tests/unit/test_audit_e_performance_scheduler.py \
            tests/integration/test_phase5_server.py \
            tests/unit/test_phase12_17_mcp.py \
            tests/integration/test_phase12_17_mcp_stdio.py
      - name: End-to-end core workflow smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/j_p6
          python scripts/run_j_p6_workflow_smoke.py 2>&1 | tee artifacts/j_p6/J_P6_WORKFLOW_SMOKE.log
      - name: CLI help and package metadata
        run: |
          commander-lab --help >/dev/null
          python - <<'PY'
          import importlib.metadata
          from commander_lab import __version__
          from commander_lab.api.tool_server import create_app
          from pathlib import Path
          assert importlib.metadata.version('commander-playtest-lab') == __version__
          assert create_app(Path('.')).version == __version__
          PY
      - name: Holdout integrity and no canonical mutation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          h=Path('data/evals/holdout/J_P5_OPTIMIZER_HOLDOUT_v1.json')
          assert hashlib.sha256(h.read_bytes()).hexdigest() == 'b75e8622097221b00ad51322e2ad13fe5158cfd8647e92d2cb21a0d65b447203'
          seal=json.loads(Path('docs/J_P5_HOLDOUT_SEAL.json').read_text())
          assert seal['evaluation_count'] == 1
          assert seal['post_holdout_tuning_performed'] is False
          manifest=json.loads(Path('data/decks/manifest.json').read_text())
          assert manifest['decks']['korvold/current']['deck_hash'] == '72c0cb6a804cfb97b5cb048ca5e2b261782037044f6360b98a6b7df51c79bf1f'
          assert manifest['decks']['rogshai/current']['deck_hash'] == '3827c35995e280753c4e714e391b9baf0a34e2c019e9df519ea1db0260ff9932'
          PY
      - name: Assert tracked tree remains clean
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: jp6-acceptance-${{ github.sha }}
          path: |
            artifacts/j_p6/J_P6_WORKFLOW_SMOKE.json
            artifacts/j_p6/J_P6_WORKFLOW_SMOKE.log
          if-no-files-found: warn
