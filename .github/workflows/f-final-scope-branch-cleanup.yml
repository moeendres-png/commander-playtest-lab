name: Audit F Final Scope Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/f-final-scope-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-merged-scope-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify containment and delete merged scope-correction branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main docs/f-handoff-scope-correction
          git merge-base --is-ancestor origin/docs/f-handoff-scope-correction origin/main
          git push origin --delete docs/f-handoff-scope-correction
