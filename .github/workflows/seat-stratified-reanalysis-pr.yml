name: Seat-Stratified Existing-Game Reanalysis

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seat-stratified-reanalysis-pr.yml'

permissions:
  contents: read
  actions: read

jobs:
  reanalyse-existing-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Fetch frozen reanalysis code from historical run branch
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/moeendres-png/commander-playtest-lab/runs/rogshai-48-structural-12opp-20260825/scripts/reanalyse_structural_seat_pairwise.py' -o /tmp/reanalyse.py
          python -m py_compile /tmp/reanalyse.py
      - name: Reanalyse only the existing 12,288 Structural game rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python /tmp/reanalyse.py --repo "$GITHUB_REPOSITORY" --output artifacts/seat-reanalysis
      - name: Verify immutable-input contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/seat-reanalysis/ANALYSIS_MANIFEST.json').read_text())
          assert m['new_games_generated'] is False
          assert m['total_existing_game_rows']==12288
          assert m['replications']=={'R1':6144,'R2':6144}
          assert m['pairs']==1128 and m['pairwise_seat_rows']==4512
          assert m['games_per_candidate']==256 and m['games_per_candidate_per_seat']==64
          assert len(m['selected_artifacts'])==16
          print('EXISTING_GAME_ONLY_REANALYSIS=PASS')
          PY
      - name: Remove recovered raw copies before upload
        run: rm -rf artifacts/seat-reanalysis/_recovered
      - name: Upload seat-stratified matrix
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: seat-stratified-pairwise-reanalysis-${{ github.sha }}
          path: artifacts/seat-reanalysis/
          if-no-files-found: error
          retention-days: 14
