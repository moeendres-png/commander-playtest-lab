name: Historical J-P3C Forge Runtime XVFB Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-runtime-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORGE_REPO: https://github.com/Card-Forge/forge.git
      FORGE_COMMIT: a37a865a53280dd8ad6fad3384d69611e8c5a42f
      CONTRACT_HASH: 89e0813ec66787328dd4b204f57cb5c404694dec29d249fbbb8785fad0a6d2c6
      SCORING_HASH: 67bc2d99e604f22c3a0d6cc3e00682fe9ac5cb86faccae979418eb2cf40d6227
      FIXTURE_HASH: cfea9c136b9126c4d367b0c91ebfe4089a47490c7d60dfae5e78dd307eb47dbb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Record historical evidence boundary
        run: echo 'historical_provenance_only=true'

      - name: Acquire and build exact Forge release
        shell: bash
        run: |
          set -eu
          mkdir -p evidence/{acquisition,build,runtime,decks,replay_or_trace,failures}
          git clone --no-checkout "$FORGE_REPO" forge-provider > evidence/acquisition/clone.log 2>&1
          cd forge-provider
          git checkout --detach "$FORGE_COMMIT" >> ../evidence/acquisition/clone.log 2>&1
          printf 'requested=%s\nactual=%s\ntree=%s\ntags=%s\ncontract_hash=%s\nscoring_hash=%s\nfixture_hash=%s\n' \
            "$FORGE_COMMIT" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git tag --points-at HEAD | tr '\n' ' ')" \
            "$CONTRACT_HASH" "$SCORING_HASH" "$FIXTURE_HASH" > ../evidence/acquisition/identity.txt
          test "$(git rev-parse HEAD)" = "$FORGE_COMMIT"
          mvn -B -DskipTests -pl forge-gui-desktop -am package > ../evidence/build/maven.log 2>&1
          echo $? > ../evidence/build/exit-code.txt
          cp forge-gui-desktop/target/forge.sh ../evidence/build/forge.sh || true
          find forge-gui-desktop/target -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > ../evidence/build/artifacts.txt

      - name: Configure isolated profile and real Commander decks
        shell: bash
        run: |
          set -eu
          ROOT="$GITHUB_WORKSPACE/forge-profile"
          D="$ROOT/decks/commander"
          mkdir -p "$D" "$ROOT/cache" "$ROOT/decks/constructed"
          cat > forge-provider/forge-gui/forge.profile.properties <<EOF
          userDir=$ROOT/
          cacheDir=$ROOT/cache/
          cardPicsDir=$ROOT/cache/pics/cards/
          decksDir=$ROOT/decks/
          decksConstructedDir=$ROOT/decks/constructed/
          EOF
          cat > "$D/rogshai-p3c.dck" <<'EOF'
          [metadata]
          Name=RogShai P3C Probe
          [commander]
          1 Ishai, Ojutai Dragonspeaker
          1 Rograkh, Son of Rohgahh
          [main]
          33 Plains
          33 Island
          32 Mountain
          EOF
          for n in 1 2 3; do
            cp 'forge-provider/forge-gui/res/quest/precons/Timeless Wisdom.dck' "$D/gavi-p3c-$n.dck"
            sed -i "s/^Name=Timeless Wisdom$/Name=Gavi P3C Probe $n/" "$D/gavi-p3c-$n.dck"
          done
          cp "$D"/*.dck evidence/decks/
          printf 'xvfb_run=%s\n' "$(command -v xvfb-run || true)" > evidence/runtime/launcher-environment.txt
          java -version >> evidence/runtime/launcher-environment.txt 2>&1

      - name: Execute real four-player Commander under virtual display
        id: run1
        shell: bash
        continue-on-error: true
        run: |
          set +e
          JAR=$(realpath forge-provider/forge-gui-desktop/target/forge-gui-desktop-2.0.14-jar-with-dependencies.jar)
          cd forge-provider/forge-gui
          START=$(date +%s)
          timeout --signal=TERM --kill-after=10s 150s xvfb-run -a \
            java -Xmx4096m -Dio.netty.tryReflectionSetAccessible=true -Dfile.encoding=UTF-8 \
            -jar "$JAR" sim -d rogshai-p3c.dck gavi-p3c-1.dck gavi-p3c-2.dck gavi-p3c-3.dck \
            -n 1 -f commander -s 424242 -c 60 \
            > "$GITHUB_WORKSPACE/evidence/runtime/run1.log" 2>&1
          RC=$?
          END=$(date +%s)
          printf 'exit_code=%s\nelapsed_seconds=%s\n' "$RC" "$((END-START))" > "$GITHUB_WORKSPACE/evidence/runtime/run1-exit.txt"
          find "$GITHUB_WORKSPACE/forge-profile" -type f -maxdepth 3 -name 'forge.log' -exec cp {} "$GITHUB_WORKSPACE/evidence/runtime/forge-run1.log" \; 2>/dev/null || true
          exit "$RC"

      - name: Execute identical seeded run again
        id: run2
        if: always() && steps.run1.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          JAR=$(realpath forge-provider/forge-gui-desktop/target/forge-gui-desktop-2.0.14-jar-with-dependencies.jar)
          cd forge-provider/forge-gui
          timeout --signal=TERM --kill-after=10s 150s xvfb-run -a \
            java -Xmx4096m -Dio.netty.tryReflectionSetAccessible=true -Dfile.encoding=UTF-8 \
            -jar "$JAR" sim -d rogshai-p3c.dck gavi-p3c-1.dck gavi-p3c-2.dck gavi-p3c-3.dck \
            -n 1 -f commander -s 424242 -c 60 \
            > "$GITHUB_WORKSPACE/evidence/runtime/run2.log" 2>&1
          RC=$?
          echo "$RC" > "$GITHUB_WORKSPACE/evidence/runtime/run2-exit-code.txt"
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import re, pathlib
          for n in (1,2):
              p=pathlib.Path(f'evidence/runtime/run{n}.log')
              text=p.read_text(errors='replace')
              text=re.sub(r'Took \d+ ms', 'Took <TIME> ms', text)
              text=re.sub(r'\b\d+(?:\.\d+)? (?:ms|s)\b', '<TIME>', text)
              pathlib.Path(f'evidence/replay_or_trace/run{n}-normalized.log').write_text(text)
          a=pathlib.Path('evidence/replay_or_trace/run1-normalized.log').read_bytes()
          b=pathlib.Path('evidence/replay_or_trace/run2-normalized.log').read_bytes()
          pathlib.Path('evidence/replay_or_trace/reproducibility.txt').write_text(f'same_seed_normalized_trace_match={str(a==b).lower()}\n')
          PY
          exit "$RC"

      - name: Capture process/result summary and manifest
        if: always()
        shell: bash
        run: |
          set -eu
          printf 'run1_outcome=%s\nrun2_outcome=%s\n' '${{ steps.run1.outcome }}' '${{ steps.run2.outcome }}' > evidence/runtime/outcomes.txt
          grep -E 'Simulation mode|game of Commander|seed 424242|Game Result|Could not load deck|Exception|ERROR|Error|RogrShai|Gavi' evidence/runtime/run1.log > evidence/runtime/run1-summary.txt || true
          pgrep -af 'forge|forge.view.Main' > evidence/runtime/residual-processes.txt || true
          find evidence -type f ! -name SHA256SUMS.txt ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          sha256sum evidence/SHA256SUMS.txt > evidence/MANIFEST_SHA256.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: J_P3_FORGE_RUNTIME_XVFB_EVIDENCE
          path: evidence
          if-no-files-found: error
          retention-days: 90
