name: Optimizer Runtime Autofix TEMP

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'policy/full-card-knowledge-precision-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: policy/full-card-knowledge-precision-20260820
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply bounded type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/commander_lab/whole_deck/optimizer_v2_decision_runtime.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              ') -> "CriticalDiagnosticsPartition":': ') -> CriticalDiagnosticsPartition:',
              'def validate_decision_contract(self) -> "DecisionOptimizerV2Manifest":': 'def validate_decision_contract(self) -> DecisionOptimizerV2Manifest:',
              '        return cls(**payload, identity=sha256_value(payload))': '''        return cls(\n            master_seed=master_seed,\n            scenario_ids=tuple(row.scenario_id for row in scenarios),\n            scenario_seeds=tuple(row.seed for row in scenarios),\n            identity=sha256_value(payload),\n        )''',
              '        "interaction": sum(float(role_map.get(key, 0.0)) for key in ("counter", "removal", "wipe", "graveyard_hate")),': '        "interaction": sum(_mapping_float(role_map, key) for key in ("counter", "removal", "wipe", "graveyard_hate")),',
              '        "protection": float(role_map.get("protection", 0.0)),': '        "protection": _mapping_float(role_map, "protection"),',
              '        "velocity": sum(float(role_map.get(key, 0.0)) for key in ("ramp", "selection", "draw")),': '        "velocity": sum(_mapping_float(role_map, key) for key in ("ramp", "selection", "draw")),',
              '        "finish": sum(float(role_map.get(key, 0.0)) for key in ("finisher", "payoff", "combat_payoff")),': '        "finish": sum(_mapping_float(role_map, key) for key in ("finisher", "payoff", "combat_payoff")),',
              '            passed = float(result["interval_high"]) >= ROBUSTNESS_MARGIN and float(result["mean_delta"]) >= -0.10': '            passed = _number(result, "interval_high") >= ROBUSTNESS_MARGIN and _number(result, "mean_delta") >= -0.10',
              '            passed = float(result["mean_delta"]) >= ROBUSTNESS_MARGIN and float(result["interval_high"]) >= ROBUSTNESS_MARGIN': '            passed = _number(result, "mean_delta") >= ROBUSTNESS_MARGIN and _number(result, "interval_high") >= ROBUSTNESS_MARGIN',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected bounded replacement not found: {old[:80]}')
              text = text.replace(old, new, 1)

          marker = '\ndef _pareto_dimensions(row: Mapping[str, Any]) -> dict[str, float]:\n'
          helper = '''\ndef _mapping_float(mapping: Mapping[str, object], key: str) -> float:\n    value = mapping.get(key, 0.0)\n    return float(value) if isinstance(value, int | float) else 0.0\n\n\ndef _pareto_dimensions(row: Mapping[str, Any]) -> dict[str, float]:\n'''
          if marker not in text:
              raise SystemExit('pareto helper insertion marker not found')
          text = text.replace(marker, helper, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Ruff fix and format changed Python
        run: |
          python -m pip install ruff==0.16.4
          ruff check --fix src/commander_lab/whole_deck/optimizer_v2_decision_runtime.py tests/unit/test_optimizer_v2_decision_runtime.py
          ruff format src/commander_lab/whole_deck/optimizer_v2_decision_runtime.py tests/unit/test_optimizer_v2_decision_runtime.py src/commander_lab/whole_deck/lab_context.py src/commander_lab/optimizer_v2_cli.py
      - name: Commit bounded fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/whole_deck/optimizer_v2_decision_runtime.py tests/unit/test_optimizer_v2_decision_runtime.py src/commander_lab/whole_deck/lab_context.py src/commander_lab/optimizer_v2_cli.py
          git commit -m 'fix: satisfy optimizer runtime strict quality gates'
          git push origin HEAD:policy/full-card-knowledge-precision-20260820
