name: Semantic Projection Repair TEMP

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'policy/full-card-knowledge-precision-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: policy/full-card-knowledge-precision-20260820
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply exact verified Alandra recovery guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/commander_lab/whole_deck/lab_context.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _decode_semantic_projection(path: Path) -> dict[str, Any]:
    try:
        compressed = base64.b64decode(path.read_text(encoding="ascii"), validate=True)
    except Exception as exc:
        raise RuntimeError("current RogShai semantic projection base64 is invalid") from exc

    try:
        decoded = zlib.decompress(compressed)
    except zlib.error as exc:
        if "incorrect data check" not in str(exc) or len(compressed) <= 6:
            raise RuntimeError(
                "current RogShai semantic projection cannot be decompressed"
            ) from exc
        try:
            decoded = zlib.decompress(compressed[2:-4], wbits=-zlib.MAX_WBITS)
        except zlib.error as raw_exc:
            raise RuntimeError(
                "current RogShai semantic projection checksum recovery failed"
            ) from raw_exc

    try:
        payload = json.loads(decoded.decode("utf-8"))
    except (UnicodeDecodeError, json.JSONDecodeError) as exc:
        raise RuntimeError("current RogShai semantic projection payload is invalid") from exc
    if not isinstance(payload, dict):
        raise RuntimeError("current RogShai semantic projection payload must be an object")
    return payload
'''
          new = '''def _decode_semantic_projection(path: Path) -> tuple[dict[str, Any], bool]:
    try:
        compressed = base64.b64decode(path.read_text(encoding="ascii"), validate=True)
    except Exception as exc:
        raise RuntimeError("current RogShai semantic projection base64 is invalid") from exc

    checksum_recovered = False
    try:
        decoded = zlib.decompress(compressed)
    except zlib.error as exc:
        if "incorrect data check" not in str(exc) or len(compressed) <= 6:
            raise RuntimeError(
                "current RogShai semantic projection cannot be decompressed"
            ) from exc
        try:
            decoded = zlib.decompress(compressed[2:-4], wbits=-zlib.MAX_WBITS)
            checksum_recovered = True
        except zlib.error as raw_exc:
            raise RuntimeError(
                "current RogShai semantic projection checksum recovery failed"
            ) from raw_exc

    try:
        payload = json.loads(decoded.decode("utf-8"))
    except (UnicodeDecodeError, json.JSONDecodeError) as exc:
        raise RuntimeError("current RogShai semantic projection payload is invalid") from exc
    if not isinstance(payload, dict):
        raise RuntimeError("current RogShai semantic projection payload must be an object")
    return payload, checksum_recovered
'''
          if old not in text:
              raise SystemExit('exact semantic decoder block not found')
          text = text.replace(old, new, 1)
          old_line = '    payload = _decode_semantic_projection(path)\n'
          new_block = '''    payload, checksum_recovered = _decode_semantic_projection(path)
'''
          if old_line not in text:
              raise SystemExit('semantic decoder call not found')
          text = text.replace(old_line, new_block, 1)
          marker = '''    if not isinstance(templates, list) or not isinstance(row_index, dict):
        raise RuntimeError("current RogShai semantic projection rows are malformed")
'''
          repair = '''    if not isinstance(templates, list) or not isinstance(row_index, dict):
        raise RuntimeError("current RogShai semantic projection rows are malformed")
    expected = set(base.cards)
    raw_actual = {str(name) for name in row_index}
    corrupt_name = "Alandra5 Sky Dreamer"
    canonical_name = "Alandra, Sky Dreamer"
    if checksum_recovered and raw_actual != expected:
        missing = expected - raw_actual
        extra = raw_actual - expected
        if missing == {canonical_name} and extra == {corrupt_name}:
            repaired_index = dict(row_index)
            repaired_index[canonical_name] = repaired_index.pop(corrupt_name)
            row_index = repaired_index
            payload = {**payload, "r": repaired_index}
'''
          if marker not in text:
              raise SystemExit('semantic rows validation marker not found')
          text = text.replace(marker, repair, 1)
          old_expected = '''    expected = set(base.cards)
    actual = set(rows)
'''
          new_expected = '''    actual = set(rows)
'''
          if old_expected not in text:
              raise SystemExit('expected universe block not found')
          text = text.replace(old_expected, new_expected, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/unit/test_optimizer_v2_decision_runtime.py')
          test = test_path.read_text(encoding='utf-8')
          needle = '''    assert len(lab.context.cards) == expected == 795
'''
          replacement = '''    assert len(lab.context.cards) == expected == 795
    assert "Alandra, Sky Dreamer" in lab.context.cards
    assert "Alandra5 Sky Dreamer" not in lab.context.cards
'''
          if needle not in test:
              raise SystemExit('semantic projection test insertion point not found')
          test_path.write_text(test.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Install and validate targeted repair
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/commander_lab/whole_deck/lab_context.py tests/unit/test_optimizer_v2_decision_runtime.py
          ruff format --check src/commander_lab/whole_deck/lab_context.py tests/unit/test_optimizer_v2_decision_runtime.py
          python -m pytest -q tests/unit/test_optimizer_v2_decision_runtime.py
      - name: Commit verified targeted repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/whole_deck/lab_context.py tests/unit/test_optimizer_v2_decision_runtime.py
          git commit -m 'fix: repair verified Alandra projection key fail-closed'
          git push origin HEAD:policy/full-card-knowledge-precision-20260820
