name: Format fix materialize

on:
  push:
    branches:
      - patch/post-official-decision-fidelity-search-efficiency

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: patch/post-official-decision-fidelity-search-efficiency
          fetch-depth: 0
      - name: Apply exact Ruff-format repair
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patchparts/formatonly/patch.b64 > /tmp/formatonly.patch
          echo 'bc4802d777156455e618860b517acc0038349a244e90e9ed4b1312c4bbc979fe  /tmp/formatonly.patch' | sha256sum -c -
          git apply --check /tmp/formatonly.patch
          git apply /tmp/formatonly.patch
          rm -rf .patchparts/formatonly
          rm -f .github/workflows/formatfix-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply final Ruff formatting repair"
          git push origin HEAD:${GITHUB_REF_NAME}
