name: Apply Audit D patch

on:
  push:
    branches:
      - agent/audit-d-limitation-remediation

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/audit-d.patch.gz.b64 | gunzip > /tmp/audit-d.patch
          echo 'c788973aa9326b9b297c7caf3a2d706b41dda0f5ce63b8dfec4eeff3856e0b06  /tmp/audit-d.patch' | sha256sum -c -
          git apply --check /tmp/audit-d.patch
          git apply --index /tmp/audit-d.patch
      - name: Remove transfer helpers
        shell: bash
        run: |
          git rm .github/audit-d.patch.gz.b64 .github/workflows/apply-audit-d-patch.yml
      - name: Commit focused remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden audit D truth bindings'
          git push origin HEAD:agent/audit-d-limitation-remediation
