name: J-P5 Pre-Holdout Hygiene

on:
  push:
    branches:
      - roadmap/j-p5-optimizer-validation
    paths:
      - .github/workflows/jp5-preholdout-hygiene.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Capture residual diagnostics after safe Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ruff check --fix . >/tmp/first.txt 2>&1
          first_rc=$?
          ruff format . >/tmp/format.txt 2>&1
          format_rc=$?
          ruff check . >/tmp/residual.txt 2>&1
          residual_rc=$?
          ruff format --check . >/tmp/format_check.txt 2>&1
          format_check_rc=$?
          set -e
          git diff --stat > /tmp/stat.txt
          git diff -- . ':!.github/workflows/jp5-preholdout-hygiene.yml' > /tmp/fix.diff
          git reset --hard HEAD
          rm .github/workflows/jp5-preholdout-hygiene.yml
          {
            echo "first_fix_rc=$first_rc"
            echo "format_rc=$format_rc"
            echo "residual_rc=$residual_rc"
            echo "format_check_rc=$format_check_rc"
            echo "--- changed files ---"
            cat /tmp/stat.txt
            echo "--- residual ruff check ---"
            cat /tmp/residual.txt
            echo "--- safe-fix diff ---"
            cat /tmp/fix.diff
          } > docs/J_P5_RUFF_POST_FIX_DIAG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "J-P5: record residual pre-holdout Ruff diagnostics"
          git push
