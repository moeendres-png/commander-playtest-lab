name: J-P4 Ruff Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'roadmap/j-p4-pilot-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Capture diagnostics
        shell: bash
        run: |
          set -uo pipefail
          {
            echo '# J-P4 Ruff diagnostics'
            echo
            echo '## ruff check'
            echo '```text'
            ruff check . 2>&1 || true
            echo '```'
            echo
            echo '## ruff format --check'
            echo '```text'
            ruff format --check . 2>&1 || true
            echo '```'
          } > docs/J_P4_RUFF_DIAGNOSTICS.md
          rm .github/workflows/jp4-ruff-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Roadmap J-P4: record Ruff diagnostics'
          git push origin HEAD:${{ github.head_ref }}
