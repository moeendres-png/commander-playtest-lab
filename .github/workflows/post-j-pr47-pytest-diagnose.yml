name: Post-J PR47 Acceptance Diagnose

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/rogshai-provisional-current-cleanup-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Capture Phase 10 current criteria
        shell: bash
        run: |
          python - <<'PY' > phase10-current.txt 2>&1
          import json
          from pathlib import Path
          from commander_lab.acceptance.phase10 import run_phase10_acceptance
          result = run_phase10_acceptance(Path.cwd(), iterations=1, workers=1, output_directory=Path('artifacts/post_j_pr47_phase10_diag'))
          print(json.dumps({
              'status': result['status'],
              'criteria': result['local_acceptance_criteria'],
              'failed_tools': result['failed_tools'],
              'joint_physical_allocation': result['joint_physical_allocation'],
              'final_recommendations': result['final_recommendations'],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: post-j-pr47-acceptance-diagnose
          path: phase10-current.txt
          if-no-files-found: error
