name: Post-J PR47 Pytest Diagnose

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Capture Phase 10 acceptance criteria
        shell: bash
        run: |
          python - <<'PY' > phase10-diagnose.txt 2>&1
          import json
          from pathlib import Path
          from commander_lab.acceptance.phase10 import run_phase10_acceptance
          result = run_phase10_acceptance(Path.cwd(), iterations=1, workers=1, output_directory=Path('artifacts/post_j_pr47_phase10_diag'))
          print(json.dumps({
              'status': result['status'],
              'criteria': result['local_acceptance_criteria'],
              'failed_tools': result['failed_tools'],
              'rules_sample': {
                  'local_acceptance_passed': result['rules_sample'].get('local_acceptance_passed'),
                  'tactical_passed': result['rules_sample'].get('tactical_passed'),
                  'rules_engine_passed': result['rules_sample'].get('rules_engine_passed'),
              },
              'joint_physical_allocation': result['joint_physical_allocation'],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: post-j-pr47-pytest-diagnose
          path: phase10-diagnose.txt
          if-no-files-found: error
