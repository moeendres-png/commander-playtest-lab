name: Post-J PR47 Validation Diagnose

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/rogshai-provisional-current-cleanup-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Capture current validate_deck shape
        shell: bash
        run: |
          python - <<'PY' > validation-current.txt 2>&1
          import json
          from pathlib import Path
          from commander_lab.tools import CommanderToolService, ToolRegistry
          registry = ToolRegistry(CommanderToolService(Path.cwd()))
          row = registry.invoke('validate_deck', {'deck_id':'rogshai/current'}).model_dump(mode='json')
          print(json.dumps(row, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post-j-pr47-validation-diagnose
          path: validation-current.txt
          if-no-files-found: error
