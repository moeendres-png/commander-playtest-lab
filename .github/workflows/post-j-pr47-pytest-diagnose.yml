name: Post-J PR47 Pytest Diagnose

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Run full pytest and capture output
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          echo "$code" > pytest-exit-code.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: post-j-pr47-pytest-diagnose
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          if-no-files-found: error
