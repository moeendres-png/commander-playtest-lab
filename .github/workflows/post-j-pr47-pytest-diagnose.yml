name: Post-J PR47 Pytest Diagnose

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Capture current RogShai candidate registry
        shell: bash
        run: |
          python - <<'PY' > candidate-diagnose.txt 2>&1
          import json
          from pathlib import Path
          from commander_lab.tools import CommanderToolService, ToolRegistry
          service = CommanderToolService(Path.cwd())
          registry = ToolRegistry(service)
          result = registry.invoke('recommend_upgrades', {'deck_id': 'rogshai/current'}).model_dump(mode='json')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: post-j-pr47-pytest-diagnose
          path: candidate-diagnose.txt
          if-no-files-found: error
