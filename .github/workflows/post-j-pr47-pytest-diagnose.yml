name: Post-J PR47 Catalog Override Repair

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/rogshai-provisional-current-cleanup-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Make current deck validation consume deck-local catalog overlays
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/commander_lab/tools/service.py')
          text = path.read_text(encoding='utf-8')
          old = '''            catalog = CardCatalog.from_json(self.root / "data/cards/oracle_subset.json")\n            report = DeckValidator(catalog).validate(deck)\n'''
          new = '''            catalog = CardCatalog.from_json(self.root / "data/cards/oracle_subset.json")\n            overlay_path = (self.root / "data/decks" / filename).with_name(\n                f"{Path(filename).stem}_card_catalog_overrides.json"\n            )\n            if overlay_path.is_file():\n                for card in CardCatalog.from_json(overlay_path).cards:\n                    catalog.add(card)\n            report = DeckValidator(catalog).validate(deck)\n'''
          if old not in text:
              raise SystemExit('validate_deck catalog snippet not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format src/commander_lab/tools/service.py
          ruff check src/commander_lab/tools/service.py
      - name: Commit locally before fail-closed validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/tools/service.py
          git commit -m 'Use deck-local card catalog overrides in validation'
      - name: Validate current deck and Phase 10 from clean tree
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          python - <<'PY'
          from pathlib import Path
          from commander_lab.tools import CommanderToolService, ToolRegistry
          registry = ToolRegistry(CommanderToolService(Path.cwd()))
          result = registry.invoke('validate_deck', {'deck_id':'rogshai/current'}).model_dump(mode='json')
          assert result['status'] == 'completed', result
          assert result['result']['validation']['valid'] is True, result['result']['validation']
          assert result['result']['physical_allocation']['valid'] is True, result['result']['physical_allocation']
          PY
          pytest -q tests/integration/test_phase10_acceptance.py tests/unit/test_rules_project_loader.py
      - name: Push only after PASS
        run: git push origin HEAD:project/rogshai-provisional-current-cleanup-20260811
