name: RogShai Post-Holdout Robustness Probe

on:
  push:
    branches:
      - analysis/rogshai-post-holdout-robustness-20260820
    paths:
      - scripts/post_holdout_surface_probe.py
      - .github/workflows/post-holdout-robustness-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact analysis head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Verify no holdout references in probe
        run: |
          if grep -Eiq 'holdout[-_/ ]?(json|cache|partition|sealed)' scripts/post_holdout_surface_probe.py; then
            echo 'Forbidden holdout reference in probe' >&2
            exit 1
          fi
      - name: Probe structural surfaces
        run: python scripts/post_holdout_surface_probe.py | tee post-holdout-surface-probe.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: post-holdout-surface-probe-${{ github.sha }}
          path: post-holdout-surface-probe.json
          if-no-files-found: error
