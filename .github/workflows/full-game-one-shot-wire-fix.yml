name: Full Game One-Shot Wire Fix

on:
  push:
    branches:
      - engine/xmage-full-game-external-pilots
    paths:
      - .github/workflows/full-game-one-shot-wire-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: engine/xmage-full-game-external-pilots
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Repair canonical selection-bound field names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/commander_lab/engine/rules/full_game.py')
          text = path.read_text(encoding='utf-8')
          old = '''        min_selections = int(request.get("min_selections", 0))\n        max_selections = int(request.get("max_selections", 0))\n'''
          new = '''        min_selections = int(\n            request.get("minimum_selections", request.get("min_selections", 0))\n        )\n        max_selections = int(\n            request.get("maximum_selections", request.get("max_selections", 0))\n        )\n'''
          if old not in text:
              raise SystemExit('selection-bound block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/unit/test_xmage_full_game.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace('        "min_selections": 1,\n        "max_selections": 1,\n', '')
          test.write_text(t, encoding='utf-8')
          PY
          python -m pip install 'ruff==0.16.4'
          ruff check --fix src/commander_lab/engine/rules/full_game.py src/commander_lab/engine/rules/full_game_batch.py tests/unit/test_xmage_full_game.py
          ruff format src/commander_lab/engine/rules/full_game.py src/commander_lab/engine/rules/full_game_batch.py tests/unit/test_xmage_full_game.py
          rm .github/workflows/full-game-one-shot-wire-fix.yml
      - name: Commit wire fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/commander_lab/engine/rules/full_game.py src/commander_lab/engine/rules/full_game_batch.py tests/unit/test_xmage_full_game.py .github/workflows/full-game-one-shot-wire-fix.yml
          git diff --cached --check
          git commit -m 'fix: align full-game selection-bound wire contract'
          git push origin HEAD:engine/xmage-full-game-external-pilots
