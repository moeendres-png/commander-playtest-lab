name: Release Artifacts

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: |
          python -m pip install -e '.[dev,api]'
          python -m pip install build
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import importlib.metadata; print(importlib.metadata.version("commander-playtest-lab"))')"
          test "$version" = "1.13.1"
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release
          python -m pytest -q 2>&1 | tee release/PLAYTEST_LAB_TEST_RESULTS.txt
      - name: Build wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m build 2>&1 | tee release/PLAYTEST_LAB_BUILD_RESULTS.txt
          cp dist/commander_playtest_lab-1.13.1-py3-none-any.whl release/
          cp dist/commander_playtest_lab-1.13.1.tar.gz release/
      - name: Build source, repository and bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=release/commander-playtest-lab-LATEST-source.zip HEAD
          git bundle create release/commander-playtest-lab-LATEST.bundle --all
          repo_dir="$RUNNER_TEMP/commander-playtest-lab-repository"
          rm -rf "$repo_dir"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$repo_dir"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/release/commander-playtest-lab-LATEST-repository.zip" commander-playtest-lab-repository)
      - name: Write status and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = Path("release")
          sha = os.environ["GITHUB_SHA"]
          status = {
              "package_version": "1.13.1",
              "git_head": sha,
              "status": "deck_optimization_system_requires_external_work",
              "external_engine_validation_pending": True,
              "xmage_observations": 0,
              "forge_observations": 0,
              "canonical_deck_mutations": 0,
              "recommendations_applied": 0,
              "runtime_state_directory": ".runtime/engine",
          }
          (release / "PLAYTEST_LAB_CURRENT_STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (release / "PLAYTEST_LAB_CURRENT_STATUS.md").write_text(
              "# Commander Playtest Lab – Current Status\n\n"
              "- Package: `1.13.1`\n"
              f"- Git HEAD: `{sha}`\n"
              "- Final status: `deck_optimization_system_requires_external_work`\n"
              "- Runtime state: `.runtime/engine` (ignored mutable runtime data).\n"
              "- External engine validation: pending; XMage/Forge observations = 0.\n"
              "- Canonical deck/inventory/allocation changes: none.\n"
              "- Recommendations applied: 0.\n",
              encoding="utf-8",
          )
          manifest = {
              "schema_version": 1,
              "release": "1.13.1",
              "git_head": sha,
              "artifacts": sorted(p.name for p in release.iterdir() if p.is_file()),
              "validation_level": "structural_and_tactical_only",
              "external_rules_engine_results": False,
          }
          (release / "PLAYTEST_LAB_ARTIFACT_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'PLAYTEST_LAB_SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > PLAYTEST_LAB_SHA256SUMS.txt
      - name: Roundtrip verification
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c PLAYTEST_LAB_SHA256SUMS.txt)
          unzip -tq release/commander-playtest-lab-LATEST-source.zip
          unzip -tq release/commander-playtest-lab-LATEST-repository.zip
          git bundle verify release/commander-playtest-lab-LATEST.bundle
          verify_dir="$RUNNER_TEMP/repository-roundtrip"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip -q release/commander-playtest-lab-LATEST-repository.zip -d "$verify_dir"
          restored="$verify_dir/commander-playtest-lab-repository"
          test "$(git -C "$restored" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$restored" fsck --full
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip install --quiet release/commander_playtest_lab-1.13.1-py3-none-any.whl
          test "$("$RUNNER_TEMP/wheel-verify/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("commander-playtest-lab"))')" = "1.13.1"
          printf 'release=1.13.1\ngit_head=%s\nroundtrip=passed\n' "$GITHUB_SHA" > release/PLAYTEST_LAB_REPRODUCIBILITY.txt
          (cd release && sha256sum PLAYTEST_LAB_REPRODUCIBILITY.txt >> PLAYTEST_LAB_SHA256SUMS.txt)
          (cd release && sha256sum -c PLAYTEST_LAB_SHA256SUMS.txt)
      - name: Upload release package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        with:
          name: commander-playtest-lab-1.13.1-release
          path: release/
          if-no-files-found: error
          retention-days: 90
