name: Release Artifacts

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "pyproject.toml"
      - ".github/workflows/release-artifacts.yml"
      - "engine-bridge/**"
      - "config/rules_engines.json"
      - ".github/actions/pinned-xmage-engine/**"
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/release-artifacts.yml"
      - "engine-bridge/**"
      - "config/rules_engines.json"
      - ".github/actions/pinned-xmage-engine/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: release-artifacts-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install build runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Resolve package version
        id: meta
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          installed = importlib.metadata.version("commander-playtest-lab")
          if declared != installed:
              raise SystemExit(f"version mismatch: pyproject={declared} installed={installed}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"version={declared}\n")
          PY
      - name: Build wheel and source distribution
        run: |
          set -euo pipefail
          mkdir -p release
          python -m build 2>&1 | tee release/PLAYTEST_LAB_BUILD_RESULTS.txt
          version='${{ steps.meta.outputs.version }}'
          cp "dist/commander_playtest_lab-${version}-py3-none-any.whl" release/
          cp "dist/commander_playtest_lab-${version}.tar.gz" release/
      - name: Build SHA-bound source, repository and bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          roundtrip_dir="$RUNNER_TEMP/release-roundtrip"
          rm -rf "$roundtrip_dir"
          mkdir -p "$roundtrip_dir"
          git archive --format=zip --output="$roundtrip_dir/commander-playtest-lab-${version}-source.zip" "$GITHUB_SHA"
          git bundle create "$roundtrip_dir/commander-playtest-lab-${version}.bundle" HEAD --branches --tags
          repo_dir="$RUNNER_TEMP/commander-playtest-lab-repository"
          rm -rf "$repo_dir"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP" && zip -qr "$roundtrip_dir/commander-playtest-lab-${version}-repository.zip" commander-playtest-lab-repository)
      - name: Write current release status and evidence boundary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = Path("release")
          sha = os.environ["GITHUB_SHA"]
          version = os.environ["VERSION"]
          scope = json.loads(Path("data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("data/decks/manifest.json").read_text(encoding="utf-8"))
          rules = json.loads(Path("config/rules_engines.json").read_text(encoding="utf-8"))
          p3 = json.loads(Path("docs/J_P3_PROVIDER_DECISION.json").read_text(encoding="utf-8"))

          active = scope.get("active_own_decks")
          if not isinstance(active, list) or not active:
              raise SystemExit("release requires at least one explicit active own deck")
          manifest_active = manifest.get("global_active_own_decks")
          if manifest_active != active:
              raise SystemExit(
                  "release current-scope drift: active scope and deck manifest disagree: "
                  f"scope={active} manifest={manifest_active}"
              )
          decks = manifest.get("decks", {})
          missing = [deck_id for deck_id in active if deck_id not in decks]
          if missing:
              raise SystemExit(f"active own decks missing from manifest: {missing}")
          invalid = [deck_id for deck_id in active if not decks[deck_id].get("validation", {}).get("valid")]
          if invalid:
              raise SystemExit(f"active own decks are not valid: {invalid}")

          primary = rules["primary_engine"]
          runtime = rules["current_runtime"]
          freeze = rules.get("architecture_freeze") or {}
          missing_required = runtime.get("required_missing_capabilities", [])
          if "secondary_engine" in rules:
              raise SystemExit("release refuses a secondary engine: XMage is the only rules engine")
          if rules["provider_decision"] == "NO_PROVIDER_READY":
              if primary.get("production_ready") or runtime.get("provider_selected"):
                  raise SystemExit("release refuses production-ready provider claim while NO_PROVIDER_READY")
              production_ready = False
              validation_level = "external_rules_engine_b3_game_start_only"
              evidence_boundary = "B3 external-rules-engine evidence covers real pinned deck import, Commander construction and game start only."
          elif rules["provider_decision"] == "XMAGE_SELECTED":
              # D5: accepted only as the complete, consistent post-Freeze record; the
              # derived lists themselves are gated by the quality job (unit tests running
              # derive_rules_engines_capabilities.py --check against the live pin once an
              # epoch is sealed on it, and over the Freeze pair until then).
              consistent = (
                  freeze.get("status") == "CLAIMED"
                  and freeze.get("selected_provider") == "xmage"
                  and freeze.get("runtime_switch") == "DONE_D5"
                  and rules.get("production_bridge") == "xmage_full_game_lane_bridge"
                  and primary.get("provider") == "xmage"
                  and primary.get("production_ready") is True
                  and primary.get("missing_required_capabilities") == []
                  and runtime.get("provider_selected") is True
                  and runtime.get("production_provider") == "xmage"
                  and missing_required == []
              )
              if not consistent:
                  raise SystemExit("release refuses an inconsistent XMAGE_SELECTED provider record")
              production_ready = True
              validation_level = "external_rules_engine_full_game_lane"
              evidence_boundary = "The XMage full-game lane is the production runtime (Owner-signed Freeze 2026-10-10, D5); its capability truth is the sealed epoch named in config/rules_engines.json architecture_freeze."
              if primary.get("commit") != freeze.get("engine_commit"):
                  evidence_boundary += f" The live pin {primary.get('commit')} has moved past the Freeze engine commit {freeze.get('engine_commit')}; its own requalification (PB-03 and re-bind) is pending."
          else:
              raise SystemExit(f"release refuses unknown provider_decision {rules['provider_decision']!r}")

          status = {
              "package_version": version,
              "git_head": sha,
              "active_own_decks": active,
              "primary_deckbuilding_focus": scope.get("primary_deckbuilding_focus"),
              "active_deck_hashes": {deck_id: decks[deck_id]["deck_hash"] for deck_id in active},
              "canonical_deck_mutations": 0,
              "inventory_mutations": 0,
              "allocation_mutations": 0,
              "artifact_purpose": "software_release_packaging",
              "simulation_validity_claim": False,
              "deck_strength_claim": False,
              "external_engine_provider_decision": rules["provider_decision"],
              "external_engine_production_ready": production_ready,
              "current_external_engine_status": rules["current_runtime"]["status"],
              "current_external_engine_validation_level": validation_level,
              "xmage_real_execution": bool(primary.get("real_execution")),
              "xmage_missing_required_capabilities": missing_required,
              "historical_p3_provider_decision": p3["decision"],
              "historical_p3_validation_level": "structural_tactical_and_real_external_feasibility_evidence",
              "historical_p3_xmage_real_execution": bool(p3["providers"]["xmage"]["real_execution"]),
              "historical_p3_forge_real_execution": bool(p3["providers"]["forge"]["real_execution"]),
              "current_external_engine_truth_source": "config/rules_engines.json",
              "historical_external_engine_truth_source": "docs/J_P3_PROVIDER_DECISION.json",
              "current_scope_truth_source": "data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json",
              "deck_manifest_truth_source": "data/decks/manifest.json",
          }
          (release / "PLAYTEST_LAB_CURRENT_STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (release / "PLAYTEST_LAB_CURRENT_STATUS.md").write_text(
              "# Commander Playtest Lab – Current Release Status\n\n"
              f"- Package: `{version}`\n"
              f"- Git HEAD: `{sha}`\n"
              f"- Active own decks: `{', '.join(active)}`\n"
              f"- External provider decision: `{rules['provider_decision']}`\n"
              f"- XMage runtime status: `{rules['current_runtime']['xmage_status']}`\n"
              f"- Missing required provider capabilities: `{', '.join(missing_required)}`\n"
              f"- Evidence boundary: {evidence_boundary}\n"
              "- Historical J-P3 feasibility evidence is retained separately and is not current provider truth.\n"
              "- This release package makes no deck-strength or empirical-win-rate claim; provider readiness is reported from config/rules_engines.json only.\n"
              "- Canonical deck/inventory/allocation mutations by release packaging: 0.\n",
              encoding="utf-8",
          )
          PY
      - name: Write artifact manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          sha = os.environ["GITHUB_SHA"]
          status = json.loads(Path("release/PLAYTEST_LAB_CURRENT_STATUS.json").read_text(encoding="utf-8"))
          payload = {
              "schema_version": 3,
              "release": version,
              "git_head": sha,
              "release_evidence": "software_packaging_and_roundtrip",
              "current_external_engine_validation_level": status["current_external_engine_validation_level"],
              "historical_p3_validation_level": "structural_tactical_and_real_external_feasibility_evidence",
              "external_engine_production_ready": status["external_engine_production_ready"],
              "external_engine_provider_decision": status["external_engine_provider_decision"],
              "deck_strength_claim": False,
              "empirical_win_rate_claim": False,
              "roundtrip_required": True,
          }
          Path("release/PLAYTEST_LAB_ARTIFACT_MANIFEST.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          version='${{ steps.meta.outputs.version }}'
          printf 'release=%s\ngit_head=%s\nroundtrip=pending\n' "$version" "$GITHUB_SHA" > release/PLAYTEST_LAB_REPRODUCIBILITY.txt
      - name: Resolve pinned XMage engine commit
        id: engine_pin
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pin = str(
              json.loads(Path("config/rules_engines.json").read_text(encoding="utf-8"))[
                  "primary_engine"
              ]["commit"]
          )
          if re.fullmatch(r"[0-9a-f]{40}", pin) is None:
              raise SystemExit(f"invalid primary_engine.commit: {pin!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"commit={pin}\n")
          PY
      - name: Checkout pinned XMage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moeendres-png/mage
          ref: ${{ steps.engine_pin.outputs.commit }}
          path: vendor/engine-source/xmage
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build or restore pinned XMage engine
        uses: ./.github/actions/pinned-xmage-engine
        with:
          commit: ${{ steps.engine_pin.outputs.commit }}
      - name: Package engine bridge JAR for release
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f engine-bridge/pom.xml package -DskipTests
          jar_src="engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar"
          test -f "$jar_src"
          cp "$jar_src" release/xmage-engine-bridge.jar
          printf '%s\n' "${{ steps.engine_pin.outputs.commit }}" > release/ENGINE_PIN.txt
          (cd release && sha256sum xmage-engine-bridge.jar > xmage-engine-bridge.jar.sha256)
      - name: Verify package and artifact roundtrip
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          roundtrip_dir="$RUNNER_TEMP/release-roundtrip"
          unzip -tq "$roundtrip_dir/commander-playtest-lab-${version}-source.zip"
          unzip -tq "$roundtrip_dir/commander-playtest-lab-${version}-repository.zip"
          git bundle verify "$roundtrip_dir/commander-playtest-lab-${version}.bundle"
          verify_dir="$RUNNER_TEMP/repository-roundtrip"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip -q "$roundtrip_dir/commander-playtest-lab-${version}-repository.zip" -d "$verify_dir"
          restored="$verify_dir/commander-playtest-lab-repository"
          test "$(git -C "$restored" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$restored" fsck --full
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip install --quiet "release/commander_playtest_lab-${version}-py3-none-any.whl"
          test "$("$RUNNER_TEMP/wheel-verify/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("commander-playtest-lab"))')" = "$version"
          "$RUNNER_TEMP/wheel-verify/bin/commander-lab" --help >/dev/null
          (cd release && sha256sum -c xmage-engine-bridge.jar.sha256)
          bridge_out="$(printf '{"request_id":"release-smoke-1","protocol_version":"2.0.0","message_type":"get_provider_version"}\n{"request_id":"release-smoke-2","protocol_version":"2.0.0","message_type":"shutdown_engine"}\n' | java -jar release/xmage-engine-bridge.jar full-game)"
          BRIDGE_OUT="$bridge_out" EXPECTED_PIN="${{ steps.engine_pin.outputs.commit }}" python - <<'PY'
          import json
          import os

          lines = [json.loads(line) for line in os.environ["BRIDGE_OUT"].splitlines() if line.strip()]
          if len(lines) != 2:
              raise SystemExit(f"expected 2 bridge responses, got {len(lines)}: {lines!r}")
          if not (lines[0].get("success") and lines[0].get("status") == "ok"):
              raise SystemExit(f"unexpected version reply: {lines[0]!r}")
          if lines[0].get("payload", {}).get("protocol_version") != "2.0.0":
              raise SystemExit(f"unexpected protocol_version={lines[0].get('payload', {}).get('protocol_version')!r}")
          commit = lines[0].get("payload", {}).get("engine_commit")
          if commit != os.environ["EXPECTED_PIN"]:
              raise SystemExit(f"bridge jar engine_commit={commit!r} != {os.environ['EXPECTED_PIN']!r}")
          if not (lines[1].get("success") and lines[1].get("status") == "ok"):
              raise SystemExit(f"unexpected shutdown reply: {lines[1]!r}")
          PY
          printf 'release=%s\ngit_head=%s\nroundtrip=passed\n' "$version" "$GITHUB_SHA" > release/PLAYTEST_LAB_REPRODUCIBILITY.txt
      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'PLAYTEST_LAB_SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > PLAYTEST_LAB_SHA256SUMS.txt
          sha256sum -c PLAYTEST_LAB_SHA256SUMS.txt
      - name: Assert tracked repository remains clean
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 immutable revision
        with:
          name: commander-playtest-lab-release-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
