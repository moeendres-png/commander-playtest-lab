name: Release Artifacts

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install -e '.[api]'
          python -m pip install build
      - name: Resolve and verify release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python - <<'PY'
          import importlib.metadata
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = pyproject["project"]["version"]
          installed = importlib.metadata.version("commander-playtest-lab")
          if declared != installed:
              raise SystemExit(f"version mismatch: pyproject={declared} installed={installed}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"version={declared}\n")
          PY
          printf 'generic_validation_owner=CI/quality\ngit_head=%s\nrelease_full_pytest_rerun=false\n' \
            "$GITHUB_SHA" > release/PLAYTEST_LAB_TEST_RESULTS.txt
      - name: Build wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          python -m build 2>&1 | tee release/PLAYTEST_LAB_BUILD_RESULTS.txt
          cp "dist/commander_playtest_lab-${version}-py3-none-any.whl" release/
          cp "dist/commander_playtest_lab-${version}.tar.gz" release/
      - name: Build source, repository and bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          git archive --format=zip --output="release/commander-playtest-lab-${version}-source.zip" HEAD
          git bundle create "release/commander-playtest-lab-${version}.bundle" HEAD --branches --tags
          repo_dir="$RUNNER_TEMP/commander-playtest-lab-repository"
          rm -rf "$repo_dir"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$repo_dir"
          git -C "$repo_dir" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/release/commander-playtest-lab-${version}-repository.zip" commander-playtest-lab-repository)
      - name: Write release status from current checked-in truth
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}' python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = Path("release")
          sha = os.environ["GITHUB_SHA"]
          version = os.environ["VERSION"]
          manifest = json.loads(Path("data/decks/manifest.json").read_text(encoding="utf-8"))
          scope = json.loads(
              Path("data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json").read_text(
                  encoding="utf-8"
              )
          )
          engines = json.loads(Path("config/rules_engines.json").read_text(encoding="utf-8"))

          global_active = scope["global_active_own_decks"]
          runtime_loaded = scope["runtime_loaded_decks"]
          optimization_targets = scope["optimization_targets"]
          unresolved = scope["unresolved_operational_baselines"]
          if manifest["global_active_own_decks"] != global_active:
              raise SystemExit("release scope disagrees with manifest global own-deck truth")
          if manifest["runtime_loaded_decks"] != runtime_loaded:
              raise SystemExit("release scope disagrees with manifest runtime-loaded truth")
          if manifest["active_own_decks"] != runtime_loaded:
              raise SystemExit("legacy manifest active_own_decks alias is no longer runtime-scoped")
          if manifest.get("active_own_decks_semantics") != "legacy_runtime_loaded_decks_compatibility_alias":
              raise SystemExit("legacy active_own_decks semantics are not explicit")
          if set(manifest["decks"]) != set(runtime_loaded):
              raise SystemExit("runtime deck manifest does not exactly match loaded deck identities")
          if set(unresolved) & set(runtime_loaded):
              raise SystemExit("unresolved operational baseline was loaded into the runtime")
          if "kaervek/current" not in manifest.get("frozen_opponent_decks", []):
              raise SystemExit("Kaervek lost its frozen opponent-only boundary")

          rogshai = manifest["decks"]["rogshai/current"]
          if not rogshai["validation"]["valid"]:
              raise SystemExit("checked-in RogShai runtime manifest is not valid")
          if engines["provider_decision"] != "NO_PROVIDER_READY":
              raise SystemExit("release unexpectedly claims a production external provider")
          if engines["primary_engine"]["status"] != "B3_PARTIAL":
              raise SystemExit("release external-engine truth is not the audited B3 boundary")
          if engines["primary_engine"]["real_execution"] is not True:
              raise SystemExit("B3 current truth lost real external-engine execution evidence")
          if engines["primary_engine"]["production_ready"] is not False:
              raise SystemExit("B3 current truth incorrectly claims production readiness")

          status = {
              "package_version": version,
              "git_head": sha,
              "status": "decision_support_system_b3_partial_external_engine",
              "canonical_deck_mutations": 0,
              "recommendations_applied": 0,
              "data_snapshot_hash": manifest["data_snapshot_hash"],
              "global_active_own_decks": global_active,
              "runtime_loaded_decks": runtime_loaded,
              "optimization_targets": optimization_targets,
              "unresolved_operational_baselines": unresolved,
              "frozen_opponent_decks": manifest["frozen_opponent_decks"],
              "runtime_allocation_valid": manifest["allocation_validation"]["valid"],
              "runtime_allocation_scope": manifest["allocation_validation"]["scope"],
              "global_allocation_status": (
                  "unresolved_until_current_operational_baselines_are_known"
                  if unresolved
                  else "resolved"
              ),
              "rogshai_current_hash": rogshai["deck_hash"],
              "rogshai_cards": rogshai["total_cards"],
              "rogshai_lands": rogshai["land_count"],
              "external_engine_provider_decision": engines["provider_decision"],
              "external_engine_production_bridge": engines["production_bridge"],
              "external_engine_validation_pending": engines["current_runtime"][
                  "external_engine_validation_pending"
              ],
              "xmage_status": engines["primary_engine"]["status"],
              "xmage_real_execution": engines["primary_engine"]["real_execution"],
              "xmage_production_ready": engines["primary_engine"]["production_ready"],
              "xmage_commit": engines["primary_engine"]["commit"],
              "forge_status": engines["secondary_engine"]["status"],
              "forge_real_execution": engines["secondary_engine"]["real_execution"],
              "truth_sources": {
                  "deck_runtime": "data/decks/manifest.json",
                  "project_scope": "data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json",
                  "external_engine": "config/rules_engines.json",
                  "historical_provider_decision": "docs/J_P3_PROVIDER_DECISION.json",
              },
          }
          (release / "PLAYTEST_LAB_CURRENT_STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (release / "PLAYTEST_LAB_CURRENT_STATUS.md").write_text(
              "# Commander Playtest Lab – Current Status\n\n"
              f"- Package: `{version}`\n"
              f"- Git HEAD: `{sha}`\n"
              "- Global active own decks: `korvold/current`, `rogshai/current`.\n"
              "- Runtime-loaded deck: `rogshai/current`.\n"
              "- Korvold: globally active; exact current operational baseline unresolved and therefore not runtime-loaded.\n"
              f"- RogShai: {rogshai['total_cards']} cards / {rogshai['land_count']} lands; current hash `{rogshai['deck_hash']}`.\n"
              "- Kaervek: frozen opponent-only.\n"
              f"- External provider decision: `{engines['provider_decision']}`.\n"
              f"- XMage: `{engines['primary_engine']['status']}` at `{engines['primary_engine']['commit']}`; real execution `{engines['primary_engine']['real_execution']}`; production ready `{engines['primary_engine']['production_ready']}`.\n"
              "- External-engine boundary: B3 deck import + Commander/Partner 2–5 player construction/start/lifecycle only; no production action loop is claimed.\n"
              "- Generic code/test quality is owned by the separate CI workflow; release does not rerun full pytest.\n"
              "- Canonical deck mutations by this technical release: 0.\n"
              "- Recommendations applied: 0.\n",
              encoding="utf-8",
          )
          PY
      - name: Regression-check release truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("data/decks/manifest.json").read_text(encoding="utf-8"))
          scope = json.loads(
              Path("data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json").read_text(
                  encoding="utf-8"
              )
          )
          engines = json.loads(Path("config/rules_engines.json").read_text(encoding="utf-8"))
          release = json.loads(Path("release/PLAYTEST_LAB_CURRENT_STATUS.json").read_text(encoding="utf-8"))
          assert release["global_active_own_decks"] == scope["global_active_own_decks"]
          assert release["runtime_loaded_decks"] == source["runtime_loaded_decks"]
          assert release["optimization_targets"] == scope["optimization_targets"]
          assert release["unresolved_operational_baselines"] == ["korvold/current"]
          assert release["frozen_opponent_decks"] == ["kaervek/current"]
          assert release["rogshai_current_hash"] == source["decks"]["rogshai/current"]["deck_hash"]
          assert release["rogshai_cards"] == 100
          assert release["rogshai_lands"] == 36
          assert release["data_snapshot_hash"] == source["data_snapshot_hash"]
          assert release["runtime_allocation_valid"] == source["allocation_validation"]["valid"]
          assert release["external_engine_provider_decision"] == engines["provider_decision"]
          assert release["external_engine_production_bridge"] == engines["production_bridge"]
          assert release["xmage_real_execution"] is True
          assert release["xmage_production_ready"] is False
          PY
      - name: Write manifest and validation package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}' python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = Path("release")
          version = os.environ["VERSION"]
          sha = os.environ["GITHUB_SHA"]
          wheel = f"commander_playtest_lab-{version}-py3-none-any.whl"
          sdist = f"commander_playtest_lab-{version}.tar.gz"
          artifacts = [
              "PLAYTEST_LAB_ARTIFACT_MANIFEST.json",
              "PLAYTEST_LAB_BUILD_RESULTS.txt",
              "PLAYTEST_LAB_CURRENT_STATUS.json",
              "PLAYTEST_LAB_CURRENT_STATUS.md",
              "PLAYTEST_LAB_REPRODUCIBILITY.txt",
              "PLAYTEST_LAB_SHA256SUMS.txt",
              "PLAYTEST_LAB_TEST_RESULTS.txt",
              f"commander-playtest-lab-{version}-validation.zip",
              f"commander-playtest-lab-{version}-repository.zip",
              f"commander-playtest-lab-{version}-source.zip",
              f"commander-playtest-lab-{version}.bundle",
              wheel,
              sdist,
          ]
          manifest = {
              "schema_version": 3,
              "release": version,
              "git_head": sha,
              "artifacts": artifacts,
              "generic_validation_owner": "CI/quality",
              "release_full_pytest_rerun": False,
              "validation_level": "packaging_installability_roundtrip_and_current_truth",
              "external_rules_engine_results_embedded": False,
              "external_engine_production_ready": False,
              "external_engine_provider_decision": "NO_PROVIDER_READY",
              "external_engine_truth_source": "config/rules_engines.json",
              "roundtrip_required": True,
              "release_truth_sources": [
                  "data/decks/manifest.json",
                  "data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json",
                  "config/rules_engines.json",
              ],
          }
          (release / "PLAYTEST_LAB_ARTIFACT_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          version='${{ steps.meta.outputs.version }}'
          printf 'release=%s\ngit_head=%s\nroundtrip=pending\n' "$version" "$GITHUB_SHA" > release/PLAYTEST_LAB_REPRODUCIBILITY.txt
          (cd release && zip -q "commander-playtest-lab-${version}-validation.zip" \
            PLAYTEST_LAB_TEST_RESULTS.txt \
            PLAYTEST_LAB_BUILD_RESULTS.txt \
            PLAYTEST_LAB_CURRENT_STATUS.md \
            PLAYTEST_LAB_CURRENT_STATUS.json \
            PLAYTEST_LAB_ARTIFACT_MANIFEST.json)
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'PLAYTEST_LAB_SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > PLAYTEST_LAB_SHA256SUMS.txt
      - name: Roundtrip verification
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          (cd release && sha256sum -c PLAYTEST_LAB_SHA256SUMS.txt)
          unzip -tq "release/commander-playtest-lab-${version}-source.zip"
          unzip -tq "release/commander-playtest-lab-${version}-repository.zip"
          unzip -tq "release/commander-playtest-lab-${version}-validation.zip"
          git bundle verify "release/commander-playtest-lab-${version}.bundle"
          verify_dir="$RUNNER_TEMP/repository-roundtrip"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip -q "release/commander-playtest-lab-${version}-repository.zip" -d "$verify_dir"
          restored="$verify_dir/commander-playtest-lab-repository"
          test "$(git -C "$restored" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$restored" fsck --full
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip install --quiet "release/commander_playtest_lab-${version}-py3-none-any.whl"
          test "$("$RUNNER_TEMP/wheel-verify/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("commander-playtest-lab"))')" = "$version"
          "$RUNNER_TEMP/wheel-verify/bin/commander-lab" --help >/dev/null
          printf 'release=%s\ngit_head=%s\nroundtrip=passed\n' "$version" "$GITHUB_SHA" > release/PLAYTEST_LAB_REPRODUCIBILITY.txt
          (cd release && grep -v 'PLAYTEST_LAB_REPRODUCIBILITY.txt$' PLAYTEST_LAB_SHA256SUMS.txt > PLAYTEST_LAB_SHA256SUMS.tmp)
          (cd release && mv PLAYTEST_LAB_SHA256SUMS.tmp PLAYTEST_LAB_SHA256SUMS.txt && sha256sum PLAYTEST_LAB_REPRODUCIBILITY.txt >> PLAYTEST_LAB_SHA256SUMS.txt)
          (cd release && sha256sum -c PLAYTEST_LAB_SHA256SUMS.txt)
      - name: Upload release package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        with:
          name: commander-playtest-lab-${{ steps.meta.outputs.version }}-release
          path: release/
          if-no-files-found: error
          retention-days: 90
