name: Release Artifacts

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build runtime
        run: |
          python -m pip install -e .
          python -m pip install build
      - name: Resolve package version
        id: meta
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          installed = importlib.metadata.version('commander-playtest-lab')
          if declared != installed:
              raise SystemExit(f'version mismatch: pyproject={declared} installed={installed}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'version={declared}\n')
          PY
      - name: Build wheel and source distribution
        run: |
          set -euo pipefail
          mkdir -p release
          python -m build 2>&1 | tee release/PLAYTEST_LAB_BUILD_RESULTS.txt
          version='${{ steps.meta.outputs.version }}'
          cp "dist/commander_playtest_lab-${version}-py3-none-any.whl" release/
          cp "dist/commander_playtest_lab-${version}.tar.gz" release/
      - name: Build source and Git bundle artifacts
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          git archive --format=zip --output="release/commander-playtest-lab-${version}-source.zip" HEAD
          git bundle create "release/commander-playtest-lab-${version}.bundle" HEAD --branches --tags
      - name: Record release identity and evidence boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          scope = json.loads(Path('data/collections/current/ACTIVE_OWN_DECKS_CURRENT.json').read_text(encoding='utf-8'))
          payload = {
              'git_head': os.environ['GITHUB_SHA'],
              'active_own_decks': scope.get('active_own_decks', []),
              'primary_deckbuilding_focus': scope.get('primary_deckbuilding_focus'),
              'artifact_purpose': 'software_release_packaging',
              'simulation_validity_claim': False,
              'deck_strength_claim': False,
              'external_provider_readiness_claim': False,
              'canonical_data_mutation': False,
          }
          Path('release/PLAYTEST_LAB_RELEASE_IDENTITY.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Hash release artifacts
        run: |
          find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
      - name: Assert tracked repository remains clean
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        with:
          name: commander-playtest-lab-release-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
