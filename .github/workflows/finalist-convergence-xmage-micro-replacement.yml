name: Finalist convergence XMage MICRO_REPLACEMENT

on:
  workflow_dispatch:
  push:
    branches:
      - program/finalist-convergence-xmage
    paths-ignore:
      - "qualification/evidence/finalist-convergence-xmage/**"

permissions:
  contents: read

env:
  CONTRACT_COMMIT: 9a8b8f5f5961466514eae6103be2d227324a27a8
  CONTRACT_BUNDLE: ad1ec6e4baa83be48c0bc07e0bde66c2f8c003af29e411bad0953558154dcfee
  XMAGE_COMMIT: 77d7646da6958fdf8125ee7c8f4aabd130d21d4c
  XMAGE_TREE: f0a028b265f9c008ea0aedc4cec6b8f14500b69f
  COMMANDER_LAB_XMAGE_WS26_BRIDGE_CMD: >-
    java -cp ${{ github.workspace }}/engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar org.commanderlab.xmage.XmageWs26QualificationMain full-game

jobs:
  micro-replacement:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Resolve exact convergence branch head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_head="$(git rev-parse origin/program/finalist-convergence-xmage)"
          test -n "$branch_head"
          echo "CONVERGENCE_BRANCH_HEAD=$branch_head" >> "$GITHUB_ENV"
          mkdir -p qualification/evidence/finalist-convergence-xmage/micro-replacement
          printf '%s\n' "$branch_head" > qualification/evidence/finalist-convergence-xmage/micro-replacement/CONVERGENCE_BRANCH_HEAD.txt
          printf '%s\n' "$GITHUB_SHA" > qualification/evidence/finalist-convergence-xmage/micro-replacement/WORKFLOW_HEAD.txt

      - name: Mount exact neutral contract
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.CONTRACT_COMMIT }}
          path: contract-lock
          sparse-checkout: qualification/finalist_convergence

      - name: Verify exact MICRO_REPLACEMENT contract
        run: |
          test "$(git -C contract-lock rev-parse HEAD)" = "$CONTRACT_COMMIT"
          python - <<'PY'
          import json, os
          p=json.load(open('contract-lock/qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json'))
          assert p['canonical_bundle_digest'] == os.environ['CONTRACT_BUNDLE']
          r={x['fixture_id']:x for x in p['records']}['MICRO_REPLACEMENT']
          assert r['materialization_digest'] == '310964ff50516220522e906cd742f5c53f3fa722ddce104461ab10162bf50a5b'
          assert r['execution_entry_mode'] == 'NATIVE_STATE_LOAD'
          assert r['temporal_state']['phase'] == 'combat'
          assert r['temporal_state']['step'] == 'combat_damage'
          assert r['combat_state']['attackers'] == {'obj:micro-3power':'P2'}
          assert r['combat_state']['blockers'] == {}
          PY

      - name: Checkout exact XMage source
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1

      - name: Verify XMage source lock
        run: |
          test "$(git -C vendor/engine-source/xmage rev-parse HEAD)" = "$XMAGE_COMMIT"
          test "$(git -C vendor/engine-source/xmage rev-parse HEAD^{tree})" = "$XMAGE_TREE"

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Validate qualification Python
        run: |
          python -m py_compile \
            candidate-qualification/ws26-xmage/apply_ws26_xmage_instrumentation.py \
            candidate-qualification/finalist-convergence-xmage/apply_primitive_a_native_state_overlay.py \
            candidate-qualification/finalist-convergence-xmage/apply_micro_stack_overlay.py \
            candidate-qualification/finalist-convergence-xmage/apply_micro_replacement_overlay.py \
            candidate-qualification/finalist-convergence-xmage/fix_micro_replacement_overlay.py \
            candidate-qualification/finalist-convergence-xmage/run_micro_replacement.py

      - name: Instrument pinned XMage
        run: |
          python candidate-qualification/ws26-xmage/apply_ws26_xmage_instrumentation.py vendor/engine-source/xmage
          git -C vendor/engine-source/xmage diff --check

      - name: Apply native-state overlays
        run: |
          python candidate-qualification/finalist-convergence-xmage/apply_primitive_a_native_state_overlay.py
          python candidate-qualification/finalist-convergence-xmage/apply_micro_stack_overlay.py
          python candidate-qualification/finalist-convergence-xmage/apply_micro_replacement_overlay.py
          python candidate-qualification/finalist-convergence-xmage/fix_micro_replacement_overlay.py
          git diff --check
          grep -q 'CombatDamageStep(false).beginStep' engine-bridge/src/main/java/org/commanderlab/xmage/XmageWs26Scenario.java
          grep -q 'adapter_damage_applied' engine-bridge/src/main/java/org/commanderlab/xmage/XmageWs26Scenario.java

      - name: Build pinned XMage and candidate bridge
        run: |
          cd vendor/engine-source/xmage
          if test -x ./mvnw; then ./mvnw -B -ntp -DskipTests install; else mvn -B -ntp -DskipTests install; fi
          cd "$GITHUB_WORKSPACE/engine-bridge"
          mvn -B -ntp -DskipTests package

      - name: Execute exact MICRO_REPLACEMENT record
        run: |
          python -m pip install -e '.[dev,api]'
          GITHUB_SHA="$CONVERGENCE_BRANCH_HEAD" python candidate-qualification/finalist-convergence-xmage/run_micro_replacement.py \
            --contract contract-lock/qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json \
            --output qualification/evidence/finalist-convergence-xmage/micro-replacement/MICRO_REPLACEMENT_RESULTS.json
          python - <<'PY'
          import json, os
          p=json.load(open('qualification/evidence/finalist-convergence-xmage/micro-replacement/MICRO_REPLACEMENT_RESULTS.json'))
          assert p['candidate_commit'] == os.environ['CONVERGENCE_BRANCH_HEAD']
          assert p['counts'] == {'PASS':1}
          r=p['rows'][0]
          assert r['record_digest'] == '310964ff50516220522e906cd742f5c53f3fa722ddce104461ab10162bf50a5b'
          assert r['requested_native_state_equal'] is True
          assert r['terminal_semantic_state']['P2']['life'] == 34
          assert r['native_combat_damage_execution']['adapter_damage_applied'] is False
          PY

      - name: Materialize checksums
        if: always()
        run: |
          ev=qualification/evidence/finalist-convergence-xmage/micro-replacement
          find "$ev" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$ev/SHA256SUMS"

      - name: Upload XMage MICRO_REPLACEMENT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalist-convergence-xmage-micro-replacement-${{ github.sha }}
          path: qualification/evidence/finalist-convergence-xmage/micro-replacement
          if-no-files-found: error
