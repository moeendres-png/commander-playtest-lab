name: J-P4 Windows Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'roadmap/j-p4-pilot-quality'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install project and tests
        shell: pwsh
        run: python -m pip install -e ".[dev,api,openai]"
      - name: Capture Windows pytest diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -q --tb=short 2>&1 | Tee-Object -FilePath jp4_windows_pytest.txt
          @('# J-P4 Windows pytest diagnostics','','```text') + (Get-Content jp4_windows_pytest.txt | Select-Object -Last 220) + @('```') | Set-Content -Encoding UTF8 docs/J_P4_WINDOWS_DIAGNOSTICS.md
          Remove-Item jp4_windows_pytest.txt
          Remove-Item .github/workflows/jp4-windows-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Roadmap J-P4: record Windows pytest diagnostics"
          git push origin HEAD:${{ github.head_ref }}
          exit 0
