name: Exact Main Recovery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-main-recovery-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"

jobs:
  recovery:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install build and validation runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused exact-main architecture conformance
        run: |
          pytest -q tests/test_candidate_lossless_handoff.py tests/unit/test_xmage_full_game.py
          python scripts/run_candidate_handoff_conformance.py \
            --root . --output-dir artifacts/candidate-handoff
          python scripts/generate_full_game_contract_artifacts.py
      - name: Build exact-main recovery payload
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          short="${commit:0:12}"
          inner="recovery/inner"
          rm -rf recovery
          mkdir -p "$inner"
          python -m build --wheel --outdir "$inner"
          git archive --format=tar.gz --output="$inner/source-${commit}.tar.gz" "$commit"
          git bundle create "$inner/repository-${commit}.bundle" HEAD --branches --tags
          cp -R artifacts/architecture "$inner/architecture-artifacts"
          cp -R artifacts/candidate-handoff "$inner/candidate-handoff-validation"
          cp -R artifacts/xmage-full-game "$inner/xmage-full-game-contracts"
          cp ARCHITECTURE_MIGRATION_REPORT.md "$inner/ARCHITECTURE_MIGRATION_REPORT.md"
          cp MIGRATION_CLOSEOUT.md "$inner/MIGRATION_CLOSEOUT.md"
          cp XMAGE_FULL_GAME_MIGRATION_REPORT.md "$inner/XMAGE_FULL_GAME_MIGRATION_REPORT.md"
          cp XMAGE_FULL_GAME_CLOSEOUT.md "$inner/XMAGE_FULL_GAME_CLOSEOUT.md"
          cp docs/architecture/xmage-full-game-external-pilots.md \
            "$inner/xmage-full-game-external-pilots.md"
          # The pin comes from config/rules_engines.json; runtime claims this run
          # does not check are recorded NOT_BOUND (scripts/build_exact_main_recovery_payload.py).
          python scripts/build_exact_main_recovery_payload.py \
            --root . --inner "$inner" \
            --commit "$commit" --tree "$tree" --version "$version" \
            --focused-test "pytest -q tests/test_candidate_lossless_handoff.py tests/unit/test_xmage_full_game.py" \
            --focused-test "python scripts/run_candidate_handoff_conformance.py --root . --output-dir artifacts/candidate-handoff"
          verify="$RUNNER_TEMP/recovery-bundle-clone"
          rm -rf "$verify"
          git clone "$inner/repository-${commit}.bundle" "$verify"
          test "$(git -C "$verify" rev-parse HEAD)" = "$commit"
          test "$(git -C "$verify" rev-parse HEAD^{tree})" = "$tree"
          restored_version="$(python - <<PY
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('$verify/pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$restored_version" = "$version"
          printf 'status=PASS\ncommit=%s\ntree=%s\npackage_version=%s\nfresh_bundle_clone=PASS\n' \
            "$commit" "$tree" "$version" > "$inner/VALIDATION.txt"
          (
            cd "$inner"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          (
            cd recovery
            tar -czf "commander-playtest-lab-exact-main-${short}.tar.gz" inner
            sha256sum "commander-playtest-lab-exact-main-${short}.tar.gz" \
              > "commander-playtest-lab-exact-main-${short}.tar.gz.sha256"
          )
      - name: Verify outer recovery checksum
        shell: bash
        run: |
          cd recovery
          sha256sum -c *.tar.gz.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-main-recovery-${{ github.sha }}
          path: |
            recovery/*.tar.gz
            recovery/*.sha256
          if-no-files-found: error
          retention-days: 90
