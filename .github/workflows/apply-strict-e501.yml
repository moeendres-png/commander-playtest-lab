name: Apply Strict E501 Fixes

on:
  push:
    branches:
      - fix/1.13.4-strict-quality-controlled

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[strict-e501]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply controlled line-length fixes
        shell: bash
        run: |
          set +e
          ruff check . --select E501 --output-format json > e501.json
          set -e
          python - <<'PY'
          from __future__ import annotations

          import ast
          import io
          import json
          import tokenize
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd()
          findings = json.loads(Path("e501.json").read_text(encoding="utf-8"))
          targets: dict[Path, list[int]] = defaultdict(list)
          for item in findings:
              filename = Path(item["filename"])
              path = filename if filename.is_absolute() else root / filename
              targets[path].append(int(item["location"]["row"]))

          def chunks_preserve(value: str, maxlen: int = 60) -> list[str]:
              result: list[str] = []
              while len(value) > maxlen:
                  cut = max(
                      (index + 1 for index, char in enumerate(value[: maxlen + 1]) if char.isspace()),
                      default=0,
                  )
                  if cut < maxlen // 2:
                      cut = maxlen
                  result.append(value[:cut])
                  value = value[cut:]
              if value:
                  result.append(value)
              return result

          # First pass: comments and single physical plain-string literals.
          for path, rows in targets.items():
              source = path.read_text(encoding="utf-8")
              lines = source.splitlines(keepends=True)
              strings: dict[int, list[tokenize.TokenInfo]] = defaultdict(list)
              for token in tokenize.generate_tokens(io.StringIO(source).readline):
                  if token.type == tokenize.STRING and token.start[0] == token.end[0]:
                      strings[token.start[0]].append(token)
              changed = False
              for row in sorted(set(rows), reverse=True):
                  line = lines[row - 1].rstrip("\n")
                  if len(line) <= 100:
                      continue
                  stripped = line.lstrip()
                  indent = line[: len(line) - len(stripped)]
                  if stripped.startswith("#"):
                      words = stripped[1:].strip().split()
                      wrapped: list[str] = []
                      current = indent + "#"
                      for word in words:
                          candidate = current + (" " if current != indent + "#" else " ") + word
                          if len(candidate) > 96 and current != indent + "#":
                              wrapped.append(current + "\n")
                              current = indent + "# " + word
                          else:
                              current = candidate
                      wrapped.append(current + "\n")
                      lines[row - 1 : row] = wrapped
                      changed = True
                      continue
                  candidates = []
                  for token in strings.get(row, []):
                      try:
                          value = ast.literal_eval(token.string)
                      except Exception:
                          continue
                      if isinstance(value, str) and len(token.string) >= 50:
                          candidates.append((len(token.string), token, value))
                  if not candidates:
                      continue
                  _, token, value = max(candidates)
                  pieces = chunks_preserve(value)
                  if len(pieces) < 2:
                      continue
                  before = line[: token.start[1]]
                  after = line[token.end[1] :]
                  encoded = [ascii(piece) for piece in pieces]
                  continuation = indent + "    "
                  if before.strip():
                      replacement = (
                          [before + "(\n"]
                          + [continuation + piece + "\n" for piece in encoded]
                          + [indent + ")" + after + "\n"]
                      )
                  else:
                      replacement = [indent + piece + "\n" for piece in encoded[:-1]] + [
                          indent + encoded[-1] + after + "\n"
                      ]
                  trial = lines[: row - 1] + replacement + lines[row:]
                  try:
                      compile("".join(trial), str(path), "exec")
                  except SyntaxError:
                      continue
                  lines = trial
                  changed = True
              if changed:
                  path.write_text("".join(lines), encoding="utf-8")

          def replace(rel: str, old: str, new: str) -> None:
              path = root / rel
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"expected E501 pattern missing in {rel}: {old[:70]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "scripts/build_rules_coverage.py",
              "    # Preserve additional explicitly provenance-marked ensemble assumptions as assumptions, never confirmed cards.\n",
              "    # Preserve additional explicitly provenance-marked ensemble assumptions as assumptions,\n    # never confirmed cards.\n",
          )
          replace(
              "scripts/build_rules_coverage.py",
              "        # Per-card structural support means a card has an actual role/profile or an explicit canonical deck role.\n",
              "        # Per-card structural support means a card has an actual role/profile or an explicit\n        # canonical deck role.\n",
          )
          replace(
              "src/commander_lab/tools/candidates.py",
              "    # Cards with no machine-identifiable function are not admitted to automatic structural screening.\n",
              "    # Cards with no machine-identifiable function are not admitted to automatic structural\n    # screening.\n",
          )
          replace(
              "src/commander_lab/tools/candidates.py",
              "    # Preserve the historical curated candidates as a fallback if the canonical snapshot is unavailable.\n",
              "    # Preserve the historical curated candidates as a fallback if the canonical snapshot is\n    # unavailable.\n",
          )
          replace(
              "src/commander_lab/counterfactual.py",
              "        hidden_information_policy: HiddenInformationPolicy = HiddenInformationPolicy.PUBLIC_INFORMATION_ONLY,\n",
              "        hidden_information_policy: HiddenInformationPolicy = (\n            HiddenInformationPolicy.PUBLIC_INFORMATION_ONLY\n        ),\n",
          )
          replace(
              "src/commander_lab/counterfactual.py",
              "                f\"{branch.branchpoint_id}:{alternative_action}:{seed}:{future_samples}:{hidden_information_policy}\".encode()\n",
              "                (\n                    f\"{branch.branchpoint_id}:{alternative_action}:{seed}:\"\n                    f\"{future_samples}:{hidden_information_policy}\"\n                ).encode()\n",
          )

          diagnostic_replacements = {
              '                f"sample size {sample_size} is below the minimum diagnostic threshold {self.minimum_evidence}"\n': '                (\n                    f"sample size {sample_size} is below the minimum diagnostic threshold "\n                    f"{self.minimum_evidence}"\n                )\n',
              '        f"evaluated {len(package_output[\'evaluations\'])} curated packages; machine candidates remain unconfirmed",\n': '        (\n            f"evaluated {len(package_output[\'evaluations\'])} curated packages; "\n            "machine candidates remain unconfirmed"\n        ),\n',
              '        f"traced {trace_id} through {len(trace.get(\'lineage\', trace.get(\'records\', trace.get(\'trace\', []))))} retained records",\n': '        (\n            f"traced {trace_id} through "\n            f"{len(trace.get(\'lineage\', trace.get(\'records\', trace.get(\'trace\', []))))} "\n            "retained records"\n        ),\n',
              '        f"loaded {len(uncertainty_profile.get(\'variants\', []))} provenance-marked variants without empirical calibration",\n': '        (\n            f"loaded {len(uncertainty_profile.get(\'variants\', []))} provenance-marked variants "\n            "without empirical calibration"\n        ),\n',
              '        f"executed {len(ensemble_result.per_variant)} variants; worst={ensemble_result.worst:.4f}, spread={ensemble_result.spread:.4f}",\n': '        (\n            f"executed {len(ensemble_result.per_variant)} variants; "\n            f"worst={ensemble_result.worst:.4f}, spread={ensemble_result.spread:.4f}"\n        ),\n',
              '        f"executed {len(counter.future_samples)} futures; {counter.conclusion}; mean={counter.mean_improvement:.4f}",\n': '        (\n            f"executed {len(counter.future_samples)} futures; {counter.conclusion}; "\n            f"mean={counter.mean_improvement:.4f}"\n        ),\n',
              '        f"executed event-derived diagnosis for {subject}: {diagnosis.hypothesis.value}; cut_gate={diagnosis.cut_release_gate}",\n': '        (\n            f"executed event-derived diagnosis for {subject}: {diagnosis.hypothesis.value}; "\n            f"cut_gate={diagnosis.cut_release_gate}"\n        ),\n',
          }
          for old, new in diagnostic_replacements.items():
              replace("src/commander_lab/diagnostics.py", old, new)

          replace(
              "src/commander_lab/packages/extractor.py",
              '                f"package commander mismatch: {package.commander!r} cannot be evaluated for {commander!r}"\n',
              '                f"package commander mismatch: {package.commander!r} cannot be evaluated "\n                f"for {commander!r}"\n',
          )
          replace(
              "src/commander_lab/packages/extractor.py",
              '''                f"- `{package['package_id']}` — status={package['status']}, density={evaluation['density']}/{evaluation['minimum_density']}, "\n                f"completeness={evaluation['package_completeness']:.2f}, failures={', '.join(evaluation['failure_modes_triggered']) or 'none'}"\n''',
              '''                f"- `{package['package_id']}` — status={package['status']}, "\n                f"density={evaluation['density']}/{evaluation['minimum_density']}, "\n                f"completeness={evaluation['package_completeness']:.2f}, "\n                f"failures={', '.join(evaluation['failure_modes_triggered']) or 'none'}"\n''',
          )
          replace(
              "src/commander_lab/packages/extractor.py",
              '                    f"- `{package[\'package_id\']}` — candidate only; confidence={package[\'confidence\']:.2f}"\n',
              '                    f"- `{package[\'package_id\']}` — candidate only; "\n                    f"confidence={package[\'confidence\']:.2f}"\n',
          )
          replace(
              "src/commander_lab/packages/extractor.py",
              '                    f"- {row.get(\'format_band\', \'unknown\')}: sample={row.get(\'sample_size\', 0)} — {row[\'reason\']}"\n',
              '                    f"- {row.get(\'format_band\', \'unknown\')}: "\n                    f"sample={row.get(\'sample_size\', 0)} — {row[\'reason\']}"\n',
          )

          replace(
              "src/commander_lab/analysis/validation.py",
              "            if illegal_colors:\n                issues.append(\n",
              "            if illegal_colors:\n                card_identity = sorted(color.value for color in card.color_identity)\n                commander_colors = sorted(color.value for color in commander_identity)\n                issues.append(\n",
          )
          replace(
              "src/commander_lab/analysis/validation.py",
              '''                        message=(\n                            f"{name} has color identity {sorted(c.value for c in card.color_identity)} "\n                            f"outside commander identity {sorted(c.value for c in commander_identity)}"\n                        ),\n''',
              '''                        message=(\n                            f"{name} has color identity {card_identity} "\n                            f"outside commander identity {commander_colors}"\n                        ),\n''',
          )

          for old, new in [
              ('                message=f"variant contains {len(deck.cards)} cards, expected {constraints.exact_card_count}",\n', '                message=(\n                    f"variant contains {len(deck.cards)} cards, "\n                    f"expected {constraints.exact_card_count}"\n                ),\n'),
              ('                message=f"land count {lands} outside {constraints.minimum_lands}-{constraints.maximum_lands}",\n', '                message=(\n                    f"land count {lands} outside "\n                    f"{constraints.minimum_lands}-{constraints.maximum_lands}"\n                ),\n'),
              ('                message=f"{high_mv} high-mana cards exceed maximum {constraints.maximum_high_mana_value_cards}",\n', '                message=(\n                    f"{high_mv} high-mana cards exceed maximum "\n                    f"{constraints.maximum_high_mana_value_cards}"\n                ),\n'),
              ('                        message=f"{name}: requires {quantity}, verified optimization pool has {available}",\n', '                        message=(\n                            f"{name}: requires {quantity}, verified optimization pool "\n                            f"has {available}"\n                        ),\n'),
              ('                    message=f"{name}: {quantity} simultaneous copies required, {available} available",\n', '                    message=(\n                        f"{name}: {quantity} simultaneous copies required, "\n                        f"{available} available"\n                    ),\n'),
          ]:
              replace("src/commander_lab/optimization/constraints.py", old, new)

          replace(
              "src/commander_lab/audit/runner.py",
              '            f"- **{name}:** `{result.get(\'status\')}` (return code `{result.get(\'returncode\', \'n/a\')}`)"\n',
              '            f"- **{name}:** `{result.get(\'status\')}` "\n            f"(return code `{result.get(\'returncode\', \'n/a\')}`)"\n',
          )
          replace(
              "src/commander_lab/audit/runner.py",
              '        f"# Reproducibility\\n\\n- Baseline commit: `{baseline_commit}`\\n- Audit working commit: `{commit}`\\n- Python: `{platform.python_version()}`\\n- Platform: `{platform.platform()}`\\n- Deterministic same-process, subprocess and worker-count tests are included in the pytest suite.\\n- Run manifests use SHA-256 and atomic writes.\\n",\n',
              '        (\n            f"# Reproducibility\\n\\n- Baseline commit: `{baseline_commit}`\\n"\n            f"- Audit working commit: `{commit}`\\n"\n            f"- Python: `{platform.python_version()}`\\n"\n            f"- Platform: `{platform.platform()}`\\n"\n            "- Deterministic same-process, subprocess and worker-count tests are included "\n            "in the pytest suite.\\n- Run manifests use SHA-256 and atomic writes.\\n"\n        ),\n',
          )
          replace(
              "src/commander_lab/audit/runner.py",
              '        f"# Security and supply chain\\n\\n- Secret-bearing values are redacted from structured logs.\\n- Subprocess commands remain explicit argument arrays; shell execution is not used for untrusted tool payloads.\\n- Run paths are constrained and manifests reject path traversal.\\n- SQLite integrity: `{db_check}`\\n- Project dependency versions are bounded in `pyproject.toml`; a fully resolved lock/audit requires network-enabled CI.\\n- External-engine binaries are not bundled or claimed present.\\n",\n',
              '        (\n            "# Security and supply chain\\n\\n"\n            "- Secret-bearing values are redacted from structured logs.\\n"\n            "- Subprocess commands remain explicit argument arrays; shell execution is not used "\n            "for untrusted tool payloads.\\n"\n            "- Run paths are constrained and manifests reject path traversal.\\n"\n            f"- SQLite integrity: `{db_check}`\\n"\n            "- Project dependency versions are bounded in `pyproject.toml`; a fully resolved "\n            "lock/audit requires network-enabled CI.\\n"\n            "- External-engine binaries are not bundled or claimed present.\\n"\n        ),\n',
          )
          replace(
              "src/commander_lab/audit/runner.py",
              '    summary = f"# Executive summary\\n\\n- Baseline: `{baseline_commit}`\\n- Audit commit/worktree: `{commit}`\\n- Bugs found: {len(bugs)} (1 critical, 3 high, 2 medium)\\n- Locally fixed with regression tests: {len(bugs)}\\n- External engine: not executed\\n- Final status: `{status}`\\n- Canonical deck/Drive changes: none\\n"\n',
              '    summary = (\n        f"# Executive summary\\n\\n- Baseline: `{baseline_commit}`\\n"\n        f"- Audit commit/worktree: `{commit}`\\n"\n        f"- Bugs found: {len(bugs)} (1 critical, 3 high, 2 medium)\\n"\n        f"- Locally fixed with regression tests: {len(bugs)}\\n"\n        "- External engine: not executed\\n"\n        f"- Final status: `{status}`\\n"\n        "- Canonical deck/Drive changes: none\\n"\n    )\n',
          )

          replace(
              "src/commander_lab/primer/compiler.py",
              '            "counterfactual_redecision_status": "not_run_missing_complete_alternative_action_context",\n',
              '            "counterfactual_redecision_status": (\n                "not_run_missing_complete_"\n                "alternative_action_context"\n            ),\n',
          )

          for old, new in [
              ('                f"{remove} is protected by current deckbuilding rules and may only be tested against "\n', '                f"{remove} is protected by current deckbuilding rules and may only be "\n                "tested against "\n'),
              ('                    f"tool exceeded simulation budget: {elapsed:.3f}s > {self.limits.max_simulation_seconds:.3f}s"\n', '                    f"tool exceeded simulation budget: {elapsed:.3f}s > "\n                    f"{self.limits.max_simulation_seconds:.3f}s"\n'),
              ('                            rationale=f"Package-aware completion candidate for {package_id}; not automatically applied.",\n', '                            rationale=(\n                                f"Package-aware completion candidate for {package_id}; "\n                                "not automatically applied."\n                            ),\n'),
              ('                "summary": f"{evidence.get(\'current_card\', \'current card\')} → {evidence.get(\'candidate_card\', \'candidate card\')}",\n', '                "summary": (\n                    f"{evidence.get(\'current_card\', \'current card\')} → "\n                    f"{evidence.get(\'candidate_card\', \'candidate card\')}"\n                ),\n'),
              ('                    f"| {row.policy.value} | {row.keep_rate_first_seven:.3f} | {row.mulligan_rate:.3f} | "\n', '                    f"| {row.policy.value} | {row.keep_rate_first_seven:.3f} | "\n                    f"{row.mulligan_rate:.3f} | "\n'),
          ]:
              replace("src/commander_lab/tools/service.py", old, new)

          replace("src/commander_lab/agents/openai_workflow.py", '            + " Evaluate roles, weaknesses, cuts and upgrade candidates. Do not confirm a candidate "\n', '            + " Evaluate roles, weaknesses, cuts and upgrade candidates. "\n            "Do not confirm a candidate "\n')
          replace("src/commander_lab/agents/openai_workflow.py", '            "build_optimization_context first, choose the smallest suitable run profile, use the Deck "\n', '            "build_optimization_context first, choose the smallest suitable run profile, "\n            "use the Deck "\n')
          replace("src/commander_lab/agents/openai_workflow.py", '                tool_description="Challenge conclusions for overfitting and alternative explanations.",\n', '                tool_description=(\n                    "Challenge conclusions for overfitting and alternative explanations."\n                ),\n')

          for old, new in [
              ('                            notes=f"Exact verified opponent snapshot card for {deck_id}; source_status={source_status}.",\n', '                            notes=(\n                                f"Exact verified opponent snapshot card for {deck_id}; "\n                                f"source_status={source_status}."\n                            ),\n'),
              ('                    f"verified opponent snapshot {deck_id} contains {len(exact_cards)} cards, expected 100"\n', '                    f"verified opponent snapshot {deck_id} contains {len(exact_cards)} "\n                    "cards, expected 100"\n'),
              ('                    notes=f"Structural role-density card for {deck_id}; source_status={source_status}.",\n', '                    notes=(\n                        f"Structural role-density card for {deck_id}; "\n                        f"source_status={source_status}."\n                    ),\n'),
          ]:
              replace("src/commander_lab/engine/structural/fixtures.py", old, new)

          for old, new in [
              ('                    f"{error.code if error else \'unknown\'}: {error.message if error else \'unknown error\'}"\n', '                    f"{error.code if error else \'unknown\'}: "\n                    f"{error.message if error else \'unknown error\'}"\n'),
              ('                        f"configured {self.backend.value} bridge identified itself as {hello.get(\'engine\')}"\n', '                        f"configured {self.backend.value} bridge identified itself as "\n                        f"{hello.get(\'engine\')}"\n'),
              ('                        f"configured {self.backend.value} bridge identified itself as {probe.backend.value}"\n', '                        f"configured {self.backend.value} bridge identified itself as "\n                        f"{probe.backend.value}"\n'),
              ('                    starting_state_injection_supported=probe.capabilities.reproducible_starting_state,\n', '                    starting_state_injection_supported=(\n                        probe.capabilities.reproducible_starting_state\n                    ),\n'),
          ]:
              replace("src/commander_lab/engine/rules/bridge.py", old, new)

          replace(
              "tests/integration/test_phase8_external_adapter.py",
              "        print(json.dumps({'request_id':rid,'ok':False,'error':{'code':'unsupported','message':method}}), flush=True)\n",
              "        print(\n            json.dumps(\n                {\n                    'request_id': rid,\n                    'ok': False,\n                    'error': {'code': 'unsupported', 'message': method},\n                }\n            ),\n            flush=True,\n        )\n",
          )

          phase = root / "scripts/complete_phase12_8_10.py"
          text = phase.read_text(encoding="utf-8")
          marker = "    lines = [\n"
          if "context_kinds =" not in text:
              text = text.replace(
                  marker,
                  '    context_kinds = ", ".join(\n        sorted({row.context_kind for row in result.overfitting_validation})\n    )\n    supported_contexts = sum(row.supported for row in result.overfitting_validation)\n    total_contexts = len(result.overfitting_validation)\n    lines = [\n',
                  1,
              )
          text = text.replace(
              '        f"- Context kinds: {\', \'.join(sorted({row.context_kind for row in result.overfitting_validation}))}",\n',
              '        f"- Context kinds: {context_kinds}",\n',
          )
          text = text.replace(
              '        f"- Supported contexts: {sum(row.supported for row in result.overfitting_validation)}/{len(result.overfitting_validation)}",\n',
              '        f"- Supported contexts: {supported_contexts}/{total_contexts}",\n',
          )
          phase.write_text(text, encoding="utf-8")
          PY
          ruff check . --fix
          ruff format .
          python -m compileall -q src tests scripts
          git diff --check
          set +e
          ruff check . > residual-ruff.txt 2>&1
          RC=$?
          cat residual-ruff.txt
          exit 0
      - name: Commit controlled E501 changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: finish repository-wide Ruff cleanup [strict-e501]"
          git push origin HEAD:fix/1.13.4-strict-quality-controlled
