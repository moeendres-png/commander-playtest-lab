        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Hardened OpenCode CLI execution lane (same pin/verification as the
      # DeepSeek and Space Bunny execution jobs above).
      - name: Install pinned OpenCode CLI v1.18.30
        env:
          VERSION: 1.18.30
          OPENCODE_X64_SHA256: 55007246858165496ff85ba1c2b648f7421e8e2013bf4189a680c9ff8e699d17
          OPENCODE_ARM64_SHA256: 4111a55c2a02c0fac314bd51e9a2330280e6d29d2b85b9554fff6d62612566ed
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) ASSET="opencode-linux-x64.tar.gz"; SHA="${OPENCODE_X64_SHA256}" ;;
            aarch64|arm64) ASSET="opencode-linux-arm64.tar.gz"; SHA="${OPENCODE_ARM64_SHA256}" ;;
            *) echo "unsupported arch ${ARCH} (fail closed)"; exit 1 ;;
          esac
          URL="https://github.com/sst/opencode/releases/download/v${VERSION}/${ASSET}"
          curl -fsSL -o "/tmp/${ASSET}" "${URL}"
