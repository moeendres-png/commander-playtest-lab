  opencode-bunny-review:
    # Mandatory cross-executor review lane (ROUTING_AND_EFFORT.md,
    # tools/foundry/review_gate.py): a fresh-context READ-ONLY Space Bunny MAX
    # reviewer bound to the exact validated implementation SHA and TREE. Started
    # only by an explicit `/bunny-review` comment, separated from the writable
    # `/bunny` secondary-execution lane above. Same trust gate and hardening as
    # every other lane: both the commenter and the thread author must have a
    # write-level association. Bot-authored threads are not exempt.
