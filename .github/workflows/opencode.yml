          python3 -I "$watchdog" -- opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/space-bunny
          AGENT: bunny-verifier
          SHARE: 'false'
          PROMPT: ''
          USE_GITHUB_TOKEN: 'false'
          # `opencode github run` accepts a comment only when it mentions one of these
