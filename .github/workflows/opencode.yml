          rm -f "/tmp/${ASSET}"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Assert OpenCode CLI is exactly v1.18.30
        run: |
          set -euo pipefail
          BIN="$HOME/.opencode/bin/opencode"
          test -x "$BIN"
          RESOLVED="$(command -v opencode)"
          echo "opencode path: ${RESOLVED}"
          test "${RESOLVED}" = "${BIN}"
          INSTALLED="$("${BIN}" --version)"
          echo "opencode --version (path): ${INSTALLED}"
          test "${INSTALLED}" = "1.18.30"
          INSTALLED_PATH="$(opencode --version)"
          echo "opencode --version (PATH): ${INSTALLED_PATH}"
          test "${INSTALLED_PATH}" = "1.18.30"

      - name: Run opencode
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/space-bunny
          AGENT: bunny-verifier
          SHARE: 'false'
          PROMPT: ''
          USE_GITHUB_TOKEN: 'false'
          # `opencode github run` accepts a comment only when it mentions one of these
          # phrases (default /opencode,/oc). This lane is started by /bunny.
          MENTIONS: '/bunny'
          VARIANT: max
          OIDC_BASE_URL: ''

  opencode-bunny-review:
    # Mandatory cross-executor review lane (ROUTING_AND_EFFORT.md,
    # tools/foundry/review_gate.py): a fresh-context READ-ONLY Space Bunny MAX
    # reviewer bound to the exact validated implementation SHA and TREE. Started
    # only by an explicit `/bunny-review` comment, separated from the writable
    # `/bunny` secondary-execution lane above. Same trust gate and hardening.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || github.event.pull_request.author_association) ||
        github.event.issue.user.login == 'opencode-agent[bot]' ||
        github.event.pull_request.user.login == 'opencode-agent[bot]'
      ) && (
        contains(github.event.comment.body, ' /bunny-review') ||
        startsWith(github.event.comment.body, '/bunny-review')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      # The agent reads the target issue/PR text and, on a PR, its head. The
      # target's author must be trusted (job `if:`) and a PR head must live in
