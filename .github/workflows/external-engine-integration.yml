name: External XMage Integration

on:
  pull_request:
    paths:
      - "engine-bridge/**"
      - "src/commander_lab/engine/rules/**"
      - "src/commander_lab/models/engine_runtime.py"
      - "src/commander_lab/models/rules.py"
      - "config/rules_engines.json"
      - "scripts/run_external_b3_regression.py"
      - ".github/workflows/external-engine-integration.yml"
  workflow_dispatch:
    inputs:
      xmage_commit:
        description: Verified full XMage commit SHA
        required: true
        default: 77d7646da6958fdf8125ee7c8f4aabd130d21d4c

permissions:
  contents: read

env:
  XMAGE_COMMIT: ${{ inputs.xmage_commit || '77d7646da6958fdf8125ee7c8f4aabd130d21d4c' }}
  ENGINE_PROVIDER: xmage
  ENGINE_MODE: external
  ALLOW_TACTICAL_ORACLE_FALLBACK: "false"
  PYTHONHASHSEED: "0"
  COMMANDER_LAB_XMAGE_BRIDGE_CMD: >-
    java -jar ${{ github.workspace }}/engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar

jobs:
  build-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate immutable XMage input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$XMAGE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "xmage_commit must be a full 40-character lowercase hexadecimal commit SHA" >&2
            exit 1
          }
      - name: Checkout lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout pinned XMage
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 immutable revision
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify XMage commit and metadata
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"
          git cat-file -t "$XMAGE_COMMIT"
          git show --no-patch --format=fuller "$XMAGE_COMMIT"
          mkdir -p ../../../artifacts/external-engine
          git describe --tags --always "$XMAGE_COMMIT" | tee ../../../artifacts/external-engine/xmage-source-description.txt
      - name: Build pinned XMage
        working-directory: vendor/engine-source/xmage
        run: |
          if test -x ./mvnw; then ./mvnw -B -ntp -DskipTests install; else mvn -B -ntp -DskipTests install; fi
      - name: Install lab
        run: python -m pip install -e '.[dev,api]'
      - name: Require provider-specific bridge
        run: |
          test -f engine-bridge/pom.xml || {
            echo 'Provider-specific XMage Java bridge is missing. This is a hard failure, not a fallback.' >&2
            exit 1
          }
      - name: Build and test B3 bridge
        working-directory: engine-bridge
        run: mvn -B -ntp verify
      - name: Verify current B3 capability truth
        run: pytest -q tests/unit/test_xmage_compatibility_provider.py tests/unit/test_phase8_rules_models.py
      - name: Run real B3 JSONL process regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/external-engine
          python scripts/run_external_b3_regression.py 2>&1 | tee artifacts/external-engine/b3-process.log
      - name: Record bridge identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/external-engine
          sha256sum engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar \
            > artifacts/external-engine/xmage-b3-bridge.sha256
          printf 'lab_commit=%s\nxmage_commit=%s\nprotocol=2.0.0\nprovider=xmage\nevidence_class=external_rules_engine\n' \
            "$GITHUB_SHA" "$XMAGE_COMMIT" \
            > artifacts/external-engine/XMAGE_B3_RUNTIME_IDENTITY.txt
      - name: Generate evidence checksums
        if: always()
        run: |
          mkdir -p artifacts/external-engine
          find artifacts/external-engine -type f ! -name 'external-engine-checksums.sha256' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > artifacts/external-engine/external-engine-checksums.sha256 || true
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: external-engine-b3-evidence-${{ github.sha }}
          path: |
            artifacts/external-engine/
            engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
