name: RogShai 48 Structural 12-Opponent Extension

on:
  push:
    branches:
      - runs/rogshai-48-structural-12opp-20260825
    paths:
      - '.github/workflows/rogshai-48-structural-12opp-128.yml'
      - 'scripts/run_rogshai_structural_12opp_screen.py.gz.b64'
      - 'artifacts/rogshai-structural-12opp-2026-08-25/input/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-12opp-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        block: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Commander Lab
        run: python -m pip install -e '.[dev]'

      - name: Decode frozen run inputs
        shell: bash
        env:
          BLOCK_NUM: ${{ matrix.block }}
        run: |
          BLOCK=$(printf "%02d" "$BLOCK_NUM")
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path

          block = int(os.environ["BLOCK_NUM"])
          pairs = [
              ('artifacts/rogshai-structural-broad-screen-2026-08-25/input/CANDIDATES.json.gz.b64', '/tmp/CANDIDATES.json'),
              ('scripts/run_rogshai_structural_12opp_screen.py.gz.b64', '/tmp/run_rogshai_structural_12opp_screen.py'),
              (f'artifacts/rogshai-structural-12opp-2026-08-25/input/BLOCK_{block:02d}_SEED_SCHEDULE.json.gz.b64', '/tmp/SEED_SCHEDULE.json'),
          ]
          for source, target in pairs:
              data = base64.b64decode(Path(source).read_text().strip())
              Path(target).write_bytes(gzip.decompress(data))
          PY

      - name: Run 48 x 16 structural games for matrix block
        env:
          BLOCK_NUM: ${{ matrix.block }}
        run: |
          BLOCK=$(printf "%02d" "$BLOCK_NUM")
          OUT="artifacts/rogshai-structural-12opp-2026-08-25/block-${BLOCK}/results"
          python /tmp/run_rogshai_structural_12opp_screen.py \
            --root . \
            --candidates /tmp/CANDIDATES.json \
            --schedule /tmp/SEED_SCHEDULE.json \
            --output "$OUT" \
            --max-turns 50
          cp /tmp/SEED_SCHEDULE.json "$OUT/SEED_SCHEDULE.json"
          cp artifacts/rogshai-structural-12opp-2026-08-25/input/OPPONENT_ENSEMBLE_CONTRACT.json "$OUT/OPPONENT_ENSEMBLE_CONTRACT.json"

      - name: Verify block invariants
        shell: bash
        env:
          BLOCK_NUM: ${{ matrix.block }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          block = int(os.environ["BLOCK_NUM"])
          p = Path(f'artifacts/rogshai-structural-12opp-2026-08-25/block-{block:02d}/results/RUN_REPORT.json')
          r = json.loads(p.read_text())
          assert r['evidence_class'] == 'structural_model_estimates'
          assert r['candidate_count'] == 48
          assert r['games_per_candidate'] == 16
          assert r['target_game_count'] == 768
          assert r['completed_game_count'] == 768
          assert r['aborted_game_count'] == 0
          assert r['pre_gameplay_candidate_elimination'] == 0
          assert r['pairwise_rows'] == 1128
          assert r['pod_size'] == 4
          assert len(r['opponent_ids']) == 12
          assert r['opponent_weighting'] == 'equal_frequency_test_design_not_meta_prior'
          assert set(r['excluded_opponent_profiles']) == {
              'opponent/cosmic-spiderman-midbudget',
              'opponent/morcant-elves',
          }
          print(f'STRUCTURAL_12OPP_BLOCK_{block:02d}=PASS')
          print('COMPLETED', r['completed_game_count'])
          print('ABORTED', r['aborted_game_count'])
          PY

      - name: Upload 12-opponent structural evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: rogshai-structural-12opp-block-${{ matrix.block }}-${{ github.sha }}
          path: artifacts/rogshai-structural-12opp-2026-08-25/block-*/results/
          if-no-files-found: error
          retention-days: 14
