name: J-P3B XMage Native Fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xmage-native-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XMAGE_REPO: https://github.com/magefree/mage.git
      XMAGE_COMMIT: 06d166b098ad36b277edef01116472203d5a047e
      CONTRACT_HASH: 89e0813ec66787328dd4b204f57cb5c404694dec29d249fbbb8785fad0a6d2c6
      FIXTURE_HASH: cfea9c136b9126c4d367b0c91ebfe4089a47490c7d60dfae5e78dd307eb47dbb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
      - name: Acquire frozen XMage and record identity
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_XMAGE_FIXTURE_EVIDENCE/logs J_P3_XMAGE_FIXTURE_EVIDENCE/runtime
          git clone --no-checkout "$XMAGE_REPO" xmage > J_P3_XMAGE_FIXTURE_EVIDENCE/logs/acquisition.log 2>&1
          cd xmage
          git checkout --detach "$XMAGE_COMMIT" >> ../J_P3_XMAGE_FIXTURE_EVIDENCE/logs/acquisition.log 2>&1
          test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"
          printf 'provider_commit=%s\nprovider_tree=%s\ncontract_hash=%s\nfixture_hash=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$CONTRACT_HASH" "$FIXTURE_HASH" > ../J_P3_XMAGE_FIXTURE_EVIDENCE/provider-identity.txt
      - name: Build XMage test dependencies
        shell: bash
        run: |
          set -eu
          cd xmage
          mvn -B -DskipTests -pl Mage.Tests -am install > ../J_P3_XMAGE_FIXTURE_EVIDENCE/logs/build.log 2>&1
      - name: P3-FX-001 Commander cast
        shell: bash
        run: |
          set -eu
          cd xmage
          mvn -B -pl Mage.Tests -Dtest=org.mage.test.commander.duel.CastCommanderTest#testCastCommander test > ../J_P3_XMAGE_FIXTURE_EVIDENCE/logs/P3-FX-001-commander-cast.log 2>&1
      - name: P3-FX-002 Commander tax on native four-player Commander harness
        shell: bash
        run: |
          set -eu
          cd xmage
          mvn -B -pl Mage.Tests -Dtest=org.mage.test.cards.continuous.CommandersCastTest#test_CastToBattlefieldTwoTimes test > ../J_P3_XMAGE_FIXTURE_EVIDENCE/logs/P3-FX-002-commander-tax-4p.log 2>&1
      - name: P3-FX-003 Partner commanders
        shell: bash
        run: |
          set -eu
          cd xmage
          mvn -B -pl Mage.Tests -Dtest=org.mage.test.commander.duel.CastBGPartnerCommanderTest#testCastBothPartnerCommanders test > ../J_P3_XMAGE_FIXTURE_EVIDENCE/logs/P3-FX-003-partner.log 2>&1
      - name: Record fixture summaries and manifest
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_XMAGE_FIXTURE_EVIDENCE/runtime
          for f in J_P3_XMAGE_FIXTURE_EVIDENCE/logs/P3-FX-*.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -E 'Tests run:|Failures:|Errors:|BUILD SUCCESS|BUILD FAILURE|Finished at:' "$f" | tail -n 12 || true
          done | tee J_P3_XMAGE_FIXTURE_EVIDENCE/runtime/fixture-summary.txt
          find J_P3_XMAGE_FIXTURE_EVIDENCE -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > J_P3_XMAGE_FIXTURE_EVIDENCE/SHA256SUMS.txt
          sha256sum J_P3_XMAGE_FIXTURE_EVIDENCE/SHA256SUMS.txt > J_P3_XMAGE_FIXTURE_EVIDENCE/MANIFEST_SHA256.txt
      - name: Upload fixture raw evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: J_P3_XMAGE_FIXTURE_EVIDENCE
          path: J_P3_XMAGE_FIXTURE_EVIDENCE
          if-no-files-found: error
          retention-days: 90
