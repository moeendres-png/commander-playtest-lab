name: J-P1 Final Strict Quality Candidate v6

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  validate-final-quality-candidate-v6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact starting lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5d025034e289bf27cca351b3d595f067aa623648"
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Replay reviewed transformation without YAML indentation assumptions
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/j-p1-final-quality-bootstrap-v2.yml \
            .github/workflows/j-p1-final-quality-bootstrap-v3.yml \
            .github/workflows/j-p1-final-quality-bootstrap-v4.yml \
            .github/workflows/j-p1-final-quality-bootstrap-v5.yml \
            .github/workflows/j-p1-final-quality-bootstrap-v6.yml; do
            if [[ -f "$f" ]]; then git rm "$f"; fi
          done
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          lab = Path('src/commander_lab/mulligan/lab.py')
          text = lab.read_text(encoding='utf-8')
          old_sig = '''    def iter_draw_sequences(\n        self,\n        deck: StructuralDeckProfile,\n        *,\n        samples: int,\n        seed: int,\n        max_mulligans: int = 6,\n    ):\n'''
          new_sig = '''    def iter_draw_sequences(\n        self,\n        deck: StructuralDeckProfile,\n        *,\n        samples: int,\n        seed: int,\n        max_mulligans: int = 6,\n    ) -> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:\n'''
          if old_sig not in text:
              raise SystemExit('exact current iter_draw_sequences signature not found')
          lab.write_text(text.replace(old_sig, new_sig, 1), encoding='utf-8')

          workflow = yaml.safe_load(Path('.github/workflows/j-p1-final-quality-bootstrap.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['validate-final-quality-candidate']['steps']
          run = next(step['run'] for step in steps if step.get('name') == 'Apply explicit current-tree type and lint boundaries')

          run = run.replace(
              'text = replace_required(text, "from statistics import fmean\\n", "from statistics import fmean\\nfrom typing import Literal, TypedDict\\n", "mulligan typing imports")',
              'text = replace_required(text, "from statistics import fmean, median\\n", "from statistics import fmean, median\\nfrom typing import Literal, TypedDict\\n", "mulligan typing imports")',
          )

          # Strip the historical regex section using marker text only, independent of indentation.
          start = run.find('# Locate the draw-sequence generator signature and add Iterator return annotation.')
          bucket_token = '"        buckets: dict[str, dict[str, list[float] | int]],"'
          end = run.find('text = replace_required(', start + 1)
          while end >= 0 and bucket_token not in run[end:end + 500]:
              end = run.find('text = replace_required(', end + 1)
          if start < 0 or end < 0:
              raise SystemExit('semantic generator markers not found in base transform')
          indent = run[run.rfind('\n', 0, start) + 1:start]
          replacement = (
              '# Exact current generator signature was annotated by the wrapper.\n'
              + indent + 'if "-> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:" not in text:\n'
              + indent + '    raise SystemExit("iter_draw_sequences annotation missing")\n'
              + indent
          )
          run = run[:start] + replacement + run[end:]

          # Replace the historical numeric rewrite call by locating its unique label and the
          # enclosing replace_required call; no whitespace/escaping assumptions.
          label_pos = run.find('"mulligan numeric rule comparison"')
          if label_pos < 0:
              raise SystemExit('numeric rewrite label not found')
          rs = run.rfind('text = replace_required(', 0, label_pos)
          re_ = run.find('\n          )', label_pos)
          if re_ < 0:
              re_ = run.find('\n)', label_pos)
          if rs < 0 or re_ < 0:
              raise SystemExit('numeric rewrite call bounds not found')
          re_ = run.find(')', re_) + 1
          base_indent = run[run.rfind('\n', 0, rs) + 1:rs]
          rule = f'''text = replace_required(\n{base_indent}    text,\n{base_indent}    \'\'\'            if clause.operator == "between" and isinstance(clause.value, tuple):\n                ok = value is not None and clause.value[0] <= float(value) <= clause.value[1]\n            elif clause.operator == "ge":\n                ok = value is not None and float(value) >= float(clause.value)\n            elif clause.operator == "le":\n                ok = value is not None and float(value) <= float(clause.value)\'\'\',\n{base_indent}    \'\'\'            numeric = self._numeric_value(value)\n            if clause.operator == "between":\n                if numeric is None or not isinstance(clause.value, tuple):\n                    ok = False\n                else:\n                    low, high = clause.value\n                    ok = low <= numeric <= high\n            elif clause.operator == "ge":\n                threshold = self._numeric_value(clause.value)\n                ok = numeric is not None and threshold is not None and numeric >= threshold\n            elif clause.operator == "le":\n                threshold = self._numeric_value(clause.value)\n                ok = numeric is not None and threshold is not None and numeric <= threshold\'\'\',\n{base_indent}    "mulligan numeric rule comparison",\n{base_indent})'''
          run = run[:rs] + rule + run[re_:]

          completed = subprocess.run(['bash', '-c', run], text=True)
          raise SystemExit(completed.returncode)
          PY
      - name: Blocking Ruff lint
        run: ruff check .
      - name: Blocking Ruff format
        run: ruff format --check .
      - name: Blocking Mypy strict
        run: mypy src/commander_lab
      - name: Commit strict-quality candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(J-P1): close whole-tree Ruff and strict typing debt"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Compile clean candidate
        run: python -m compileall -q src tests scripts
      - name: Test clean candidate
        run: pytest -q
      - name: Push only fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:roadmap/j-p1-reliability
