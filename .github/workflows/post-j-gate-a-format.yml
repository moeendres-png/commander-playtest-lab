name: Post-J Gate A format

on:
  push:
    branches:
      - post-j/gate-a-current-truth

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-j/gate-a-current-truth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12.1,<0.13'
      - name: Format Gate A files
        run: |
          ruff format src/commander_lab/fresh_rebuild.py src/commander_lab/mcp/server.py tests/integration/test_rogshai_mvp_readiness.py tests/unit/test_phase12_17_mcp.py
          git diff --check
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/fresh_rebuild.py src/commander_lab/mcp/server.py tests/integration/test_rogshai_mvp_readiness.py tests/unit/test_phase12_17_mcp.py
          git commit -m 'Format Post-J Gate A files'
          git push origin HEAD:post-j/gate-a-current-truth
