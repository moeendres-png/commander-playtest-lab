name: Complete 4P-only operational simulation policy

on:
  push:
    branches:
      - policy/4p-only-simulation-readiness-20260820
    paths:
      - .github/workflows/complete-4p-only-policy.yml

permissions:
  contents: write

jobs:
  complete-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/4p-only-simulation-readiness-20260820
      - name: Remove remaining operational 3P/5P self-play path and update tests
        shell: python
        run: |
          from pathlib import Path

          robust = Path('src/commander_lab/robustness.py')
          text = robust.read_text(encoding='utf-8')
          old = '''    pod_sizes: tuple[int, ...] = (3, 4, 5),\n    max_turns: int = 20,\n) -> dict[str, Any]:\n    \"\"\"Run actual Structural Simulator self-play with one policy profile on every seat.\n'''
          new = '''    pod_sizes: tuple[int, ...] = (4,),\n    max_turns: int = 20,\n) -> dict[str, Any]:\n    \"\"\"Run actual Structural Simulator self-play with one policy profile on every seat.\n'''
          if old not in text:
              raise SystemExit('Expected run_structural_self_play signature not found')
          text = text.replace(old, new, 1)
          guard_anchor = '''    if politics not in POLITICS_REGIMES:\n        raise KeyError(f\"unknown politics regime: {politics}\")\n'''
          guard_new = '''    if pod_sizes != (4,):\n        raise ValueError(\n            \"Operational Commander Playtest Lab self-play is 4-player only; \"\n            \"3P/5P pod sensitivity is out of project scope.\"\n        )\n    if politics not in POLITICS_REGIMES:\n        raise KeyError(f\"unknown politics regime: {politics}\")\n'''
          if guard_anchor not in text:
              raise SystemExit('Expected self-play guard anchor not found')
          text = text.replace(guard_anchor, guard_new, 1)
          robust.write_text(text, encoding='utf-8')

          test = Path('tests/unit/test_phase1215_robustness.py')
          t = test.read_text(encoding='utf-8')
          replacements = {
              'assert {row["pod_size"] for row in a["scenario_rows"]} == {3, 4, 5}': 'assert {row["pod_size"] for row in a["scenario_rows"]} == {4}',
              'pod_sizes=(3,), iterations_per_scenario=1, max_turns=10, rounds=2': 'pod_sizes=(4,), iterations_per_scenario=1, max_turns=10, rounds=2',
              'seed=99, rounds=2, pod_sizes=(3,), iterations_per_scenario=1, max_turns=8, workers=1': 'seed=99, rounds=2, pod_sizes=(4,), iterations_per_scenario=1, max_turns=8, workers=1',
              'seed=99, rounds=2, pod_sizes=(3,), iterations_per_scenario=1, max_turns=8, workers=2': 'seed=99, rounds=2, pod_sizes=(4,), iterations_per_scenario=1, max_turns=8, workers=2',
              'pod_sizes=(3,),\n        max_turns=8,': 'pod_sizes=(4,),\n        max_turns=8,',
          }
          for before, after in replacements.items():
              if before not in t:
                  raise SystemExit(f'Expected test text not found: {before!r}')
              t = t.replace(before, after, 1)
          test.write_text(t, encoding='utf-8')

          policy_test = Path('tests/unit/test_operational_4p_policy.py')
          p = policy_test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_structural_self_play_rejects_non_four_player_operational_scope(repo_root) -> None:\n    from commander_lab.robustness import run_structural_self_play\n\n    with pytest.raises(ValueError, match=\"4-player only\"):\n        run_structural_self_play(repo_root, pod_sizes=(3,))\n'''
          if 'test_structural_self_play_rejects_non_four_player_operational_scope' not in p:
              p += addition
          policy_test.write_text(p, encoding='utf-8')

          Path('.github/workflows/complete-4p-only-policy.yml').unlink()
      - name: Commit final policy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/commander_lab/robustness.py tests/unit/test_phase1215_robustness.py tests/unit/test_operational_4p_policy.py .github/workflows/complete-4p-only-policy.yml
          git diff --cached --check
          git commit -m "test: align robustness surfaces with 4P-only policy"
          git push origin HEAD:policy/4p-only-simulation-readiness-20260820
