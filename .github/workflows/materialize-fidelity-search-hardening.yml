name: Materialize fidelity search hardening

on:
  push:
    branches:
      - fix/post-official-fidelity-search-liveness-20260823
    paths:
      - .github/workflows/materialize-fidelity-search-hardening.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-official-fidelity-search-liveness-20260823
          fetch-depth: 0

      - name: Apply locally verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch-materialize/part*.txt | base64 -d | gzip -d > /tmp/fidelity-search-hardening.patch
          git apply --check /tmp/fidelity-search-hardening.patch
          git apply /tmp/fidelity-search-hardening.patch
          rm -rf .patch-materialize
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix optimizer fidelity, search liveness, and evidence routing"
          git push origin HEAD:fix/post-official-fidelity-search-liveness-20260823
