name: Run Manifest Integrity

on:
  pull_request:
    paths:
      - 'src/commander_lab/storage/**'
      - 'tests/unit/test_run_*.py'
      - 'tests/unit/test_phase86_atomic_and_integrity.py'
      - '.github/workflows/run-manifest-integrity.yml'
      - 'pyproject.toml'
      - 'requirements/lock.txt'
      - "src/commander_lab/__init__.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/candidates/**"
      - "src/commander_lab/cards/**"
      - "src/commander_lab/engine/**"
      - "src/commander_lab/models/**"
      - "tests/conftest.py"
      - "src/commander_lab/semantic_replay/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: run-manifest-integrity-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  windows-manifest-integrity:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install manifest test dependencies
        # Install the hashed package list without resolving Linux-lock transitive
        # extras on Windows; this bounded suite does not exercise those extras.
        run: |
          python -m pip install --no-deps --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise real Windows junction and manifest contracts
        shell: pwsh
        run: |
          $runTests = @(Get-ChildItem -Path tests/unit/test_run_*.py -File -ErrorAction Stop | ForEach-Object { $_.FullName })
          if ($runTests.Count -eq 0) { throw "No run integrity tests discovered" }
          python -m pytest -q @runTests tests/unit/test_phase86_atomic_and_integrity.py
