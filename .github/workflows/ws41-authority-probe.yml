name: WS41 live Wizards CR authority probe
on:
  push:
    branches:
      - ws41/successor-contract-v1.0.3-freeze
    paths:
      - .github/workflows/ws41-authority-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and lock current official Comprehensive Rules
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0' 'https://magic.wizards.com/en/rules' -o /tmp/rules-page.html
          python - <<'PY' >/tmp/cr-url.txt
          import html,re
          from urllib.parse import quote
          text=open('/tmp/rules-page.html',encoding='utf-8').read()
          urls=re.findall(r'https://media\.wizards\.com/[^\"\'<>]+?\.txt', text, flags=re.I)
          if not urls:
              urls=re.findall(r'href=[\"\']([^\"\']+\.txt)[\"\']', text, flags=re.I)
          if not urls:
              raise SystemExit('official TXT link not found on Wizards rules page')
          raw=html.unescape(urls[-1]).strip()
          print(quote(raw, safe=':/'))
          PY
          txt_url="$(cat /tmp/cr-url.txt)"
          echo "CURRENT_OFFICIAL_CR_URL=$txt_url"
          curl -fsSL -A 'Mozilla/5.0' "$txt_url" -o /tmp/MagicCompRules-current.txt
          echo "CURRENT_OFFICIAL_CR_SHA256=$(sha256sum /tmp/MagicCompRules-current.txt | awk '{print $1}')"
          grep -m1 -E 'These rules are effective as of|These rules are effective' /tmp/MagicCompRules-current.txt | sed 's/^/CURRENT_OFFICIAL_CR_EFFECTIVE_LINE=/'
          grep -m1 '^303\.4a ' /tmp/MagicCompRules-current.txt | sed 's/^/CR303_4A=/'
          grep -m1 '^115\.1b ' /tmp/MagicCompRules-current.txt | sed 's/^/CR115_1B=/'
          grep -m1 '^601\.2c ' /tmp/MagicCompRules-current.txt | sed 's/^/CR601_2C=/'
