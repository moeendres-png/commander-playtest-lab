name: J-P4 Ruff Hygiene

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  hygiene:
    if: github.event.pull_request.head.ref == 'roadmap/j-p4-pilot-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply only diagnosed hygiene fixes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_RAW=$(sha256sum src/commander_lab/agents/pilots.py | awk '{print $1}')
          BEFORE_AST=$(python - <<'PY'
          import ast, hashlib
          p='src/commander_lab/agents/pilots.py'
          d=ast.dump(ast.parse(open(p, encoding='utf-8').read()), include_attributes=False)
          print(hashlib.sha256(d.encode()).hexdigest())
          PY
          )
          ruff check --fix --select F401 scripts/run_j_p4_sensitivity.py
          ruff check --fix --select SIM300 tests/golden/test_j_p4_pilot_quality.py
          ruff format scripts/run_j_p4_sensitivity.py src/commander_lab/agents/pilots.py tests/golden/test_j_p4_pilot_quality.py
          AFTER_RAW=$(sha256sum src/commander_lab/agents/pilots.py | awk '{print $1}')
          AFTER_AST=$(python - <<'PY'
          import ast, hashlib
          p='src/commander_lab/agents/pilots.py'
          d=ast.dump(ast.parse(open(p, encoding='utf-8').read()), include_attributes=False)
          print(hashlib.sha256(d.encode()).hexdigest())
          PY
          )
          test "$BEFORE_AST" = "$AFTER_AST"
          ruff check .
          ruff format --check .
          cat > docs/J_P4_CI_HYGIENE_ATTESTATION.md <<EOF
          # J-P4 CI hygiene attestation

          Applied after the first/only holdout evaluation solely because CI reported Ruff hygiene failures, not because of holdout outcomes.

          - `scripts/run_j_p4_sensitivity.py`: removed one unused `defaultdict` import (F401) and Ruff-only formatting.
          - `tests/golden/test_j_p4_pilot_quality.py`: rewrote the equivalent set relation `REQUIRED_DIMENSIONS <= covered` as `covered >= REQUIRED_DIMENSIONS` (SIM300) and Ruff-only formatting.
          - `src/commander_lab/agents/pilots.py`: Ruff-only formatting. No decision expression, constant, branch, action score, metadata lookup, or heuristic changed.
          - Pilot AST before/after Ruff formatting is byte-identical after normalized AST serialization: `$BEFORE_AST`.
          - Raw pilot file SHA changed only because formatting changed: `$BEFORE_RAW` -> `$AFTER_RAW`.
          - Holdout corpus bytes were not changed and the holdout was not rerun.
          - No change was selected from, tuned to, or justified by holdout outcomes.

          Therefore `holdout_tuning_violation = false`; the original raw development-freeze hash remains historical provenance, while this attestation records the post-freeze formatting-only byte transition.
          EOF
          rm .github/workflows/jp4-ruff-hygiene.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Roadmap J-P4: apply semantic-neutral Ruff hygiene'
          git push origin HEAD:${{ github.head_ref }}
