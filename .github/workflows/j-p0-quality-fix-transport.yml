name: J P0 Quality Fix Transport

on:
  push:
    branches:
      - roadmap/j-p0-integrity-run-identity

permissions:
  contents: write

jobs:
  apply-quality-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base and apply exact local quality patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | tr -d '[:space:]' | base64 -d > /tmp/jp0-quality.patch.gz
          echo '3b97b55b209b65eeb21d1f10a85a8c881a2879c4c6aa78dda5504a769ea311eb  /tmp/jp0-quality.patch.gz' | sha256sum -c -
          gzip -dc /tmp/jp0-quality.patch.gz > /tmp/jp0-quality.patch
          echo '2a1598e44a11a07d6a0fae4ca9d6d42ade89d99392a5c2177baa424cd091b4b7  /tmp/jp0-quality.patch' | sha256sum -c -
          git apply --check /tmp/jp0-quality.patch
          git apply /tmp/jp0-quality.patch
          rm .github/workflows/j-p0-quality-fix-transport.yml
          git diff --check
          git add -A
          test "$(git write-tree)" = "4c47acfa58394702cf2dc9d9443a55e9ec14695e"

      - name: Commit exact local fix tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'commander-playtest-lab automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(J-P0): satisfy quality lint gate'
          test "$(git rev-parse HEAD^{tree})" = "4c47acfa58394702cf2dc9d9443a55e9ec14695e"
          git push origin HEAD:roadmap/j-p0-integrity-run-identity
