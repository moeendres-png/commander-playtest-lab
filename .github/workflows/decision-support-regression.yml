name: Decision Support Regression

on:
  pull_request:
    paths:
      - 'scripts/run_j_final_acceptance.py'
      - '.github/workflows/decision-support-regression.yml'
      - "src/commander_lab/__init__.py"
      - "src/commander_lab/advancement.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/analysis/**"
      - "src/commander_lab/candidate_screening.py"
      - "src/commander_lab/candidates/**"
      - "src/commander_lab/canonical_features.py"
      - "src/commander_lab/cards/**"
      - "src/commander_lab/counterfactual.py"
      - "src/commander_lab/cut_frontier.py"
      - "src/commander_lab/decision_bundle.py"
      - "src/commander_lab/decision_information.py"
      - "src/commander_lab/decision_statistics.py"
      - "src/commander_lab/deck_registry.py"
      - "src/commander_lab/diagnostics.py"
      - "src/commander_lab/engine/**"
      - "src/commander_lab/fresh_rebuild.py"
      - "src/commander_lab/importers/**"
      - "src/commander_lab/mana_analysis.py"
      - "src/commander_lab/meta/**"
      - "src/commander_lab/model_informativeness.py"
      - "src/commander_lab/models/**"
      - "src/commander_lab/mulligan/**"
      - "src/commander_lab/opponent_ensembles/**"
      - "src/commander_lab/optimization/**"
      - "src/commander_lab/packages/**"
      - "src/commander_lab/playstyle.py"
      - "src/commander_lab/pod_scheduling.py"
      - "src/commander_lab/pod_scheduling_5p.py"
      - "src/commander_lab/primer/**"
      - "src/commander_lab/priority_workflows.py"
      - "src/commander_lab/project_context.py"
      - "src/commander_lab/provenance/**"
      - "src/commander_lab/repositories/**"
      - "src/commander_lab/robustness.py"
      - "src/commander_lab/semantic_evidence.py"
      - "src/commander_lab/semantic_features.py"
      - "src/commander_lab/storage/**"
      - "src/commander_lab/tools/**"
      - "src/commander_lab/variant_identity.py"
      - "src/commander_lab/whole_deck/**"
      - "src/commander_lab/workflow_identity.py"
      - "src/commander_lab/workflow_session.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: decision-support-regression-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  historical-rogshai-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install historical regression runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Repository integrity
        run: |
          git fsck --full
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run historical J-FINAL decision-support regression
        run: python scripts/run_j_final_acceptance.py
      - name: Assert tracked repository remains clean
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: decision-support-regression-${{ github.sha }}
          path: artifacts/j_final/
          if-no-files-found: error
          retention-days: 30
