name: Decision Support Regression

on:
  # Package B (Owner decision 2026-11-14): dispatch only. This is the historical RogShai J-FINAL
  # regression; RogShai is historical/regression data, not an active optimization lane
  # (docs/OWNER_DECK_FOCUS_CURRENT.md), so it no longer starts on pull requests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: decision-support-regression-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  historical-rogshai-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install historical regression runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Repository integrity
        run: |
          git fsck --full
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run historical J-FINAL decision-support regression
        run: python scripts/run_j_final_acceptance.py
      - name: Assert tracked repository remains clean
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 immutable revision
        if: always()
        with:
          name: decision-support-regression-${{ github.sha }}
          path: artifacts/j_final/
          if-no-files-found: error
          retention-days: 30
