name: RogShai First Optimizer-v2 Campaign 2026-08-20

on:
  pull_request:
    paths:
      - ".github/workflows/rogshai-first-optimizer-v2-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  structural-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact run branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lab
        run: python -m pip install -e '.[dev,api]'

      - name: Record exact software identity
        run: |
          set -euo pipefail
          mkdir -p artifacts/rogshai-first-optimizer-v2
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee artifacts/rogshai-first-optimizer-v2/SOFTWARE_IDENTITY.txt
          git status --porcelain=v1 --untracked-files=no | tee artifacts/rogshai-first-optimizer-v2/GIT_STATUS_BEFORE.txt

      - name: Freeze manifest
        run: |
          set -euo pipefail
          python -m commander_lab.optimizer_v2_cli manifest \
            --output artifacts/rogshai-first-optimizer-v2/manifest.json \
            --run-id rogshai-first-official-optimizer-v2-20260820 \
            --seed 20260820 \
            --exploratory-games 256 \
            --calibration-games 128 \
            --confirmatory-games 512 \
            --holdout-games 512

      - name: Fail-closed preflight
        run: |
          set -euo pipefail
          python -m commander_lab.optimizer_v2_cli preflight \
            --manifest artifacts/rogshai-first-optimizer-v2/manifest.json \
            | tee artifacts/rogshai-first-optimizer-v2/preflight.json

      - name: Exploratory adaptive search
        run: |
          set -euo pipefail
          python -m commander_lab.optimizer_v2_cli run \
            --manifest artifacts/rogshai-first-optimizer-v2/manifest.json \
            --output-dir artifacts/rogshai-first-optimizer-v2 \
            --workers 4 \
            --max-turns 35 \
            | tee artifacts/rogshai-first-optimizer-v2/exploratory-cli.json

      - name: Confirmatory evaluation
        run: |
          set -euo pipefail
          python -m commander_lab.optimizer_v2_cli confirm \
            --manifest artifacts/rogshai-first-optimizer-v2/manifest.json \
            --frontier artifacts/rogshai-first-optimizer-v2/frontier-handoff.json \
            --output-dir artifacts/rogshai-first-optimizer-v2 \
            --workers 4 \
            --max-turns 35 \
            | tee artifacts/rogshai-first-optimizer-v2/confirmatory-cli.json

      - name: Open sealed holdout after confirmatory only
        run: |
          set -euo pipefail
          python -m commander_lab.optimizer_v2_cli holdout \
            --manifest artifacts/rogshai-first-optimizer-v2/manifest.json \
            --confirmatory artifacts/rogshai-first-optimizer-v2/confirmatory-report.json \
            --output-dir artifacts/rogshai-first-optimizer-v2 \
            --authorize-holdout \
            --workers 4 \
            --max-turns 35 \
            | tee artifacts/rogshai-first-optimizer-v2/holdout-cli.json

      - name: Build campaign summary and checksums
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/rogshai-first-optimizer-v2')
          summary = {
              'run_dir': str(root),
              'files': sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()),
          }
          for name in (
              'optimizer-search-report.json',
              'frontier-handoff.json',
              'confirmatory-report.json',
              'holdout-report.json',
          ):
              p = root / name
              if p.exists():
                  summary[name] = json.loads(p.read_text(encoding='utf-8'))
          (root / 'CAMPAIGN_SUMMARY.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY
          find artifacts/rogshai-first-optimizer-v2 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/rogshai-first-optimizer-v2/SHA256SUMS

      - name: Verify no tracked/canonical mutation
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=no | tee artifacts/rogshai-first-optimizer-v2/GIT_STATUS_AFTER.txt
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: rogshai-first-optimizer-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/rogshai-first-optimizer-v2/
          if-no-files-found: error
          retention-days: 30
