name: J P0 Formatter Transport

on:
  push:
    branches:
      - roadmap/j-p0-integrity-run-identity

permissions:
  contents: write

jobs:
  apply-verified-formatter-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact locally verified Ruff formatter patch and self-remove
        shell: bash
        env:
          EXPECTED_PARENT: 5778fd747e1079adedecf1dd2c95ca2720bb386e
          EXPECTED_FINAL_TREE: 1e35d2fc612eba200c17c2837e0e7f73afe95b59
          PATCH_SHA256: bf3bdb28ffbb1d36289a0891498488869e114009221141c15ee511070518b839
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/jp0-format.patch
          echo "$PATCH_SHA256  /tmp/jp0-format.patch" | sha256sum -c -
          git apply --check /tmp/jp0-format.patch
          git apply /tmp/jp0-format.patch
          git rm .github/workflows/j-p0-formatter-transport.yml
          git add src/commander_lab/cli/app.py src/commander_lab/models/run_identity.py src/commander_lab/tools/service.py
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_FINAL_TREE"
          git config user.name "commander-playtest-lab automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(J-P0): converge with Ruff formatter"
          git push origin HEAD:roadmap/j-p0-integrity-run-identity
