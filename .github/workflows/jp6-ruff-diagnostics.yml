name: J-P6 Ruff Diagnostics
on:
  push:
    branches: [roadmap/j-p6-performance-hardening]
    paths: [.github/workflows/jp6-ruff-diagnostics.yml]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - shell: bash
        run: |
          mkdir -p artifacts/j_p6
          set +e
          ruff check . > artifacts/j_p6/ruff-check.txt 2>&1
          echo $? > artifacts/j_p6/ruff-check.exit
          ruff format --check . > artifacts/j_p6/ruff-format.txt 2>&1
          echo $? > artifacts/j_p6/ruff-format.exit
          exit 0
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: jp6-ruff-diagnostics-${{ github.sha }}
          path: artifacts/j_p6/ruff-*
          if-no-files-found: error
