name: Repository Tree Integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

# Every push and every PR edit (title, body, base) starts a run; only the
# newest one per pull request can describe the tree that will merge.
concurrency:
  group: repository-tree-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  repository-tree-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted base code is checked out/installed/executed. Candidate Git
      # objects are fetched as data and never checked out, imported or built.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install trusted base tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Inspect candidate objects without executing candidate code
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          python scripts/verify_repository_tree.py --head "$CANDIDATE_SHA"
