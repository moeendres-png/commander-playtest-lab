name: Repository Tree Integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  repository-tree-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted base code is checked out/installed/executed. Candidate Git
      # objects are fetched as data and never checked out, imported or built.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.12'
      - name: Install trusted base tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Inspect candidate objects without executing candidate code
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          python scripts/verify_repository_tree.py --head "$CANDIDATE_SHA"
