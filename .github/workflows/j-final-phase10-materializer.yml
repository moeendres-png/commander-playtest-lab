name: J-FINAL Phase10 Truth Materializer

on:
  push:
    branches:
      - j-final/rogshai-scope-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: j-final/rogshai-scope-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize bounded Phase 10 truth repair
        run: python scripts/j_final_phase10_scope_materialize.py
      - name: Commit materialized changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Phase 10 materialized changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commander_lab/acceptance/phase10.py tests/unit/test_phase12_16_optimizer.py
          git diff --cached --check
          git commit -m "J-FINAL: materialize Phase 10 RogShai truth repair"
          git push origin HEAD:j-final/rogshai-scope-repair
