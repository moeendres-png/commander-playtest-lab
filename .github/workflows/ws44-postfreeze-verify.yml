name: WS44 v1.0.4 independent post-freeze verification

on:
  push:
    branches:
      - ws44/v1.0.4-authority-reconciliation-freeze
    paths:
      - .github/workflows/ws44-postfreeze-verify.yml

permissions:
  contents: write

jobs:
  independent-postfreeze-verification:
    runs-on: ubuntu-latest
    env:
      WS44_FREEZE_COMMIT: 117ff5eb9195cd6428861c666c2281e8ecaf28af
      WS44_FREEZE_RUN_ID: '34049251543'
      WS44_FREEZE_ARTIFACT_ID: '9994037253'
      WS44_FREEZE_ARTIFACT_DIGEST: sha256:873cfaded79c892a954f312cb08ab2813c706ecf0dd850ff39ee6d4da7f8ab9e
    steps:
      - name: Checkout complete history after persistent freeze
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable canonical namespace survived post-freeze commit
        run: |
          set -euo pipefail
          git cat-file -e "$WS44_FREEZE_COMMIT^{commit}"
          freeze_tree="$(git show -s --format=%T "$WS44_FREEZE_COMMIT")"
          freeze_ns="$(git rev-parse "$WS44_FREEZE_COMMIT:qualification/ws44")"
          current_ns="$(git rev-parse "HEAD:qualification/ws44")"
          test "$freeze_ns" = "$current_ns"
          echo "WS44_FREEZE_TREE=$freeze_tree" >> "$GITHUB_ENV"
          echo "WS44_FREEZE_NAMESPACE_TREE=$freeze_ns" >> "$GITHUB_ENV"
          echo "WS44_VERIFICATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WS44_VERIFICATION_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "WS44_VERIFICATION_NAMESPACE_TREE=$current_ns" >> "$GITHUB_ENV"
          echo "Frozen namespace tree: $freeze_ns"

      - name: Compile independent regeneration implementation
        run: |
          python -m py_compile scripts/ws44_build_successor.py scripts/ws44_build_successor_v2.py scripts/ws44_test_referential_integrity.py

      - name: Independently regenerate from detached predecessor authority
        run: |
          set -euo pipefail
          rm -rf /tmp/ws44-postfreeze
          mkdir -p /tmp/ws44-postfreeze
          python scripts/ws44_build_successor_v2.py --output /tmp/ws44-postfreeze

      - name: Byte-compare checked-in freeze against independent regeneration
        run: |
          set -euo pipefail
          diff -ru qualification/ws44 /tmp/ws44-postfreeze

      - name: Verify sealed SHA256 manifest
        run: |
          set -euo pipefail
          cd qualification/ws44
          sha256sum -c WS44_SHA256SUMS

      - name: Validate frozen v1.0.4 materialization against frozen JSON Schema
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          root = Path('qualification/ws44')
          schema = json.loads((root / 'SEMANTIC_FIXTURE_SCHEMA_v1_0_4.json').read_text(encoding='utf-8'))
          materialization = json.loads((root / 'SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json').read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator.check_schema(schema)
          errors = sorted(jsonschema.Draft202012Validator(schema).iter_errors(materialization), key=lambda e: list(e.absolute_path))
          if errors:
              for e in errors[:50]:
                  print(f"schema error at {list(e.absolute_path)}: {e.message}")
              raise SystemExit(f"WS44 schema validation failed with {len(errors)} errors")
          assert schema['properties']['schema_version']['const'] == 'commander-lab.semantic-fixture-materialization/1.0.4'
          assert schema['$defs']['record']['properties']['materialization_version']['const'] == 'commander-lab.semantic-fixture-materialization/1.0.4'
          assert 'supersedes' in schema['properties']
          print('WS44 Draft 2020-12 schema validation PASS')
          PY

      - name: Re-run referential-integrity regression suite
        run: |
          python scripts/ws44_test_referential_integrity.py /tmp/ws44-postfreeze/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json

      - name: Assert complete terminal gate facts
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('qualification/ws44')
          ref = json.loads((root/'WS44_REFERENTIAL_INTEGRITY_AUDIT_135.json').read_text())
          sem = json.loads((root/'WS44_SEMANTIC_EXECUTABILITY_REPORT_135.json').read_text())
          den = json.loads((root/'WS44_PROVIDER_DENOMINATOR_107.json').read_text())
          lin = json.loads((root/'WS44_DIGEST_LINEAGE.json').read_text())
          val = json.loads((root/'WS44_VALIDATION.json').read_text())
          mat = json.loads((root/'SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json').read_text())
          assert ref['terminal_status'] == 'PASS' and ref['record_count'] == 135 and ref['defect_count'] == 0
          assert sem['terminal_status'] == 'PASS' and sem['semantic_executable_count'] == 135 and sem['contract_defect_count'] == 0
          assert den['provider_denominator_count'] == 107 and den['predecessor_identity_set_equal'] is True
          assert lin['obligation_changed_count'] == 0
          assert val['provider_runtime_executed'] is False
          assert val['provider_pass_imported'] is False
          assert val['AF07_GRANTED'] is False
          assert val['ARCHITECTURE_FREEZE'] is False
          assert all(v == 'PASS' for v in val['static_gates'].values())
          mat_sha = hashlib.sha256((root/'SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json').read_bytes()).hexdigest()
          assert lin['successor']['materialization_sha256'] == mat_sha
          assert lin['successor']['canonical_bundle_digest'] == mat['canonical_bundle_digest']
          print('WS44 complete terminal gate facts PASS')
          PY

      - name: Persist post-freeze attestation and terminal gate result
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('qualification/ws44')
          out = Path('candidate-qualification/ws44-v1.0.4-authority')
          out.mkdir(parents=True, exist_ok=True)
          mat_path = root/'SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json'
          mat = json.loads(mat_path.read_text())
          lin = json.loads((root/'WS44_DIGEST_LINEAGE.json').read_text())
          att = {
              'artifact_version': 'commander-lab.ws44-postfreeze-attestation/1.0.0',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'verification_input_commit': os.environ['WS44_VERIFICATION_COMMIT'],
              'verification_input_tree': os.environ['WS44_VERIFICATION_TREE'],
              'persistent_freeze_commit': os.environ['WS44_FREEZE_COMMIT'],
              'persistent_freeze_tree': os.environ['WS44_FREEZE_TREE'],
              'persistent_freeze_namespace_tree': os.environ['WS44_FREEZE_NAMESPACE_TREE'],
              'verification_namespace_tree': os.environ['WS44_VERIFICATION_NAMESPACE_TREE'],
              'namespace_tree_byte_identity': os.environ['WS44_FREEZE_NAMESPACE_TREE'] == os.environ['WS44_VERIFICATION_NAMESPACE_TREE'],
              'pre_freeze_double_materialization_run_id': int(os.environ['WS44_FREEZE_RUN_ID']),
              'pre_freeze_artifact_id': int(os.environ['WS44_FREEZE_ARTIFACT_ID']),
              'pre_freeze_artifact_digest': os.environ['WS44_FREEZE_ARTIFACT_DIGEST'],
              'independent_regeneration_source_mode': 'DETACHED_EXACT_GIT_OBJECT_VIA_GIT_SHOW',
              'independent_regeneration': 'PASS',
              'checked_in_byte_equality': 'PASS',
              'sealed_sha256_manifest': 'PASS',
              'draft_2020_12_schema_validation': 'PASS',
              'referential_integrity_regressions': 'PASS',
              'materialization_sha256': hashlib.sha256(mat_path.read_bytes()).hexdigest(),
              'canonical_bundle_digest': mat['canonical_bundle_digest'],
              'obligation_changed_count': lin['obligation_changed_count'],
              'G44_13': 'PASS',
              'G44_15': 'PASS',
              'provider_runtime_executed': False,
              'provider_pass_imported': False,
              'AF07_GRANTED': False,
              'ARCHITECTURE_FREEZE': False,
              'terminal_status': 'PASS',
          }
          gate = {
              'artifact_version': 'commander-lab.ws44-terminal-gates/1.0.0',
              'gates': {f'G44-{i:02d}': 'PASS' for i in range(1,16)},
              'WS44': 'COMPLETE / PASS_SUCCESSOR_CONTRACT_V1_0_4_FREEZE',
              'SUCCESSOR_CONTRACT_FROZEN': True,
              'provider_runtime_executed': False,
              'provider_pass_imported': False,
              'AF07_GRANTED': False,
              'ARCHITECTURE_FREEZE': False,
              'evidence': {
                  'persistent_freeze_commit': os.environ['WS44_FREEZE_COMMIT'],
                  'persistent_freeze_namespace_tree': os.environ['WS44_FREEZE_NAMESPACE_TREE'],
                  'postfreeze_workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              },
          }
          (out/'WS44_POSTFREEZE_ATTESTATION.json').write_text(json.dumps(att,sort_keys=True,separators=(',',':'))+'\n')
          (out/'WS44_TERMINAL_GATE_RESULT.json').write_text(json.dumps(gate,sort_keys=True,separators=(',',':'))+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-qualification/ws44-v1.0.4-authority/WS44_POSTFREEZE_ATTESTATION.json candidate-qualification/ws44-v1.0.4-authority/WS44_TERMINAL_GATE_RESULT.json
          git commit -m "ws44: persist independent post-freeze verification"
          git push origin HEAD:ws44/v1.0.4-authority-reconciliation-freeze

      - name: Upload independent post-freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws44-v104-postfreeze-${{ github.run_id }}
          path: |
            qualification/ws44
            candidate-qualification/ws44-v1.0.4-authority/WS44_POSTFREEZE_ATTESTATION.json
            candidate-qualification/ws44-v1.0.4-authority/WS44_TERMINAL_GATE_RESULT.json
          if-no-files-found: error
