name: J-P1 Final Strict Quality Candidate v9

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  validate-final-quality-candidate-v9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact starting lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "75d01b97d5a501cc7ddb15eea8177cd415e711cb"
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Replay v8 strict-quality candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/j-p1-final-quality-bootstrap-v8.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['validate-final-quality-candidate-v8']['steps']
          for step_name in ('Replay fully Ruff-clean v7 candidate', 'Apply exact final Mypy fixes'):
              run = next(step['run'] for step in steps if step.get('name') == step_name)
              completed = subprocess.run(['bash', '-c', run], text=True)
              if completed.returncode:
                  raise SystemExit(completed.returncode)
          PY
      - name: Narrow concrete counterfactual and diagnostic helper types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/commander_lab/tools/service.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from typing import Any, Literal, cast'
          new_import = 'from typing import TYPE_CHECKING, Any, Literal, cast'
          if old_import not in text:
              raise SystemExit('service typing import marker missing')
          text = text.replace(old_import, new_import, 1)

          marker = 'from .candidates import load_candidate_profiles, load_canonical_inventory_quantities\n'
          type_block = '''from .candidates import load_candidate_profiles, load_canonical_inventory_quantities\n\nif TYPE_CHECKING:\n    from commander_lab.counterfactual import CounterfactualReplayLab\n    from commander_lab.diagnostics import DecisionDiagnosticEngine\n'''
          if marker not in text:
              raise SystemExit('service candidates import marker missing')
          text = text.replace(marker, type_block, 1)

          replacements = {
              '    def _counterfactual_lab(self) -> Any:\n': '    def _counterfactual_lab(self) -> CounterfactualReplayLab:\n',
              '    def _diagnostic_engine(self) -> Any:\n': '    def _diagnostic_engine(self) -> DecisionDiagnosticEngine:\n',
              '            payload = cast(dict[str, Any], lab.export_fixture(branch, target))\n': '            payload = lab.export_fixture(branch, target)\n',
              '            return cast(dict[str, Any], DecisionDiagnosticEngine.next_experiment(diagnosis))\n': '            return DecisionDiagnosticEngine.next_experiment(diagnosis)\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected dynamic helper fragment missing: {old.strip()}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          ruff check . --fix
          ruff format .
          git rm .github/workflows/j-p1-final-quality-bootstrap-v9.yml
          git add -A
          git diff --cached --check
      - name: Blocking Ruff lint
        run: ruff check .
      - name: Blocking Ruff format
        run: ruff format --check .
      - name: Blocking Mypy strict
        run: mypy src/commander_lab
      - name: Commit final strict-quality candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(J-P1): close whole-tree Ruff and strict typing debt"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Compile clean candidate
        run: python -m compileall -q src tests scripts
      - name: Test clean candidate
        run: pytest -q
      - name: Push only fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:roadmap/j-p1-reliability
