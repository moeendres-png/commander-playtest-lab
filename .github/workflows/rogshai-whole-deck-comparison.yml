name: RogShai Whole-Deck Comparison

on:
  pull_request:
    paths:
      - "data/decks/candidates/rogshai_final_recommended_2026-08-20.json"
      - "scripts/run_rogshai_whole_deck_comparison.py"
      - ".github/workflows/rogshai-whole-deck-comparison.yml"
  workflow_dispatch:
    inputs:
      games:
        description: Primary paired 4P scenarios
        required: true
        default: "32"
        type: choice
        options:
          - "32"
          - "128"
          - "256"
      holdout_games:
        description: Separate paired holdout scenarios
        required: true
        default: "16"
        type: choice
        options:
          - "16"
          - "32"
          - "64"

permissions:
  contents: read

concurrency:
  group: rogshai-whole-deck-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  paired-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIMARY_GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '32' }}
      HOLDOUT_GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.holdout_games || '16' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Snapshot canonical RogShai truth
        shell: bash
        run: |
          sha256sum data/decks/manifest.json data/decks/rogshai_current.json > /tmp/rogshai-canonical-before.sha256
          git diff --exit-code -- data/decks/manifest.json data/decks/rogshai_current.json
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Whole-Deck contracts
        run: >-
          pytest -q
          tests/unit/test_balanced_pod_scheduler.py
          tests/unit/test_current_model_resolution.py
          tests/unit/test_current_opponent_repository.py
          tests/unit/test_structural_simulator.py
          tests/unit/test_whole_deck_balanced_campaign.py
          tests/unit/test_whole_deck_campaign_orchestrator.py
          tests/unit/test_whole_deck_search_integration.py
          tests/unit/test_whole_deck_search_hard_gate.py
          tests/unit/test_whole_deck_public_integration.py
      - name: Lint comparison runner
        run: ruff check scripts/run_rogshai_whole_deck_comparison.py
      - name: Run preregistered paired Whole-Deck campaign
        run: |
          python scripts/run_rogshai_whole_deck_comparison.py \
            --root . \
            --games "$PRIMARY_GAMES" \
            --holdout-games "$HOLDOUT_GAMES" \
            --seed 20260820 \
            --max-turns 35 \
            --workers 2
      - name: Verify canonical RogShai truth unchanged
        shell: bash
        if: always()
        run: |
          sha256sum --check /tmp/rogshai-canonical-before.sha256
          git diff --exit-code -- data/decks/manifest.json data/decks/rogshai_current.json
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify comparison artifacts
        if: success()
        run: |
          test -f artifacts/rogshai_whole_deck_comparison/run_manifest.json
          test -f artifacts/rogshai_whole_deck_comparison/scenario_matrix.json
          test -f artifacts/rogshai_whole_deck_comparison/paired_results.json
          test -f artifacts/rogshai_whole_deck_comparison/holdout_results.json
          test -f artifacts/rogshai_whole_deck_comparison/summary.md
          test -f artifacts/rogshai_whole_deck_comparison/sha256sums.txt
          (cd artifacts/rogshai_whole_deck_comparison && sha256sum --check sha256sums.txt)
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: rogshai-whole-deck-comparison-${{ github.sha }}
          path: artifacts/rogshai_whole_deck_comparison/
          if-no-files-found: warn
          retention-days: 14
