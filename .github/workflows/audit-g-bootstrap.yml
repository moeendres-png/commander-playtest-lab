name: Audit G Bootstrap Apply

on:
  push:
    branches:
      - audit/g-modeling-data-quality

permissions:
  contents: write

jobs:
  apply-frozen-g:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify and apply frozen G patch
        shell: bash
        run: |
          set -euo pipefail

          cat .g-bootstrap/part{00..05}.b64 .g-bootstrap/rem{00..17}.b64 > /tmp/g.patch.xz.b64
          base64 --decode /tmp/g.patch.xz.b64 > /tmp/g.patch.xz
          echo "5bda00cc596ecd9246ee35c75070445ae5c6e3f510235baf7269e1d5e2954069  /tmp/g.patch.xz" | sha256sum -c -
          xz -dc /tmp/g.patch.xz > /tmp/g.patch

          git apply --check /tmp/g.patch
          git apply /tmp/g.patch

          rm -rf .g-bootstrap
          rm .github/workflows/audit-g-bootstrap.yml
          git diff --check

          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          done <<'EOF'
          e737104ea024c7cdf2e6ac1fe879a3c148b86e56 artifacts/audit/G_BASELINE_DECISION_EVAL.json
          a3cd24fe8111da776c0e35e322c28b35c54de581 artifacts/audit/G_GAP_REGISTER.json
          f2f99d296a969e61dae9909f4b1992157f0f93bb artifacts/audit/G_HOLDOUT_EVAL_RESULTS.json
          ef76f5316ef68f164b31d5b30c26ed3b7f7cb209 artifacts/audit/G_LOCAL_VALIDATION.json
          d036ec4f7a0e65cb82139c0a707c72ff22270460 data/cards/structural_role_profiles.json
          8106318c95749200fad1ad3b3387c36934071589 data/decks/opponents/kaervek/current/roles.json
          0358820665a8ed1a3d003f2b89120a7ea164a996 data/evals/golden/pilot_decisions_g.json
          5dd17af689b43687cde86ba9d708cf2d27c412bb data/evals/holdout/pilot_decisions_g.json
          64c6aff2cf4395c9cd58f22cad6ec69fa3b0c1f2 data/opponents/current_structural_profiles.json
          fc70c9c799b18683ba3284bdee05e669328e1b4c docs/CARD_COVERAGE_CURRENT.md
          169dfda950f12b15edce2b42a207e5006210a541 docs/META_KB_REFRESH_REPORT.md
          7720598c6e8f2c70db82b66a1d728f14f5a318ad docs/MODELING_IMPROVEMENT_REPORT.md
          2f219062d215c37fe403e7b1954964390f9d108f docs/PILOT_GOLDEN_SCENARIOS.md
          78a45110b62237805cd27fda523d3d77102f2e4a src/commander_lab/agents/pilots.py
          f71d13ddd1180c97fe5b24aed9c874fd3326d213 src/commander_lab/engine/structural/fixtures.py
          1778e1fab3703081eeea78140c9c4ec957534f72 src/commander_lab/engine/structural/profiles.py
          2d90886d19ab450145b82815ae960e5a25553efe src/commander_lab/engine/structural/simulator.py
          07a4e270c32e83d005cf7ca575e7dd33af1e9ca7 src/commander_lab/evals/golden.py
          a42656d0a1d17cf5dbceee26e6f08709a9e67299 src/commander_lab/evals/models.py
          526c281e7e588304f1bae96de9a47c539e6a91f3 src/commander_lab/models/__init__.py
          b5b996c30eb6c152380b020e1069a9a7319faf8f src/commander_lab/models/meta.py
          7bf7858a11b9405b938290de474ce28629745fac src/commander_lab/models/pilots.py
          8765b644f301d7944f1c0e543e9c97398d71c4b7 src/commander_lab/models/roles.py
          9050cbcc362785aeefb169b593bbc83752c994ac src/commander_lab/models/structural.py
          813778b89427e44b2eef3911f9c840f6f7bb457a tests/golden/test_g_decision_quality.py
          c682481efa1b8d98f4c0b134391615e1db1584e6 tests/unit/test_g_modeling_quality.py
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(G): improve structural decision quality"

          cat > /tmp/expected-files <<'EOF'
          artifacts/audit/G_BASELINE_DECISION_EVAL.json
          artifacts/audit/G_GAP_REGISTER.json
          artifacts/audit/G_HOLDOUT_EVAL_RESULTS.json
          artifacts/audit/G_LOCAL_VALIDATION.json
          data/cards/structural_role_profiles.json
          data/decks/opponents/kaervek/current/roles.json
          data/evals/golden/pilot_decisions_g.json
          data/evals/holdout/pilot_decisions_g.json
          data/opponents/current_structural_profiles.json
          docs/CARD_COVERAGE_CURRENT.md
          docs/META_KB_REFRESH_REPORT.md
          docs/MODELING_IMPROVEMENT_REPORT.md
          docs/PILOT_GOLDEN_SCENARIOS.md
          src/commander_lab/agents/pilots.py
          src/commander_lab/engine/structural/fixtures.py
          src/commander_lab/engine/structural/profiles.py
          src/commander_lab/engine/structural/simulator.py
          src/commander_lab/evals/golden.py
          src/commander_lab/evals/models.py
          src/commander_lab/models/__init__.py
          src/commander_lab/models/meta.py
          src/commander_lab/models/pilots.py
          src/commander_lab/models/roles.py
          src/commander_lab/models/structural.py
          tests/golden/test_g_decision_quality.py
          tests/unit/test_g_modeling_quality.py
          EOF

          git diff --name-only origin/main...HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:audit/g-modeling-data-quality
