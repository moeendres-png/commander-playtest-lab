name: XMage Full Game Conformance

# WS223 cardinality lane (merge-relevant): live production full-game startup
# and lifecycle smoke for 2P/3P/4P/5P plus 6P fail-closed.
#
# Cost bound (by design, see CI_IMPACT_MAP): one XMage build + one bridge
# build per run; JVM executions are 3 bounded smokes (25 decisions each) + 1
# full 4P game-over/replay pair + 6P fail-closed with no engine. Single job,
# sequential steps, shared build artifacts — no matrix-build multiplication.
# WS218 trigger adjudication: `src/commander_lab/semantic_replay/**`-only
# changes ride the light `ci.yml` lane and must NOT be added here.

on:
  pull_request:
    paths:
      - "engine-bridge/**"
      - "src/commander_lab/engine/rules/full_game.py"
      - "src/commander_lab/engine/rules/full_game_batch.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/models/pilots.py"
      - "src/commander_lab/candidates/models.py"
      - "artifacts/xmage-full-game/**"
      - "tests/unit/test_xmage_full_game.py"
      - "tests/unit/test_xmage_variable_player.py"
      - "tests/unit/test_ws223_cardinality_regression.py"
      - "scripts/generate_full_game_contract_artifacts.py"
      - "scripts/run_external_full_game_conformance.py"
      - "scripts/write_environment_receipt.py"
      - "requirements/lock.txt"
      - ".github/workflows/xmage-full-game-conformance.yml"
  push:
    branches: [main]
    paths:
      - "engine-bridge/**"
      - "src/commander_lab/engine/rules/full_game.py"
      - "src/commander_lab/engine/rules/full_game_batch.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/models/pilots.py"
      - "src/commander_lab/candidates/models.py"
      - "artifacts/xmage-full-game/**"
      - "tests/unit/test_xmage_full_game.py"
      - "tests/unit/test_xmage_variable_player.py"
      - "tests/unit/test_ws223_cardinality_regression.py"
      - "scripts/generate_full_game_contract_artifacts.py"
      - "scripts/run_external_full_game_conformance.py"
      - "scripts/write_environment_receipt.py"
      - "requirements/lock.txt"
      - ".github/workflows/xmage-full-game-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  XMAGE_COMMIT: db134b9737e951367d65ef5806ad986319cc73ab
  PYTHONHASHSEED: "0"
  COMMANDER_LAB_XMAGE_FULL_GAME_BRIDGE_CMD: >-
    java -jar ${{ github.workspace }}/engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar full-game

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout pinned XMage
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/lock.txt
            pyproject.toml
      - name: Verify immutable XMage pin
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"
      - name: Build pinned XMage
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          if test -x ./mvnw; then ./mvnw -B -ntp -DskipTests install; else mvn -B -ntp -DskipTests install; fi
      - name: Install lab from transitive hash-pinned lock
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Write environment receipt
        run: python scripts/write_environment_receipt.py --lane cardinality-conformance --output artifacts/xmage-full-game/ENVIRONMENT_RECEIPT.json
      - name: Generate versioned full-game contracts
        run: python scripts/generate_full_game_contract_artifacts.py
      - name: Run focused Python full-game tests
        run: pytest -q tests/unit/test_xmage_full_game.py tests/unit/test_xmage_variable_player.py tests/unit/test_ws223_cardinality_regression.py
      - name: Build and verify XMage bridge including full-game contract tests
        working-directory: engine-bridge
        run: mvn -B -ntp verify
      - name: Run bounded 2P lifecycle smoke
        run: python scripts/run_external_full_game_conformance.py --player-count 2 --smoke-decisions 25
      - name: Run bounded 3P lifecycle smoke
        run: python scripts/run_external_full_game_conformance.py --player-count 3 --smoke-decisions 25
      - name: Run bounded 5P lifecycle smoke
        run: python scripts/run_external_full_game_conformance.py --player-count 5 --smoke-decisions 45
      - name: Run real seeded 4P game-over and replay conformance
        run: python scripts/run_external_full_game_conformance.py
      - name: Prove 6P fails closed without launching an engine
        run: python scripts/run_external_full_game_conformance.py --player-count 6 --expect-fail-closed
      - name: Verify technical-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/xmage-full-game')
          conformance = json.loads((root / 'XMAGE_FULL_GAME_CONFORMANCE.json').read_text())
          replay = json.loads((root / 'XMAGE_FULL_GAME_REPLAY_GATE.json').read_text())
          hidden = json.loads((root / 'HIDDEN_INFORMATION_BOUNDARY_REPORT.json').read_text())
          invariant = json.loads((root / 'ARCHITECTURE_INVARIANT_REPORT.json').read_text())
          assert conformance['evidence_class'] == 'technical_conformance_only'
          assert conformance['consumed_gameplay_evidence'] is False
          assert conformance['holdout_consumed'] is False
          assert conformance['official_campaign_eligible'] is False
          assert conformance['rules_authority'] == 'xmage'
          assert conformance['decision_authority'] == 'commander_lab_external_pilots'
          assert conformance['structural_authority'] is False
          assert conformance['tactical_authority'] is False
          assert conformance['fallback_used'] is False
          assert replay['semantic_replay_match'] is True
          assert replay['bit_exact_replay_validated'] is False
          assert hidden['status'] == 'PASS'
          assert invariant['random_or_default_discretionary_fallback'] is False
          assert invariant['canonical_data_mutated'] is False
          for count in (2, 3, 5):
              smoke = json.loads((root / f'XMAGE_FULL_GAME_SMOKE_{count}P.json').read_text())
              assert smoke['status'] == 'PASS', count
              assert smoke['mode'] == 'bounded_smoke', count
              assert smoke['player_count'] == count, count
              assert smoke['seed_preserved'] is True, count
              assert smoke['player_count_preserved'] is True, count
              assert smoke['decision_count'] >= smoke['smoke_decision_target'], count
              assert 'mulligan' in smoke['observed_decision_classes'], count
              assert 'priority' in smoke['observed_decision_classes'], count
              assert smoke['unsupported_callback_seen'] is False, count
              assert smoke['clean_shutdown'] is True, count
          closed = json.loads((root / 'XMAGE_FULL_GAME_FAIL_CLOSED_6P.json').read_text())
          assert closed['status'] == 'FAIL_CLOSED'
          assert closed['player_count'] == 6
          assert closed['engine_launched'] is False
          PY
      - name: Record test validation and checksums
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/xmage-full-game
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('artifacts/xmage-full-game/TEST_VALIDATION_REPORT.json')
          payload = {
              'schema_version': 'xmage-full-game-test-validation-1.0.0',
              'lab_commit': os.environ.get('GITHUB_SHA'),
              'xmage_commit': os.environ['XMAGE_COMMIT'],
              'operational_pod_size': 4,
              'cardinality_smoke_counts': [2, 3, 5],
              'unsupported_cardinality_fail_closed': [6],
              'rules_authority': 'xmage',
              'decision_authority': 'commander_lab_external_pilots',
              'evidence_class': 'technical_conformance_only',
              'official_gameplay_evidence_consumed': False,
              'holdout_consumed': False,
              'canonical_data_mutated': False,
              'workflow': 'XMage Full Game Conformance',
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          find artifacts/xmage-full-game -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > artifacts/xmage-full-game/SHA256SUMS || true
      - name: Upload full-game technical conformance evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: xmage-full-game-conformance-${{ github.sha }}
          path: artifacts/xmage-full-game/
          if-no-files-found: error
