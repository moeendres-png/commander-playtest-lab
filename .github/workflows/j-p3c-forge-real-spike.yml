name: J-P3C Forge Real Spike

on:
  push:
    branches:
      - roadmap/j-p3c-forge-real-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-real-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORGE_REPO: https://github.com/Card-Forge/forge.git
      FORGE_COMMIT: a37a865a53280dd8ad6fad3384d69611e8c5a42f
      CONTRACT_HASH: 89e0813ec66787328dd4b204f57cb5c404694dec29d249fbbb8785fad0a6d2c6
      SCORING_HASH: 67bc2d99e604f22c3a0d6cc3e00682fe9ac5cb86faccae979418eb2cf40d6227
      FIXTURE_HASH: cfea9c136b9126c4d367b0c91ebfe4089a47490c7d60dfae5e78dd307eb47dbb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Record host and frozen identities
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_FORGE_RAW_EVIDENCE/{acquisition,build,runtime,decks,states,legal_actions,submitted_actions,rejections,events,fixtures,replay_or_trace,failures,controller}
          {
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "runner_os=$RUNNER_OS"
            echo "arch=$(uname -m)"
            uname -a
            java -version 2>&1
            mvn -version 2>&1
          } | tee J_P3_FORGE_RAW_EVIDENCE/runtime/host.txt
          {
            echo "contract_hash=$CONTRACT_HASH"
            echo "scoring_hash=$SCORING_HASH"
            echo "fixture_hash=$FIXTURE_HASH"
            echo "forge_repo=$FORGE_REPO"
            echo "forge_commit=$FORGE_COMMIT"
          } | tee J_P3_FORGE_RAW_EVIDENCE/frozen-identities.txt

      - name: Acquire exact Forge source
        shell: bash
        run: |
          set -eu
          git clone --no-checkout "$FORGE_REPO" forge-provider > J_P3_FORGE_RAW_EVIDENCE/acquisition/git-clone.log 2>&1
          cd forge-provider
          git checkout --detach "$FORGE_COMMIT" >> ../J_P3_FORGE_RAW_EVIDENCE/acquisition/git-clone.log 2>&1
          ACTUAL=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          TAGS=$(git tag --points-at HEAD | tr '\n' ' ')
          printf 'requested_commit=%s\nactual_commit=%s\ntree=%s\ntags=%s\n' "$FORGE_COMMIT" "$ACTUAL" "$TREE" "$TAGS" | tee ../J_P3_FORGE_RAW_EVIDENCE/acquisition/provider-identity.txt
          test "$ACTUAL" = "$FORGE_COMMIT"
          git status --porcelain=v1 | tee ../J_P3_FORGE_RAW_EVIDENCE/acquisition/provider-git-status.txt
          sha256sum pom.xml forge-gui-desktop/src/main/java/forge/view/Main.java forge-gui-desktop/src/main/java/forge/view/SimulateMatch.java forge-game/src/main/java/forge/game/player/RegisteredPlayer.java > ../J_P3_FORGE_RAW_EVIDENCE/acquisition/primary-source-sha256.txt

      - name: Build real Forge desktop/runtime modules
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd forge-provider
          mvn -B -DskipTests -pl forge-gui-desktop -am package > ../J_P3_FORGE_RAW_EVIDENCE/build/maven-build.log 2>&1
          RC=$?
          echo "$RC" > ../J_P3_FORGE_RAW_EVIDENCE/build/exit-code.txt
          find forge-gui-desktop/target -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort > ../J_P3_FORGE_RAW_EVIDENCE/build/artifacts.txt || true
          tail -n 160 ../J_P3_FORGE_RAW_EVIDENCE/build/maven-build.log
          exit "$RC"

      - name: Configure isolated Forge profile and Commander decks
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -eu
          PROFILE_ROOT="$GITHUB_WORKSPACE/forge-profile"
          DECK_DIR="$PROFILE_ROOT/decks/commander"
          mkdir -p "$DECK_DIR" "$PROFILE_ROOT/cache" "$PROFILE_ROOT/decks/constructed"
          cat > forge-provider/forge-gui/forge.profile.properties <<EOF
          userDir=$PROFILE_ROOT/
          cacheDir=$PROFILE_ROOT/cache/
          cardPicsDir=$PROFILE_ROOT/cache/pics/cards/
          decksDir=$PROFILE_ROOT/decks/
          decksConstructedDir=$PROFILE_ROOT/decks/constructed/
          EOF
          cat > "$DECK_DIR/rogshai-p3c.dck" <<'EOF'
          [metadata]
          Name=RogShai P3C Probe
          [commander]
          1 Ishai, Ojutai Dragonspeaker
          1 Rograkh, Son of Rohgahh
          [main]
          33 Plains
          33 Island
          32 Mountain
          EOF
          for n in 1 2 3; do
            cp 'forge-provider/forge-gui/res/quest/precons/Timeless Wisdom.dck' "$DECK_DIR/gavi-p3c-$n.dck"
            sed -i "s/^Name=Timeless Wisdom$/Name=Gavi P3C Probe $n/" "$DECK_DIR/gavi-p3c-$n.dck"
          done
          cp "$DECK_DIR"/*.dck J_P3_FORGE_RAW_EVIDENCE/decks/
          printf 'profile_root=%s\ndeck_dir=%s\n' "$PROFILE_ROOT" "$DECK_DIR" > J_P3_FORGE_RAW_EVIDENCE/runtime/profile-paths.txt

      - name: Real four-player Commander process with RogShai and fixed seed
        id: sim
        if: always() && steps.build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          JAR=$(find forge-provider/forge-gui-desktop/target -maxdepth 1 -type f -name '*jar-with-dependencies.jar' | head -n 1)
          echo "$JAR" > J_P3_FORGE_RAW_EVIDENCE/runtime/desktop-jar.txt
          if [ -z "$JAR" ]; then echo 'No desktop assembly jar found' | tee J_P3_FORGE_RAW_EVIDENCE/failures/no-jar.txt; exit 2; fi
          JAR=$(realpath "$JAR")
          cd forge-provider/forge-gui
          START=$(date +%s)
          timeout --signal=TERM --kill-after=10s 120s java -Djava.awt.headless=true -jar "$JAR" sim \
            -d rogshai-p3c.dck gavi-p3c-1.dck gavi-p3c-2.dck gavi-p3c-3.dck \
            -n 1 -f commander -s 424242 -c 45 > "$GITHUB_WORKSPACE/J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run1.log" 2>&1
          RC=$?
          END=$(date +%s)
          printf 'exit_code=%s\nelapsed_seconds=%s\n' "$RC" "$((END-START))" > "$GITHUB_WORKSPACE/J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run1-exit.txt"
          grep -E 'Simulation mode|game of Commander|seed 424242|Game Result|Could not load deck|Exception|ERROR|Error' "$GITHUB_WORKSPACE/J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run1.log" | tail -n 160 || true
          exit "$RC"

      - name: Repeat same seeded Commander run for reproducibility evidence
        id: replay
        if: always() && steps.build.outcome == 'success' && steps.sim.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          JAR=$(realpath "$(cat J_P3_FORGE_RAW_EVIDENCE/runtime/desktop-jar.txt)")
          cd forge-provider/forge-gui
          timeout --signal=TERM --kill-after=10s 120s java -Djava.awt.headless=true -jar "$JAR" sim \
            -d rogshai-p3c.dck gavi-p3c-1.dck gavi-p3c-2.dck gavi-p3c-3.dck \
            -n 1 -f commander -s 424242 -c 45 > "$GITHUB_WORKSPACE/J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run2.log" 2>&1
          RC=$?
          echo "$RC" > "$GITHUB_WORKSPACE/J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run2-exit-code.txt"
          cd "$GITHUB_WORKSPACE"
          sed -E '/Took [0-9]+ ms/d; /Loading.*in [0-9]+/d' J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run1.log > J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/run1-normalized.log
          sed -E '/Took [0-9]+ ms/d; /Loading.*in [0-9]+/d' J_P3_FORGE_RAW_EVIDENCE/runtime/commander-4p-run2.log > J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/run2-normalized.log
          if cmp -s J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/run1-normalized.log J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/run2-normalized.log; then
            echo 'same_seed_normalized_trace_match=true' | tee J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/reproducibility.txt
          else
            echo 'same_seed_normalized_trace_match=false' | tee J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/reproducibility.txt
            diff -u J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/run1-normalized.log J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/run2-normalized.log > J_P3_FORGE_RAW_EVIDENCE/replay_or_trace/normalized.diff || true
          fi
          exit "$RC"

      - name: Record native controller/state/action surfaces at frozen source
        if: always()
        shell: bash
        run: |
          set -eu
          if [ ! -d forge-provider ]; then echo 'Forge source unavailable' > J_P3_FORGE_RAW_EVIDENCE/failures/source-unavailable.txt; exit 0; fi
          cd forge-provider
          grep -RIn --include='*.java' -E 'class PlayerController|abstract class PlayerController|class PlayerControllerAi' forge-game forge-ai forge-gui | head -n 80 > ../J_P3_FORGE_RAW_EVIDENCE/controller/controller-surfaces.txt || true
          grep -RIn --include='*.java' -E 'AvailableActions|chooseSpellAbilityToPlay|playSpellAbility|GameView|GameLog|EventBus|getStack|getPhaseHandler' forge-game forge-ai forge-gui | head -n 240 > ../J_P3_FORGE_RAW_EVIDENCE/controller/state-action-event-surfaces.txt || true
          grep -RIn --include='*.java' -E 'Commander|Partner|commander damage|CommanderDamage|commanderDamage' forge-game forge-ai forge-gui | head -n 240 > ../J_P3_FORGE_RAW_EVIDENCE/controller/commander-surfaces.txt || true

      - name: Summarize evidence and hash manifest
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_FORGE_RAW_EVIDENCE/runtime
          {
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "commander_sim_outcome=${{ steps.sim.outcome }}"
            echo "repeated_seed_outcome=${{ steps.replay.outcome }}"
          } > J_P3_FORGE_RAW_EVIDENCE/runtime/workflow-outcomes.txt
          find J_P3_FORGE_RAW_EVIDENCE -type f ! -name SHA256SUMS.txt ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > J_P3_FORGE_RAW_EVIDENCE/SHA256SUMS.txt
          sha256sum J_P3_FORGE_RAW_EVIDENCE/SHA256SUMS.txt > J_P3_FORGE_RAW_EVIDENCE/MANIFEST_SHA256.txt

      - name: Upload Forge raw evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: J_P3_FORGE_RAW_EVIDENCE
          path: J_P3_FORGE_RAW_EVIDENCE
          if-no-files-found: error
          retention-days: 90
