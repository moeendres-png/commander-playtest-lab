name: Temporary Format Seat Fix

on:
  push:
    branches:
      - fix/structural-seat-symmetry-20260825
    paths:
      - '.github/workflows/tmp-format-seat-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/structural-seat-symmetry-20260825
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.4
      - name: Format exact CI-diff files
        run: |
          ruff format scripts/apply_structural_seat_symmetry_fix.py scripts/audit_structural_seat_symmetry.py src/commander_lab/engine/structural/simulator.py
          ruff format --check scripts/apply_structural_seat_symmetry_fix.py scripts/audit_structural_seat_symmetry.py src/commander_lab/engine/structural/simulator.py
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_structural_seat_symmetry_fix.py scripts/audit_structural_seat_symmetry.py src/commander_lab/engine/structural/simulator.py
          git diff --cached --quiet && exit 0
          git commit -m 'style: apply ruff format to seat-symmetry fix'
          git push origin HEAD:fix/structural-seat-symmetry-20260825
