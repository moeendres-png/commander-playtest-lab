name: Windows Runtime Hygiene

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/unit/test_atomic_storage.py'
      - 'tests/unit/test_runtime_hygiene.py'
      - 'tests/contract/test_phase86_phase85_claims.py'
      - 'tests/integration/test_phase85_validation.py'
      - 'config/**'
      - '.github/workflows/windows-runtime.yml'
      - "tests/conftest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: windows-runtime-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

# WS223 scope exception: the windows lane keeps pyproject.toml range installs (documented, exempt).
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 immutable revision
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and test tools
        shell: pwsh
        run: python -m pip install -e '.[dev,api]'
      - name: Assert clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            Write-Error "Repository is dirty before runtime validation:`n$status"
            exit 1
          }
      - name: Windows filesystem and atomic-storage contracts
        shell: pwsh
        run: python -m pytest -q tests/unit/test_atomic_storage.py tests/unit/test_runtime_hygiene.py
      - name: External-runtime boundary contracts on Windows
        shell: pwsh
        run: python -m pytest -q tests/contract/test_phase86_phase85_claims.py tests/integration/test_phase85_validation.py
      - name: Doctor must not dirty repository
        shell: pwsh
        run: commander-lab doctor --root . | Out-File -Encoding utf8 "$env:RUNNER_TEMP/doctor.json"
      - name: Rules-engine probe must not dirty repository
        shell: pwsh
        run: commander-lab probe-rules-engines --root . | Out-File -Encoding utf8 "$env:RUNNER_TEMP/rules-probe.json"
      - name: Structural validation must not dirty repository
        shell: pwsh
        run: commander-lab validate-structural --iterations 1 --workers 1 --root . | Out-File -Encoding utf8 "$env:RUNNER_TEMP/structural.json"
      - name: Tactical validation must not dirty repository
        shell: pwsh
        run: commander-lab validate-rules-phase8 --output data/runs/ci_phase8_windows --root . | Out-File -Encoding utf8 "$env:RUNNER_TEMP/tactical.json"
      - name: Assert repository remains clean
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            Write-Error "Runtime operations dirtied repository:`n$status"
            exit 1
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
