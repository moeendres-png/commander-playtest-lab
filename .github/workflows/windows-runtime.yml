name: Windows Runtime Hygiene

on:
  push:
    branches: [main]
  pull_request:
    # Package B: one Windows runner for the Windows-specific contracts (atomic storage,
    # runtime hygiene). The paths are the modules these tests execute
    # (scripts/audit_workflow_impact.py proves it), no longer all of src/ and scripts/.
    paths:
      - 'src/commander_lab/__init__.py'
      - 'src/commander_lab/agents/**'
      - 'src/commander_lab/candidates/**'
      - 'src/commander_lab/cards/**'
      - 'src/commander_lab/engine/**'
      - 'src/commander_lab/freeze_readiness.py'
      - 'src/commander_lab/models/**'
      - 'src/commander_lab/semantic_replay/**'
      - 'src/commander_lab/storage/**'
      - 'src/commander_lab/studio/**'
      - 'tests/unit/test_atomic_storage.py'
      - 'tests/unit/test_runtime_hygiene.py'
      - 'tests/unit/test_phase86_atomic_and_integrity.py'
      - 'tests/unit/test_studio_*.py'
      - 'tests/contract/test_phase86_phase85_claims.py'
      - 'tests/integration/test_phase85_validation.py'
      - 'config/**'
      - 'pyproject.toml'
      - 'requirements/lock.txt'
      - '.github/workflows/windows-runtime.yml'
      - "tests/conftest.py"
      - "src/commander_lab/bridge_qualification.py"
      - "src/commander_lab/decision_statistics.py"
      - "src/commander_lab/deck_profile.py"
      - "src/commander_lab/deck_readiness.py"
      - "src/commander_lab/deck_variant.py"
      - "src/commander_lab/mana_analysis.py"
      - "src/commander_lab/owner_data.py"
      - "src/commander_lab/qualification/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: windows-runtime-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

# WS223 scope exception: the windows lane keeps pyproject.toml range installs (documented, exempt).
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and test tools
        shell: pwsh
        run: python -m pip install -e '.[dev,api]'
      - name: Assert clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            Write-Error "Repository is dirty before runtime validation:`n$status"
            exit 1
          }
      - name: Windows filesystem and atomic-storage contracts
        shell: pwsh
        run: python -m pytest -q tests/unit/test_atomic_storage.py tests/unit/test_runtime_hygiene.py
      - name: External-runtime boundary contracts on Windows
        shell: pwsh
        run: python -m pytest -q tests/contract/test_phase86_phase85_claims.py tests/integration/test_phase85_validation.py
      - name: Atomic-write and integrity contracts on Windows
        shell: pwsh
        run: python -m pytest -q tests/unit/test_phase86_atomic_and_integrity.py
      - name: Studio Windows smoke (doctor, imports, selected studio tests)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -c @"
          import json, subprocess, sys
          proc = subprocess.run([sys.executable, '-m', 'commander_lab.studio', 'doctor', '--json'], capture_output=True, text=True)
          print(proc.stdout)
          if proc.stderr:
              print(proc.stderr, file=sys.stderr)
          report = json.loads(proc.stdout)
          by_name = {c['name']: c for c in report.get('checks', [])}
          for core in ('python', 'dependencies'):
              item = by_name.get(core, {})
              assert item.get('status') == 'PASS', f'Core doctor check failed: {item}'
          for engine_dep in ('java', 'engine_bridge', 'card_knowledge'):
              item = by_name.get(engine_dep, {})
              if item.get('status') != 'PASS':
                  print(f'doctor {engine_dep}: MISSING_ON_CI_RUNNER (status={item.get("status")}; NOT PASS)')
          "@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import commander_lab.studio.web, commander_lab.studio.play, commander_lab.studio.paired_series, commander_lab.studio.launch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/unit/test_studio_engine_provisioning.py tests/unit/test_studio_simulations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert repository remains clean
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            Write-Error "Runtime operations dirtied repository:`n$status"
            exit 1
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
