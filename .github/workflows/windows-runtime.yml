name: Windows Runtime Hygiene

on:
  push:
    branches: [main]
  pull_request:
    # Package B: one Windows runner for the Windows-specific contracts (junctions, atomic storage,
    # run-manifest integrity, runtime hygiene). The paths are the modules these tests execute
    # (scripts/audit_workflow_impact.py proves it), no longer all of src/ and scripts/.
    paths:
      - 'src/commander_lab/__init__.py'
      - 'src/commander_lab/agents/**'
      - 'src/commander_lab/candidates/**'
      - 'src/commander_lab/cards/**'
      - 'src/commander_lab/engine/**'
      - 'src/commander_lab/freeze_readiness.py'
      - 'src/commander_lab/models/**'
      - 'src/commander_lab/semantic_replay/**'
      - 'src/commander_lab/storage/**'
      - 'tests/unit/test_atomic_storage.py'
      - 'tests/unit/test_runtime_hygiene.py'
      - 'tests/unit/test_run_*.py'
      - 'tests/unit/test_phase86_atomic_and_integrity.py'
      - 'tests/contract/test_phase86_phase85_claims.py'
      - 'tests/integration/test_phase85_validation.py'
      - 'config/**'
      - 'pyproject.toml'
      - 'requirements/lock.txt'
      - '.github/workflows/windows-runtime.yml'
      - "tests/conftest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: windows-runtime-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

# WS223 scope exception: the windows lane keeps pyproject.toml range installs (documented, exempt).
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and test tools
        shell: pwsh
        run: python -m pip install -e '.[dev,api]'
      - name: Assert clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            Write-Error "Repository is dirty before runtime validation:`n$status"
            exit 1
          }
      - name: Windows filesystem and atomic-storage contracts
        shell: pwsh
        run: python -m pytest -q tests/unit/test_atomic_storage.py tests/unit/test_runtime_hygiene.py
      - name: External-runtime boundary contracts on Windows
        shell: pwsh
        run: python -m pytest -q tests/contract/test_phase86_phase85_claims.py tests/integration/test_phase85_validation.py
      - name: Exercise real Windows junction and run-manifest contracts
        shell: pwsh
        run: |
          $runTests = @(Get-ChildItem -Path tests/unit/test_run_*.py -File -ErrorAction Stop | ForEach-Object { $_.FullName })
          if ($runTests.Count -eq 0) { throw "No run integrity tests discovered" }
          python -m pytest -q @runTests tests/unit/test_phase86_atomic_and_integrity.py
      - name: Assert repository remains clean
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            Write-Error "Runtime operations dirtied repository:`n$status"
            exit 1
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
