name: J-FINAL Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j-final-acceptance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  j-final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install decision-support surface
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Decision-support semantic regression
        run: |
          pytest -q \
            tests/regressions/test_j_final_scope.py \
            tests/unit/test_candidate_screening.py \
            tests/unit/test_project_context.py \
            tests/unit/test_priority_workflows.py \
            tests/unit/test_mana_analysis.py \
            tests/unit/test_playstyle.py
      - name: Integrated current-deck decision workflow
        run: python scripts/run_j_final_acceptance.py
      - name: Upload J-FINAL evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: j-final-acceptance-evidence
          path: artifacts/j_final/
          if-no-files-found: error
          retention-days: 30
