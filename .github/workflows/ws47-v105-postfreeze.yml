name: WS47 v1.0.5 postfreeze attestation

on:
  push:
    branches:
      - ws47/successor-contract-v1.0.5-freeze
    paths:
      - qualification/ws47/**
      - .github/workflows/ws47-v105-postfreeze.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip workflow-definition bootstrap when namespace absent
        id: namespace
        run: |
          if test -f qualification/ws47/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_5.json; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Verify immutable predecessor and install dependency
        if: steps.namespace.outputs.present == 'true'
        run: |
          test "$(git rev-parse 12940248497a8795991cbbd2eedef72945528cfe^{tree})" = "cd83c973b269711106d08ab5be2d7672f05bcb7c"
          test "$(git rev-parse 12940248497a8795991cbbd2eedef72945528cfe:qualification/ws44)" = "6579e119605b90248426a3121a47c487b2bb13cd"
          git diff --exit-code 12940248497a8795991cbbd2eedef72945528cfe -- qualification/ws44
          python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Regenerate exact successor namespace
        if: steps.namespace.outputs.present == 'true'
        run: |
          rm -rf regen
          mkdir regen
          python scripts/ws47_build_successor_v1_0_5.py --output regen
          python scripts/ws47_finalize_evidence_metadata.py --input-dir regen
          python scripts/ws47_validate_successor_v1_0_5.py --input-dir regen --report regen/WS47_INDEPENDENT_VALIDATION.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d=Path('regen')
          report=json.loads((d/'WS47_FREEZE_RESULT.json').read_text())
          report['G47_14']='PASS_DOUBLE_MATERIALIZATION_BYTE_IDENTICAL'
          (d/'WS47_FREEZE_RESULT.json').write_text(json.dumps(report,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          files=sorted(p for p in d.iterdir() if p.is_file() and p.name not in {'WS47_SHA256SUMS','WS47_EVIDENCE_INDEX.json'})
          rows=[(hashlib.sha256(p.read_bytes()).hexdigest(),p.name) for p in files]
          (d/'WS47_SHA256SUMS').write_text(''.join(f'{h}  {n}\n' for h,n in rows))
          idx={'artifact_version':'commander-lab.ws47-evidence-index/1.0.0','contract_version':'commander-lab.semantic-fixture-materialization/1.0.5','files':[{'path':n,'sha256':h,'role':'canonical_ws47_freeze_candidate_evidence'} for h,n in rows]}
          idx['files'].append({'path':'WS47_SHA256SUMS','sha256':hashlib.sha256((d/'WS47_SHA256SUMS').read_bytes()).hexdigest(),'role':'sealed_checksum_manifest'})
          (d/'WS47_EVIDENCE_INDEX.json').write_text(json.dumps(idx,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY
          diff -ru qualification/ws47 regen
      - name: Build postfreeze attestation outside working tree
        if: steps.namespace.outputs.present == 'true'
        run: |
          FREEZE_COMMIT="$GITHUB_SHA"
          FREEZE_TREE="$(git rev-parse "$GITHUB_SHA^{tree}")"
          NS_TREE="$(git rev-parse "$GITHUB_SHA:qualification/ws47")"
          MAT_SHA="$(sha256sum qualification/ws47/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_5.json | awk '{print $1}')"
          CANON="$(python -c 'import json; print(json.load(open("qualification/ws47/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_5.json"))["canonical_bundle_digest"])')"
          python - <<PY
          import json
          data={
            'artifact_version':'commander-lab.ws47-postfreeze-attestation/1.0.0',
            'freeze_commit':'$FREEZE_COMMIT',
            'freeze_tree':'$FREEZE_TREE',
            'namespace_tree':'$NS_TREE',
            'materialization_sha256':'$MAT_SHA',
            'canonical_bundle_digest':'$CANON',
            'workflow_run_id':'${{ github.run_id }}',
            'workflow_run_attempt':'${{ github.run_attempt }}',
            'predecessor_namespace_integrity':'PASS',
            'regeneration_diff':'PASS_BYTE_IDENTICAL',
            'independent_validation':'PASS',
            'G47_14':'PASS',
            'G47_15':'PASS_POSTFREEZE_REGENERATION',
            'provider_runtime_executed':False,
            'provider_pass_imported':False,
            'AF07_GRANTED':False,
            'ARCHITECTURE_FREEZE':False,
            'terminal_status':'PASS'
          }
          open('/tmp/WS47_POSTFREEZE_ATTESTATION.json','w').write(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
      - name: Verify freeze freshness and persist postfreeze attestation
        if: steps.namespace.outputs.present == 'true'
        run: |
          BRANCH='ws47/successor-contract-v1.0.5-freeze'
          RUN_NS_TREE="$(git rev-parse "$GITHUB_SHA:qualification/ws47")"
          RUN_BUILDER="$(git rev-parse "$GITHUB_SHA:scripts/ws47_build_successor_v1_0_5.py")"
          RUN_VALIDATOR="$(git rev-parse "$GITHUB_SHA:scripts/ws47_validate_successor_v1_0_5.py")"
          RUN_FINALIZER="$(git rev-parse "$GITHUB_SHA:scripts/ws47_finalize_evidence_metadata.py")"
          RUN_WORKFLOW="$(git rev-parse "$GITHUB_SHA:.github/workflows/ws47-v105-postfreeze.yml")"
          git fetch origin "$BRANCH"
          test "$RUN_NS_TREE" = "$(git rev-parse "origin/$BRANCH:qualification/ws47")"
          test "$RUN_BUILDER" = "$(git rev-parse "origin/$BRANCH:scripts/ws47_build_successor_v1_0_5.py")"
          test "$RUN_VALIDATOR" = "$(git rev-parse "origin/$BRANCH:scripts/ws47_validate_successor_v1_0_5.py")"
          test "$RUN_FINALIZER" = "$(git rev-parse "origin/$BRANCH:scripts/ws47_finalize_evidence_metadata.py")"
          test "$RUN_WORKFLOW" = "$(git rev-parse "origin/$BRANCH:.github/workflows/ws47-v105-postfreeze.yml")"
          git rebase "origin/$BRANCH"
          mkdir -p candidate-qualification/ws47-successor-v1.0.5
          cp /tmp/WS47_POSTFREEZE_ATTESTATION.json candidate-qualification/ws47-successor-v1.0.5/WS47_POSTFREEZE_ATTESTATION.json
          git add candidate-qualification/ws47-successor-v1.0.5/WS47_POSTFREEZE_ATTESTATION.json
          if git diff --cached --quiet; then
            echo 'WS47_POSTFREEZE_ATTESTATION_ALREADY_CURRENT=TRUE'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ws47: persist postfreeze regeneration attestation'
            git push origin HEAD:ws47/successor-contract-v1.0.5-freeze
          fi
      - name: Upload regenerated namespace
        if: steps.namespace.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ws47-v105-postfreeze-${{ github.sha }}
          path: regen
          if-no-files-found: error
