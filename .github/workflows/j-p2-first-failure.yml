name: J-P2 First Regression Failure

on:
  push:
    branches:
      - roadmap/j-p2-modeling-data-quality

permissions:
  contents: read

jobs:
  first-failure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reconstruct frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/jp2_candidate.patch.gz.b64 | gzip -dc > /tmp/jp2_candidate.patch
          echo "5503e564a440923b933240e4f282d118ec7e8d46220ef622c0c6bc08797e0ab2  /tmp/jp2_candidate.patch" | sha256sum -c -
          git apply /tmp/jp2_candidate.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('src/commander_lab/tools/service.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from typing import TYPE_CHECKING, Any, Literal\n', 'from typing import TYPE_CHECKING, Any, ClassVar, Literal\n', 1)
          text = text.replace('    COVERAGE_VERSION_PREFIXES = {\n', '    COVERAGE_VERSION_PREFIXES: ClassVar[dict[str, tuple[str, ...]]] = {\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m pip install -e '.[dev,api,openai]'
          ruff check . --fix
          ruff format .
      - name: Capture first failure
        shell: bash
        run: |
          mkdir -p artifacts/jp2-first-failure
          set +e
          pytest -x -q --tb=long > artifacts/jp2-first-failure/pytest-first.txt 2>&1
          echo "$?" > artifacts/jp2-first-failure/exit-code.txt
          true
      - name: Upload first failure
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: jp2-first-failure
          path: artifacts/jp2-first-failure
