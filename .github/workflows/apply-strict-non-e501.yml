name: Apply Strict Non-E501 Fixes

on:
  push:
    branches:
      - fix/1.13.4-strict-quality-controlled

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[strict-non-e501]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply controlled fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def replace(rel: str, old: str, new: str, count: int = -1) -> None:
              path = root / rel
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"expected pattern missing in {rel}: {old[:80]!r}")
              path.write_text(text.replace(old, new, count), encoding="utf-8")

          def transform(rel: str, fn) -> None:
              path = root / rel
              text = path.read_text(encoding="utf-8")
              path.write_text(fn(text), encoding="utf-8")

          # Preserve exact runtime Unicode while removing ambiguous source glyphs.
          for rel, mapping in {
              "scripts/complete_phase12_8_10.py": {"12.8–12.10": "12.8\\u201312.10"},
              "src/commander_lab/acceptance/phase10.py": {"Report – {deck_id}": "Report \\u2013 {deck_id}"},
              "tests/unit/test_phase1214_rules_coverage.py": {"Alen – High Perfect Morcant": "Alen \\u2013 High Perfect Morcant"},
              "tests/unit/test_plaintext_importer.py": {"Nature’s Claim": "Nature\\u2019s Claim"},
              "tests/property/test_normalization_properties.py": {"\"’\"": "\"\\u2019\"", "\"‘\"": "\"\\u2018\""},
              "tests/fuzz/test_boundary_fuzz.py": {"Ω🕷️’\\x00": "Ω🕷️\\u2019\\x00"},
          }.items():
              transform(rel, lambda text, mapping=mapping: __import__("functools").reduce(lambda value, item: value.replace(*item), mapping.items(), text))

          transform(
              "src/commander_lab/cards/normalize.py",
              lambda text: text.replace("\"’\"", "\"\\u2019\"")
              .replace("\"‘\"", "\"\\u2018\"")
              .replace("\"´\"", "\"\\u00b4\"")
              .replace("\"–\"", "\"\\u2013\"")
              .replace("\"—\"", "\"\\u2014\"")
              .replace("\"−\"", "\"\\u2212\"")
              .replace("\"／\"", "\"\\uff0f\"")
              .replace("[xX×]", "[xX\\u00d7]"),
          )

          path = root / "scripts/run_phase86_acceptance.py"
          text = path.read_text(encoding="utf-8")
          imports = '''from commander_lab.agents.demo import run_phase5_demo\nfrom commander_lab.engine.rules import run_phase8_validation\nfrom commander_lab.models import (\n    CardAblationInput,\n    CreateReportInput,\n    HoldoutInput,\n    MatchupBatchInput,\n    PairedVariantInput,\n    VariantSwap,\n)\nfrom commander_lab.storage.atomic import atomic_write_json\nfrom commander_lab.tools import CommanderToolService\nfrom commander_lab.tools.local_snapshots import build_local_snapshots\n\n\n'''
          if imports not in text:
              raise RuntimeError("phase86 import block missing")
          text = text.replace(imports, "")
          text = text.replace(
              "def main() -> int:\n",
              '''def main() -> int:\n    from commander_lab.agents.demo import run_phase5_demo\n    from commander_lab.engine.rules import run_phase8_validation\n    from commander_lab.models import (\n        CardAblationInput,\n        CreateReportInput,\n        HoldoutInput,\n        MatchupBatchInput,\n        PairedVariantInput,\n        ValidateDeckInput,\n        VariantSwap,\n    )\n    from commander_lab.storage.atomic import atomic_write_json\n    from commander_lab.tools import CommanderToolService\n    from commander_lab.tools.local_snapshots import build_local_snapshots\n\n''',
              1,
          )
          text = text.replace("    validation = [serialized(service.validate_deck.model.__self__)] if False else []\n", "")
          text = text.replace("        from commander_lab.models import ValidateDeckInput\n\n", "")
          path.write_text(text, encoding="utf-8")

          path = root / "src/commander_lab/agents/__init__.py"
          text = path.read_text(encoding="utf-8")
          opt = '''from .optimization_orchestrator import (\n    OptimizationPlan,\n    RunProfile,\n    build_optimization_plan,\n    select_run_profile,\n)\n\n'''
          if opt not in text:
              raise RuntimeError("agents optimization import block missing")
          text = text.replace(opt, "")
          pos = text.index("__all__ = [")
          text = text[:pos] + opt + text[pos:]
          text = text.replace(
              '    "build_pilot",\n]',
              '    "build_pilot",\n    "OptimizationPlan",\n    "RunProfile",\n    "build_optimization_plan",\n    "select_run_profile",\n]',
          )
          text = re.sub(
              r'\n__all__\.extend\(\n    \[\n        "OptimizationPlan",\n        "RunProfile",\n        "build_optimization_plan",\n        "select_run_profile",\n    \]\n\)\n?$',
              "\n",
              text,
          )
          path.write_text(text, encoding="utf-8")

          replace("src/commander_lab/agents/ensemble.py", "for index, name in enumerate(names):", "for name in names:")
          replace("src/commander_lab/agents/ensemble.py", "for name, row in results.items():", "for row in results.values():")

          replace(
              "src/commander_lab/agents/openai_workflow.py",
              '''        def make_invoke(name: str, model: type[Any]) -> Any:\n            async def invoke(payload: Any) -> dict[str, Any]:\n                validated = model.model_validate(payload)\n                response = registry.invoke(name, validated.model_dump(mode="json"))\n                validate_tool_output(response)\n                return response.model_dump(mode="json")\n\n            invoke.__annotations__ = {"payload": model, "return": dict[str, Any]}\n            return invoke\n\n        invoke = make_invoke(tool_name, input_model)\n        invoke.__name__ = tool_name\n        invoke.__doc__ = description\n        tools.append(\n            function_tool(\n                invoke,\n''',
              '''        def make_invoke(name: str, model: type[Any]) -> Any:\n            async def invoke_tool(payload: Any) -> dict[str, Any]:\n                validated = model.model_validate(payload)\n                response = registry.invoke(name, validated.model_dump(mode="json"))\n                validate_tool_output(response)\n                return response.model_dump(mode="json")\n\n            invoke_tool.__annotations__ = {"payload": model, "return": dict[str, Any]}\n            return invoke_tool\n\n        tool_callable = make_invoke(tool_name, input_model)\n        tool_callable.__name__ = tool_name\n        tool_callable.__doc__ = description\n        tools.append(\n            function_tool(\n                tool_callable,\n''',
          )

          replace(
              "src/commander_lab/agents/pilots.py",
              '''        if CardRole.COMBAT_PAYOFF in action.roles or action.base_power >= 5:\n            if korvold_online:\n                bonus += 0.4\n''',
              '''        if (CardRole.COMBAT_PAYOFF in action.roles or action.base_power >= 5) and korvold_online:\n            bonus += 0.4\n''',
          )

          path = root / "src/commander_lab/agents/validation.py"
          text = path.read_text(encoding="utf-8")
          if "from itertools import pairwise\n" not in text:
              text = text.replace("from pathlib import Path\n", "from itertools import pairwise\nfrom pathlib import Path\n")
          text = text.replace("for earlier, later in zip(rates, rates[1:])", "for earlier, later in pairwise(rates)")
          path.write_text(text, encoding="utf-8")

          path = root / "src/commander_lab/audit/runner.py"
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'    phase85_path = project / "PHASE85_VALIDATION_OUTPUT\.json"\n    if not phase85_path\.exists\(\):\n        phase85_path = \(\n            project / "artifacts" / "engine_setup" / "phase85_validation" / "validation_result\.json"\n        \)\n    phase85: dict\[str, Any\] = \{\}\n    if phase85_path\.exists\(\):\n        try:\n            phase85 = json\.loads\(phase85_path\.read_text\(encoding="utf-8"\)\)\n        except json\.JSONDecodeError:\n            phase85 = \{\}\n',
              "",
              text,
          )
          path.write_text(text, encoding="utf-8")

          replace("src/commander_lab/counterfactual.py", "        path, rows = self.load(source_path)\n        if event_offset < 0", "        _path, rows = self.load(source_path)\n        if event_offset < 0", 1)

          path = root / "src/commander_lab/diagnostics.py"
          text = path.read_text(encoding="utf-8")
          if "from typing import Any\n" in text:
              text = text.replace("from typing import Any\n", "from typing import Any, ClassVar\n")
          elif "from typing import ClassVar\n" not in text:
              text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom typing import ClassVar\n")
          text = text.replace("    SUCCESS_EVENTS = {", "    SUCCESS_EVENTS: ClassVar[set[str]] = {")
          path.write_text(text, encoding="utf-8")

          replace("src/commander_lab/engine/rules/base.py", '    def close(self) -> None:\n        """Release subprocesses or temporary resources."""\n', '    def close(self) -> None:\n        """Release subprocesses or temporary resources."""\n        return None\n')
          replace("src/commander_lab/engine/rules/bridge.py", '                result = client.request("engine_hello") if False else None\n                raise\n', '                raise\n')
          replace("src/commander_lab/engine/rules/bridge.py", 'tuple(probe.details) + ("legacy protocol compatibility",)', '(*probe.details, "legacy protocol compatibility"),')
          replace("src/commander_lab/engine/rules/tactical.py", '        wipe = _bool(s.get("wipe_resolves", True))\n        return {\n            "affected_by_wipe": False if wipe else False,\n', '        return {\n            "affected_by_wipe": False,\n')
          replace("src/commander_lab/engine/structural/simulator.py", "return int(math.ceil(base_cost + 2 * prior_casts))", "return math.ceil(base_cost + 2 * prior_casts)")
          replace("src/commander_lab/engine/structural/simulator.py", "amount = max(1, int(math.ceil(card.strength(CardRole.DRAW))))", "amount = max(1, math.ceil(card.strength(CardRole.DRAW)))")

          path = root / "src/commander_lab/evals/agent_eval.py"
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''    if "winrate" in text.casefold() or "win rate" in text.casefold():\n        if "not" not in text.casefold() and "structural" not in text.casefold():\n            return 0.0, ["win-rate wording lacks structural-model qualification"]\n''',
              '''    if (\n        "winrate" in text.casefold() or "win rate" in text.casefold()\n    ) and "not" not in text.casefold() and "structural" not in text.casefold():\n        return 0.0, ["win-rate wording lacks structural-model qualification"]\n''',
          )
          path.write_text(text, encoding="utf-8")

          path = root / "src/commander_lab/importers/google_drive.py"
          text = path.read_text(encoding="utf-8")
          if "from typing import ClassVar\n" not in text:
              text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom typing import ClassVar\n")
          text = text.replace("    DEFAULT_SHEET_MAP = {", "    DEFAULT_SHEET_MAP: ClassVar[dict[str, tuple[str, ...]]] = {")
          path.write_text(text, encoding="utf-8")

          path = root / "src/commander_lab/opponent_ensembles/store.py"
          text = path.read_text(encoding="utf-8")
          text = text.replace("zip(values, weights)", "zip(values, weights, strict=True)")
          text = text.replace(
              '''zip(\n                baseline_result.per_variant,\n                candidate_result.per_variant,\n            )''',
              '''zip(\n                baseline_result.per_variant,\n                candidate_result.per_variant,\n                strict=True,\n            )''',
          )
          path.write_text(text, encoding="utf-8")

          replace("src/commander_lab/optimization/experiments.py", "    avg = lambda rows, key: fmean(row[key] for row in rows)\n", "    def avg(rows, key):\n        return fmean(row[key] for row in rows)\n")

          path = root / "src/commander_lab/storage/json_store.py"
          text = path.read_text(encoding="utf-8")
          text = text.replace("from typing import TypeVar\n\n", "")
          text = text.replace('\nModelT = TypeVar("ModelT", bound=BaseModel)\n', "")
          text = text.replace("def load_model(path: str | Path, model_type: type[ModelT]) -> ModelT:", "def load_model[ModelT: BaseModel](path: str | Path, model_type: type[ModelT]) -> ModelT:")
          path.write_text(text, encoding="utf-8")

          replace("src/commander_lab/tools/service.py", '''                        swaps = tuple(\n                            cumulative_swaps\n                            + [self.models_variant_swap(cut.oracle_name, candidate_id)]\n                        )\n''', '''                        swaps = (\n                            *cumulative_swaps,\n                            self.models_variant_swap(cut.oracle_name, candidate_id),\n                        )\n''')

          path = root / "tests/fuzz/test_boundary_fuzz.py"
          text = path.read_text(encoding="utf-8")
          if "import contextlib\n" not in text:
              text = text.replace("import json\n", "import contextlib\nimport json\n")
          text = text.replace('''        try:\n            importer.import_file(path, options)\n        except (ValueError, ValidationError, UnicodeError):\n            pass\n''', '''        with contextlib.suppress(ValueError, ValidationError, UnicodeError):\n            importer.import_file(path, options)\n''')
          text = text.replace('''            try:\n                EngineProtocolRequest.model_validate(value)\n            except ValidationError:\n                pass\n''', '''            with contextlib.suppress(ValidationError):\n                EngineProtocolRequest.model_validate(value)\n''')
          path.write_text(text, encoding="utf-8")

          replace("tests/integration/test_phase8_external_adapter.py", 'match="unverified|legacy|external rules engine"', 'match=r"unverified|legacy|external rules engine"')
          replace("tests/property/test_quantity_properties.py", '''        def make_deck(deck_id: str, required: int) -> Deck:\n            filler = 99 - required\n            entries = [DeckEntry(oracle_name=commander, zone=DeckZone.COMMANDER)]\n''', '''        def make_deck(deck_id: str, required: int, commander_name: str = commander) -> Deck:\n            filler = 99 - required\n            entries = [DeckEntry(oracle_name=commander_name, zone=DeckZone.COMMANDER)]\n''')
          replace("tests/property/test_quantity_properties.py", "CommanderConfiguration(commanders=(commander,))", "CommanderConfiguration(commanders=(commander_name,))")
          replace("tests/unit/test_pilots.py", "    synergy = lands + (\n", "    synergy = (\n        *lands,\n")
          PY
          ruff format .
          python -m compileall -q src tests scripts
          git diff --check
      - name: Commit controlled changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: fix non-E501 strict-quality findings [strict-non-e501]"
          git push origin HEAD:fix/1.13.4-strict-quality-controlled
