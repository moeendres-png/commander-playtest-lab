name: J-P2 Materialize Frozen Candidate

on:
  push:
    branches:
      - roadmap/j-p2-modeling-data-quality

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact P1 base and staged patch lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2496fd0d913ebcdb34180f147a677021ea4d282d"
          test "$(git rev-parse HEAD^^)" = "807b3602c48824df40a70d2a715f9dfb6dc3e8c6"
          test "$(git rev-parse HEAD^^^{tree})" = "50e66b90d7349ebe8e66ebbec0cb9f338a153087"
      - name: Decode and apply frozen local candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/jp2_candidate.patch.gz.b64 | gzip -dc > /tmp/jp2_candidate.patch
          echo "5503e564a440923b933240e4f282d118ec7e8d46220ef622c0c6bc08797e0ab2  /tmp/jp2_candidate.patch" | sha256sum -c -
          git apply --check /tmp/jp2_candidate.patch
          git apply /tmp/jp2_candidate.patch
          git rm .github/jp2_candidate.patch.gz.b64 .github/workflows/j-p2-materialize-frozen-candidate.yml
          git add -A
          git diff --cached --check
      - name: Verify J-P2 scope and frozen truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, tomllib
          root = pathlib.Path('.')
          changed = set(__import__('subprocess').check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          forbidden_prefixes = ('data/decks/', 'data/inventory/', 'data/evals/holdout/pilot_decisions_j_v1.json')
          bad = sorted(p for p in changed if p.startswith(forbidden_prefixes))
          if bad:
              raise SystemExit(f'forbidden J-P2 mutation: {bad}')
          pyproject = tomllib.loads((root/'pyproject.toml').read_text())
          if pyproject['project']['version'] != '1.15.0':
              raise SystemExit('pyproject version is not 1.15.0')
          ns = {}
          exec((root/'src/commander_lab/__init__.py').read_text(), ns)
          if ns['__version__'] != '1.15.0':
              raise SystemExit('runtime version is not 1.15.0')
          member = root/'data/evals/holdout/pilot_decisions_j_v1.json'
          member_hash = hashlib.sha256(member.read_bytes()).hexdigest()
          if member_hash != 'a5875cd1a8edf6bbf79248b3e4ba26151579f628eaeefd4ef2369abb309da8d1':
              raise SystemExit('J_HOLDOUT_v1 member bytes changed')
          registry = json.loads((root/'data/evals/j_eval_registry.json').read_text())
          holdout = registry['sets']['UNTOUCHED_HOLDOUT']
          if holdout['hash'] != '724e84f1ea34bea9ec6b37929d945724c77c408a464b3a9dd05235738a00d5d6':
              raise SystemExit('J_HOLDOUT_v1 set hash changed')
          if holdout['first_evaluation_timestamp'] is not None or holdout['used_for_tuning'] is not False or holdout['mutable'] is not False:
              raise SystemExit('J_HOLDOUT_v1 registry state changed')
          print('scope=PASS version=1.15.0 holdout_v1_bytes=UNCHANGED')
          PY
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy strict
        run: mypy src/commander_lab
      - name: Collect tests
        run: pytest --collect-only -q
      - name: Full test suite
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Canonical data audit
        shell: bash
        run: |
          set -euo pipefail
          commander-lab data audit --root . | tee /tmp/jp2-data-audit.json
          grep -q '"status": "MATCH"' /tmp/jp2-data-audit.json
      - name: Commit validated candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Roadmap J-P2: improve modeling and opponent data quality"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Push only fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:roadmap/j-p2-modeling-data-quality
