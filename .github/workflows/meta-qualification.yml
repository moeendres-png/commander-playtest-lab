name: Meta Qualification

on:
  pull_request:
    paths:
      - "src/commander_lab/meta_qualification.py"
      - "scripts/run_meta_verification.py"
      - "tests/qualification/test_meta_verification.py"
      - "qualification/protocol/meta_verification_v1/**"
      - "qualification/pre-freeze-successor/CURRENT_RULES_AUTHORITY.json"
      - "qualification/SHA256SUMS"
      - "qualification/ws218-semantic-replay-tape-v1/tapes/ws218-tape-4p.json"
      - "engine-bridge/pom.xml"
      - "engine-bridge/src/test/java/org/commanderlab/xmage/XmageFullGameHiddenInformationTest.java"
      - ".github/workflows/meta-qualification.yml"
  push:
    branches: [main]
    paths:
      - "src/commander_lab/meta_qualification.py"
      - "scripts/run_meta_verification.py"
      - "tests/qualification/test_meta_verification.py"
      - "qualification/protocol/meta_verification_v1/**"
      - "qualification/pre-freeze-successor/CURRENT_RULES_AUTHORITY.json"
      - "qualification/SHA256SUMS"
      - "qualification/ws218-semantic-replay-tape-v1/tapes/ws218-tape-4p.json"
      - "engine-bridge/pom.xml"
      - "engine-bridge/src/test/java/org/commanderlab/xmage/XmageFullGameHiddenInformationTest.java"
      - ".github/workflows/meta-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  XMAGE_COMMIT: b19596980f2734496ea1896504253e1bdd2756dd

jobs:
  mutation-detection:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact lab head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned XMage
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Verify immutable XMage pin
        working-directory: vendor/engine-source/xmage
        run: test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"
      - name: Build pinned XMage
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          if test -x ./mvnw; then ./mvnw -B -ntp -DskipTests install; else mvn -B -ntp -DskipTests install; fi
      - name: Install validation runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run semantic meta-verification tests
        run: pytest -q tests/qualification/test_meta_verification.py
      - name: Kill live hidden-information mutation
        working-directory: engine-bridge
        run: >-
          mvn -B -ntp
          -Dtest='XmageFullGameHiddenInformationTest#qualificationOracleKillsInjectedOpponentPrivateIdentity'
          test
      - name: Generate complete mutation evidence
        run: python scripts/run_meta_verification.py --runtime-hidden-killed
      - name: Verify complete fail-closed accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(".")
          report = json.loads(
              (root / "artifacts/meta-verification/META_VERIFICATION_RESULT.json").read_text()
          )
          schema = json.loads(
              (
                  root
                  / "qualification/protocol/meta_verification_v1/"
                  "meta_verification_result_v1.schema.json"
              ).read_text()
          )
          Draft202012Validator(schema).validate(report)
          assert report["attempted"] == 8
          assert report["killed"] == 8
          assert report["survived"] == 0
          assert report["not_run"] == 0
          assert report["kill_rate"] == 1.0
          assert report["catalog_coverage"] == 1.0
          PY
      - name: Verify current rules-authority receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("qualification/pre-freeze-successor/CURRENT_RULES_AUTHORITY.json").read_text()
          )
          assert receipt["authority_status"] == "CURRENT_OFFICIAL_SOURCE_DIRECTLY_VERIFIED"
          PY
      - name: Record exact source and engine identity
        run: |
          mkdir -p artifacts/meta-verification
          git rev-parse HEAD > artifacts/meta-verification/LAB_COMMIT.txt
          git rev-parse HEAD^{tree} > artifacts/meta-verification/LAB_TREE.txt
          printf '%s\n' "$XMAGE_COMMIT" > artifacts/meta-verification/XMAGE_COMMIT.txt
          sha256sum             qualification/protocol/meta_verification_v1/meta_verification_contract_v1.json             qualification/protocol/meta_verification_v1/rules_mutation_catalog_v1.json             qualification/protocol/meta_verification_v1/meta_verification_result_v1.schema.json             qualification/pre-freeze-successor/CURRENT_RULES_AUTHORITY.json             qualification/SHA256SUMS             qualification/ws218-semantic-replay-tape-v1/tapes/ws218-tape-4p.json             engine-bridge/src/test/java/org/commanderlab/xmage/XmageFullGameHiddenInformationTest.java             > artifacts/meta-verification/SHA256SUMS
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: meta-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/meta-verification/
          if-no-files-found: error
          retention-days: 90
