name: Meta Qualification

on:
  pull_request:
    paths:
      - "src/commander_lab/meta_qualification.py"
      - "scripts/run_meta_verification.py"
      - "tests/qualification/test_meta_verification.py"
      - "qualification/protocol/meta_verification_v1/**"
      - "qualification/ws218-semantic-replay-tape-v1/tapes/ws218-tape-4p.json"
      - ".github/workflows/meta-qualification.yml"
  push:
    branches: [main]
    paths:
      - "src/commander_lab/meta_qualification.py"
      - "scripts/run_meta_verification.py"
      - "tests/qualification/test_meta_verification.py"
      - "qualification/protocol/meta_verification_v1/**"
      - "qualification/ws218-semantic-replay-tape-v1/tapes/ws218-tape-4p.json"
      - ".github/workflows/meta-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-mutation-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install validation runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run meta-verification tests
        run: pytest -q tests/qualification/test_meta_verification.py
      - name: Generate mutation evidence
        run: python scripts/run_meta_verification.py
      - name: Verify evidence shape and fail-closed accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(".")
          report = json.loads(
              (root / "artifacts/meta-verification/META_VERIFICATION_RESULT.json").read_text()
          )
          schema = json.loads(
              (
                  root
                  / "qualification/protocol/meta_verification_v1/"
                  "meta_verification_result_v1.schema.json"
              ).read_text()
          )
          Draft202012Validator(schema).validate(report)
          assert report["survived"] == 0
          assert report["killed"] == report["attempted"]
          assert report["not_run"] > 0
          assert report["catalog_coverage"] < 1.0
          PY
      - name: Record exact source identity
        run: |
          git rev-parse HEAD > artifacts/meta-verification/LAB_COMMIT.txt
          git rev-parse HEAD^{tree} > artifacts/meta-verification/LAB_TREE.txt
          sha256sum qualification/protocol/meta_verification_v1/meta_verification_contract_v1.json qualification/protocol/meta_verification_v1/rules_mutation_catalog_v1.json qualification/protocol/meta_verification_v1/meta_verification_result_v1.schema.json qualification/SHA256SUMS qualification/ws218-semantic-replay-tape-v1/tapes/ws218-tape-4p.json > artifacts/meta-verification/SHA256SUMS
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: meta-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/meta-verification/
          if-no-files-found: error
          retention-days: 90
