name: J-P1 Local Patch Bootstrap

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  transport-reviewed-local-patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[jp1-local-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact locally reviewed J-P1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/jp1_patch.part1 .github/jp1_patch.part2 .github/jp1_patch.part3 .github/jp1_patch.part4 > /tmp/jp1.patch.gz.b64
          base64 -d /tmp/jp1.patch.gz.b64 | gzip -d > /tmp/jp1.patch
          echo "f75cdf8fef3367793bc1a01c5b3520b9d39f9e87fa4b607bed699cf246e75e04  /tmp/jp1.patch" | sha256sum -c -
          git apply --check /tmp/jp1.patch
          git apply /tmp/jp1.patch
          rm -f .github/jp1_patch.part1 .github/jp1_patch.part2 .github/jp1_patch.part3 .github/jp1_patch.part4 .github/workflows/j-p1-bootstrap.yml
          python -m compileall -q src tests
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(J-P1): transport locally reviewed reliability patch [jp1-local-bootstrap]"
          git push origin HEAD:roadmap/j-p1-reliability
