name: WS49 XMage v1.0.5 Full107 Construction

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'engine-bridge/**'
      - 'candidate-qualification/ws49-xmage-v1.0.5/**'
      - '.github/workflows/ws49-xmage-v105-construction.yml'
  push:
    branches:
      - ws49/xmage-v1.0.5-successor-qualification
    paths:
      - 'engine-bridge/**'
      - 'candidate-qualification/ws49-xmage-v1.0.5/**'
      - '.github/workflows/ws49-xmage-v105-construction.yml'

permissions:
  contents: read

env:
  WS47_FREEZE_COMMIT: 192e2b77c0625ad26905bd0ee8dcc3f44a5796c8
  WS47_FREEZE_TREE: f596c54d2cb229b9827c6c94a278175e8312c65c
  WS47_NAMESPACE_TREE: 12af73695c801a42a0193ee895d5fc0843d16b0c
  WS47_MATERIALIZATION_SHA256: 0e47b792cc5232fa0ef06a0cab2a4ebfe9d72d4cbc8bc2bfc5c22b9bf7a940b3
  XMAGE_WS49_COMMIT: 0c1f455ea8c8fa48ab9d638ad5068ec242800428
  XMAGE_WS49_TREE: fdb8bf56a8bd8199a4ef372e468d93d6550b0649
  XMAGE_WS42_COMMIT: 0c1f455ea8c8fa48ab9d638ad5068ec242800428
  COMMANDER_LAB_XMAGE_WS26_BRIDGE_CMD: >-
    java -cp ${{ github.workspace }}/engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar:${{ github.workspace }}/engine-bridge/target/dependency/* org.commanderlab.xmage.XmageWs26QualificationMain full-game

jobs:
  full107-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact WS49 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Attest exact provider identity
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws49-v105-construction artifacts/ws39-ci
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          printf '%s\n' "$ACTUAL_HEAD" | tee artifacts/ws49-v105-construction/PROVIDER_COMMIT.txt
          git rev-parse HEAD^{tree} | tee artifacts/ws49-v105-construction/PROVIDER_TREE.txt

      - name: Checkout exact immutable WS47 contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.WS47_FREEZE_COMMIT }}
          path: _ws47

      - name: Checkout exact XMage candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_WS49_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'

      - name: Install Commander Lab runtime dependencies
        run: python -m pip install -e .

      - name: Verify exact source locks and WS49 scripts
        run: |
          set -euo pipefail
          test "$(git -C _ws47 rev-parse HEAD)" = "$WS47_FREEZE_COMMIT"
          test "$(git -C _ws47 rev-parse HEAD^{tree})" = "$WS47_FREEZE_TREE"
          test "$(git -C _ws47 rev-parse HEAD:qualification/ws47)" = "$WS47_NAMESPACE_TREE"
          test "$(git -C vendor/engine-source/xmage rev-parse HEAD)" = "$XMAGE_WS49_COMMIT"
          test "$(git -C vendor/engine-source/xmage rev-parse HEAD^{tree})" = "$XMAGE_WS49_TREE"
          MATERIALIZATION=_ws47/qualification/ws47/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_5.json
          test "$(sha256sum "$MATERIALIZATION" | cut -d' ' -f1)" = "$WS47_MATERIALIZATION_SHA256"
          printf '%s\n' "$WS47_FREEZE_COMMIT" > artifacts/ws49-v105-construction/WS47_COMMIT.txt
          printf '%s\n' "$WS47_FREEZE_TREE" > artifacts/ws49-v105-construction/WS47_TREE.txt
          printf '%s\n' "$WS47_NAMESPACE_TREE" > artifacts/ws49-v105-construction/WS47_NAMESPACE_TREE.txt
          printf '%s\n' "$XMAGE_WS49_COMMIT" > artifacts/ws49-v105-construction/XMAGE_COMMIT.txt
          printf '%s\n' "$XMAGE_WS49_TREE" > artifacts/ws49-v105-construction/XMAGE_TREE.txt
          python -m py_compile \
            candidate-qualification/ws49-xmage-v1.0.5/successor_contract_v105.py \
            candidate-qualification/ws49-xmage-v1.0.5/canonical_v105.py \
            candidate-qualification/ws49-xmage-v1.0.5/build_denominator_v105.py \
            candidate-qualification/ws49-xmage-v1.0.5/run_full107_construction_probe_v105.py \
            candidate-qualification/ws49-xmage-v1.0.5/apply_ws49_native_remediation.py

      - name: Independently reconstruct exact v1.0.5 denominator
        run: |
          set -euo pipefail
          python candidate-qualification/ws49-xmage-v1.0.5/build_denominator_v105.py \
            --contract _ws47/qualification/ws47/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_5.json \
            --output artifacts/ws49-v105-construction/WS49_DENOMINATOR_MANIFEST_107.json \
            | tee artifacts/ws49-v105-construction/DENOMINATOR.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/ws49-v105-construction/WS49_DENOMINATOR_MANIFEST_107.json').read_text())
          assert p['provider_denominator']==107 and p['unique_fixture_ids']==107
          assert p['all_requested_state_digests_recomputed_equal'] is True
          assert p['historical_successor_runtime_credit_imported']==0
          PY

      - name: Apply inherited native qualification overlays and WS49 remediation
        run: |
          set -euo pipefail
          python candidate-qualification/finalist-convergence-xmage/apply_primitive_a_native_state_overlay.py
          python candidate-qualification/ws34-xmage-successor/apply_ws34_successor_overlay.py
          python candidate-qualification/ws36-xmage-successor/apply_ws36_provider_overlay.py
          python candidate-qualification/ws39-xmage-successor/apply_ws39_provider_overlay.py
          python candidate-qualification/ws46-xmage-v1.0.4/apply_ws46_runtime_evidence_overlay.py
          python candidate-qualification/ws39-xmage-successor/apply_ws39_state_surface_overlay.py
          python candidate-qualification/ws39-xmage-successor/apply_ws39_stack_state_overlay.py
          python candidate-qualification/ws39-xmage-successor/apply_ws39_stack_identity_overlay.py
          python candidate-qualification/ws42-xmage-v1.0.3/apply_ws42_native_readback_overlay.py
          python candidate-qualification/ws42-xmage-v1.0.3/apply_ws42_native_state_extension_overlay.py
          python candidate-qualification/ws42-xmage-v1.0.3/apply_ws42_hidden_identity_overlay.py
          python candidate-qualification/ws46-xmage-v1.0.4/apply_ws46_v104_construction_overlay.py
          python candidate-qualification/ws49-xmage-v1.0.5/apply_ws49_native_remediation.py
          git diff --check
          git -C vendor/engine-source/xmage diff --check
          git diff -- engine-bridge > artifacts/ws49-v105-construction/QUALIFICATION_BRIDGE_OVERLAY.patch
          git -C vendor/engine-source/xmage diff > artifacts/ws49-v105-construction/XMAGE_QUALIFICATION_OVERLAY.patch
          cp artifacts/ws39-ci/WS39_XMAGE_RNG_SOURCE_TRANSFORM.json artifacts/ws49-v105-construction/

      - name: Build exact XMage candidate
        working-directory: vendor/engine-source/xmage
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests install 2>&1 | tee ../../../artifacts/ws49-v105-construction/XMAGE_BUILD.log

      - name: Build qualification bridge
        working-directory: engine-bridge
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee ../artifacts/ws49-v105-construction/BRIDGE_BUILD.log

      - name: Materialize runtime classpath
        working-directory: engine-bridge
        run: |
          set -euo pipefail
          mvn -B -ntp dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory="${{ github.workspace }}/engine-bridge/target/dependency"
          test -n "$(find "${{ github.workspace }}/engine-bridge/target/dependency" -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Execute fresh v1.0.5 full107 native construction probe from record 1
        run: |
          set -euo pipefail
          python candidate-qualification/ws49-xmage-v1.0.5/run_full107_construction_probe_v105.py \
            --contract _ws47/qualification/ws47/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_5.json \
            --output artifacts/ws49-v105-construction/WS49_FULL107_CONSTRUCTION_PROBE.json \
            | tee artifacts/ws49-v105-construction/WS49_FULL107_CONSTRUCTION_STDOUT.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/ws49-v105-construction/WS49_FULL107_CONSTRUCTION_PROBE.json').read_text())
          assert p['denominator']==107 and p['record_count']==107
          assert p['historical_pass_imported'] is False and p['historical_successor_runtime_credit']==0
          assert p['legacy_request_echo_accepted_as_proof'] is False
          assert p['unsupported_dimension_counts']=={}, p['unsupported_dimension_counts']
          assert p['counts']=={'NATIVE_SETUP_PASS_AWAITING_INDEPENDENT_NORMALIZATION':107}, p['counts']
          assert p['construction_credit_granted'] is False
          assert p['behavior_credit_granted'] is False
          PY

      - name: Seal construction evidence
        if: always()
        run: |
          find artifacts/ws49-v105-construction -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/ws49-v105-construction/SHA256SUMS || true

      - name: Upload WS49 construction evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ws49-v105-construction-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ws49-v105-construction/
          if-no-files-found: error
