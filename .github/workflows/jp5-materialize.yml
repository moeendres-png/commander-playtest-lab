name: J-P5 Materialize Frozen Development

on:
  push:
    branches:
      - roadmap/j-p5-optimizer-validation
    paths:
      - .github/workflows/jp5-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reconstruct, verify, and materialize frozen J-P5 development payload
        shell: bash
        run: |
          set -euo pipefail
          cat .jp5_materialize/part_* | tr -d '[:space:]' > /tmp/jp5.patch.gz.b64
          base64 -d /tmp/jp5.patch.gz.b64 | gzip -d > /tmp/jp5.patch
          echo "9b4d2e3ab66f8071737f628331d242af403a9f968d452110753e6424706091ec  /tmp/jp5.patch" | sha256sum -c -
          git apply --check /tmp/jp5.patch
          git apply /tmp/jp5.patch
          rm -rf .jp5_materialize
          rm .github/workflows/jp5-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "J-P5: materialize frozen development payload"
          git push
