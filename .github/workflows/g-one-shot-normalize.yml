name: G One-Shot Normalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'audit/g-modeling-data-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev,api]'
      - name: Normalize and validate G Python changes
        run: python scripts/g_quality_normalize.py --base-sha "${{ github.event.pull_request.base.sha }}"
      - name: Commit normalized G sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/commander_lab/agents/pilots.py \
            src/commander_lab/engine/structural/fixtures.py \
            src/commander_lab/engine/structural/profiles.py \
            src/commander_lab/engine/structural/simulator.py \
            src/commander_lab/evals/golden.py \
            src/commander_lab/evals/models.py \
            src/commander_lab/models/__init__.py \
            src/commander_lab/models/meta.py \
            src/commander_lab/models/pilots.py \
            src/commander_lab/models/roles.py \
            src/commander_lab/models/structural.py \
            tests/golden/test_g_decision_quality.py \
            tests/unit/test_g_modeling_quality.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No normalization changes required."
          else
            git commit -m "fix(G): satisfy strict quality gate"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
