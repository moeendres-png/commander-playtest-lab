name: WS40 v1.0.3 PILOT_PILE Extract
on:
  push:
    branches: [ws40/forge-core-remediation-requalification]
    paths:
      - '.github/workflows/ws40-v103-pilot-pile-extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws40/forge-core-remediation-requalification
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: 24152acf36b5a560c23ccacfed3f31d3039537eb
          path: ws41-lock
          sparse-checkout: qualification/ws41
      - name: Verify immutable WS41 source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ws41-lock rev-parse HEAD)" = '24152acf36b5a560c23ccacfed3f31d3039537eb'
          test "$(git -C ws41-lock rev-parse HEAD^{tree})" = '428bbe58b2ea7b869200521092a8768108029b47'
          echo '8f6e3778e96079dbb501b9f5d72f007da0549e26b836011a855c0dbd2c6237c5  ws41-lock/qualification/ws41/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_3.json' | sha256sum -c -
      - name: Extract exact PILOT_PILE record
        shell: python
        run: |
          import json
          from pathlib import Path

          src = Path('ws41-lock/qualification/ws41/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_3.json')
          doc = json.loads(src.read_text())
          matches = []
          def walk(x, path='$'):
              if isinstance(x, dict):
                  if x.get('fixture_id') == 'PILOT_PILE':
                      matches.append((path, x))
                  for k, v in x.items():
                      walk(v, f'{path}.{k}')
              elif isinstance(x, list):
                  for i, v in enumerate(x):
                      walk(v, f'{path}[{i}]')
          walk(doc)
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one PILOT_PILE record, got {len(matches)} at {[p for p,_ in matches]}')
          record_path, record = matches[0]
          out = {
              'schema_version': 'commander-lab.ws40-v1.0.3-exact-record-extract/1.0.0',
              'source_commit': '24152acf36b5a560c23ccacfed3f31d3039537eb',
              'source_tree': '428bbe58b2ea7b869200521092a8768108029b47',
              'source_materialization_sha256': '8f6e3778e96079dbb501b9f5d72f007da0549e26b836011a855c0dbd2c6237c5',
              'record_path': record_path,
              'record': record,
          }
          dest = Path('candidate-qualification/ws40-forge/WS40_V1_0_3_PILOT_PILE_EXACT_RECORD.json')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
      - name: Persist exact record if changed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ws41-lock
          if git diff --quiet -- candidate-qualification/ws40-forge/WS40_V1_0_3_PILOT_PILE_EXACT_RECORD.json && git ls-files --error-unmatch candidate-qualification/ws40-forge/WS40_V1_0_3_PILOT_PILE_EXACT_RECORD.json >/dev/null 2>&1; then
            echo 'Exact record already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-qualification/ws40-forge/WS40_V1_0_3_PILOT_PILE_EXACT_RECORD.json
          git commit -m 'ws40: persist exact v1.0.3 PILOT_PILE record'
          git push origin HEAD:ws40/forge-core-remediation-requalification
