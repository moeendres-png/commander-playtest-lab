name: Standalone deckbuilder smoke tests
on:
  push:
    branches: [deckbuilder-standalone-20261111]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: pytest -q tests/test_standalone.py
