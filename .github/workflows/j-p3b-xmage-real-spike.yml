name: J-P3B XMage Real Spike

on:
  push:
    branches:
      - roadmap/j-p3b-xmage-real-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xmage-real-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XMAGE_REPO: https://github.com/magefree/mage.git
      XMAGE_COMMIT: 06d166b098ad36b277edef01116472203d5a047e
      CONTRACT_HASH: 89e0813ec66787328dd4b204f57cb5c404694dec29d249fbbb8785fad0a6d2c6
      SCORING_HASH: 67bc2d99e604f22c3a0d6cc3e00682fe9ac5cb86faccae979418eb2cf40d6227
      FIXTURE_HASH: cfea9c136b9126c4d367b0c91ebfe4089a47490c7d60dfae5e78dd307eb47dbb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'

      - name: Record host and frozen identities
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_XMAGE_RAW_EVIDENCE/logs J_P3_XMAGE_RAW_EVIDENCE/source J_P3_XMAGE_RAW_EVIDENCE/runtime J_P3_XMAGE_RAW_EVIDENCE/controller
          {
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "runner_os=$RUNNER_OS"
            echo "arch=$(uname -m)"
            uname -a
            java -version 2>&1
            mvn -version 2>&1
          } | tee J_P3_XMAGE_RAW_EVIDENCE/runtime/host.txt
          {
            echo "contract_hash=$CONTRACT_HASH"
            echo "scoring_hash=$SCORING_HASH"
            echo "fixture_hash=$FIXTURE_HASH"
            echo "xmage_repo=$XMAGE_REPO"
            echo "xmage_commit=$XMAGE_COMMIT"
          } | tee J_P3_XMAGE_RAW_EVIDENCE/frozen-identities.txt

      - name: Acquire exact XMage source
        shell: bash
        run: |
          set -eu
          git clone --no-checkout "$XMAGE_REPO" xmage 2>&1 | tee J_P3_XMAGE_RAW_EVIDENCE/logs/acquisition.log
          cd xmage
          git checkout --detach "$XMAGE_COMMIT" 2>&1 | tee -a ../J_P3_XMAGE_RAW_EVIDENCE/logs/acquisition.log
          ACTUAL=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          printf 'requested_commit=%s\nactual_commit=%s\ntree=%s\n' "$XMAGE_COMMIT" "$ACTUAL" "$TREE" | tee ../J_P3_XMAGE_RAW_EVIDENCE/source/provider-identity.txt
          test "$ACTUAL" = "$XMAGE_COMMIT"
          git status --porcelain=v1 | tee ../J_P3_XMAGE_RAW_EVIDENCE/source/provider-git-status.txt
          sha256sum pom.xml Mage.Server/src/main/java/mage/server/Main.java Mage.Common/src/main/java/mage/remote/interfaces/PlayerActions.java > ../J_P3_XMAGE_RAW_EVIDENCE/source/primary-source-sha256.txt

      - name: Build real XMage modules
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd xmage
          mvn -B -DskipTests -pl Mage.Server,Mage.Tests -am install > ../J_P3_XMAGE_RAW_EVIDENCE/logs/build.log 2>&1
          RC=$?
          echo "$RC" > ../J_P3_XMAGE_RAW_EVIDENCE/runtime/build-exit-code.txt
          tail -n 120 ../J_P3_XMAGE_RAW_EVIDENCE/logs/build.log
          exit $RC

      - name: Run native XMage partner Commander test
        id: partner
        if: always() && steps.build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd xmage
          mvn -B -pl Mage.Tests -Dtest=org.mage.test.commander.duel.CastBGPartnerCommanderTest#testCastBothPartnerCommanders test > ../J_P3_XMAGE_RAW_EVIDENCE/logs/partner-test.log 2>&1
          RC=$?
          echo "$RC" > ../J_P3_XMAGE_RAW_EVIDENCE/runtime/partner-test-exit-code.txt
          tail -n 100 ../J_P3_XMAGE_RAW_EVIDENCE/logs/partner-test.log
          exit $RC

      - name: Probe native multiplayer and Commander source coverage
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -eu
          cd xmage
          grep -RInE 'playerC|playerD' Mage.Tests/src/test/java/org/mage/test/commander 2>/dev/null | head -n 200 > ../J_P3_XMAGE_RAW_EVIDENCE/source/commander-player-cd-references.txt || true
          grep -RInE 'playerC|playerD' Mage.Tests/src/test/java/org/mage/test/multiplayer 2>/dev/null | head -n 200 > ../J_P3_XMAGE_RAW_EVIDENCE/source/multiplayer-player-cd-references.txt || true
          grep -RIn 'class CommanderFreeForAllMatch' Mage.Server.Plugins Mage 2>/dev/null > ../J_P3_XMAGE_RAW_EVIDENCE/source/commander-free-for-all-class.txt || true

      - name: Start real server, exercise remote session, then bounded shutdown
        id: server
        if: always() && steps.build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd xmage/Mage.Server
          mvn -B dependency:build-classpath -Dmdep.outputFile=target/jp3b-classpath.txt > ../../J_P3_XMAGE_RAW_EVIDENCE/logs/classpath.log 2>&1
          CP_RC=$?
          if [ "$CP_RC" -ne 0 ]; then
            echo "$CP_RC" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/server-start-exit-code.txt
            exit "$CP_RC"
          fi
          CP="target/classes:$(cat target/jp3b-classpath.txt)"
          printf '%s\n' "$CP" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/runtime-classpath.txt
          java -Dxmage.testMode=true -Dxmage.config.path=release/config/config.xml -cp "$CP" mage.server.Main -testMode=true > ../../J_P3_XMAGE_RAW_EVIDENCE/logs/server.log 2>&1 &
          PID=$!
          echo "$PID" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/server-pid.txt
          STARTED=0
          for i in $(seq 1 90); do
            if grep -q 'Started MAGE server' ../../J_P3_XMAGE_RAW_EVIDENCE/logs/server.log; then STARTED=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          echo "$STARTED" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/server-started.txt
          ps -p "$PID" -o pid,ppid,stat,etime,args > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/server-process-before-shutdown.txt 2>&1 || true

          cat > ../../J_P3_XMAGE_RAW_EVIDENCE/controller/XmageRemoteProbe.java <<'JAVA'
          import java.util.UUID;
          import mage.constants.MultiplayerAttackOption;
          import mage.constants.PlayerAction;
          import mage.constants.RangeOfInfluence;
          import mage.game.match.MatchOptions;
          import mage.interfaces.MageClient;
          import mage.interfaces.callback.ClientCallback;
          import mage.remote.Connection;
          import mage.remote.SessionImpl;
          import mage.utils.MageVersion;
          import mage.view.TableView;

          public final class XmageRemoteProbe implements MageClient {
              @Override public MageVersion getVersion() { return new MageVersion(XmageRemoteProbe.class); }
              @Override public void connected(String message) { System.out.println("callback_connected=" + message); }
              @Override public void disconnected(boolean askToReconnect, boolean keepMySessionActive) { System.out.println("callback_disconnected=" + askToReconnect + "," + keepMySessionActive); }
              @Override public void showMessage(String message) { System.out.println("callback_message=" + message); }
              @Override public void showError(String message) { System.out.println("callback_error=" + message); }
              @Override public void onNewConnection() { System.out.println("callback_new_connection=true"); }
              @Override public void onCallback(ClientCallback callback) {
                  try { callback.decompressData(); } catch (Throwable ignored) {}
                  try { System.out.println("callback_event=" + callback.getInfo()); }
                  catch (Throwable t) { System.out.println("callback_event=unprintable:" + t.getClass().getName()); }
              }

              public static void main(String[] args) throws Exception {
                  System.setProperty("java.awt.headless", "true");
                  XmageRemoteProbe client = new XmageRemoteProbe();
                  SessionImpl session = new SessionImpl(client);
                  Connection c = new Connection();
                  c.setHost("127.0.0.1");
                  c.setPort(17171);
                  c.setProxyType(Connection.ProxyType.NONE);
                  c.setUsername("Admin");
                  c.setPassword("");
                  c.setEmail("");
                  c.setUserIdStr("jp3b-xmage-remote-probe");
                  c.setAdminPassword("");

                  boolean connected = session.connectStart(c);
                  System.out.println("connected=" + connected);
                  System.out.println("is_connected=" + session.isConnected());
                  if (!connected || !session.isConnected()) {
                      System.out.println("last_error=" + session.getLastError());
                      System.exit(20);
                  }

                  System.out.println("server_ready=" + session.isServerReady());
                  System.out.println("version_info=" + session.getVersionInfo());
                  System.out.println("player_types=" + java.util.Arrays.toString(session.getPlayerTypes()));
                  System.out.println("deck_types=" + java.util.Arrays.toString(session.getDeckTypes()));
                  System.out.println("game_types_count=" + session.getGameTypes().size());
                  for (Object type : session.getGameTypes()) {
                      System.out.println("game_type=" + String.valueOf(type));
                  }

                  UUID room = session.getMainRoomId();
                  System.out.println("main_room_id=" + room);
                  int tablesBefore = session.getTables(room).size();
                  System.out.println("tables_before=" + tablesBefore);

                  MatchOptions options = new MatchOptions("J-P3B XMage remote probe", "Commander Free For All", true);
                  options.setDeckType("Commander");
                  options.setWinsNeeded(1);
                  options.setFreeMulligans(1);
                  options.setAttackOption(MultiplayerAttackOption.MULTIPLE);
                  options.setRange(RangeOfInfluence.ALL);
                  TableView table = session.createTable(room, options);
                  System.out.println("commander_table_created=" + (table != null));
                  if (table != null) {
                      System.out.println("created_table_id=" + table.getTableId());
                      System.out.println("tables_after_create=" + session.getTables(room).size());
                  }

                  UUID bogusGame = UUID.randomUUID();
                  boolean bogusActionTransport = session.sendPlayerAction(PlayerAction.CONCEDE, bogusGame, null);
                  System.out.println("bogus_game_id=" + bogusGame);
                  System.out.println("bogus_game_action_transport_return=" + bogusActionTransport);
                  System.out.println("bogus_action_note=transport return is not treated as semantic illegal-action rejection evidence");

                  if (table != null) {
                      boolean removed = session.removeTable(room, table.getTableId());
                      System.out.println("table_remove_return=" + removed);
                      System.out.println("tables_after_remove=" + session.getTables(room).size());
                  }
                  session.connectStop(false, false);
                  System.out.println("remote_probe_complete=true");
              }
          }
          JAVA

          javac -cp "$CP" ../../J_P3_XMAGE_RAW_EVIDENCE/controller/XmageRemoteProbe.java > ../../J_P3_XMAGE_RAW_EVIDENCE/logs/remote-probe-compile.log 2>&1
          COMPILE_RC=$?
          echo "$COMPILE_RC" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/remote-probe-compile-exit-code.txt
          REMOTE_RC=125
          if [ "$COMPILE_RC" -eq 0 ] && [ "$STARTED" -eq 1 ]; then
            java -Djava.awt.headless=true -cp "$CP:../../J_P3_XMAGE_RAW_EVIDENCE/controller" XmageRemoteProbe > ../../J_P3_XMAGE_RAW_EVIDENCE/logs/remote-probe.log 2>&1
            REMOTE_RC=$?
          fi
          echo "$REMOTE_RC" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/remote-probe-exit-code.txt
          cat ../../J_P3_XMAGE_RAW_EVIDENCE/logs/remote-probe-compile.log || true
          cat ../../J_P3_XMAGE_RAW_EVIDENCE/logs/remote-probe.log || true

          kill -TERM "$PID" 2>/dev/null || true
          CLEAN=0
          for i in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then CLEAN=1; break; fi
            sleep 1
          done
          if [ "$CLEAN" -eq 0 ]; then kill -KILL "$PID" 2>/dev/null || true; fi
          wait "$PID" 2>/dev/null
          WAIT_RC=$?
          echo "$CLEAN" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/bounded-shutdown.txt
          echo "$WAIT_RC" > ../../J_P3_XMAGE_RAW_EVIDENCE/runtime/server-wait-exit-code.txt
          tail -n 160 ../../J_P3_XMAGE_RAW_EVIDENCE/logs/server.log
          test "$STARTED" -eq 1

      - name: Capture native control surface source evidence
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_XMAGE_RAW_EVIDENCE/source
          if [ -d xmage/.git ]; then
            cp xmage/Mage.Common/src/main/java/mage/remote/interfaces/PlayerActions.java J_P3_XMAGE_RAW_EVIDENCE/source/PlayerActions.java
            cp xmage/Mage.Common/src/main/java/mage/remote/interfaces/GamePlay.java J_P3_XMAGE_RAW_EVIDENCE/source/GamePlay.java
            cp xmage/Mage.Common/src/main/java/mage/remote/interfaces/Replays.java J_P3_XMAGE_RAW_EVIDENCE/source/Replays.java
            cp xmage/Mage.Common/src/main/java/mage/interfaces/MageServer.java J_P3_XMAGE_RAW_EVIDENCE/source/MageServer.java
            find xmage -path '*mage/remote/interfaces/*' -name '*.java' -maxdepth 12 -print | sort > J_P3_XMAGE_RAW_EVIDENCE/source/remote-interface-files.txt || true
            grep -RInE 'sendPlayer|GamePlay|legal|priority|replay|Replay' xmage/Mage.Common/src/main/java/mage/remote xmage/Mage.Server/src/main/java 2>/dev/null | head -n 800 > J_P3_XMAGE_RAW_EVIDENCE/source/native-control-surface-grep.txt || true
          fi

      - name: Finalize immutable raw-evidence manifest
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p J_P3_XMAGE_RAW_EVIDENCE
          {
            echo "provider=xmage"
            echo "provider_commit=$XMAGE_COMMIT"
            echo "controller_repo_commit=$GITHUB_SHA"
            echo "contract_hash=$CONTRACT_HASH"
            echo "scoring_hash=$SCORING_HASH"
            echo "fixture_hash=$FIXTURE_HASH"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "partner_outcome=${{ steps.partner.outcome }}"
            echo "server_outcome=${{ steps.server.outcome }}"
            echo "real_provider_claim_requires_raw_logs=true"
          } > J_P3_XMAGE_RAW_EVIDENCE/manifest-bindings.txt
          find J_P3_XMAGE_RAW_EVIDENCE -type f ! -name SHA256SUMS.txt ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > J_P3_XMAGE_RAW_EVIDENCE/SHA256SUMS.txt
          sha256sum J_P3_XMAGE_RAW_EVIDENCE/SHA256SUMS.txt > J_P3_XMAGE_RAW_EVIDENCE/MANIFEST_SHA256.txt
          cat J_P3_XMAGE_RAW_EVIDENCE/manifest-bindings.txt
          cat J_P3_XMAGE_RAW_EVIDENCE/MANIFEST_SHA256.txt

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: J_P3_XMAGE_RAW_EVIDENCE
          path: J_P3_XMAGE_RAW_EVIDENCE
          if-no-files-found: error
          retention-days: 90
