name: J-MVP-R cleanup

on:
  push:
    branches:
      - roadmap/j-mvp-r-rogshai-readiness

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'J-MVP-R: finalize clean RogShai MVP scope'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize MVP scope
        shell: bash
        run: |
          set -euo pipefail
          FILES="src/commander_lab/fresh_rebuild.py src/commander_lab/fresh_rebuild_experiments.py src/commander_lab/rogshai_mvp_acceptance.py tests/integration/test_rogshai_mvp_readiness.py"
          ruff check --fix $FILES
          ruff format $FILES
          ruff check $FILES
          ruff format --check $FILES
      - name: Type and targeted acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy src/commander_lab/fresh_rebuild.py src/commander_lab/fresh_rebuild_experiments.py src/commander_lab/rogshai_mvp_acceptance.py
          python -m pytest -q tests/integration/test_rogshai_mvp_readiness.py
      - name: Commit normalized MVP scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/j-mvp-r-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "J-MVP-R: finalize clean RogShai MVP scope"
          git push origin "HEAD:${GITHUB_REF_NAME}"
