name: J-MVP-R cleanup

on:
  push:
    branches:
      - roadmap/j-mvp-r-rogshai-readiness

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Restore verified current-Drive runtime projection
        shell: bash
        run: |
          set -euo pipefail
          runtime='data/rogshai_mvp/CURRENT_DRIVE_RUNTIME.json.gz.b64'
          : > "$runtime"
          for blob in \
            fc542619c56bc7562b655b76725d09b9de961502 \
            59bea0531adf968722c58c2652262253a68fe358 \
            41812a02950cb2257609696407b01e6d7b0be6e8 \
            0863884bd90db32f146f7a9d928efdce477a7d14 \
            3c97197d9727eb2c3204010e9ba4da88e6f63c56 \
            aff718de0fb381007820049e9f55b08255b25da7 \
            ccad9aaf7814cc63dfe18f7b70be7a96726124e0 \
            495b8a95649faef555df6f1454a73fe4ddb2e2e3 \
            9e0b0380b422835188674c264326c8376ef8668c \
            2c32fb0ce1213ca1eed9590924dd9a73f5439ef0 \
            603022b1374cef453634dc3c2c0002f4afb820eb \
            1d74913d20f2d5d019999a33b034a8bb420451d0 \
            6af9cb2061b727e977449cef6e66a1dbe4e261e7 \
            d57afbb4fcc184ff41ba98413105c90ee292f55c \
            70f63b6613ba48d8e4dab18f715f5e3e660282c2 \
            c29b0158aa5b914ed5530a74a5812b84ad0aba23 \
            a198878e30becfbb1e7249450850e867aac1671a
          do
            git cat-file blob "$blob" >> "$runtime"
          done
          printf '\n' >> "$runtime"
          printf '%s  %s\n' 'bf45a6b0e672b76ac5b4d05991ca0d646bfe23de9a32cdbaadfa18b31881199a' "$runtime" | sha256sum -c -
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Close remaining strict-typing and runtime-schema gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fresh = Path('src/commander_lab/fresh_rebuild.py')
          text = fresh.read_text(encoding='utf-8')
          text = text.replace(
              '"roles": list(raw.get("roles", [])) if isinstance(raw.get("roles"), list) else [],',
              '"roles": list(cast(list[object], raw.get("roles", []))) if isinstance(raw.get("roles"), list) else [],',
          )
          text = text.replace(
              'list(raw.get("hooks", [])) if isinstance(raw.get("hooks"), list) else []',
              'list(cast(list[object], raw.get("hooks", []))) if isinstance(raw.get("hooks"), list) else []',
          )
          text = text.replace(
              'list(raw.get("targets", [])) if isinstance(raw.get("targets"), list) else []',
              'list(cast(list[object], raw.get("targets", []))) if isinstance(raw.get("targets"), list) else []',
          )
          text = text.replace(
              'compact.get("coverage_counts")',
              'compact.get("coverage_counts", compact.get("coverage"))',
          )
          fresh.write_text(text, encoding='utf-8')

          acceptance = Path('src/commander_lab/rogshai_mvp_acceptance.py')
          text = acceptance.read_text(encoding='utf-8')
          text = text.replace('    BASIC_LANDS,\n', '')
          text = text.replace(
              'from commander_lab.fresh_rebuild import (\n',
              'from commander_lab.tools.candidates import BASIC_LANDS\nfrom commander_lab.fresh_rebuild import (\n',
              1,
          )
          text = text.replace(
              '    pair_id: str,\n):\n    return run_paired_structural_comparison(',
              '    pair_id: str,\n) -> tuple[Any, list[dict[str, object]]]:\n    return run_paired_structural_comparison(',
          )
          acceptance.write_text(text, encoding='utf-8')

          contract = Path('data/rogshai_mvp/K1_K2_RUNTIME_CONTRACT.json')
          text = contract.read_text(encoding='utf-8')
          text = text.replace(
              '9573d74eb9f80a7302cf74a9c88876885bcdaca1823c441f666c57fe741ef3d9',
              'bf45a6b0e672b76ac5b4d05991ca0d646bfe23de9a32cdbaadfa18b31881199a',
          )
          contract.write_text(text, encoding='utf-8')
          PY
      - name: Normalize MVP scope
        shell: bash
        run: |
          set -euo pipefail
          FILES="src/commander_lab/fresh_rebuild.py src/commander_lab/fresh_rebuild_experiments.py src/commander_lab/rogshai_mvp_acceptance.py tests/integration/test_rogshai_mvp_readiness.py"
          ruff check --fix $FILES
          ruff format $FILES
          ruff check $FILES
          ruff format --check $FILES
      - name: Type and targeted acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy src/commander_lab/fresh_rebuild.py src/commander_lab/fresh_rebuild_experiments.py src/commander_lab/rogshai_mvp_acceptance.py
          python -m pytest -q tests/integration/test_rogshai_mvp_readiness.py
      - name: Commit normalized MVP scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/j-mvp-r-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "J-MVP-R: finalize clean RogShai MVP scope"
          git push origin "HEAD:${GITHUB_REF_NAME}"
