name: Rules Evidence Canonical Ruff Fix
on:
  push:
    branches:
      - rules-evidence/capability-unlock
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical Ruff
        run: python -m pip install "ruff==0.16.4"
      - name: Canonical fix and verify allowlist
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/rules_evidence_campaign.py
            src/commander_lab/engine/rules/tactical.py
            src/commander_lab/whole_deck/tactical_capabilities.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              scripts/rules_evidence_campaign.py|src/commander_lab/engine/rules/tactical.py|src/commander_lab/whole_deck/tactical_capabilities.py) ;;
              *) echo "unexpected file changed: $path"; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit canonical output and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rules-evidence-ruff-fix.yml .ruff-trigger
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply canonical Ruff formatting to rules evidence patch'
          git push origin HEAD:rules-evidence/capability-unlock
