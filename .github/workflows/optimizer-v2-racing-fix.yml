name: Optimizer v2 Progressive Racing Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Patch progressive racing and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/commander_lab/whole_deck/optimizer_search.py')
          text = path.read_text(encoding='utf-8')
          old = '''        by_id = {row.candidate_id: row for row in current}\n        variant_by_id = {variant.variant_id: variant for variant in variants}\n        for budget_index, budget in enumerate(self.racing.budgets[1:], start=1):\n            survivor_ids = select_racing_survivors(tuple(by_id.values()), config=self.racing)\n            next_rows: dict[str, ExploratoryEvaluation] = {}\n            for index, candidate_id in enumerate(survivor_ids):\n                variant = variant_by_id[candidate_id]\n                raw = self.evaluator(\n                    variant,\n                    budget,\n                    generation * 100_003 + budget_index * 10_007 + index,\n                )\n                previous = by_id[candidate_id]\n                next_rows[candidate_id] = raw.model_copy(\n                    update={\n                        "generation": generation,\n                        "novelty": previous.novelty,\n                        "qd_cell": previous.qd_cell,\n                    }\n                )\n                calls += 1\n                scenario_pairs += budget\n            by_id.update(next_rows)\n'''
          new = '''        by_id = {row.candidate_id: row for row in current}\n        variant_by_id = {variant.variant_id: variant for variant in variants}\n        active_ids = tuple(by_id)\n        for budget_index, budget in enumerate(self.racing.budgets[1:], start=1):\n            active_rows = tuple(by_id[candidate_id] for candidate_id in active_ids)\n            survivor_ids = select_racing_survivors(active_rows, config=self.racing)\n            next_rows: dict[str, ExploratoryEvaluation] = {}\n            for index, candidate_id in enumerate(survivor_ids):\n                variant = variant_by_id[candidate_id]\n                raw = self.evaluator(\n                    variant,\n                    budget,\n                    generation * 100_003 + budget_index * 10_007 + index,\n                )\n                previous = by_id[candidate_id]\n                next_rows[candidate_id] = raw.model_copy(\n                    update={\n                        "generation": generation,\n                        "novelty": previous.novelty,\n                        "qd_cell": previous.qd_cell,\n                    }\n                )\n                calls += 1\n                scenario_pairs += budget\n            by_id.update(next_rows)\n            active_ids = survivor_ids\n'''
          if old not in text:
              raise SystemExit('adaptive racing block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/unit/test_optimizer_v2.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''\ndef test_exploratory_evidence_cannot_masquerade_as_confirmatory() -> None:\n'''
          addition = '''\ndef test_adaptive_racing_progressively_reduces_survivors() -> None:\n    search = AdaptiveWholeDeckSearch(\n        {PolicyId.OWNED_POOL_NEUTRAL.value: _FakeEngine()},  # type: ignore[dict-item]\n        evaluator=_FakeEvaluator(),\n        seed=303,\n        qd=QDConfig(elites_per_cell=2),\n        racing=RacingConfig(\n            budgets=(4, 8, 16),\n            survival_fraction=0.5,\n            exploration_fraction=0.25,\n            minimum_survivors=1,\n        ),\n        learning=LearningConfig(update_rate=0.4, exploration_floor=0.05),\n    )\n    variants = tuple(_variant(str(index)) for index in range(1, 9))\n    archive = QualityDiversityArchive(search.qd)\n    _, calls, pairs = search._evaluate_batch(variants, generation=0, archive=archive)\n    assert calls == 14  # 8 -> 4 -> 2 candidates\n    assert pairs == 96  # 8*4 + 4*8 + 2*16\n\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          test_path.write_text(tests.replace(marker, '\n' + addition + marker, 1), encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          ruff check --fix src/commander_lab/whole_deck/optimizer_search.py tests/unit/test_optimizer_v2.py
          ruff format src/commander_lab/whole_deck/optimizer_search.py tests/unit/test_optimizer_v2.py
          ruff check src/commander_lab/whole_deck/optimizer_search.py tests/unit/test_optimizer_v2.py
          ruff format --check src/commander_lab/whole_deck/optimizer_search.py tests/unit/test_optimizer_v2.py
          mypy src/commander_lab/whole_deck/optimizer_search.py
          pytest -q tests/unit/test_optimizer_v2.py tests/unit/test_optimizer_v2_release.py
      - name: Commit source and test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commander_lab/whole_deck/optimizer_search.py tests/unit/test_optimizer_v2.py
          git commit -m "Make Optimizer v2 racing progressively adaptive"
      - name: Remove one-shot workflow and publish
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/optimizer-v2-racing-fix.yml
          git commit -m "Remove one-shot Optimizer v2 racing fixer"
          git push origin HEAD:${{ github.head_ref }}
