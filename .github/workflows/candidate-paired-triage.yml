name: Candidate Paired Triage

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/commander_lab/candidate_evaluation.py'
      - 'src/commander_lab/priority_workflows.py'
      - 'src/commander_lab/advancement.py'
      - 'src/commander_lab/optimization/**'
      - 'scripts/run_candidate_paired_triage.py'
      - '.github/workflows/candidate-paired-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-paired-triage-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  paired-structural-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: '3.12'
          cache: pip
      - name: Install structural triage runtime
        run: python -m pip install -e '.[dev]'
      - name: Run first-pass paired candidate triage
        env:
          CANDIDATE_TRIAGE_ITERATIONS: '8'
        run: python scripts/run_candidate_paired_triage.py
      - name: Verify triage evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'artifacts/candidate_evaluation/CURRENT_PAIRED_CANDIDATE_TRIAGE.json'
          )
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('evidence_class') != 'structural_model_estimates':
              raise SystemExit('paired triage lost its structural evidence class')
          if payload.get('direct_cross_variant_pairing') is not False:
              raise SystemExit('paired triage incorrectly claims cross-variant pairing')
          if payload.get('direct_cross_variant_ranking_allowed') is not False:
              raise SystemExit('paired triage incorrectly allows direct candidate ranking')
          if payload.get('canonical_mutation_performed') is not False:
              raise SystemExit('paired triage mutated canonical data')
          if payload.get('inventory_reservation_performed') is not False:
              raise SystemExit('paired triage reserved inventory')
          if payload.get('final_recommendation') is not False:
              raise SystemExit('paired triage emitted a premature final recommendation')
          results = payload.get('results')
          if not isinstance(results, list) or not results:
              raise SystemExit('paired triage produced no executed candidate results')
          for row in results:
              provenance = row.get('candidate_provenance')
              if not isinstance(provenance, dict):
                  raise SystemExit('paired triage row lost candidate provenance')
              if provenance.get('availability') != 'physical_free':
                  raise SystemExit('physical-only priority adapter executed nonphysical candidate')
              if row.get('evidence_class') != 'structural_model_estimates':
                  raise SystemExit('paired triage row lost structural evidence class')
              if row.get('final_recommendation') is not False:
                  raise SystemExit('paired triage row emitted a premature recommendation')

          print('CANDIDATE_PAIRED_TRIAGE=PASS')
          print('PAIRING_SCOPE=baseline_vs_variant_within_candidate_only')
          print('EVIDENCE_BOUNDARY=structural_first_pass_not_empirical_winrate')
          PY
      - name: Assert tracked repository remains clean
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: candidate-paired-triage-${{ github.sha }}
          path: artifacts/candidate_evaluation/CURRENT_PAIRED_CANDIDATE_TRIAGE.json
          if-no-files-found: error
          retention-days: 14
