name: WS40 Native Construction 107

on:
  push:
    branches: [ws40/forge-core-remediation-requalification]
    paths:
      - 'qualification/providers/forge/gpl/Ws40SuccessorState.java'
      - 'scripts/ws40_apply_successor_state_overlay.py'
      - 'scripts/ws40_fix_successor_state_java.py'
      - 'scripts/ws40_fix_construction_runner.py'
      - 'scripts/ws40_fix_construction_runner_natural_objects.py'
      - 'candidate-qualification/ws40-forge/run_native_construction_107.py'
      - '.github/workflows/ws40-native-construction-107.yml'
  workflow_dispatch:

env:
  WS32_COMMIT: 038d0f38635eecee4e331c99af41f148de267a26
  WS32_TREE: 0d160128119f2bad30b220a17c43419b50b7edbe
  FORGE_COMMIT: 3f53c7c4e93c011e781680ae2a0c195dd71414c0
  FORGE_TREE: 481d3ee3b4798b78b4f00a93cc8e2cb54d05391f
  FORGE_VERSION: 2.0.15-SNAPSHOT

permissions:
  contents: read

jobs:
  construction-107:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.WS32_COMMIT }}
          path: contract-lock
          sparse-checkout: qualification/ws32
          fetch-depth: 1
      - name: Verify immutable WS32 v1.0.2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-lock rev-parse HEAD)" = "$WS32_COMMIT"
          test "$(git -C contract-lock rev-parse HEAD^{tree})" = "$WS32_TREE"
          (cd contract-lock/qualification/ws32 && sha256sum -c SHA256SUMS_v1_0_2)
      - uses: actions/checkout@v4
        with:
          repository: moeendres-png/forge
          ref: ${{ env.FORGE_COMMIT }}
          path: vendor/engine-source/forge
          fetch-depth: 1
      - name: Verify exact repaired Forge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/engine-source/forge rev-parse HEAD)" = "$FORGE_COMMIT"
          test "$(git -C vendor/engine-source/forge rev-parse HEAD^{tree})" = "$FORGE_TREE"
          grep -q "GNU GENERAL PUBLIC LICENSE" vendor/engine-source/forge/LICENSE
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact Forge game
        working-directory: vendor/engine-source/forge
        run: mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am -DskipTests install
      - name: Resolve isolated classpath
        working-directory: vendor/engine-source/forge
        run: mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile="$GITHUB_WORKSPACE/artifacts/ws40-construction/dependency-classpath.txt"
      - name: Build isolated WS40 provider with native state loader
        shell: bash
        run: |
          set -euo pipefail
          ev=artifacts/ws40-construction
          out="$ev/generated"
          mkdir -p "$out" "$ev/classes"
          python scripts/ws40_generate_forge_provider.py \
            --player-controller vendor/engine-source/forge/forge-game/src/main/java/forge/game/player/PlayerController.java \
            --output-dir "$out" --forge-commit "$FORGE_COMMIT" --forge-tree "$FORGE_TREE"
          python scripts/finalist_generate_forge_bootstrap.py \
            --source qualification/providers/forge/gpl/Ws23ForgeBootstrap.java \
            --output "$out/java/forge/game/player/Ws23ForgeBootstrap.java"
          python scripts/ws40_apply_successor_state_overlay.py \
            --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          cp qualification/providers/forge/gpl/Ws40SuccessorState.java "$out/java/forge/game/player/Ws40SuccessorState.java"
          python scripts/ws40_fix_successor_state_java.py --state-java "$out/java/forge/game/player/Ws40SuccessorState.java"
          ! grep -REn 'import forge\.(ai|gui)|RemoteClientGuiGame|PlayerControllerAi|ComputerUtilMana' "$out/java"
          ! grep -Eq 'forge-(ai|gui)' "$ev/dependency-classpath.txt"
          cp="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes:$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes:$(cat "$ev/dependency-classpath.txt")"
          javac -cp "$cp" -d "$ev/classes" \
            "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java" \
            "$out/java/forge/game/player/Ws23ForgeBootstrap.java" \
            "$out/java/forge/game/player/Ws40SuccessorState.java"
          printf '%s:%s:%s:%s\n' "$GITHUB_WORKSPACE/$ev/classes" \
            "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes" \
            "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes" \
            "$(cat "$ev/dependency-classpath.txt")" > "$ev/provider.classpath"
      - name: Execute exact immutable 107 native construction gate
        shell: bash
        run: |
          set -euo pipefail
          ev=artifacts/ws40-construction
          cp candidate-qualification/ws40-forge/run_native_construction_107.py "$ev/run_native_construction_107.py"
          python scripts/ws40_fix_construction_runner.py --runner "$ev/run_native_construction_107.py"
          python scripts/ws40_fix_construction_runner_natural_objects.py --runner "$ev/run_native_construction_107.py"
          export COMMANDER_LAB_FORGE_LANG_DIR="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-gui/res/languages"
          export COMMANDER_LAB_FORGE_PROVIDER_CMD="java -cp $(cat "$ev/provider.classpath") forge.game.player.Ws23ForgeBootstrap"
          python "$ev/run_native_construction_107.py" \
            --materialization contract-lock/qualification/ws32/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_2.json \
            --output "$ev/WS40_NATIVE_CONSTRUCTION_107.json"
          python - <<'PY'
          import json
          p=json.load(open('artifacts/ws40-construction/WS40_NATIVE_CONSTRUCTION_107.json'))
          assert p['status']=='PASS'
          assert p['denominator']==107 and p['pass_count']==107
          assert p['no_request_echo'] is True
          assert p['no_request_echo_proof']['provider_side_config_digest'] is True
          assert p['no_request_echo_proof']['request_values_used_by_normalizer'] is False
          assert all(r['construction_status']=='PASS' and r['requested_native_state_equal'] for r in p['rows'])
          assert p['family_counts']=={
            'actual_card':1,'hidden_information':20,'micro_rules':17,'multiplayer_commander':36,
            'pilot_boundary':17,'pilot_boundary_negative':7,'player_count':4,'replay_rng':5,
          }
          PY
      - name: Materialize source lock and evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ev=artifacts/ws40-construction
          python - <<'PY'
          import json, os, subprocess
          lock={
            'schema_version':'ws40-native-construction-source-lock/1.0.0',
            'commander_lab_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'ws32_commit':os.environ['WS32_COMMIT'],'ws32_tree':os.environ['WS32_TREE'],
            'forge_commit':os.environ['FORGE_COMMIT'],'forge_tree':os.environ['FORGE_TREE'],
            'process_boundary':'SEPARATE_GPL_JVM',
          }
          open('artifacts/ws40-construction/SOURCE_LOCK.json','w').write(json.dumps(lock,indent=2,sort_keys=True)+'\n')
          PY
          find "$ev" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$ev/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws40-native-construction-107-${{ github.sha }}
          path: artifacts/ws40-construction/
          if-no-files-found: error
          retention-days: 90
