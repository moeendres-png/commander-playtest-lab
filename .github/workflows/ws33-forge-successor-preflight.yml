name: WS-33 Forge Successor v1.0.2 Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - ws33/forge-successor-provider-qualification
    paths-ignore:
      - "qualification/evidence/ws33/**"
      - "handoffs/ws33/**"

permissions:
  contents: read
  actions: read

env:
  WS32_COMMIT: 038d0f386acc5dbd8b2cebfcf7d3ab4e87fb84de
  WS32_TREE: 9d3592d8ab8d232b8e3f55128b1951ab4564e8e5
  WS32_BUNDLE: 61002a78c7fdd2ab4bec30e64742a7954e9a6448e8f39e05503dbe26492aa20b
  FINALIST_FORGE_BASE: 8fb95d53d168228a3785f6270f33d5785df989a3
  FORGE_COMMIT: 1e604105f9e279331063824943b9222b6589f5d8
  FORGE_TREE: 994976e06aaf99b807646b60b1aa2ac9f7703df4
  FORGE_VERSION: 2.0.15-SNAPSHOT

jobs:
  successor-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout WS-33 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact WS-33 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$FINALIST_FORGE_BASE")" = "$FINALIST_FORGE_BASE"
          git merge-base --is-ancestor "$FINALIST_FORGE_BASE" HEAD
          mkdir -p artifacts/ws33
          printf '%s\n' "$GITHUB_SHA" > artifacts/ws33/WS33_RUN_HEAD.txt

      - name: Mount exact frozen WS-32 contract
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.WS32_COMMIT }}
          path: contract-lock
          sparse-checkout: qualification/ws32

      - name: Verify WS-32 commit tree bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-lock rev-parse HEAD)" = "$WS32_COMMIT"
          test "$(git -C contract-lock rev-parse HEAD^{tree})" = "$WS32_TREE"
          cd contract-lock/qualification/ws32
          sha256sum -c SHA256SUMS_v1_0_2
          python - <<'PY'
          import json, os
          m=json.load(open('WS32_BUNDLE_MANIFEST_v1_0_2.json'))
          assert m['contract_version'] == 'commander-lab.semantic-fixture-materialization/1.0.2'
          assert m['bundle_digest'] == os.environ['WS32_BUNDLE']
          p=json.load(open('SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_2.json'))
          assert p['schema_version'] == 'commander-lab.semantic-fixture-materialization/1.0.2'
          assert p['canonical_bundle_digest'] == os.environ['WS32_BUNDLE']
          assert len(p['records']) == 135
          assert all(r['semantic_executability'] == 'SEMANTIC_EXECUTABLE' for r in p['records'])
          ids={r['fixture_id'] for r in p['records']}
          owned={x for x in ids if not x.startswith('CARD_')} | {'CARD_02'}
          assert len(owned) == 107
          gate=json.load(open('CRITICAL_SUCCESSOR_GATE_v1_0_2.json'))
          assert gate['count'] == 81 and gate['semantic_executable_count'] == 81
          assert set(gate['fixture_ids']) <= ids
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WS-33 preflight source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile candidate-qualification/ws33-forge/ws33_successor_preflight.py

      - name: Checkout exact retained Forge source
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_COMMIT }}
          path: vendor/engine-source/forge
          fetch-depth: 1

      - name: Verify retained Forge source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/engine-source/forge rev-parse HEAD)" = "$FORGE_COMMIT"
          test "$(git -C vendor/engine-source/forge rev-parse HEAD^{tree})" = "$FORGE_TREE"
          grep -q "GNU GENERAL PUBLIC LICENSE" vendor/engine-source/forge/LICENSE
          git -C vendor/engine-source/forge diff --exit-code

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build pinned unmodified Forge game modules
        working-directory: vendor/engine-source/forge
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am -DskipTests install
          git diff --exit-code

      - name: Resolve isolated Forge classpath
        working-directory: vendor/engine-source/forge
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am dependency:build-classpath \
            -DincludeScope=compile \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/artifacts/ws33/dependency-classpath.txt"

      - name: Generate finalist provider baseline
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/ws33/generated
          mkdir -p "$out"
          python scripts/finalist_generate_forge_provider.py \
            --player-controller vendor/engine-source/forge/forge-game/src/main/java/forge/game/player/PlayerController.java \
            --output-dir "$out" \
            --forge-commit "$FORGE_COMMIT" \
            --forge-tree "$FORGE_TREE" \
            | tee artifacts/ws33/generator-summary.json
          python scripts/finalist_generate_forge_bootstrap.py \
            --source qualification/providers/forge/gpl/Ws23ForgeBootstrap.java \
            --output "$out/java/forge/game/player/Ws23ForgeBootstrap.java"
          ! grep -REn 'import forge\.(ai|gui)|RemoteClientGuiGame|PlayerControllerAi|ComputerUtilMana' "$out/java"
          ! grep -Eq 'forge-(ai|gui)' artifacts/ws33/dependency-classpath.txt

      - name: Compile separate GPL-side provider JVM
        shell: bash
        run: |
          set -euo pipefail
          cp="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes:$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes:$(cat artifacts/ws33/dependency-classpath.txt)"
          mkdir -p artifacts/ws33/classes
          javac -cp "$cp" -d artifacts/ws33/classes \
            artifacts/ws33/generated/java/forge/game/player/Ws23ForgeVerticalProvider.java \
            artifacts/ws33/generated/java/forge/game/player/Ws23ForgeBootstrap.java
          printf '%s:%s:%s:%s\n' \
            "$GITHUB_WORKSPACE/artifacts/ws33/classes" \
            "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes" \
            "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes" \
            "$(cat artifacts/ws33/dependency-classpath.txt)" > artifacts/ws33/provider.classpath
          ! grep -Eq 'forge-(ai|gui)' artifacts/ws33/provider.classpath
          git -C vendor/engine-source/forge diff --exit-code

      - name: Prove separate-process protocol handshake
        shell: bash
        run: |
          set -euo pipefail
          export COMMANDER_LAB_FORGE_LANG_DIR="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-gui/res/languages"
          export COMMANDER_LAB_FORGE_PROVIDER_CMD="java -cp $(cat artifacts/ws33/provider.classpath) forge.game.player.Ws23ForgeBootstrap"
          python - <<'PY'
          import json, os, shlex, subprocess
          p=subprocess.Popen(shlex.split(os.environ['COMMANDER_LAB_FORGE_PROVIDER_CMD']),
                             stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
          req={'protocol':'commander-lab.rules-service/1.1.0','message_type':'HANDSHAKE',
               'request_id':'ws33-handshake','payload':{}}
          out,err=p.communicate(json.dumps(req,separators=(',',':'))+'\n',timeout=60)
          assert p.returncode == 0, err
          rows=[json.loads(x) for x in out.splitlines() if x.strip()]
          assert len(rows) == 1
          msg=rows[0]
          assert msg['message_type'] == 'HANDSHAKE_RESULT'
          assert msg['payload']['verdict'] == 'PASS'
          assert msg['payload']['provider'] == 'forge'
          assert msg['payload']['forge_commit'] == os.environ['FORGE_COMMIT']
          open('artifacts/ws33/HANDSHAKE_PROOF.json','w').write(json.dumps(msg,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute exact successor construction-gate preflight
        shell: bash
        run: |
          set -euo pipefail
          export COMMANDER_LAB_FORGE_LANG_DIR="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-gui/res/languages"
          export COMMANDER_LAB_FORGE_PROVIDER_CMD="java -cp $(cat artifacts/ws33/provider.classpath) forge.game.player.Ws23ForgeBootstrap"
          python candidate-qualification/ws33-forge/ws33_successor_preflight.py \
            --materialization contract-lock/qualification/ws32/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_2.json \
            --digest-spec contract-lock/qualification/ws32/REQUESTED_STATE_DIGEST_SPEC_v1_0_2.json \
            --output-dir artifacts/ws33 \
            | tee artifacts/ws33/preflight-summary.json
          python - <<'PY'
          import json
          p=json.load(open('artifacts/ws33/WS33_SUCCESSOR_PREFLIGHT.json'))
          assert p['status'] == 'STOPPED_FAIL_CLOSED'
          assert p['contract']['ws33_owned_denominator'] == 107
          assert p['counts'] == {
              'CANONICAL_SETUP_UNSUPPORTED': 1,
              'FAIL': 0,
              'NOT_RUN_AFTER_STOP_CONDITION': 106,
              'PASS': 0,
          }
          f=p['first_record_result']
          assert f['fixture_id'] == 'PLAYER_COUNT_2P'
          assert f['narrow_native_snapshot_validation'] == 'PASS'
          assert f['provider_emitted_normalized_constructed_state'] is False
          assert f['defect_taxonomy'] == 'FORGE_PROVIDER_DEFECT'
          PY

      - name: Record exact source and topology lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          p={
            'schema_version':'commander-lab.ws33-source-lock/1.0.0',
            'repository':'moeendres-png/commander-playtest-lab',
            'ws33_branch':'ws33/forge-successor-provider-qualification',
            'ws33_run_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'finalist_forge_base':os.environ['FINALIST_FORGE_BASE'],
            'ws32':{
              'commit':os.environ['WS32_COMMIT'],
              'tree':os.environ['WS32_TREE'],
              'bundle_digest':os.environ['WS32_BUNDLE'],
              'contract_version':'commander-lab.semantic-fixture-materialization/1.0.2',
            },
            'forge':{
              'commit':os.environ['FORGE_COMMIT'],
              'tree':os.environ['FORGE_TREE'],
              'version':os.environ['FORGE_VERSION'],
              'pin_decision':'RETAIN_QUALIFIED_PIN',
              'source_modified':False,
            },
            'topology':{
              'process_boundary':'SEPARATE_GPL_JVM',
              'forge_ai_or_gui_on_provider_classpath':False,
              'one_active_simulation_per_forge_jvm_required':True,
            },
          }
          pathlib.Path('artifacts/ws33/WS33_SOURCE_LOCK.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY

      - name: Hash WS-33 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find artifacts/ws33 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/ws33/SHA256SUMS

      - name: Upload WS-33 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-forge-successor-preflight-${{ github.sha }}
          path: artifacts/ws33/
          if-no-files-found: error
          retention-days: 90
