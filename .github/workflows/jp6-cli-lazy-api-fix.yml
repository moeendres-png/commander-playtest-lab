name: J-P6 CLI Optional API Lazy Import Fix
on:
  push:
    branches: [roadmap/j-p6-performance-hardening]
    paths: [.github/workflows/jp6-cli-lazy-api-fix.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/commander_lab/cli/app.py')
          s=p.read_text(encoding='utf-8')
          top='from commander_lab.api import create_app\n'
          if top not in s:
              raise SystemExit('expected eager API import not found')
          s=s.replace(top, '', 1)
          old='''    try:\n        import uvicorn\n    except ImportError as exc:\n        raise RuntimeError(\n            "Install the api extra: pip install 'commander-playtest-lab[api]'"\n        ) from exc\n    uvicorn.run(create_app(root), host=host, port=port)\n'''
          new='''    try:\n        import uvicorn\n\n        from commander_lab.api import create_app\n    except ImportError as exc:\n        raise RuntimeError(\n            "Install the api extra: pip install 'commander-playtest-lab[api]'"\n        ) from exc\n    uvicorn.run(create_app(root), host=host, port=port)\n'''
          if old not in s:
              raise SystemExit('expected serve_tools block not found')
          s=s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          ruff check src/commander_lab/cli/app.py
          ruff format --check src/commander_lab/cli/app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('src/commander_lab/cli/app.py').read_text()
          prefix=s.split('@app.command("serve-tools")',1)[0]
          assert 'from commander_lab.api import create_app' not in prefix
          serve=s.split('@app.command("serve-tools")',1)[1].split('@app.command("serve-mcp")',1)[0]
          assert 'from commander_lab.api import create_app' in serve
          PY
          rm .github/workflows/jp6-cli-lazy-api-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'J-P6: lazy-load optional API dependencies from CLI'
          git push
