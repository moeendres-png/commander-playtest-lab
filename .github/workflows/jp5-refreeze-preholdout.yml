name: J-P5 Refreeze Pre-Holdout
on:
  push:
    branches: [roadmap/j-p5-optimizer-validation]
    paths: [.github/workflows/jp5-refreeze-preholdout.yml]
permissions: {contents: write}
jobs:
  refreeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with: {python-version: '3.12'}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.')
          holdout = root / 'data/evals/holdout/J_P5_OPTIMIZER_HOLDOUT_v1.json'
          freeze_path = root / 'docs/J_P5_DEVELOPMENT_FREEZE.json'
          seal_path = root / 'docs/J_P5_HOLDOUT_SEAL.json'
          output_path = root / 'docs/J_P5_HOLDOUT_FIRST_EVALUATION.json'
          expected_holdout = 'b75e8622097221b00ad51322e2ad13fe5158cfd8647e92d2cb21a0d65b447203'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          if output_path.exists():
              raise SystemExit('holdout output already exists; refreeze refused')
          if sha(holdout) != expected_holdout:
              raise SystemExit('holdout hash mismatch; refreeze refused')
          seal = json.loads(seal_path.read_text(encoding='utf-8'))
          if seal.get('outcomes_evaluated') is not False or seal.get('first_evaluation_status') != 'not_run':
              raise SystemExit('holdout seal no longer untouched; refreeze refused')
          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          if freeze.get('holdout_outcomes_seen') is not False:
              raise SystemExit('development freeze says holdout outcomes seen; refreeze refused')
          for rel in list(freeze['file_sha256']):
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'missing frozen file: {rel}')
              freeze['file_sha256'][rel] = sha(p)
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          freeze['development_commit_before_freeze_manifest'] = head
          freeze['development_tree_before_freeze_manifest'] = tree
          freeze['holdout_sha256'] = expected_holdout
          freeze['holdout_outcomes_seen'] = False
          freeze['status'] = 'frozen_pre_holdout'
          freeze['pre_holdout_gate_evidence'] = {
              'ci_run': 31447771796,
              'windows_run': 31447771839,
              'release_run': 31447771841,
              'status': 'PASS',
              'note': 'technical formatting/typing and byte-stability fixes only; no holdout outcomes evaluated',
          }
          freeze_path.write_text(json.dumps(freeze, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          freeze_sha = sha(freeze_path)
          seal['development_freeze_sha256'] = freeze_sha
          seal['development_content_tree'] = tree
          seal['outcomes_evaluated'] = False
          seal['first_evaluation_status'] = 'not_run'
          seal['sha256'] = expected_holdout
          seal['refrozen_pre_holdout_at'] = datetime.now(timezone.utc).isoformat()
          seal['refreeze_reason'] = 'semantic-preserving pre-holdout Ruff/Mypy hygiene and Windows byte-identity attributes; no optimizer/search/objective/finalist tuning'
          seal_path.write_text(json.dumps(seal, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'freeze_sha256': freeze_sha, 'holdout_sha256': expected_holdout, 'outcomes_evaluated': False}, indent=2))
          PY
          rm .github/workflows/jp5-refreeze-preholdout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'J-P5: renew pre-holdout freeze after technical hygiene'
          git push
