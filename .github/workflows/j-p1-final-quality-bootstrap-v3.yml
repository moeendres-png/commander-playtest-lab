name: J-P1 Final Strict Quality Candidate v3

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  validate-final-quality-candidate-v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact starting lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f4fd04f133e14879fd0cb05d8ae62a66728680b9"
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Replay reviewed transformation with exact current signature
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/j-p1-final-quality-bootstrap-v2.yml
          git rm .github/workflows/j-p1-final-quality-bootstrap-v3.yml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          lab = Path('src/commander_lab/mulligan/lab.py')
          text = lab.read_text(encoding='utf-8')
          old = '''    def iter_draw_sequences(\n        self,\n        deck: StructuralDeckProfile,\n        *,\n        samples: int,\n        seed: int,\n        max_mulligans: int = 6,\n    ):\n'''
          new = '''    def iter_draw_sequences(\n        self,\n        deck: StructuralDeckProfile,\n        *,\n        samples: int,\n        seed: int,\n        max_mulligans: int = 6,\n    ) -> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:\n'''
          if old not in text:
              raise SystemExit('exact iter_draw_sequences signature not found')
          lab.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = yaml.safe_load(Path('.github/workflows/j-p1-final-quality-bootstrap.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['validate-final-quality-candidate']['steps']
          run = next(step['run'] for step in steps if step.get('name') == 'Apply explicit current-tree type and lint boundaries')
          run = run.replace('from statistics import fmean\\n', 'from statistics import fmean, median\\n')
          completed = subprocess.run(['bash', '-c', run], text=True)
          raise SystemExit(completed.returncode)
          PY
      - name: Blocking Ruff lint
        run: ruff check .
      - name: Blocking Ruff format
        run: ruff format --check .
      - name: Blocking Mypy strict
        run: mypy src/commander_lab
      - name: Commit strict-quality candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(J-P1): close whole-tree Ruff and strict typing debt"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Compile clean candidate
        run: python -m compileall -q src tests scripts
      - name: Test clean candidate
        run: pytest -q
      - name: Push only fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:roadmap/j-p1-reliability
