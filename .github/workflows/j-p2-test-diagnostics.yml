name: J-P2 Frozen Candidate Test Diagnostics

on:
  push:
    branches:
      - roadmap/j-p2-modeling-data-quality

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify P1 ancestry, package and frozen holdout
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 807b3602c48824df40a70d2a715f9dfb6dc3e8c6 HEAD
          python - <<'PY'
          import hashlib, json, pathlib, tomllib
          root = pathlib.Path('.')
          assert tomllib.loads((root/'pyproject.toml').read_text())['project']['version'] == '1.15.0'
          ns = {}
          exec((root/'src/commander_lab/__init__.py').read_text(), ns)
          assert ns['__version__'] == '1.15.0'
          member = root/'data/evals/holdout/pilot_decisions_j_v1.json'
          assert hashlib.sha256(member.read_bytes()).hexdigest() == 'a5875cd1a8edf6bbf79248b3e4ba26151579f628eaeefd4ef2369abb309da8d1'
          registry = json.loads((root/'data/evals/j_eval_registry.json').read_text())
          holdout = registry['sets']['UNTOUCHED_HOLDOUT']
          assert holdout['hash'] == '724e84f1ea34bea9ec6b37929d945724c77c408a464b3a9dd05235738a00d5d6'
          assert holdout['used_for_tuning'] is False
          assert holdout['mutable'] is False
          print('lineage=PASS package=1.15.0 holdout_bytes=UNCHANGED')
          PY
      - name: Install exact project toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Static quality
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .
          mypy src/commander_lab
      - name: Run full suite and capture output
        id: tests
        shell: bash
        run: |
          mkdir -p artifacts/jp2-tests
          set +e
          pytest -q --tb=short > artifacts/jp2-tests/pytest.txt 2>&1
          rc=$?
          echo "$rc" > artifacts/jp2-tests/exit_code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: jp2-test-diagnostics
          path: artifacts/jp2-tests/
          if-no-files-found: error
      - name: Preserve test verdict
        shell: bash
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"
