name: Strict Quality Autofix

on:
  push:
    branches:
      - fix/1.13.4-strict-quality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: ${{ !contains(github.event.head_commit.message || '', '[strict-quality-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Apply repository-wide Ruff formatting and safe fixes
        id: ruff
        shell: bash
        run: |
          set +e
          : > ruff-diagnostics.txt
          ruff format . >>ruff-diagnostics.txt 2>&1
          FORMAT_RC=$?
          if [ "$FORMAT_RC" -eq 0 ]; then
            ruff check . --fix >>ruff-diagnostics.txt 2>&1
            FIX_RC=$?
            ruff check . >>ruff-diagnostics.txt 2>&1
            CHECK_RC=$?
            ruff format --check . >>ruff-diagnostics.txt 2>&1
            FORMAT_CHECK_RC=$?
            git diff --check >>ruff-diagnostics.txt 2>&1
            DIFF_RC=$?
          else
            FIX_RC=0
            CHECK_RC=0
            FORMAT_CHECK_RC=0
            DIFF_RC=0
          fi
          cat ruff-diagnostics.txt
          if [ "$FORMAT_RC" -ne 0 ] || [ "$FIX_RC" -ne 0 ] || [ "$CHECK_RC" -ne 0 ] || [ "$FORMAT_CHECK_RC" -ne 0 ] || [ "$DIFF_RC" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-quality-ruff-diagnostics
          path: ruff-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
      - name: Commit mechanical quality cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: repository-wide Ruff cleanup [strict-quality-autofix]"
          git push origin HEAD:fix/1.13.4-strict-quality
