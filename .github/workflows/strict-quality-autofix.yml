name: Strict Quality Gate

# Non-mutating branch gate used until strict quality is integrated into main CI.
# Verification refresh: structural, experiment, ensemble, and agent hook fixes applied.
on:
  push:
    branches:
      - fix/1.13.4-strict-quality-controlled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Ruff check
        id: ruff
        shell: bash
        run: |
          set +e
          : > ruff-diagnostics.txt
          ruff check . >>ruff-diagnostics.txt 2>&1
          RUFF_RC=$?
          ruff format --check . >>ruff-diagnostics.txt 2>&1
          FORMAT_RC=$?
          git diff --check >>ruff-diagnostics.txt 2>&1
          DIFF_RC=$?
          cat > ruff-status.env <<EOF
          RUFF_RC=$RUFF_RC
          FORMAT_RC=$FORMAT_RC
          DIFF_RC=$DIFF_RC
          EOF
          cat ruff-diagnostics.txt
          exit 0
      - name: Strict mypy
        shell: bash
        run: |
          set +e
          mypy src/commander_lab >mypy-diagnostics.txt 2>&1
          MYPY_RC=$?
          echo "MYPY_RC=$MYPY_RC" > mypy-status.env
          cat mypy-diagnostics.txt
          exit 0
      - name: Archive exact checked-out branch source
        shell: bash
        run: git archive --format=tar.gz --output=quality-branch-source.tar.gz HEAD
      - name: Upload strict-quality diagnostics and source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-quality-diagnostics
          path: |
            ruff-diagnostics.txt
            ruff-status.env
            mypy-diagnostics.txt
            mypy-status.env
            quality-branch-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Enforce strict quality gate
        if: always()
        shell: bash
        run: |
          source ruff-status.env
          source mypy-status.env
          if [ "$RUFF_RC" -ne 0 ] || [ "$FORMAT_RC" -ne 0 ] || [ "$DIFF_RC" -ne 0 ] || [ "$MYPY_RC" -ne 0 ]; then
            echo "Strict quality issues remain; see uploaded diagnostics."
            exit 1
          fi
