name: Strict Quality Autofix

on:
  push:
    branches:
      - fix/1.13.4-strict-quality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: ${{ !contains(github.event.head_commit.message || '', '[strict-quality-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Apply repository-wide Ruff formatting and safe fixes
        run: |
          ruff format .
          ruff check . --fix
          ruff check .
          ruff format --check .
          git diff --check
      - name: Commit mechanical quality cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: repository-wide Ruff cleanup [strict-quality-autofix]"
          git push origin HEAD:fix/1.13.4-strict-quality
