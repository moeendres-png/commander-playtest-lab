name: Package Engine Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-engine-bridge-${{ github.sha }}
  cancel-in-progress: true

env:
  XMAGE_COMMIT: f4d12f6e8066203fba7aa38bd35ea3358117393d
  PYTHONHASHSEED: "0"

jobs:
  package-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned XMage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install lab
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify immutable XMage pin
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"
      - name: Pinned XMage engine (restored by pin commit, built on a miss)
        uses: ./.github/actions/pinned-xmage-engine
        with:
          commit: ${{ env.XMAGE_COMMIT }}
      - name: Build XMage engine bridge JAR
        working-directory: engine-bridge
        run: |
          set -euo pipefail
          mvn -B -ntp package -DskipTests
      - name: Prepare staged artifact and digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-engine
          cp engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar dist-engine/xmage-engine-bridge.jar
          echo "${{ env.XMAGE_COMMIT }}" > dist-engine/ENGINE_PIN.txt
          (cd dist-engine && sha256sum xmage-engine-bridge.jar > xmage-engine-bridge.jar.sha256)
          cat dist-engine/xmage-engine-bridge.jar.sha256
      - name: Upload engine bridge artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xmage-engine-bridge
          path: dist-engine/
          retention-days: 30
