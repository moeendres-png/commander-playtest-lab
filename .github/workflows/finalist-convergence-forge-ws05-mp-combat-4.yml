name: Finalist convergence Forge WS05-MP-COMBAT-4

on:
  workflow_dispatch:
  push:
    branches:
      - program/finalist-convergence-forge
    paths-ignore:
      - "qualification/evidence/finalist-convergence-forge/**"
      - "handoffs/finalist-convergence-forge/**"

permissions:
  actions: read
  contents: read

env:
  CONTRACT_COMMIT: 9a8b8f5f5961466514eae6103be2d227324a27a8
  CONTRACT_BUNDLE: ad1ec6e4baa83be48c0bc07e0bde66c2f8c003af29e411bad0953558154dcfee
  FORGE_BASE: 09cfad8a24be12a87761e6645c48577387f0521b
  FORGE_COMMIT: 1e604105f9e279331063824943b9222b6589f5d8
  FORGE_TREE: 994976e06aaf99b807646b60b1aa2ac9f7703df4
  FORGE_VERSION: 2.0.15-SNAPSHOT

jobs:
  ws05-mp-combat-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify convergence ancestry and exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_head="$(git rev-parse origin/program/finalist-convergence-forge)"
          test "$(git merge-base "$branch_head" "$FORGE_BASE")" = "$FORGE_BASE"
          git merge-base --is-ancestor "$FORGE_BASE" "$branch_head"
          echo "COMMANDER_LAB_CONVERGENCE_BRANCH_HEAD=$branch_head" >> "$GITHUB_ENV"
          mkdir -p qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4
          printf '%s\n' "$branch_head" > qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/CONVERGENCE_HEAD.txt
          printf '%s\n' "$GITHUB_SHA" > qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/WORKFLOW_HEAD.txt

      - name: Mount exact neutral v1.0.1 contract
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.CONTRACT_COMMIT }}
          path: contract-lock
          sparse-checkout: qualification/finalist_convergence

      - name: Verify exact WS05-MP-COMBAT-4 record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-lock rev-parse HEAD)" = "$CONTRACT_COMMIT"
          python - <<'PY'
          import json, os
          p=json.load(open('contract-lock/qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json'))
          assert p['schema_version'] == 'commander-lab.semantic-fixture-materialization/1.0.1'
          assert p['canonical_bundle_digest'] == os.environ['CONTRACT_BUNDLE']
          r={x['fixture_id']:x for x in p['records']}['WS05-MP-COMBAT-4']
          assert r['materialization_digest'] == 'abfdea2d4ca22db3135349d6fc87c27d450611195f73f0a24ad0451f206a9776'
          assert r['execution_entry_mode'] == 'NATIVE_STATE_LOAD'
          assert r['combat_state']['eligible_attackers'] == ['obj:mp-attacker-0','obj:mp-attacker-1']
          assert r['decision_script'][0]['selection']['semantic_value'] == {
              'obj:mp-attacker-0':'P2','obj:mp-attacker-1':'P3'
          }
          PY

      - name: Checkout exact Forge source
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_COMMIT }}
          path: vendor/engine-source/forge
          fetch-depth: 1

      - name: Verify Forge source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/engine-source/forge rev-parse HEAD)" = "$FORGE_COMMIT"
          test "$(git -C vendor/engine-source/forge rev-parse HEAD^{tree})" = "$FORGE_TREE"
          git -C vendor/engine-source/forge diff --exit-code

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Check qualification sources
        run: |
          python -m py_compile \
            scripts/ws23_generate_forge_vertical_provider.py \
            scripts/ws25_generate_forge_broad_provider.py \
            scripts/finalist_generate_forge_provider.py \
            scripts/finalist_generate_forge_bootstrap.py \
            scripts/finalist_apply_forge_primitive_a_overlay.py \
            scripts/finalist_fix_forge_primitive_a_sync.py \
            scripts/finalist_apply_forge_af05_overlay.py \
            scripts/finalist_apply_forge_micro_stack_overlay.py \
            scripts/finalist_apply_forge_micro_replacement_overlay.py \
            scripts/finalist_fix_forge_micro_replacement_native_damage.py \
            scripts/finalist_apply_forge_ws05_mp_combat_4_overlay.py \
            candidate-qualification/finalist-convergence-forge/run_ws05_mp_combat_4.py

      - name: Build pinned unmodified Forge game modules
        working-directory: vendor/engine-source/forge
        run: |
          mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am -DskipTests install
          git diff --exit-code

      - name: Resolve isolated Forge classpath
        working-directory: vendor/engine-source/forge
        run: |
          mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am dependency:build-classpath \
            -DincludeScope=compile \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/dependency-classpath.txt"

      - name: Generate provider and apply exact overlays
        run: |
          set -euo pipefail
          ev=qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4
          out="$ev/generated"
          mkdir -p "$out"
          python scripts/finalist_generate_forge_provider.py \
            --player-controller vendor/engine-source/forge/forge-game/src/main/java/forge/game/player/PlayerController.java \
            --output-dir "$out" --forge-commit "$FORGE_COMMIT" --forge-tree "$FORGE_TREE" \
            | tee "$ev/generator-summary.json"
          python scripts/finalist_generate_forge_bootstrap.py \
            --source qualification/providers/forge/gpl/Ws23ForgeBootstrap.java \
            --output "$out/java/forge/game/player/Ws23ForgeBootstrap.java"
          python scripts/finalist_apply_forge_primitive_a_overlay.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python scripts/finalist_fix_forge_primitive_a_sync.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python scripts/finalist_apply_forge_af05_overlay.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python scripts/finalist_apply_forge_micro_stack_overlay.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python scripts/finalist_apply_forge_micro_replacement_overlay.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python scripts/finalist_fix_forge_micro_replacement_native_damage.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python scripts/finalist_apply_forge_ws05_mp_combat_4_overlay.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          python - <<'PY'
          from pathlib import Path
          p=Path('qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/generated/java/forge/game/player/Ws23ForgeVerticalProvider.java').read_text()
          assert 'StringBuilder("ATTACK_ASSIGNMENT:")' in p
          assert 'obj:mp-attacker-0' in p
          assert 'obj:mp-attacker-1' in p
          assert 'CombatUtil.getPossibleAttackers' in p
          assert 'CombatUtil.getAllPossibleDefenders' in p
          assert 'CombatUtil.validateAttackers' in p
          assert 'NATIVE_ATTACKER_DECLARED:' in p
          assert 'FINALIST_WS05_MP_COMBAT_4_TERMINAL' in p
          PY
          git diff --check

      - name: Assert prohibited AI and GUI provider dependencies absent
        run: |
          ! grep -REn 'import forge\.(ai|gui)|RemoteClientGuiGame|PlayerControllerAi|ComputerUtilMana' \
            qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/generated/java
          ! grep -Eq 'forge-(ai|gui)' qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/dependency-classpath.txt

      - name: Compile separate GPL-side provider JVM
        run: |
          set -euo pipefail
          ev=qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4
          cp="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes:$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes:$(cat "$ev/dependency-classpath.txt")"
          mkdir -p "$ev/classes"
          javac -cp "$cp" -d "$ev/classes" "$ev/generated/java/forge/game/player/Ws23ForgeVerticalProvider.java" "$ev/generated/java/forge/game/player/Ws23ForgeBootstrap.java"
          printf '%s:%s:%s:%s\n' "$GITHUB_WORKSPACE/$ev/classes" "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes" "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes" "$(cat "$ev/dependency-classpath.txt")" > "$ev/provider.classpath"
          ! grep -Eq 'forge-(ai|gui)' "$ev/provider.classpath"
          git -C vendor/engine-source/forge diff --exit-code

      - name: Execute exact WS05-MP-COMBAT-4 record
        run: |
          set -euo pipefail
          ev=qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4
          export COMMANDER_LAB_FORGE_LANG_DIR="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-gui/res/languages"
          export COMMANDER_LAB_FORGE_PROVIDER_CMD="java -cp $(cat "$ev/provider.classpath") forge.game.player.Ws23ForgeBootstrap"
          python candidate-qualification/finalist-convergence-forge/run_ws05_mp_combat_4.py \
            --contract contract-lock/qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json \
            --output "$ev/WS05_MP_COMBAT_4_RESULTS.json"
          python - <<'PY'
          import json, os
          p=json.load(open('qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4/WS05_MP_COMBAT_4_RESULTS.json'))
          assert p['candidate_commit'] == os.environ['COMMANDER_LAB_CONVERGENCE_BRANCH_HEAD']
          assert p['counts'] == {'PASS': 1}
          r=p['rows'][0]
          assert r['record_digest'] == 'abfdea2d4ca22db3135349d6fc87c27d450611195f73f0a24ad0451f206a9776'
          assert r['requested_semantic_state_digest'] == '93a2f8f3acd3a183cfea6985907c9445811f7ea8d9ed72b19857b70ca214c85f'
          assert r['normalized_native_constructed_state_digest'] == r['requested_semantic_state_digest']
          assert r['requested_native_state_equal'] is True
          assert r['terminal_postcondition_result'] == 'PASS'
          assert r['terminal_semantic_state'] == {'combat_state': {'attackers': {
              'obj:mp-attacker-0':'P2','obj:mp-attacker-1':'P3'
          }}}
          PY

      - name: Materialize checksums
        if: always()
        run: |
          ev=qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4
          find "$ev" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$ev/SHA256SUMS"

      - name: Upload Forge WS05-MP-COMBAT-4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalist-convergence-forge-ws05-mp-combat-4-${{ github.sha }}
          path: qualification/evidence/finalist-convergence-forge/ws05-mp-combat-4
          if-no-files-found: error
