name: Structural Seat Symmetry Audit

on:
  push:
    branches:
      - fix/structural-seat-symmetry-20260825
    paths:
      - 'src/commander_lab/engine/structural/**'
      - 'src/commander_lab/agents/**'
      - 'scripts/audit_structural_seat_symmetry.py'
      - 'tests/regressions/test_structural_seat_symmetry.py'
      - '.github/workflows/structural-seat-symmetry-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seat-symmetry-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install Commander Lab
        run: python -m pip install -e '.[dev]'
      - name: Run permutation-equivariance audit
        run: python scripts/audit_structural_seat_symmetry.py --root . --output artifacts/structural-seat-symmetry-audit
      - name: Run structural seat regression tests
        if: hashFiles('tests/regressions/test_structural_seat_symmetry.py') != ''
        run: pytest -q tests/regressions/test_structural_seat_symmetry.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: structural-seat-symmetry-audit-${{ github.sha }}
          path: artifacts/structural-seat-symmetry-audit/
          if-no-files-found: warn
          retention-days: 14
