name: Structural Seat Symmetry Audit

on:
  push:
    branches:
      - fix/structural-seat-symmetry-20260825
    paths:
      - 'src/commander_lab/engine/structural/**'
      - 'src/commander_lab/agents/**'
      - 'scripts/audit_structural_seat_symmetry.py'
      - 'scripts/apply_structural_seat_symmetry_fix.py'
      - 'tests/regressions/test_structural_seat_symmetry.py'
      - '.github/workflows/structural-seat-symmetry-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/commander_lab/engine/structural/**'
      - 'src/commander_lab/agents/**'
      - 'scripts/audit_structural_seat_symmetry.py'
      - 'scripts/apply_structural_seat_symmetry_fix.py'
      - 'tests/regressions/test_structural_seat_symmetry.py'
      - '.github/workflows/structural-seat-symmetry-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seat-symmetry-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/structural-seat-symmetry-20260825
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install Commander Lab
        run: python -m pip install -e '.[dev]'
      - name: Apply minimal fix when not yet committed
        run: |
          if grep -q 'ENGINE_VERSION = "structural-0.6.1"' src/commander_lab/engine/structural/simulator.py; then
            python scripts/apply_structural_seat_symmetry_fix.py
          else
            grep -q 'ENGINE_VERSION = "structural-0.6.2"' src/commander_lab/engine/structural/simulator.py
            echo 'STRUCTURAL_SEAT_SYMMETRY_FIX_ALREADY_APPLIED=PASS'
          fi
      - name: Compile modified simulator
        run: python -m py_compile src/commander_lab/engine/structural/simulator.py
      - name: Run permutation-equivariance audit after fix
        run: python scripts/audit_structural_seat_symmetry.py --root . --output artifacts/structural-seat-symmetry-audit
      - name: Run focused regression tests
        run: |
          pytest -q tests/regressions/test_structural_seat_symmetry.py
          pytest -q tests/property/test_structural_properties.py
      - name: Ruff modified source and audit tests
        run: ruff check src/commander_lab/engine/structural/simulator.py tests/regressions/test_structural_seat_symmetry.py scripts/audit_structural_seat_symmetry.py
      - name: Commit source fix only after all gates pass
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/commander_lab/engine/structural/simulator.py; then
            echo 'SOURCE_FIX_ALREADY_COMMITTED=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/engine/structural/simulator.py
          git commit -m 'fix: remove absolute seat bias from structural simulator [seat-fix-applied]'
          git push origin HEAD:fix/structural-seat-symmetry-20260825
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: structural-seat-symmetry-audit-${{ github.sha }}
          path: artifacts/structural-seat-symmetry-audit/
          if-no-files-found: warn
          retention-days: 14
