name: Full Game One-Shot Version Finalizer

on:
  push:
    branches:
      - engine/xmage-full-game-external-pilots
    paths:
      - .github/workflows/full-game-one-shot-version.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: engine/xmage-full-game-external-pilots
          fetch-depth: 0
      - name: Bump additive full-game capability to 1.25.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          if 'version = "1.24.0"' not in text:
              raise SystemExit('expected package version 1.24.0 not found')
          pyproject.write_text(text.replace('version = "1.24.0"', 'version = "1.25.0"', 1), encoding='utf-8')

          init = Path('src/commander_lab/__init__.py')
          text = init.read_text(encoding='utf-8')
          if '__version__ = "1.24.0"' not in text:
              raise SystemExit('expected __version__ 1.24.0 not found')
          init.write_text(text.replace('__version__ = "1.24.0"', '__version__ = "1.25.0"', 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          entry = '''## 1.25.0 - 2026-08-24\n\n- Added a dedicated, exactly four-player XMage full-game lane with XMage as sole rules authority and Commander Lab Our Pilots as sole discretionary decision authority from mulligan through Game Over.\n- Added actor-scoped hidden-information redaction, fail-closed typed decision handoff, explicit seeded rules randomness, one isolated JVM per game, semantic replay gating, and no Structural/Tactical/XMage-AI/random/default decision fallback.\n- Added resumable content-addressed batch orchestration, failure classification, versioned full-game schemas/invariant reports, focused Java/Python contract tests, and a real pinned-XMage two-run technical conformance workflow.\n- Hardened replay identity and transcript privacy by removing process-local XMage UUIDs from pilot RNG identity and excluding actor-private pilot state from exported transcripts.\n- Preserved all canonical deck, inventory, allocation, purchase, opponent and holdout truth unchanged; migration games remain technical conformance only and are not official deck-strength evidence.\n\n'''
          if not old.startswith('## 1.24.0'):
              raise SystemExit('unexpected changelog head')
          changelog.write_text(entry + old, encoding='utf-8')
          PY
          rm .github/workflows/full-game-one-shot-version.yml
      - name: Commit version finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml src/commander_lab/__init__.py CHANGELOG.md .github/workflows/full-game-one-shot-version.yml
          git diff --cached --check
          git commit -m 'chore: release full-game lane as 1.25.0'
          git push origin HEAD:engine/xmage-full-game-external-pilots
