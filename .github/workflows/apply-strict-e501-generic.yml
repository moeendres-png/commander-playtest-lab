name: Apply Generic E501 Cleanup

on:
  push:
    branches:
      - fix/1.13.4-strict-quality-controlled

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[generic-e501]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply safe generic wrapping
        shell: bash
        run: |
          set +e
          ruff check . --select E501 --output-format json > e501.json
          set -e
          python - <<'PY'
          import ast
          import io
          import json
          import tokenize
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd()
          findings = json.loads(Path("e501.json").read_text(encoding="utf-8"))
          targets = defaultdict(list)
          for item in findings:
              path = Path(item["filename"])
              if not path.is_absolute():
                  path = root / path
              targets[path].append(int(item["location"]["row"]))

          def chunks(value: str, limit: int = 58) -> list[str]:
              out = []
              while len(value) > limit:
                  spaces = [i + 1 for i, c in enumerate(value[: limit + 1]) if c.isspace()]
                  cut = spaces[-1] if spaces and spaces[-1] >= limit // 2 else limit
                  out.append(value[:cut])
                  value = value[cut:]
              if value:
                  out.append(value)
              return out

          for path, rows in targets.items():
              source = path.read_text(encoding="utf-8")
              lines = source.splitlines(keepends=True)
              string_tokens = defaultdict(list)
              for token in tokenize.generate_tokens(io.StringIO(source).readline):
                  if token.type == tokenize.STRING and token.start[0] == token.end[0]:
                      string_tokens[token.start[0]].append(token)
              changed = False
              for row in sorted(set(rows), reverse=True):
                  if row > len(lines):
                      continue
                  line = lines[row - 1].rstrip("\n")
                  if len(line) <= 100:
                      continue
                  stripped = line.lstrip()
                  indent = line[: len(line) - len(stripped)]
                  if stripped.startswith("#"):
                      words = stripped[1:].strip().split()
                      wrapped = []
                      current = indent + "#"
                      for word in words:
                          candidate = current + " " + word
                          if len(candidate) > 96 and current != indent + "#":
                              wrapped.append(current + "\n")
                              current = indent + "# " + word
                          else:
                              current = candidate
                      wrapped.append(current + "\n")
                      lines[row - 1:row] = wrapped
                      changed = True
                      continue
                  candidates = []
                  for token in string_tokens.get(row, []):
                      try:
                          value = ast.literal_eval(token.string)
                      except Exception:
                          continue
                      if isinstance(value, str) and not token.string.lstrip().lower().startswith(("f'", 'f"', "rf'", 'rf"', "fr'", 'fr"')) and len(token.string) >= 50:
                          candidates.append((len(token.string), token, value))
                  if not candidates:
                      continue
                  _, token, value = max(candidates)
                  parts = chunks(value)
                  if len(parts) < 2:
                      continue
                  before = line[:token.start[1]]
                  after = line[token.end[1]:]
                  encoded = [ascii(part) for part in parts]
                  cont = indent + "    "
                  if before.strip():
                      repl = [before + "(\n"] + [cont + p + "\n" for p in encoded] + [indent + ")" + after + "\n"]
                  else:
                      repl = [indent + p + "\n" for p in encoded[:-1]] + [indent + encoded[-1] + after + "\n"]
                  trial = lines[:row - 1] + repl + lines[row:]
                  try:
                      compile("".join(trial), str(path), "exec")
                  except SyntaxError:
                      continue
                  lines = trial
                  changed = True
              if changed:
                  path.write_text("".join(lines), encoding="utf-8")
          PY
          ruff check . --fix
          ruff format .
          python -m compileall -q src tests scripts
          git diff --check
          set +e
          ruff check . > residual-ruff.txt 2>&1
          cat residual-ruff.txt
          exit 0
      - name: Commit safe cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No tracked changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply safe generic E501 cleanup [generic-e501]"
          git push origin HEAD:fix/1.13.4-strict-quality-controlled
