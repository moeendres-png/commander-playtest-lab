name: J-P1 Final Strict Quality Candidate v4

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  validate-final-quality-candidate-v4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact starting lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d9c262ef7c199a752c03e59d2449eab00f825ebf"
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Replay reviewed transformation against current source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/j-p1-final-quality-bootstrap-v2.yml
          git rm .github/workflows/j-p1-final-quality-bootstrap-v3.yml
          git rm .github/workflows/j-p1-final-quality-bootstrap-v4.yml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          # Pre-annotate the exact current generator signature; the original transform's
          # historical regex is deliberately bypassed below after this exact check.
          lab = Path('src/commander_lab/mulligan/lab.py')
          text = lab.read_text(encoding='utf-8')
          old_sig = '''    def iter_draw_sequences(\n        self,\n        deck: StructuralDeckProfile,\n        *,\n        samples: int,\n        seed: int,\n        max_mulligans: int = 6,\n    ):\n'''
          new_sig = '''    def iter_draw_sequences(\n        self,\n        deck: StructuralDeckProfile,\n        *,\n        samples: int,\n        seed: int,\n        max_mulligans: int = 6,\n    ) -> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:\n'''
          if old_sig not in text:
              raise SystemExit('exact iter_draw_sequences signature not found')
          lab.write_text(text.replace(old_sig, new_sig, 1), encoding='utf-8')

          workflow = yaml.safe_load(Path('.github/workflows/j-p1-final-quality-bootstrap.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['validate-final-quality-candidate']['steps']
          run = next(step['run'] for step in steps if step.get('name') == 'Apply explicit current-tree type and lint boundaries')
          run = run.replace('from statistics import fmean\\n', 'from statistics import fmean, median\\n')

          # The exact generator signature is already annotated above; make the historical
          # regex check accept that pre-annotated signature without altering source again.
          old_regex_check = '''          text = re.sub(\n              r"(    def iter_draw_sequences\\(\\n(?:.*\\n){0,8}?        seed: int,\\n    \\)):",\n              r"\\1 -> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:",\n              text,\n              count=1,\n          )\n          if "-> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:" not in text:\n              raise SystemExit("failed to annotate iter_draw_sequences")\n'''
          new_regex_check = '''          if "-> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:" not in text:\n              raise SystemExit("iter_draw_sequences annotation missing")\n'''
          if old_regex_check not in run:
              raise SystemExit('historical generator regex block not found in transform')
          run = run.replace(old_regex_check, new_regex_check, 1)

          old_rule = '''            if clause.operator == "between":\n                low, high = clause.value\n                passed = float(value) >= low and float(value) <= high\n            elif clause.operator == ">=":\n                passed = float(value) >= float(clause.value)\n            elif clause.operator == "<=":\n                passed = float(value) <= float(clause.value)'''
          current_rule = '''            if clause.operator == "between" and isinstance(clause.value, tuple):\n                ok = value is not None and clause.value[0] <= float(value) <= clause.value[1]\n            elif clause.operator == "ge":\n                ok = value is not None and float(value) >= float(clause.value)\n            elif clause.operator == "le":\n                ok = value is not None and float(value) <= float(clause.value)'''
          if old_rule not in run:
              raise SystemExit('historical mulligan numeric fragment not found in transform')
          run = run.replace(old_rule, current_rule, 1)
          run = run.replace('elif clause.operator == ">=":', 'elif clause.operator == "ge":')
          run = run.replace('elif clause.operator == "<=":', 'elif clause.operator == "le":')

          completed = subprocess.run(['bash', '-c', run], text=True)
          raise SystemExit(completed.returncode)
          PY
      - name: Blocking Ruff lint
        run: ruff check .
      - name: Blocking Ruff format
        run: ruff format --check .
      - name: Blocking Mypy strict
        run: mypy src/commander_lab
      - name: Commit strict-quality candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(J-P1): close whole-tree Ruff and strict typing debt"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Compile clean candidate
        run: python -m compileall -q src tests scripts
      - name: Test clean candidate
        run: pytest -q
      - name: Push only fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:roadmap/j-p1-reliability
