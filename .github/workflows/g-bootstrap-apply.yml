name: G Bootstrap Apply

on:
  push:
    branches:
      - audit/g-modeling-data-quality
    paths:
      - '.github/workflows/g-bootstrap-apply.yml'

permissions:
  contents: write

jobs:
  apply-frozen-g-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact G branch
        uses: actions/checkout@v4
        with:
          ref: audit/g-modeling-data-quality
          fetch-depth: 0

      - name: Reconstruct and verify frozen patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .g-bootstrap/part00.b64 .g-bootstrap/part01.b64 .g-bootstrap/part02.b64 \
            .g-bootstrap/part03.b64 .g-bootstrap/part04.b64 .g-bootstrap/part05.b64 \
            .g-bootstrap/rem00.b64 .g-bootstrap/rem01.b64 .g-bootstrap/rem02.b64 \
            .g-bootstrap/rem03.b64 .g-bootstrap/rem04.b64 .g-bootstrap/rem05.b64 \
            .g-bootstrap/rem06.b64 .g-bootstrap/rem07.b64 .g-bootstrap/rem08.b64 \
            .g-bootstrap/rem09.b64 .g-bootstrap/rem10.b64 .g-bootstrap/rem11.b64 \
            .g-bootstrap/rem12.b64 .g-bootstrap/rem13.b64 .g-bootstrap/rem14.b64 \
            .g-bootstrap/rem15.b64 .g-bootstrap/rem16.b64 .g-bootstrap/rem17.b64 \
            > /tmp/g.patch.b64
          base64 --decode /tmp/g.patch.b64 > /tmp/g.patch.xz
          echo '5bda00cc596ecd9246ee35c75070445ae5c6e3f510235baf7269e1d5e2954069  /tmp/g.patch.xz' | sha256sum --check --strict
          test "$(wc -c < /tmp/g.patch.xz)" -eq 30684
          xz -t /tmp/g.patch.xz
          xz -dc /tmp/g.patch.xz > /tmp/g.patch
          git apply --check /tmp/g.patch

      - name: Apply frozen G patch and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/g.patch
          rm -rf .g-bootstrap
          rm -f .github/workflows/g-bootstrap-apply.yml
          git diff --check
          test -z "$(git status --porcelain | grep -E '^.. \.g-bootstrap/|g-bootstrap-apply\.yml$' || true)"

      - name: Commit exact G result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(G): improve modeling and pilot decision quality'
          git push origin HEAD:audit/g-modeling-data-quality
