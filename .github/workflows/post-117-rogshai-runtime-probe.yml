name: Post-1.17 RogShai Paired Runtime Probe

on:
  push:
    branches:
      - runs/post-117-rogshai-first-wave-20260812
    paths:
      - '.github/workflows/post-117-rogshai-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validated 1.17 main identity
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e33107c7aa6ca997aa47565008e1da1d6d878007
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run 8-pair single-worker technical probe
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          import commander_lab
          from commander_lab.engine.structural import ENGINE_VERSION
          from commander_lab.tools import CommanderToolService, ToolRegistry

          EXPECTED_COMMIT='e33107c7aa6ca997aa47565008e1da1d6d878007'
          EXPECTED_TREE='7d66469daf6e7657c26a5d08a2777bb05ec57f92'
          EXPECTED_DECK='7b7d03aa16be6586df8f8a4e9f1acd30f85ad2e8e45e7889e700353a6f19c126'
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD')==EXPECTED_COMMIT
          assert git('rev-parse','HEAD^{tree}')==EXPECTED_TREE
          assert commander_lab.__version__=='1.17.0'
          assert ENGINE_VERSION=='structural-0.6.0'
          service=CommanderToolService(Path.cwd())
          assert service.decks['rogshai/current'].deck_hash==EXPECTED_DECK
          public=ToolRegistry(service,surface='public')
          out=Path('artifacts/post_117_runtime_probe'); out.mkdir(parents=True,exist_ok=True)
          t0=time.perf_counter()
          run=public.invoke('deck_decision_run',{
              'deck_id':'rogshai/current',
              'remove':'Preordain',
              'add_candidate_id':'rogshai/opt-smoke',
              'iterations':8,
              'seed':2026081203,
              'max_turns':35,
              'workers':1,
          })
          elapsed=time.perf_counter()-t0
          rp=run.model_dump(mode='json')
          (out/'COMPARISON.json').write_text(json.dumps(rp,indent=2,sort_keys=True),encoding='utf-8')
          if rp['status']!='completed': raise RuntimeError(rp.get('errors'))
          diag=public.invoke('deck_decision_diagnose',{'comparison':rp['result']}).model_dump(mode='json')
          (out/'DIAGNOSIS.json').write_text(json.dumps(diag,indent=2,sort_keys=True),encoding='utf-8')
          state=diag['result']['decision_information_state']
          summary={
              'classification':'technical_runtime_probe_not_preregistered_decision_evidence',
              'remove':'Preordain','add_candidate_id':'rogshai/opt-smoke',
              'iterations':8,'workers':1,'seed':2026081203,'max_turns':35,
              'elapsed_seconds':elapsed,
              'pair_count':rp['result'].get('pair_count'),
              'placement_improvement':rp['result'].get('paired',{}).get('placement_improvement'),
              'confidence_interval':rp['result'].get('paired',{}).get('confidence_interval'),
              'decision_information_status':state.get('status'),
              'next_recommended_experiment':state.get('next_recommended_experiment'),
              'truth_boundary':'technical structural runtime probe; not empirical gameplay and not a deck recommendation',
          }
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Assert tracked tree clean
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: post-117-runtime-probe-${{ github.run_id }}
          path: artifacts/post_117_runtime_probe/
          if-no-files-found: warn
