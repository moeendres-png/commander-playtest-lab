name: J-P1 Final Strict Quality Candidate

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  validate-final-quality-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5649c9ba4e8ecf3d5e23420e25e41f58c346b513"
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Apply explicit current-tree type and lint boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {label}")
              return text.replace(old, new, 1)

          # P1 packaging metadata: use the modern SPDX-compatible string form accepted by setuptools.
          path = "pyproject.toml"
          text = read(path)
          text = replace_required(
              text,
              'license = { text = "Private project - no redistribution license granted" }',
              'license = "LicenseRef-Proprietary"',
              "project license metadata",
          )
          marker = '[tool.mypy]\n'
          per_file = '''[tool.ruff.lint.per-file-ignores]\n# Re-export aggregator: imports are the public API and are intentionally staged.\n"src/commander_lab/models/__init__.py" = ["F401", "E402"]\n# Script bootstraps src/ before importing the package.\n"scripts/run_phase86_acceptance.py" = ["E402"]\n# Unicode below is intentional normalization/fuzz/fixture input.\n"src/commander_lab/cards/normalize.py" = ["RUF001"]\n"scripts/complete_phase12_8_10.py" = ["RUF001"]\n"tests/fuzz/test_boundary_fuzz.py" = ["RUF001"]\n"tests/property/test_normalization_properties.py" = ["RUF001"]\n"tests/unit/test_plaintext_importer.py" = ["RUF001"]\n"tests/unit/test_phase1214_rules_coverage.py" = ["RUF001"]\n\n'''
          if "[tool.ruff.lint.per-file-ignores]" not in text:
              text = replace_required(text, marker, per_file + marker, "ruff per-file ignores insertion")
          write(path, text)

          # Explicit public re-export aliases understood by Ruff.
          path = "src/commander_lab/agents/__init__.py"
          text = read(path)
          text = replace_required(
              text,
              '''from .optimization_orchestrator import (\n    OptimizationPlan,\n    RunProfile,\n    build_optimization_plan,\n    select_run_profile,\n)''',
              '''from .optimization_orchestrator import (\n    OptimizationPlan as OptimizationPlan,\n    RunProfile as RunProfile,\n    build_optimization_plan as build_optimization_plan,\n    select_run_profile as select_run_profile,\n)''',
              "agent explicit reexports",
          )
          write(path, text)

          # Test must enumerate the model API it exercises; star imports defeat lint/type analysis.
          path = "tests/unit/test_opponent_ensembles.py"
          text = read(path)
          text = replace_required(
              text,
              "from commander_lab.models import *",
              '''from commander_lab.models import (\n    EnsembleWeightMode,\n    ObservationStatus,\n    ObservedConstraint,\n    OpponentCardAssumption,\n    OpponentEnsemble,\n    OpponentVariant,\n    VariantWeight,\n)''',
              "opponent ensemble explicit imports",
          )
          write(path, text)

          # RunIdentity: dataclasses.is_dataclass also accepts dataclass classes; the runtime value here
          # is intentionally reflective, so make that boundary explicit to static typing.
          path = "src/commander_lab/storage/run_identity.py"
          text = read(path)
          text = replace_required(text, "from typing import Any", "from typing import Any, cast", "run identity cast import")
          text = replace_required(
              text,
              "        return _canonicalize_run(asdict(value), root=root)",
              "        return _canonicalize_run(asdict(cast(Any, value)), root=root)",
              "run identity asdict boundary",
          )
          write(path, text)

          # Google Drive importer: explicit ClassVar and string-preserving casefold map.
          path = "src/commander_lab/importers/google_drive.py"
          text = read(path)
          text = replace_required(
              text,
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom typing import ClassVar\n",
              "google drive ClassVar import",
          )
          text = replace_required(
              text,
              "        folded = {name.casefold(): name for name in available}",
              "        folded: dict[str, str] = {str(name).casefold(): str(name) for name in available}",
              "google drive folded map",
          )
          write(path, text)

          # Structural simulator: narrow the card/string union and nullable selected-action IDs.
          path = "src/commander_lab/engine/structural/simulator.py"
          text = read(path)
          text = replace_required(
              text,
              '''                else:\n                    resolved = self._cast_card(active, card_or_name, players, recorder, score)''',
              '''                else:\n                    if not isinstance(card_or_name, StructuralCardProfile):\n                        raise TypeError("non-commander action must carry a StructuralCardProfile")\n                    resolved = self._cast_card(active, card_or_name, players, recorder, score)''',
              "simulator card narrowing",
          )
          text = replace_required(
              text,
              '''            card = next(\n                (item for item in player.deck.cards if item.oracle_name == commander.name), None\n            )''',
              '''            commander_card = next(\n                (item for item in player.deck.cards if item.oracle_name == commander.name), None\n            )''',
              "simulator commander card local",
          )
          for old, new in [
              ("roles=card.roles if card else frozenset({CardRole.ENGINE, CardRole.PAYOFF})", "roles=commander_card.roles if commander_card else frozenset({CardRole.ENGINE, CardRole.PAYOFF})"),
              ("role_strengths=card.role_strengths if card else {}", "role_strengths=commander_card.role_strengths if commander_card else {}"),
              ("mechanic_tags=card.mechanic_tags if card else frozenset()", "mechanic_tags=commander_card.mechanic_tags if commander_card else frozenset()"),
              ("floor_value=card.floor_value if card else 0.8", "floor_value=commander_card.floor_value if commander_card else 0.8"),
              ("immediate_impact=card.immediate_impact if card else 0.6", "immediate_impact=commander_card.immediate_impact if commander_card else 0.6"),
              ("turn_cycle_risk=card.turn_cycle_risk if card else 0.55", "turn_cycle_risk=commander_card.turn_cycle_risk if commander_card else 0.55"),
              ("multiplayer_scaling=card.multiplayer_scaling if card else 0.0", "multiplayer_scaling=commander_card.multiplayer_scaling if commander_card else 0.0"),
              ("commander_synergy=max(1.0, card.commander_synergy if card else 1.0)", "commander_synergy=max(1.0, commander_card.commander_synergy if commander_card else 1.0)"),
          ]:
              text = replace_required(text, old, new, f"simulator commander local: {old[:20]}")
          text = replace_required(
              text,
              '''        if decision.selected_action_id in {None, "pass"}:\n            return None\n        kind, item = mapping[decision.selected_action_id]''',
              '''        selected_action_id = decision.selected_action_id\n        if selected_action_id is None or selected_action_id == "pass":\n            return None\n        kind, item = mapping[selected_action_id]''',
              "simulator main selected action",
          )
          text = replace_required(
              text,
              '''            if decision.selected_action_id in {None, "pass"}:\n                continue\n            counter = mapping[decision.selected_action_id]''',
              '''            selected_action_id = decision.selected_action_id\n            if selected_action_id is None or selected_action_id == "pass":\n                continue\n            counter = mapping[selected_action_id]''',
              "simulator counter selected action",
          )
          write(path, text)

          # Paired experiment rows are numeric by construction; make this explicit instead of lambdas/object casts.
          path = "src/commander_lab/optimization/experiments.py"
          text = read(path)
          text = replace_required(
              text,
              '''    avg = lambda rows, key: fmean(row[key] for row in rows)\n    base_place = avg(base_rows, "placement")''',
              '''    def avg(rows: list[dict[str, float]], key: str) -> float:\n        return fmean(row[key] for row in rows)\n\n    base_place = avg(base_rows, "placement")''',
              "experiments typed average",
          )
          text = replace_required(
              text,
              '''    differences = tuple(\n        float(row["baseline_placement"]) - float(row["variant_placement"]) for row in pairs\n    )''',
              '''    differences = tuple(\n        base_row["placement"] - variant_row["placement"]\n        for base_row, variant_row in zip(base_rows, var_rows, strict=True)\n    )''',
              "experiments paired differences",
          )
          write(path, text)

          # Mulligan lab: use a TypedDict for heterogeneous counters/series and literal context kinds.
          path = "src/commander_lab/mulligan/lab.py"
          text = read(path)
          text = replace_required(text, "from collections.abc import Iterable", "from collections.abc import Iterable, Iterator", "mulligan Iterator import")
          if "from typing import Literal, TypedDict" not in text:
              text = replace_required(text, "from statistics import fmean\n", "from statistics import fmean\nfrom typing import Literal, TypedDict\n", "mulligan typing imports")
          typed_block = '''\n\nclass _HandTypeBucket(TypedDict):\n    samples: int\n    first_keeps: int\n    mulligans: int\n    mulligan_total: int\n    color_issues: int\n    dead_total: int\n    ramp_rows: list[float | None]\n    commander_rows: list[float | None]\n    draw_rows: list[float | None]\n    placement_rows: list[float | None]\n\n\nKeepRuleContextKind = Literal[\n    "primary_pod", "holdout_pod", "opponent_ensemble", "pilot_profile"\n]\n'''
          text = replace_required(text, "\n\nclass MulliganLab:\n", typed_block + "\n\nclass MulliganLab:\n", "mulligan typed helper block")
          text = replace_required(text, "        expanded = []", "        expanded: list[str] = []", "mulligan expanded list")
          # Locate the draw-sequence generator signature and add Iterator return annotation.
          text = re.sub(
              r"(    def iter_draw_sequences\(\n(?:.*\n){0,8}?        seed: int,\n    \)):",
              r"\1 -> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:",
              text,
              count=1,
          )
          if "-> Iterator[tuple[tuple[StructuralCardProfile, ...], ...]]:" not in text:
              raise SystemExit("failed to annotate iter_draw_sequences")
          text = replace_required(
              text,
              "        buckets: dict[str, dict[str, list[float] | int]],",
              "        buckets: dict[str, _HandTypeBucket],",
              "mulligan summarize bucket type",
          )
          text = replace_required(
              text,
              "            buckets: dict[str, dict[str, list[float] | int]] = defaultdict(",
              "            buckets: dict[str, _HandTypeBucket] = defaultdict(",
              "mulligan run bucket type",
          )
          # Context tuple annotation at validation site.
          text = text.replace(
              "        contexts = [",
              "        contexts: list[tuple[str, KeepRuleContextKind, MulliganContext, int, str]] = [",
              1,
          )
          # Replace raw float(object) predicate evaluation with a narrow numeric helper.
          helper_marker = "    def test_rule(\n"
          numeric_helper = '''    @staticmethod\n    def _numeric_value(value: object) -> float | None:\n        if isinstance(value, bool):\n            return None\n        if isinstance(value, (int, float, str)):\n            try:\n                return float(value)\n            except ValueError:\n                return None\n        return None\n\n'''
          if numeric_helper not in text:
              text = replace_required(text, helper_marker, numeric_helper + helper_marker, "mulligan numeric helper")
          text = replace_required(
              text,
              '''            if clause.operator == "between":\n                low, high = clause.value\n                passed = float(value) >= low and float(value) <= high\n            elif clause.operator == ">=":\n                passed = float(value) >= float(clause.value)\n            elif clause.operator == "<=":\n                passed = float(value) <= float(clause.value)''',
              '''            numeric = self._numeric_value(value)\n            if clause.operator == "between":\n                if numeric is None or not isinstance(clause.value, tuple):\n                    passed = False\n                else:\n                    low, high = clause.value\n                    passed = low <= numeric <= high\n            elif clause.operator == ">=":\n                threshold = self._numeric_value(clause.value)\n                passed = numeric is not None and threshold is not None and numeric >= threshold\n            elif clause.operator == "<=":\n                threshold = self._numeric_value(clause.value)\n                passed = numeric is not None and threshold is not None and numeric <= threshold''',
              "mulligan numeric rule comparison",
          )
          write(path, text)

          # Tool service: explicitly type the dynamic API boundary while keeping internals concrete.
          path = "src/commander_lab/tools/service.py"
          text = read(path)
          text = replace_required(text, "from typing import Any", "from typing import Any, Literal, cast", "service typing imports")
          text = replace_required(text, "    CandidatePackage,\n", "    CandidatePackage,\n    CandidateProfile,\n    CardRole,\n", "service candidate/card role imports")
          text = replace_required(text, "    DEFAULT_CONSTRAINTS,\n", "    DEFAULT_CONSTRAINTS,\n    PairedMetrics,\n", "service PairedMetrics import")
          alias_marker = "\n\nclass ToolExecutionError(ValueError):"
          estimate_alias = '''\n\nEstimateType = Literal[\n    "structural_model_estimates",\n    "tactical_oracle_results",\n    "external_rules_engine_results",\n]\n'''
          if alias_marker in text and "EstimateType = Literal[" not in text:
              text = text.replace(alias_marker, estimate_alias + alias_marker, 1)
          # All internal metadata/run-identity estimate_type parameters share the model Literal.
          text = text.replace("estimate_type: str = \"structural_model_estimates\"", "estimate_type: EstimateType = \"structural_model_estimates\"")
          text = replace_required(
              text,
              '''        return self._run_identity(\n            scenario,\n            deck_ids,\n            tool_name=tool_name,\n            estimate_type=estimate_type,\n        )["run_identity"]''',
              '''        value = self._run_identity(\n            scenario,\n            deck_ids,\n            tool_name=tool_name,\n            estimate_type=estimate_type,\n        )["run_identity"]\n        if not isinstance(value, RunIdentity):\n            raise ToolExecutionError("RunIdentity builder returned an invalid identity object")\n        return value''',
              "service build_run_identity narrow",
          )
          text = replace_required(text, "    def _candidate(self, candidate_id: str, deck_id: str):", "    def _candidate(self, candidate_id: str, deck_id: str) -> CandidateProfile:", "service candidate return")
          text = replace_required(
              text,
              "        pair_id: str,\n    ):\n        return run_paired_structural_comparison(",
              "        pair_id: str,\n    ) -> tuple[PairedMetrics, list[dict[str, object]]]:\n        return run_paired_structural_comparison(",
              "service paired return",
          )
          text = text.replace("        removed_roles = Counter()", "        removed_roles: Counter[CardRole] = Counter()", 1)
          text = text.replace("        added_roles = Counter()", "        added_roles: Counter[CardRole] = Counter()", 1)
          text = replace_required(text, "            results = []\n            for index, pod in enumerate(request.holdout_pods):", "            results: list[dict[str, Any]] = []\n            for index, pod in enumerate(request.holdout_pods):", "service holdout results")
          text = replace_required(text, "    def models_variant_swap(remove: str, candidate_id: str):", "    def models_variant_swap(remove: str, candidate_id: str) -> VariantSwap:", "service variant swap return")
          text = replace_required(text, "            rationale = []\n            matchups: set[str]", "            rationale: list[str] = []\n            matchups: set[str]", "service rationale")
          text = replace_required(text, "            rows = []\n            for deck_id in request.deck_ids:", "            rows: list[dict[str, Any]] = []\n            for deck_id in request.deck_ids:", "service allocation rows")
          text = replace_required(text, "            conflicts = []\n            allocation = []", "            conflicts: list[dict[str, Any]] = []\n            allocation: list[dict[str, Any]] = []", "service allocation lists")
          text = replace_required(text, "                observations = []", "                observations: list[dict[str, Any]] = []", "service external observations")
          text = replace_required(
              text,
              '''                coverage = {\n                    "external_rules_engine": 3,\n                    "tactical_oracle": 2,\n                    "structural_only": 1,\n                }.get(row.get("rules_coverage"), 0)''',
              '''                coverage_key = str(row.get("rules_coverage") or "")\n                coverage = {\n                    "external_rules_engine": 3,\n                    "tactical_oracle": 2,\n                    "structural_only": 1,\n                }.get(coverage_key, 0)''',
              "service coverage key narrow",
          )
          text = replace_required(
              text,
              '''            p_rows = [\n                (index, row.get("p_value"))\n                for index, row in enumerate(ranked)\n                if row.get("p_value") is not None\n            ]''',
              '''            p_rows: list[tuple[int, float]] = []\n            for index, row in enumerate(ranked):\n                raw_p = row.get("p_value")\n                if isinstance(raw_p, (int, float)) and not isinstance(raw_p, bool):\n                    p_rows.append((index, float(raw_p)))''',
              "service p-value narrowing",
          )
          text = replace_required(text, "                adjusted = holm_adjust(float(value) for _, value in p_rows)", "                adjusted = holm_adjust(value for _, value in p_rows)", "service p-value adjustment")
          # Dynamic extension API: requests come from Pydantic tool dispatch; keep Any only at this edge.
          text = text.replace("    def _counterfactual_lab(self):", "    def _counterfactual_lab(self) -> Any:")
          text = text.replace("    def _diagnostic_engine(self):", "    def _diagnostic_engine(self) -> Any:")
          dynamic_methods = [
              "find_counterfactual_branchpoints",
              "list_alternative_actions",
              "run_counterfactual",
              "compare_counterfactuals",
              "generate_decision_regret_report",
              "export_minimal_counterfactual_fixture",
              "diagnose_card_performance",
              "diagnose_pilot_behavior",
              "compare_deck_and_pilot_effects",
              "classify_failure_cause",
              "recommend_next_experiment",
              "generate_diagnostic_report",
          ]
          for name in dynamic_methods:
              text = text.replace(f"    def {name}(self, request):", f"    def {name}(self, request: Any) -> ToolResponse:")
          # Pydantic model_dump returns dictionaries at these dynamic boundaries; cast is explicit and local.
          text = text.replace("            return result.model_dump(mode=\"json\") | {", "            return cast(dict[str, Any], result.model_dump(mode=\"json\")) | {")
          text = text.replace("            return diagnosis.model_dump(mode=\"json\") | {", "            return cast(dict[str, Any], diagnosis.model_dump(mode=\"json\")) | {")
          text = text.replace("            return DecisionDiagnosticEngine.next_experiment(diagnosis)", "            return cast(dict[str, Any], DecisionDiagnosticEngine.next_experiment(diagnosis))")
          write(path, text)
          PY

          # Only the previously reviewed, semantics-preserving Ruff unsafe fixes are enabled.
          ruff check . --fix --unsafe-fixes --select B007,B905,B023,F841,RUF005,RUF007,RUF034,RUF043,RUF046,RUF059,SIM102,SIM105 || true
          ruff format .
          git rm .github/workflows/j-p1-final-quality-bootstrap.yml
          git add -A
          git diff --cached --check
      - name: Blocking Ruff lint
        run: ruff check .
      - name: Blocking Ruff format
        run: ruff format --check .
      - name: Blocking Mypy strict
        run: mypy src/commander_lab
      - name: Commit strict-quality candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(J-P1): close whole-tree Ruff and strict typing debt"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Compile clean candidate
        run: python -m compileall -q src tests scripts
      - name: Test clean candidate
        run: pytest -q
      - name: Push only fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:roadmap/j-p1-reliability
