name: Post-J PR47 stale test migration

on:
  push:
    branches:
      - project/rogshai-provisional-current-cleanup-20260811

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/rogshai-provisional-current-cleanup-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Migrate stale current-deck regression fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected fixture in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, count if count is not None else -1), encoding='utf-8')

          p=Path('tests/unit/test_j_p6_hardening.py'); t=p.read_text(encoding='utf-8')
          old='''        deck_ids=(\n            "korvold/current",\n            "opponent/morcant-elves",'''
          new='''        deck_ids=(\n            "rogshai/current",\n            "opponent/morcant-elves",'''
          if old not in t: raise SystemExit('P6 current-deck fixture missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          p=Path('tests/unit/test_j_p5_optimizer_validation.py'); t=p.read_text(encoding='utf-8')
          start=t.index('def test_wrong_commander_identity_fails_closed()')
          end=t.index('\ndef test_simultaneous_allocation_uses_free_copy_capacity()', start)
          block='''def test_wrong_commander_identity_fails_closed() -> None:\n    svc = CommanderToolService(ROOT)\n    baseline = svc._deck("rogshai/current")\n    altered = baseline.model_copy(\n        update={\n            "commander_names": ("Not Ishai", "Not Rograkh"),\n            "commander_base_costs": {"Not Ishai": 4.0, "Not Rograkh": 0.0},\n        }\n    )\n    report = evaluate_constraints(altered, DEFAULT_CONSTRAINTS["rogshai/current"])\n    assert not report.valid\n    assert any(issue.code == "commander_identity" for issue in report.issues)\n\n\ndef test_inactive_korvold_does_not_create_a_current_locked_cut() -> None:\n    protected = json.loads((ROOT / "config/protected_cards.json").read_text(encoding="utf-8"))\n    assert protected.get("protected_cards", {}) in ({}, [])\n    svc = CommanderToolService(ROOT)\n    candidate = next(c for c in svc.candidates.values() if "rogshai/current" in c.allowed_deck_ids)\n    svc._validate_swap_policy("rogshai/current", "Kykar, Wind's Fury", candidate.card)\n\n'''
          t=t[:start]+block+t[end+1:]
          start=t.index('def test_challenge_set_is_constraint_safe_and_has_all_classes()')
          t=t[:start]+'''def test_historical_challenge_set_preserves_classes_and_truth_boundary() -> None:\n    payload = json.loads(\n        (ROOT / "data/evals/golden/J_P5_OPTIMIZER_CHALLENGE_SET_v1.json").read_text()\n    )\n    assert {row["class"] for row in payload["variants"]} == {"good", "neutral", "bad"}\n    assert payload["evidence_boundary"] == "structural_model_estimates"\n    assert payload["canonical_mutation_allowed"] is False\n    assert any(row["deck_id"] == "korvold/current" for row in payload["variants"])\n    assert any(row["deck_id"] == "rogshai/current" for row in payload["variants"])\n'''
          p.write_text(t,encoding='utf-8')

          p=Path('tests/unit/test_j_p0_run_identity.py'); t=p.read_text(encoding='utf-8')
          t=t.replace('InspectDeckInput(deck_id="korvold/current")','InspectDeckInput(deck_id="rogshai/current")',1)
          old='''    current = service.decks["korvold/current"]\n    service.decks["korvold/current"] = current.model_copy(update={"deck_hash": "0" * 64})'''
          new='''    current = service.decks["rogshai/current"]\n    service.decks["rogshai/current"] = current.model_copy(update={"deck_hash": "0" * 64})'''
          if old not in t: raise SystemExit('stale identity fixture missing')
          t=t.replace(old,new,1)
          t=t.replace('{"deck_id": "korvold/current", "canonical_inputs_required": True}', '{"deck_id": "rogshai/current", "canonical_inputs_required": True}',1)
          t=t.replace('("korvold/current",),\n            tool_name="inspect_deck"','("rogshai/current",),\n            tool_name="inspect_deck"',1)
          t=t.replace('''            "deck_id": "korvold/current",\n            "canonical_inputs_required": True,''','''            "deck_id": "rogshai/current",\n            "canonical_inputs_required": True,''',1)
          t=t.replace('("korvold/current",),\n        tool_name="inspect_deck"','("rogshai/current",),\n        tool_name="inspect_deck"',1)
          old='''            deck_id="korvold/current",\n            remove_cards=("Aftermath Analyst",),\n            add_candidate_ids=("korvold/mazirek-smoke",),'''
          new='''            deck_id="rogshai/current",\n            remove_cards=("Kykar, Wind's Fury",),\n            add_candidate_ids=("inventory/disorder-in-the-court-f673274a",),'''
          if old not in t: raise SystemExit('optimizer identity fixture missing')
          t=t.replace(old,new,1)
          t=t.replace('identity.deck_hashes["korvold/current"] == service.decks["korvold/current"].deck_hash','identity.deck_hashes["rogshai/current"] == service.decks["rogshai/current"].deck_hash',1)
          p.write_text(t,encoding='utf-8')

          p=Path('tests/unit/test_snapshot_reproducibility.py'); t=p.read_text(encoding='utf-8')
          t=t.replace('    "data/decks/korvold_current.txt",\n','')
          t=t.replace('    "data/decks/korvold_current.json",\n','')
          t=t.replace('''    korvold = json.loads((first_root / "data/decks/korvold_current.json").read_text())\n''','')
          t=t.replace('''    assert korvold["source"]["source_path"] == "data/decks/korvold_current.txt"\n''','')
          p.write_text(t,encoding='utf-8')

          replace('tests/integration/test_phase5_server.py','"deck_id": "korvold/current"','"deck_id": "rogshai/current"',1)
          replace('tests/integration/test_phase5_server.py','Inspect Korvold using structured local tools.','Inspect RogShai using structured local tools.',1)
          p=Path('tests/unit/test_phase12_17_mcp.py'); t=p.read_text(encoding='utf-8')
          t=t.replace('arguments={"deck_id": "korvold/current"}', 'arguments={"deck_id": "rogshai/current"}', 2)
          p.write_text(t,encoding='utf-8')
          PY
          ruff format tests/unit/test_j_p6_hardening.py tests/unit/test_j_p5_optimizer_validation.py tests/unit/test_j_p0_run_identity.py tests/unit/test_snapshot_reproducibility.py tests/integration/test_phase5_server.py tests/unit/test_phase12_17_mcp.py
          ruff check --fix tests/unit/test_j_p6_hardening.py tests/unit/test_j_p5_optimizer_validation.py tests/unit/test_j_p0_run_identity.py tests/unit/test_snapshot_reproducibility.py tests/integration/test_phase5_server.py tests/unit/test_phase12_17_mcp.py
          ruff check tests/unit/test_j_p6_hardening.py tests/unit/test_j_p5_optimizer_validation.py tests/unit/test_j_p0_run_identity.py tests/unit/test_snapshot_reproducibility.py tests/integration/test_phase5_server.py tests/unit/test_phase12_17_mcp.py
      - name: Commit locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'Migrate stale J regression fixtures to current RogShai scope'
      - name: Validate exact J-P6 focused regression set from clean tree
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          pytest -q tests/unit/test_j_p6_hardening.py tests/unit/test_j_p5_optimizer_validation.py tests/unit/test_j_p0_run_identity.py tests/unit/test_snapshot_reproducibility.py tests/unit/test_audit_e_performance_scheduler.py tests/integration/test_phase5_server.py tests/unit/test_phase12_17_mcp.py tests/integration/test_phase12_17_mcp_stdio.py
      - name: Push only after PASS
        run: git push origin HEAD:project/rogshai-provisional-current-cleanup-20260811
