name: Ruff format once

on:
  push:
    branches:
      - patch/post-official-decision-fidelity-search-efficiency

permissions:
  contents: write

jobs:
  format_once:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: patch/post-official-decision-fidelity-search-efficiency
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply repository Ruff formatter exactly once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.4'
          ruff format .
          ruff check .
          ruff format --check .
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              src/commander_lab/engine/structural/fact_fidelity.py|src/commander_lab/engine/structural/simulator.py|src/commander_lab/whole_deck/mechanics_fidelity.py|src/commander_lab/whole_deck/optimizer_search.py) ;;
              *) echo "Unexpected formatter change: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          rm -f .ruff-format-trigger
          rm -f .github/workflows/ruff-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m 'Apply canonical Ruff 0.16.4 formatting'
          git push origin HEAD:${GITHUB_REF_NAME}
