name: Temporary Calibration-First Patch Applicator

on:
  push:
    branches:
      - fix/optimizer-v2-calibration-first-20260823
    paths:
      - '.github/workflows/temporary-calibration-first-patch.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-calibration-first-patch.yml'
      - '.run-integrity/calibration-first.patch'

permissions:
  contents: write

jobs:
  apply-validate-push:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply exact reviewed patch
        run: |
          git apply --check .run-integrity/calibration-first.patch
          git apply .run-integrity/calibration-first.patch
      - name: Install dev runtime
        run: python -m pip install -e '.[dev]'
      - name: Format and validate patch files
        run: |
          python -m ruff format src/commander_lab/whole_deck/optimizer_v2_release.py tests/unit/test_optimizer_v2_release.py
          python -m ruff check src/commander_lab/whole_deck/optimizer_v2_release.py tests/unit/test_optimizer_v2_release.py
      - name: Remove temporary applicator files and create clean patch commit
        run: |
          rm .run-integrity/calibration-first.patch
          rm .github/workflows/temporary-calibration-first-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fail calibration before exploratory optimizer evidence'
      - name: Regression and decision-runtime tests on clean tree
        run: |
          python -m pytest -q tests/unit/test_optimizer_v2_release.py::test_release_search_fails_calibration_before_exploratory_evidence tests/unit/test_optimizer_v2_decision_runtime.py tests/unit/test_optimizer_v2.py
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Push validated patch commit
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
