name: Static quality fix materialize

on:
  push:
    branches:
      - patch/post-official-decision-fidelity-search-efficiency

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-verified static quality patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patchparts/staticfix/part*.b64 | base64 --decode > /tmp/staticfix.patch
          git apply --check /tmp/staticfix.patch
          git apply /tmp/staticfix.patch
          rm -rf .patchparts/staticfix
          rm -f .github/workflows/staticfix-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix strict static quality findings"
          git push origin HEAD:${GITHUB_REF_NAME}