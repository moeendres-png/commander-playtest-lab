name: Core Workflow Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/commander_lab/**'
      - 'scripts/run_j_p6_workflow_smoke.py'
      - 'tests/unit/test_deck_policy_registry.py'
      - 'tests/unit/test_candidate_screening.py'
      - 'tests/unit/test_canonical_feature_fusion.py'
      - 'tests/unit/test_workflow_identity.py'
      - 'data/collections/current/**'
      - 'data/decks/**'
      - 'data/opponents/**'
      - 'data/pilots/**'
      - 'config/**'
      - '.github/workflows/core-workflow-acceptance.yml'
      - "tests/conftest.py"
  push:
    branches: [main]
    paths:
      - 'src/commander_lab/**'
      - 'scripts/run_j_p6_workflow_smoke.py'
      - 'tests/unit/test_deck_policy_registry.py'
      - 'tests/unit/test_candidate_screening.py'
      - 'tests/unit/test_canonical_feature_fusion.py'
      - 'tests/unit/test_workflow_identity.py'
      - 'data/collections/current/**'
      - 'data/decks/**'
      - 'data/opponents/**'
      - 'data/pilots/**'
      - 'config/**'
      - '.github/workflows/core-workflow-acceptance.yml'
      - "tests/conftest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: core-workflow-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  decision-workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install decision-workflow runtime
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Multi-deck, candidate, feature and run-identity semantic contracts
        run: |
          python -m pytest -q \
            tests/unit/test_deck_policy_registry.py \
            tests/unit/test_candidate_screening.py \
            tests/unit/test_canonical_feature_fusion.py \
            tests/unit/test_workflow_identity.py
      - name: Current reference decision workflow
        run: python scripts/run_j_p6_workflow_smoke.py
      - name: Verify acceptance evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          smoke_path = Path('artifacts/j_p6/J_P6_WORKFLOW_SMOKE.json')
          smoke = json.loads(smoke_path.read_text(encoding='utf-8'))
          if smoke.get('evidence_class') != 'workflow_runtime_smoke':
              raise SystemExit('reference workflow smoke lost its technical-only evidence boundary')
          if smoke.get('canonical_deck_mutations') != 0:
              raise SystemExit('acceptance workflow mutated canonical deck data')
          workflows = smoke.get('workflows')
          if not isinstance(workflows, list) or not workflows:
              raise SystemExit('reference workflow produced no workflow evidence')
          for row in workflows:
              identity = row.get('run_identity_hash')
              if not isinstance(identity, str) or len(identity) != 64:
                  raise SystemExit(f"missing run identity for {row.get('name')}")

          print('CORE_WORKFLOW_ACCEPTANCE=PASS')
          print('EVIDENCE_BOUNDARY=technical_and_structural_acceptance_not_deck_strength')
          PY
      - name: Assert tracked repository remains clean
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
