name: Apply Full Game Final Fix

on:
  push:
    branches:
      - engine/xmage-full-game-external-pilots
    paths:
      - .github/full-game-final.patch
      - .github/workflows/apply-full-game-final-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated local patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/full-game-final.patch
          git apply .github/full-game-final.patch
          rm .github/full-game-final.patch .github/workflows/apply-full-game-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: stabilize full-game mana and semantic replay"
          git push origin HEAD:engine/xmage-full-game-external-pilots
