name: WS32 semantic inspection

on:
  push:
    branches:
      - ws32/successor-semantic-executability-freeze
    paths:
      - .github/workflows/ws32-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emit exact v1.0.1 defect records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          report=json.loads((root/'qualification/finalist_convergence/SEMANTIC_EXECUTABILITY_REPORT.json').read_text())
          corpus=json.loads((root/'qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json').read_text())
          bad={r['fixture_id'] for r in report['records'] if r['status']!='PASS'}
          keys=['fixture_id','fixture_family','semantic_objects','temporal_state','commander_state','combat_state','stack_state','mana_state','decision_script','native_procedure','expected_events','terminal_postconditions','negative_fallback_probe','scenario_notes']
          print('DEFECT_COUNT',len(bad))
          for rec in corpus['records']:
              if rec['fixture_id'] in bad:
                  out={k:rec[k] for k in keys if k in rec}
                  print('WS32_RECORD '+json.dumps(out,sort_keys=True,separators=(',',':')))
          PY
