name: Temporary Official Driver Hygiene

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/temporary-official-driver-hygiene.yml'

permissions:
  contents: write

jobs:
  format-lint-driver:
    if: >-
      github.event.pull_request.head.ref == 'runs/rogshai-official-fresh-ready-post-pr113-20260823' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: runs/rogshai-official-fresh-ready-post-pr113-20260823
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply exact vehicle-only Ruff hygiene
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.4'
          ruff check --fix .run-tools/official_campaign_driver.py
          ruff format .run-tools/official_campaign_driver.py
          ruff check .run-tools/official_campaign_driver.py
          ruff format --check .run-tools/official_campaign_driver.py
          python -m py_compile .run-tools/official_campaign_driver.py
      - name: Remove temporary workflow and push only vehicle hygiene
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-official-driver-hygiene.yml
          git add .run-tools/official_campaign_driver.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'Format and lint official campaign execution vehicle'
          git push origin HEAD:runs/rogshai-official-fresh-ready-post-pr113-20260823
