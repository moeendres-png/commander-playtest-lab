name: WS44 detached predecessor semantic probe

on:
  push:
    branches:
      - ws44/v1.0.4-authority-reconciliation-freeze
    paths:
      - scripts/ws44_probe_predecessor.py
      - scripts/ws44_extract_dangling_context.py
      - .github/workflows/ws44-predecessor-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run detached predecessor semantic probes
        run: |
          python scripts/ws44_probe_predecessor.py \
            --output candidate-qualification/ws44-v1.0.4-authority/WS44_V103_SEMANTIC_REFERENCE_PROBE.json
          python scripts/ws44_extract_dangling_context.py \
            --output candidate-qualification/ws44-v1.0.4-authority/WS44_V103_DANGLING_CONTEXTS.json
      - name: Persist probe evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-qualification/ws44-v1.0.4-authority/WS44_V103_SEMANTIC_REFERENCE_PROBE.json \
                  candidate-qualification/ws44-v1.0.4-authority/WS44_V103_DANGLING_CONTEXTS.json
          if git diff --cached --quiet; then
            echo "Probe evidence already current"
            exit 0
          fi
          git commit -m "ws44: persist detached v1.0.3 semantic reference probes"
          git push origin HEAD:ws44/v1.0.4-authority-reconciliation-freeze
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws44-v103-semantic-reference-probe
          path: |
            candidate-qualification/ws44-v1.0.4-authority/WS44_V103_SEMANTIC_REFERENCE_PROBE.json
            candidate-qualification/ws44-v1.0.4-authority/WS44_V103_DANGLING_CONTEXTS.json
          if-no-files-found: error
