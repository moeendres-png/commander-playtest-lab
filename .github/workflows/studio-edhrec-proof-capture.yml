name: C079 Public EDHREC Fresh Capture (review only)

# Only public Chulane EDHREC URLs; not a historical timestamp repair.
# Never run on a schedule; no import or modification of Studio ACTIVE sources.
on:
  pull_request:
    paths:
      - "scripts/studio_edhrec_provenance/**"
      - "data/studio_public/edhrec_chulane_original_20_urls.txt"
      - ".github/workflows/studio-edhrec-proof-capture.yml"
      - "src/commander_lab/studio/edhrec_capture_proof.py"
      - "src/commander_lab/studio/importers.py"
      - "tests/unit/test_studio_edhrec*.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  capture-fresh-public-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate offline, including deliberate 403 failure case
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s scripts/studio_edhrec_provenance -p "test_*.py"
      - name: Capture new public observations without historical backfill
        run: |
          set -euo pipefail
          python3 scripts/studio_edhrec_provenance/capture_public_chulane.py \
            --urls data/studio_public/edhrec_chulane_original_20_urls.txt \
            --out edhrec-fresh-evidence --pause 1.5 --limit 20
      - name: Verify every new HTTP event and replay full import offline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from commander_lab.studio.edhrec_capture_proof import verify_captures
          from commander_lab.studio.importers import import_edhrec_capture_manifest
          from commander_lab.studio.store import StudioStore
          manifest = Path("edhrec-fresh-evidence/manifest.json")
          capture_events = verify_captures(manifest)
          assert len(capture_events) == 20
          store = StudioStore.in_memory()
          try:
              first = import_edhrec_capture_manifest(store, manifest)
              assert first["events"] == 20
              assert first["unique_card_pages"] > 1000
              assert store.count("source_capture_event") == 20
              events = store.connection.execute(
                  "SELECT event_id, request_start_utc, response_complete_utc "
                  "FROM source_capture_event"
              ).fetchall()
              proof_by_id = {item.event_id: item for item in capture_events}
              for row in events:
                  proof = proof_by_id[row["event_id"]]
                  assert row["request_start_utc"] == proof.request_start_utc
                  assert row["response_complete_utc"] == proof.response_complete_utc
              count = store.count("observation")
              import_edhrec_capture_manifest(store, manifest)
              assert store.count("observation") == count, "not idempotent"
              print(f"VERIFIED: {len(capture_events)} independent immutable HTTP events, "
                    f"{first['unique_card_pages']} unique visible page-card pairs, "
                    f"{count} observations, no historical timestamp backfill")
          finally:
              store.close()
          PY
      - name: Preserve source response and any denial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edhrec-fresh-capture-proof
          path: edhrec-fresh-evidence/
          if-no-files-found: warn
          retention-days: 30
