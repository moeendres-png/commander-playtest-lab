name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  # The required `quality` context is the small gate job at the end of this graph. The work
  # runs in parallel jobs: lint, a matrix of test slots, and (only for a push to main or a
  # pull request that changes a packaging input) the packaging job. `changes` decides how much
  # of that work a pull request needs; scripts/ci_change_scope.py states the rules.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      packaging: ${{ steps.scope.outputs.packaging }}
      test_matrix: ${{ steps.scope.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python3 scripts/ci_change_scope.py --event "$EVENT_NAME" --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install project and quality tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff lint
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/quality
          set +e
          ruff check . --output-format=json > artifacts/quality/ruff.json
          rc=$?
          python scripts/ci_ruff_annotations.py artifacts/quality/ruff.json || true
          exit "$rc"
      - name: Ruff format
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/quality
          ruff format --check --diff . | tee artifacts/quality/ruff-format.diff
      - name: Mypy strict
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          mypy src/commander_lab 2>&1 | tee artifacts/quality/mypy.txt
      - name: Compile
        if: ${{ success() || failure() }}
        run: python -m compileall -q src tests
      - name: Secret-pattern scan
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail

          # The token pattern is anchored to a token boundary: a key stands on its
          # own, while "sk-" inside a hyphenated slug of published data is no key.
          # The lookbehind needs PCRE; without it git grep would fail and report
          # nothing, so its availability is proven first (fail closed).
          if ! git grep -qIP -e '(?<![A-Za-z0-9_-])Secret-pattern scan' -- .github/workflows/ci.yml; then
            echo "git grep without PCRE support: the secret-pattern scan cannot run."
            exit 1
          fi

          matches="$(
            git grep -nIP \
              -e '(?<![A-Za-z0-9_-])[s]k-[A-Za-z0-9_-]{20,}' \
              -e '[O]PENAI_API_KEY=[^[:space:]]+' \
              -- \
              ':(exclude).env.example' \
              ':(exclude)artifacts/**' \
              || true
          )"

          if [[ -n "$matches" ]]; then
            matches="$(
              printf '%s\n' "$matches" |
                grep -Ev '[O]PENAI_API_KEY=(\.\.\.|<[^>]+>|\$\{[^}]+\})' ||
                true
            )"
          fi

          if [[ -n "$matches" ]]; then
            echo "Potential secret material found. Content suppressed."
            exit 1
          fi

          echo "No secret patterns found."
      - name: Build wheel
        if: ${{ success() || failure() }}
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 immutable revision
        if: always()
        timeout-minutes: 3
        with:
          name: ci-evidence-lint
          path: |
            dist/
            artifacts/quality/
          if-no-files-found: warn

  tests:
    # B5 (#486): tests/qualification is owned by the required infrastructure context
    # (production-qualification.yml); every other test runs here, except the packaging test,
    # which the packaging job owns. tests/unit/test_required_test_ownership.py proves that the
    # slots below, the packaging job and the infrastructure context cover every test file once.
    # Each slot is a full 4-core runner: `python -m tests.pytest_shards matrix` names its files
    # and `--shards=4` (tests/pytest_shards.py) splits them over four pytest processes.
    needs: changes
    name: tests ${{ matrix.index }}/${{ matrix.count }} (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: tests such as test_technical_truth and test_benchmark_xmage_full_games
          # diff against old commits and must not skip or fail on a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install project and quality tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Select the test files of this slot
        shell: bash
        run: |
          set -euo pipefail
          python -m tests.pytest_shards matrix --index "${{ matrix.index }}" --count "${{ matrix.count }}" --scope "${{ matrix.scope }}" > "$RUNNER_TEMP/test-files.txt"
          echo "$(wc -l < "$RUNNER_TEMP/test-files.txt") test files in this slot"
      - name: Test suite
        shell: bash
        # Priority E1 (#479): per-test durations (log) and JUnit XML are reporting only; they
        # never change collection or outcome.
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/test-files.txt"
          pytest -q --durations=50 --junitxml=artifacts/quality/pytest-junit.xml --shards=4 "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 immutable revision
        if: always()
        timeout-minutes: 3
        with:
          name: ci-evidence-tests-${{ matrix.index }}
          path: artifacts/quality/
          if-no-files-found: warn

  packaging:
    # Runs on every push to main and on a pull request that changes a packaging input
    # (scripts/ci_change_scope.py); otherwise it is skipped and `quality` accepts the skip.
    needs: changes
    if: ${{ needs.changes.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: tests such as test_technical_truth and test_benchmark_xmage_full_games
          # diff against old commits and must not skip or fail on a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install project and quality tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Packaging smoke (isolated wheel install, import and CLI)
        # Issue #490. Wheel construction above proves packaging can produce an
        # artifact; this proves the artifact installs into a clean isolated
        # environment and that the *installed* package imports and exposes its
        # officially supported console entrypoints. The isolated environment is
        # created outside the workspace, never inherits system site-packages,
        # installs the project with --no-index --no-deps from the exact wheel
        # path, takes its dependency closure from the hash-pinned project lock,
        # and probes imports with -I so no worktree PYTHONPATH can substitute the
        # source tree for the installation. No continue-on-error, no || true and
        # no skip condition: a broken wheel, entrypoint or evidence document
        # fails this job and with it the required quality context.
        if: ${{ success() || failure() }}
        run: |
          python scripts/verify_packaging_smoke.py smoke \
            --repo . \
            --wheel-dir dist \
            --venv-dir "$RUNNER_TEMP/packaging-smoke-venv" \
            --output artifacts/quality/PACKAGING_SMOKE.json
      - name: Packaging smoke evidence check
        # Independently re-adjudicate the machine-readable evidence, including
        # re-verifying that the built wheel still hashes to the bound digest.
        # Missing, truncated, malformed, UNKNOWN or unbound evidence is never
        # promoted to PASS.
        if: ${{ success() || failure() }}
        run: |
          python scripts/verify_packaging_smoke.py check \
            --repo . \
            --wheel-dir dist \
            --evidence artifacts/quality/PACKAGING_SMOKE.json
      - name: Packaging tests
        if: ${{ success() || failure() }}
        run: pytest -q --durations=50 --junitxml=artifacts/quality/pytest-junit-packaging.xml tests/unit/test_packaging_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 immutable revision
        if: always()
        timeout-minutes: 3
        with:
          name: ci-evidence-packaging
          path: |
            dist/
            artifacts/quality/
          if-no-files-found: warn

  quality:
    # The required context. It is green only when every job it needs ended `success`; the one
    # accepted `skipped` is the packaging job on a pull request whose diff has no packaging
    # input (changes.outputs.packaging == 'false', and `changes` itself succeeded).
    # `if: always()` keeps it from being skipped when a needed job fails or is cancelled; it
    # fails then. scripts/ci_gate.py holds the decision (tests/unit/test_ci_gate.py) and
    # scripts/verify_required_check_definitions.py verifies this exact pattern.
    if: always()
    needs: [changes, lint, tests, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every needed job succeeded
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGING: ${{ needs.packaging.result }}
          PACKAGING_NEEDED: ${{ needs.changes.outputs.packaging }}
        run: |
          set -euo pipefail
          python3 scripts/ci_gate.py --job changes="$CHANGES" --job lint="$LINT" --job tests="$TESTS" --job packaging="$PACKAGING" --allow-skipped packaging --packaging-needed "$PACKAGING_NEEDED"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Security evidence binds the event head, never a synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install hash-locked audit tools
        id: install-tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/security-bootstrap.txt
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip check
      - name: Build source-bound product wheel for security evidence
        id: build-wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install actual wheel in tooling scope
        id: install-wheel-tooling
        run: |
          python -m pip install --no-deps --no-index dist/*.whl
          python -m pip check
      - name: Prepare distinct security scopes
        id: prepare-scopes
        if: ${{ success() || failure() }}
        run: >-
          python scripts/security_evidence.py prepare --repo . --wheel-dir dist
          --runtime "$RUNNER_TEMP/security-product-venv" --out artifacts/security
      - name: CI and tooling dependency audit
        id: audit-tooling
        if: ${{ success() || failure() }}
        run: >-
          pip-audit --strict --no-deps --disable-pip
          -r artifacts/security/ci-tooling/requirements.txt --format=json
          --output artifacts/security/ci-tooling/dependency-audit.json
      - name: Product runtime dependency audit
        id: audit-product
        if: ${{ success() || failure() }}
        run: >-
          pip-audit --strict --no-deps --disable-pip
          -r artifacts/security/runtime-product/requirements.txt --format=json
          --output artifacts/security/runtime-product/dependency-audit.json
      - name: CI and tooling CycloneDX SBOM
        id: sbom-tooling
        if: ${{ success() || failure() }}
        run: >-
          cyclonedx-py environment --output-reproducible --output-format JSON
          --output-file artifacts/security/ci-tooling/sbom.cdx.json
      - name: Product runtime CycloneDX SBOM
        id: sbom-product
        if: ${{ success() || failure() }}
        run: >-
          cyclonedx-py environment "$RUNNER_TEMP/security-product-venv/bin/python"
          --output-reproducible --output-format JSON
          --output-file artifacts/security/runtime-product/sbom.cdx.json
      - name: CI and tooling license report
        id: licenses-tooling
        if: ${{ success() || failure() }}
        run: >-
          pip-licenses --with-system --format=json
          --output-file=artifacts/security/ci-tooling/licenses.json
      - name: Product runtime license report
        id: licenses-product
        if: ${{ success() || failure() }}
        run: >-
          pip-licenses --with-system --python "$RUNNER_TEMP/security-product-venv/bin/python"
          --format=json --output-file=artifacts/security/runtime-product/licenses.json
      - name: Seal security scopes and failure evidence
        if: always()
        env:
          B11_STEP_RESULTS: ${{ toJSON(steps) }}
        run: >-
          python scripts/security_evidence.py seal --repo . --wheel-dir dist
          --runtime "$RUNNER_TEMP/security-product-venv" --out artifacts/security
      - name: Broad secret scan (pinned gitleaks)
        if: ${{ success() || failure() }}
        # B10 (#491): the full gitleaks rule set over exactly the tracked files,
        # after red controls prove the pinned scanner finds representative
        # secrets. Independent of the audit steps above; the quality job's
        # Secret-pattern scan stays a separate project sentinel.
        run: python scripts/run_broad_secret_scan.py --install-dir "${{ runner.temp }}/gitleaks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 immutable revision
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          if-no-files-found: warn
