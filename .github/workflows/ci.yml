name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Ruff lint
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/quality
          set +e
          ruff check . --output-format=json > artifacts/quality/ruff.json
          rc=$?
          ruff check . --output-format=github || true
          exit "$rc"
      - name: Ruff format
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          ruff format --diff . > artifacts/quality/ruff-format.diff || true
          ruff format --check .
      - name: Mypy strict
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          mypy src/commander_lab 2>&1 | tee artifacts/quality/mypy.txt
      - name: Test suite
        if: ${{ success() || failure() }}
        run: pytest -q
      - name: Compile
        if: ${{ success() || failure() }}
        run: python -m compileall -q src tests
      - name: Secret-pattern scan
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nIE -e '[s]k-[A-Za-z0-9_-]{20,}' -e '[O]PENAI_API_KEY=[^[:space:]]+' -- ':(exclude).env.example' ':(exclude)artifacts/**' || true)"
          if [[ -n "$matches" ]]; then
            matches="$(printf '%s\n' "$matches" | grep -Ev '[O]PENAI_API_KEY=(\.\.\.|<[^>]+>|\$\{[^}]+\})' || true)"
          fi
          if [[ -n "$matches" ]]; then
            echo "Potential secret material found. Content suppressed."
            exit 1
          fi
          echo "No secret patterns found."
      - name: Build wheel
        if: ${{ success() || failure() }}
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: ci-evidence
          path: |
            dist/
            artifacts/quality/
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned audit tools
        run: |
          python -m pip install -e '.[api]'
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0 pip-licenses==5.5.5
      - name: Dependency audit
        run: |
          mkdir -p artifacts/security
          python -m pip list --format=freeze --exclude-editable > artifacts/security/requirements-audit.txt
          pip-audit --strict --no-deps -r artifacts/security/requirements-audit.txt
      - name: CycloneDX SBOM
        run: mkdir -p artifacts/security && cyclonedx-py environment --output-format JSON --output-file artifacts/security/sbom.cdx.json
      - name: License report
        run: pip-licenses --format=json --output-file=artifacts/security/licenses.json
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          if-no-files-found: warn

  forge-primitive-a:
    if: ${{ github.head_ref == 'program/finalist-convergence-forge' || github.ref_name == 'program/finalist-convergence-forge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CONTRACT_COMMIT: 9a8b8f5f5961466514eae6103be2d227324a27a8
      CONTRACT_BUNDLE: ad1ec6e4baa83be48c0bc07e0bde66c2f8c003af29e411bad0953558154dcfee
      FORGE_BASE: 09cfad8a24be12a87761e6645c48577387f0521b
      FORGE_COMMIT: 1e604105f9e279331063824943b9222b6589f5d8
      FORGE_TREE: 994976e06aaf99b807646b60b1aa2ac9f7703df4
      FORGE_VERSION: 2.0.15-SNAPSHOT
    steps:
      - name: Checkout convergence PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Resolve exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin program/finalist-convergence-forge
          branch_head="$(git rev-parse origin/program/finalist-convergence-forge)"
          echo "COMMANDER_LAB_CONVERGENCE_BRANCH_HEAD=$branch_head" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$FORGE_BASE" "$branch_head"
      - name: Mount exact neutral contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.CONTRACT_COMMIT }}
          path: contract-lock
          sparse-checkout: qualification/finalist_convergence
      - name: Verify neutral contract identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-lock rev-parse HEAD)" = "$CONTRACT_COMMIT"
          python - <<'PY'
          import json, os
          p=json.load(open('contract-lock/qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json'))
          assert p['schema_version'] == 'commander-lab.semantic-fixture-materialization/1.0.1'
          assert p['canonical_bundle_digest'] == os.environ['CONTRACT_BUNDLE']
          by={r['fixture_id']:r for r in p['records']}
          assert by['PILOT_PRIORITY']['materialization_digest'] == '252b416e0022cf41ce42cc1a516c55866c874c6b239f10d04043430fc3966d2a'
          assert by['PILOT_TARGET']['materialization_digest'] == '854a5cb7e4a6aee3a733e004972decbd503f5e7fc53980a4b5c7fd640ed3351b'
          PY
      - name: Checkout exact Forge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_COMMIT }}
          path: vendor/engine-source/forge
          fetch-depth: 1
      - name: Verify Forge source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/engine-source/forge rev-parse HEAD)" = "$FORGE_COMMIT"
          test "$(git -C vendor/engine-source/forge rev-parse HEAD^{tree})" = "$FORGE_TREE"
          git -C vendor/engine-source/forge diff --exit-code
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
      - name: Validate qualification Python
        shell: bash
        run: |
          python -m py_compile scripts/finalist_apply_forge_primitive_a_overlay.py candidate-qualification/finalist-convergence-forge/run_primitive_a.py
      - name: Build pinned unmodified Forge game modules
        working-directory: vendor/engine-source/forge
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am -DskipTests install
          git diff --exit-code
      - name: Resolve isolated Forge classpath
        working-directory: vendor/engine-source/forge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/qualification/evidence/finalist-convergence-forge"
          mvn -B -ntp -Drevision="$FORGE_VERSION" -pl forge-game -am dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile="$GITHUB_WORKSPACE/qualification/evidence/finalist-convergence-forge/dependency-classpath.txt"
      - name: Generate provider and apply Primitive-A overlay
        shell: bash
        run: |
          set -euo pipefail
          ev=qualification/evidence/finalist-convergence-forge
          out="$ev/generated"
          mkdir -p "$out"
          python scripts/finalist_generate_forge_provider.py --player-controller vendor/engine-source/forge/forge-game/src/main/java/forge/game/player/PlayerController.java --output-dir "$out" --forge-commit "$FORGE_COMMIT" --forge-tree "$FORGE_TREE" | tee "$ev/generator-summary.json"
          python scripts/finalist_generate_forge_bootstrap.py --source qualification/providers/forge/gpl/Ws23ForgeBootstrap.java --output "$out/java/forge/game/player/Ws23ForgeBootstrap.java"
          python scripts/finalist_apply_forge_primitive_a_overlay.py --provider "$out/java/forge/game/player/Ws23ForgeVerticalProvider.java"
          git diff --check
      - name: Assert prohibited AI and GUI dependencies absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn 'import forge\.(ai|gui)|RemoteClientGuiGame|PlayerControllerAi|ComputerUtilMana' qualification/evidence/finalist-convergence-forge/generated/java
          ! grep -Eq 'forge-(ai|gui)' qualification/evidence/finalist-convergence-forge/dependency-classpath.txt
      - name: Compile separate GPL-side provider JVM
        shell: bash
        run: |
          set -euo pipefail
          ev=qualification/evidence/finalist-convergence-forge
          cp="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes:$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes:$(cat "$ev/dependency-classpath.txt")"
          mkdir -p "$ev/classes"
          javac -cp "$cp" -d "$ev/classes" "$ev/generated/java/forge/game/player/Ws23ForgeVerticalProvider.java" "$ev/generated/java/forge/game/player/Ws23ForgeBootstrap.java"
          printf '%s:%s:%s:%s\n' "$GITHUB_WORKSPACE/$ev/classes" "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-game/target/classes" "$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-core/target/classes" "$(cat "$ev/dependency-classpath.txt")" > "$ev/provider.classpath"
          ! grep -Eq 'forge-(ai|gui)' "$ev/provider.classpath"
          git -C vendor/engine-source/forge diff --exit-code
      - name: Execute exact Primitive-A records
        shell: bash
        run: |
          set -euo pipefail
          ev=qualification/evidence/finalist-convergence-forge
          export COMMANDER_LAB_FORGE_LANG_DIR="$GITHUB_WORKSPACE/vendor/engine-source/forge/forge-gui/res/languages"
          export COMMANDER_LAB_FORGE_PROVIDER_CMD="java -cp $(cat "$ev/provider.classpath") forge.game.player.Ws23ForgeBootstrap"
          python candidate-qualification/finalist-convergence-forge/run_primitive_a.py --contract contract-lock/qualification/finalist_convergence/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_1.json --output "$ev/PRIMITIVE_A_RESULTS.json"
          python - <<'PY'
          import json, os
          p=json.load(open('qualification/evidence/finalist-convergence-forge/PRIMITIVE_A_RESULTS.json'))
          assert p['counts'] == {'PASS': 2}
          assert p['convergence_branch_head'] == os.environ['COMMANDER_LAB_CONVERGENCE_BRANCH_HEAD']
          assert all(r['requested_native_state_equal'] for r in p['rows'])
          assert all(r['terminal_postcondition_result'] == 'PASS' for r in p['rows'])
          PY
      - name: Materialize checksums
        if: always()
        shell: bash
        run: |
          ev=qualification/evidence/finalist-convergence-forge
          find "$ev" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$ev/SHA256SUMS" || true
      - name: Upload Forge Primitive-A evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: finalist-convergence-forge-primitive-a-${{ github.sha }}
          path: qualification/evidence/finalist-convergence-forge
          if-no-files-found: warn
