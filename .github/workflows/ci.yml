name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev,api]'
      - name: Determine changed Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- '*.py' > changed-python-files.txt
          elif [[ "${{ github.event_name }}" == "push" ]] && \
               [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              -- '*.py' > changed-python-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD \
              -- '*.py' > changed-python-files.txt
          fi

          sort -u -o changed-python-files.txt changed-python-files.txt

          echo "Changed Python files:"
          cat changed-python-files.txt

      - name: Ruff lint changed Python files
        shell: bash
        run: |
          if [[ -s changed-python-files.txt ]]; then
            xargs -d '\n' ruff check -- < changed-python-files.txt
          else
            echo "No changed Python files to lint."
          fi

      - name: Ruff format changed Python files
        shell: bash
        run: |
          if [[ -s changed-python-files.txt ]]; then
            xargs -d '\n' ruff format --check -- < changed-python-files.txt
          else
            echo "No changed Python files to format-check."
          fi

      - name: Mypy baseline
        continue-on-error: true
        run: mypy src/commander_lab
      - name: Collect tests
        run: pytest --collect-only -q
      - name: Test suite
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Phase 8.6 audit
        run: commander-lab audit-phase86 --skip-tests || test $? -eq 2
      - name: Secret-pattern scan
        shell: bash
        run: |
          set -euo pipefail

          matches="$(
            git grep -nIE \
              -e '[s]k-[A-Za-z0-9_-]{20,}' \
              -e '[O]PENAI_API_KEY=[^[:space:]]+' \
              -- \
              ':(exclude).env.example' \
              ':(exclude)artifacts/**' \
              || true
          )"

          if [[ -n "$matches" ]]; then
            matches="$(
              printf '%s\n' "$matches" |
                grep -Ev '[O]PENAI_API_KEY=(\.\.\.|<[^>]+>|\$\{[^}]+\})' ||
                true
            )"
          fi

          if [[ -n "$matches" ]]; then
            echo "Potential secret material found. Content suppressed."
            exit 1
          fi

          echo "No secret patterns found."
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: ci-evidence
          path: |
            artifacts/audit/
            PHASE86_VALIDATION_OUTPUT.json
            dist/
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned audit tools
        run: |
          python -m pip install -e '.[api]'
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0 pip-licenses==5.5.5
      - name: Dependency audit
        run: |
          mkdir -p artifacts/security
          python -m pip list --format=freeze --exclude-editable > artifacts/security/requirements-audit.txt
          pip-audit --strict --no-deps -r artifacts/security/requirements-audit.txt
      - name: CycloneDX SBOM
        run: mkdir -p artifacts/security && cyclonedx-py environment --output-format JSON --output-file artifacts/security/sbom.cdx.json
      - name: License report
        run: pip-licenses --format=json --output-file=artifacts/security/licenses.json
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          if-no-files-found: warn
