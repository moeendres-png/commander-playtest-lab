name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install project and quality tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff lint
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/quality
          set +e
          ruff check . --output-format=json > artifacts/quality/ruff.json
          rc=$?
          ruff check . --output-format=github || true
          exit "$rc"
      - name: Ruff format
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          ruff format --diff . > artifacts/quality/ruff-format.diff || true
          ruff format --check .
      - name: Mypy strict
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          mypy src/commander_lab 2>&1 | tee artifacts/quality/mypy.txt
      - name: Test suite
        if: ${{ success() || failure() }}
        # B5 (#486): tests/qualification is owned by the required infrastructure
        # context (production-qualification.yml); every other test runs here.
        # tests/unit/test_required_test_ownership.py keeps each file to one owner.
        run: pytest -q --ignore=tests/qualification
      - name: Compile
        if: ${{ success() || failure() }}
        run: python -m compileall -q src tests
      - name: Secret-pattern scan
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail

          matches="$(
            git grep -nIE \
              -e '[s]k-[A-Za-z0-9_-]{20,}' \
              -e '[O]PENAI_API_KEY=[^[:space:]]+' \
              -- \
              ':(exclude).env.example' \
              ':(exclude)artifacts/**' \
              || true
          )"

          if [[ -n "$matches" ]]; then
            matches="$(
              printf '%s\n' "$matches" |
                grep -Ev '[O]PENAI_API_KEY=(\.\.\.|<[^>]+>|\$\{[^}]+\})' ||
                true
            )"
          fi

          if [[ -n "$matches" ]]; then
            echo "Potential secret material found. Content suppressed."
            exit 1
          fi

          echo "No secret patterns found."
      - name: Build wheel
        if: ${{ success() || failure() }}
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Packaging smoke (isolated wheel install, import and CLI)
        # Issue #490. Wheel construction above proves packaging can produce an
        # artifact; this proves the artifact installs into a clean isolated
        # environment and that the *installed* package imports and exposes its
        # officially supported console entrypoints. The isolated environment is
        # created outside the workspace, never inherits system site-packages,
        # installs the project with --no-index --no-deps from the exact wheel
        # path, takes its dependency closure from the hash-pinned project lock,
        # and probes imports with -I so no worktree PYTHONPATH can substitute the
        # source tree for the installation. No continue-on-error, no || true and
        # no skip condition: a broken wheel, entrypoint or evidence document
        # fails this required context.
        if: ${{ success() || failure() }}
        run: |
          python scripts/verify_packaging_smoke.py smoke \
            --repo . \
            --wheel-dir dist \
            --venv-dir "$RUNNER_TEMP/packaging-smoke-venv" \
            --output artifacts/quality/PACKAGING_SMOKE.json
      - name: Packaging smoke evidence check
        # Independently re-adjudicate the machine-readable evidence, including
        # re-verifying that the built wheel still hashes to the bound digest.
        # Missing, truncated, malformed, UNKNOWN or unbound evidence is never
        # promoted to PASS.
        if: ${{ success() || failure() }}
        run: |
          python scripts/verify_packaging_smoke.py check \
            --repo . \
            --wheel-dir dist \
            --evidence artifacts/quality/PACKAGING_SMOKE.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 immutable revision
        if: always()
        with:
          name: ci-evidence
          path: |
            dist/
            artifacts/quality/
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 immutable revision
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install project and pinned audit tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0 pip-licenses==5.5.5
      - name: Dependency audit
        run: |
          mkdir -p artifacts/security
          python -m pip list --format=freeze --exclude-editable > artifacts/security/requirements-audit.txt
          pip-audit --strict --no-deps -r artifacts/security/requirements-audit.txt
      - name: CycloneDX SBOM
        run: mkdir -p artifacts/security && cyclonedx-py environment --output-format JSON --output-file artifacts/security/sbom.cdx.json
      - name: License report
        run: pip-licenses --format=json --output-file=artifacts/security/licenses.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 immutable revision
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          if-no-files-found: warn
