name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  materialize_static_fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'patch/post-official-decision-fidelity-search-efficiency' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply byte-verified strict static repair
        shell: bash
        run: |
          set -euo pipefail
          cat .patchparts/staticfix/part*.b64 | base64 --decode > /tmp/staticfix.patch
          sha256sum /tmp/staticfix.patch
          git apply --check /tmp/staticfix.patch
          git apply /tmp/staticfix.patch
          rm -rf .patchparts/staticfix
          rm -f .github/workflows/staticfix-materialize.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix strict static quality findings"
          git push origin HEAD:${GITHUB_HEAD_REF}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Ruff lint
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/quality
          set +e
          ruff check . --output-format=json > artifacts/quality/ruff.json
          rc=$?
          ruff check . --output-format=github || true
          exit "$rc"
      - name: Ruff format
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          ruff format --diff . > artifacts/quality/ruff-format.diff || true
          ruff format --check .
      - name: Mypy strict
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          mypy src/commander_lab 2>&1 | tee artifacts/quality/mypy.txt
      - name: Test suite
        if: ${{ success() || failure() }}
        run: pytest -q
      - name: Compile
        if: ${{ success() || failure() }}
        run: python -m compileall -q src tests
      - name: Secret-pattern scan
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail

          matches="$(
            git grep -nIE \
              -e '[s]k-[A-Za-z0-9_-]{20,}' \
              -e '[O]PENAI_API_KEY=[^[:space:]]+' \
              -- \
              ':(exclude).env.example' \
              ':(exclude)artifacts/**' \
              || true
          )"

          if [[ -n "$matches" ]]; then
            matches="$(
              printf '%s\n' "$matches" |
                grep -Ev '[O]PENAI_API_KEY=(\.\.\.|<[^>]+>|\$\{[^}]+\})' ||
                true
            )"
          fi

          if [[ -n "$matches" ]]; then
            echo "Potential secret material found. Content suppressed."
            exit 1
          fi

          echo "No secret patterns found."
      - name: Build wheel
        if: ${{ success() || failure() }}
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: ci-evidence
          path: |
            dist/
            artifacts/quality/
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned audit tools
        run: |
          python -m pip install -e '.[api]'
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0 pip-licenses==5.5.5
      - name: Dependency audit
        run: |
          mkdir -p artifacts/security
          python -m pip list --format=freeze --exclude-editable > artifacts/security/requirements-audit.txt
          pip-audit --strict --no-deps -r artifacts/security/requirements-audit.txt
      - name: CycloneDX SBOM
        run: mkdir -p artifacts/security && cyclonedx-py environment --output-format JSON --output-file artifacts/security/sbom.cdx.json
      - name: License report
        run: pip-licenses --format=json --output-file=artifacts/security/licenses.json
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4 immutable revision
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          if-no-files-found: warn
