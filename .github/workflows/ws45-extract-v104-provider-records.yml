name: WS45 extract v1.0.4 provider records

on:
  push:
    branches: [ws45/forge-v1.0.4-successor-qualification]
    paths:
      - '.github/workflows/ws45-extract-v104-provider-records.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WS44_COMMIT: 12940248497a8795991cbbd2eedef72945528cfe
  WS44_TREE: cd83c973b269711106d08ab5be2d7672f05bcb7c
  WS44_NAMESPACE_TREE: 6579e119605b90248426a3121a47c487b2bb13cd
  WS44_MATERIALIZATION_SHA256: 9b370244e4e5df3132e6e9a3d2b70ad641a5a6023fc7c86832931340d24bfa35

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moeendres-png/commander-playtest-lab
          ref: ${{ env.WS44_COMMIT }}
          path: contract-v104
          sparse-checkout: qualification/ws44
          fetch-depth: 1
      - name: Verify immutable lock and extract exact denominator records
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C contract-v104 rev-parse HEAD)" = "$WS44_COMMIT"
          test "$(git -C contract-v104 rev-parse HEAD^{tree})" = "$WS44_TREE"
          test "$(git -C contract-v104 rev-parse HEAD:qualification/ws44)" = "$WS44_NAMESPACE_TREE"
          test "$(sha256sum contract-v104/qualification/ws44/SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json | awk '{print $1}')" = "$WS44_MATERIALIZATION_SHA256"
          mkdir -p artifacts/ws45-v104-records
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('contract-v104/qualification/ws44')
          doc=json.load(open(root/'SEMANTIC_FIXTURE_MATERIALIZATION_v1_0_4.json'))
          den=json.load(open(root/'WS44_PROVIDER_DENOMINATOR_107.json'))
          ids=den['fixture_ids']
          assert len(ids)==107 and len(set(ids))==107
          by={r['fixture_id']:r for r in doc['records']}
          records=[by[x] for x in ids]
          out={
            'schema':'commander-lab.ws45.exact-v104-provider-records/1.0.0',
            'ws44_commit':'12940248497a8795991cbbd2eedef72945528cfe',
            'provider_denominator_count':107,
            'fixture_ids':ids,
            'records':records,
          }
          open('artifacts/ws45-v104-records/WS45_EXACT_V104_PROVIDER_RECORDS.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum artifacts/ws45-v104-records/WS45_EXACT_V104_PROVIDER_RECORDS.json > artifacts/ws45-v104-records/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ws45-exact-v104-provider-records-${{ github.sha }}
          path: artifacts/ws45-v104-records/
          if-no-files-found: error
          retention-days: 90
