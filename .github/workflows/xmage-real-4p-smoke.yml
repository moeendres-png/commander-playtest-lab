name: XMage Real 4P Technical Smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "engine-bridge/**"
      - "src/commander_lab/engine/rules/full_game.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/models/**"
      - "src/commander_lab/storage/**"
      - "src/commander_lab/candidates/models.py"
      - "src/commander_lab/engine/rules/project.py"
      - "scripts/run_real_4p_full_game_smoke.py"
      - "tests/unit/test_real_4p_full_game_smoke.py"
      - "tests/unit/test_rules_project_loader.py"
      - "data/decks/rogshai_current.json"
      - "data/decks/opponents/kaervek/current/deck.json"
      - "data/opponents/hosts_of_mordor_precon.json"
      - "data/opponents/lorehold_spirit_precon.json"
      - ".github/workflows/xmage-real-4p-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: xmage-real-4p-smoke-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  XMAGE_COMMIT: 9375f35ac7c9a540ebcb8b262b8645b8c6b1b326
  PYTHONHASHSEED: "0"
  COMMANDER_LAB_XMAGE_FULL_GAME_BRIDGE_CMD: >-
    java -jar ${{ github.workspace }}/engine-bridge/target/xmage-engine-bridge-0.1.0-SNAPSHOT.jar full-game

jobs:
  smoke-scope:
    # Always runs on pull requests so the heavy job below can be a required check;
    # the heavy job is skipped (reported as success) only when this change
    # provably touches none of its inputs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - id: scope
        uses: ./.github/actions/change-scope
        with:
          paths: |
            .github/actions/**
            engine-bridge/**
            src/commander_lab/engine/rules/full_game.py
            src/commander_lab/agents/**
            src/commander_lab/models/**
            src/commander_lab/storage/**
            src/commander_lab/candidates/models.py
            src/commander_lab/engine/rules/project.py
            scripts/run_real_4p_full_game_smoke.py
            tests/unit/test_real_4p_full_game_smoke.py
            tests/unit/test_rules_project_loader.py
            data/decks/rogshai_current.json
            data/decks/opponents/kaervek/current/deck.json
            data/opponents/hosts_of_mordor_precon.json
            data/opponents/lorehold_spirit_precon.json
            .github/workflows/xmage-real-4p-smoke.yml

  real-4p-smoke:
    needs: [smoke-scope]
    if: ${{ !cancelled() && needs.smoke-scope.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout pinned XMage
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt

      - name: Verify immutable XMage pin
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"

      - name: Pinned XMage engine (restored by pin commit, built on a miss)
        uses: ./.github/actions/pinned-xmage-engine
        with:
          commit: ${{ env.XMAGE_COMMIT }}

      - name: Install lab
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run real-deck setup and loader tests
        run: |
          pytest -q tests/unit/test_rules_project_loader.py tests/unit/test_real_4p_full_game_smoke.py

      - name: Preflight exact real 4P deck inputs
        run: python scripts/run_real_4p_full_game_smoke.py --preflight-only

      - name: Package XMage bridge
        # The bridge test suite runs in XMage Full Game Conformance (and H4); this
        # smoke only needs the packaged bridge, so it does not run it a third time.
        working-directory: engine-bridge
        run: mvn -B -ntp -DskipTests package

      - name: Run bounded real 4P technical smoke
        run: python scripts/run_real_4p_full_game_smoke.py --smoke-decisions 40

      - name: Verify evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/xmage-full-game/REAL_4P_TECHNICAL_SMOKE.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "PASS"
          assert report["mode"] == "bounded_live_smoke"
          assert report["player_count"] == 4
          assert report["all_four_decks_imported_by_xmage"] is True
          assert report["rules_authority"] == "xmage"
          assert report["decision_authority"] == "commander_lab_external_pilots"
          assert report["evidence_class"] == "technical_conformance_only"
          assert report["official_campaign_eligible"] is False
          assert report["deck_strength_evidence"] is False
          assert report["actual_card_behavior_coverage_claim"] is False
          assert report["canonical_data_mutated"] is False
          assert report["clean_shutdown"] is True
          PY

      # Preflight writes REAL_4P_PREFLIGHT.json. This unconditional upload
      # names only the live path, so an earlier bridge/live-stage failure cannot
      # publish the preflight PASS as live-smoke evidence.
      - name: Upload real 4P technical evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: xmage-real-4p-smoke-${{ github.sha }}
          path: artifacts/xmage-full-game/REAL_4P_TECHNICAL_SMOKE.json
          if-no-files-found: error
