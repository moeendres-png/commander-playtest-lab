name: Apply 4P-only operational simulation policy

on:
  push:
    branches:
      - policy/4p-only-simulation-readiness-20260820
    paths:
      - .github/workflows/apply-4p-only-policy.yml

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/4p-only-simulation-readiness-20260820
      - name: Apply fail-closed 4P policy
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/commander_lab/robustness.py')
          text = path.read_text(encoding='utf-8')
          old = '''@dataclass(frozen=True)\nclass PolicyTournamentConfig:\n    seed: int = 20260807\n    rounds: int = 128\n    pod_sizes: tuple[int, ...] = (3, 4, 5)\n    iterations_per_scenario: int = 1\n    max_turns: int = 24\n    workers: int = 1\n'''
          new = '''@dataclass(frozen=True)\nclass PolicyTournamentConfig:\n    seed: int = 20260807\n    rounds: int = 128\n    pod_sizes: tuple[int, ...] = (4,)\n    iterations_per_scenario: int = 1\n    max_turns: int = 24\n    workers: int = 1\n\n    def __post_init__(self) -> None:\n        if self.pod_sizes != (4,):\n            raise ValueError(\n                "Operational Commander Playtest Lab simulations are 4-player only; "\n                "3P/5P pod sensitivity is out of project scope."\n            )\n'''
          if old not in text:
              raise SystemExit('Expected PolicyTournamentConfig block not found; refusing to patch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/unit/test_operational_4p_policy.py')
          test.write_text('''from __future__ import annotations\n\nimport pytest\n\nfrom commander_lab.robustness import PolicyTournamentConfig\n\n\ndef test_policy_tournament_defaults_to_four_player_commander_only() -> None:\n    assert PolicyTournamentConfig().pod_sizes == (4,)\n\n\n@pytest.mark.parametrize("pod_sizes", [(3,), (5,), (3, 4, 5), (4, 5), (3, 4)])\ndef test_policy_tournament_rejects_non_four_player_operational_scope(\n    pod_sizes: tuple[int, ...],\n) -> None:\n    with pytest.raises(ValueError, match="4-player only"):\n        PolicyTournamentConfig(pod_sizes=pod_sizes)\n''', encoding='utf-8')

          policy = Path('docs/OPERATIONAL_SIMULATION_POLICY.md')
          policy.write_text('''# Operational Simulation Policy\n\nCurrent policy effective 2026-08-20:\n\n- The Commander Playtest Lab operational simulation target is **4-player Commander only**.\n- 3-player and 5-player pod sensitivity are out of scope and must not be scheduled, calculated, or used as readiness/robustness gates.\n- Generic low-level engine capability may remain for technical correctness tests, but project-level tournament/robustness configuration fails closed unless `pod_sizes == (4,)`.\n- Historical 3P/5P references or artifacts are provenance only, not current evidence requirements.\n- Structural results remain `structural_model_estimates`, not empirical win rates.\n- This policy does not mutate canonical deck lists, inventory, purchases, opponent truth, or physical allocations.\n''', encoding='utf-8')

          Path('.github/workflows/apply-4p-only-policy.yml').unlink()
      - name: Commit policy patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/commander_lab/robustness.py tests/unit/test_operational_4p_policy.py docs/OPERATIONAL_SIMULATION_POLICY.md .github/workflows/apply-4p-only-policy.yml
          git diff --cached --check
          git commit -m "policy: lock operational simulations to 4-player Commander"
          git push origin HEAD:policy/4p-only-simulation-readiness-20260820
