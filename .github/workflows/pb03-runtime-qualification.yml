name: PB-03 Current Boundary Runtime Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/pb03-runtime-qualification.yml"
      - "config/rules_engines.json"
      # B12: the effective contract, fixture manifests and install inputs the
      # producer reads (tests/qualification/test_pb03_trigger_completeness.py).
      - "qualification/CURRENT_PRE_FREEZE_CONTRACT.json"
      - "qualification/pre-freeze-successor/**"
      - "qualification/ws47/**"
      - "qualification/manifests/**"
      # Committed inputs consumed by the workflow's offline tests (audit measured).
      - "qualification/final-current-boundary-20260927/**"
      - "qualification/pb03-fresh-main-reconciliation-20260929/**"
      - "qualification/xmage-mp-candidate-repin-v2-20260930/**"
      - "tests/__init__.py"
      - "tests/qualification/test_pb03_trigger_completeness.py"
      - "requirements/lock.txt"
      - "pyproject.toml"
      # pyproject.toml's declared readme: `pip install -e .` reads it.
      - "README.md"
      - "scripts/resolve_pre_freeze_contract.py"
      - "schemas/engine_adapter_protocol.schema.json"
      - "engine-bridge/**"
      - "scripts/run_current_boundary_qualification.py"
      - "scripts/assemble_current_boundary_evidence.py"
      # The Coordinator AF11 adjudication the assembler validates (Refs #255).
      - "qualification/af11-single-provider-topology-*/**"
      - "scripts/run_midgame_capability_probe.py"
      - "src/commander_lab/qualification/current_boundary/**"
      - "tests/qualification/test_current_boundary_dimension_admission.py"
      - "tests/qualification/test_current_boundary_midgame_lane.py"
      - "tests/qualification/test_current_boundary_pb03_runtime.py"
      - "tests/qualification/test_current_boundary_receipts.py"
      # The early contract step's wildcard family, the generators its
      # determinism tests launch and the errata ledger they read (#646, audit
      # measured by tests/qualification/test_pb03_trigger_completeness.py).
      - "tests/qualification/test_midgame_arrival_history_*.py"
      # The static registry preflight (efficiency M16): a record gap in any
      # lane registry fails here in seconds, before the engine builds.
      - "tests/qualification/test_lane_registry_declarations.py"
      - "docs/arrival_history_erratum_*/generate_contract_*.py"
      - "docs/final_prefreeze_evidence_closure_20261001/FIXTURE_ERRATA_LEDGER.json"
      - "src/commander_lab/__init__.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/candidates/**"
      - "src/commander_lab/cards/**"
      - "src/commander_lab/engine/**"
      - "src/commander_lab/models/**"
      - "src/commander_lab/storage/**"
      - "tests/conftest.py"
      - "src/commander_lab/semantic_replay/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pb03-runtime-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  # B12: stream the runner's phase lines as they happen instead of at exit.
  PYTHONUNBUFFERED: "1"

jobs:
  pb03-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Fail cheap contract checks before any external engine checkout/build.
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt

      - name: Install lab
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate PB-03 Python contracts
        run: |
          pytest -q \
            tests/qualification/test_current_boundary_dimension_admission.py \
            tests/qualification/test_current_boundary_midgame_lane.py \
            tests/qualification/test_current_boundary_pb03_runtime.py \
            tests/qualification/test_current_boundary_receipts.py \
            tests/qualification/test_midgame_arrival_history_*.py \
            tests/qualification/test_lane_registry_declarations.py

      - name: Resolve current XMage and Forge dual identities
        run: |
          set -euo pipefail
          # config/rules_engines.json is the sole machine-readable authority.
          # Forge deliberately has two bound roles: #11/#12 Rules Core and the
          # bridge-only #13 materialization descendant used for execution.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          config = json.load(open("config/rules_engines.json"))
          xmage = config["primary_engine"]
          forge = config["secondary_engine"]
          bridge = forge["bridge_source"]
          values = {
              "XMAGE_COMMIT": xmage["commit"],
              "FORGE_RULES_COMMIT": forge["commit"],
              "FORGE_BRIDGE_COMMIT": bridge["commit"],
          }
          assert bridge["rules_core_base_commit"] == forge["commit"], bridge
          assert bridge["repository"] == forge["repository"], bridge
          for env_name, commit in values.items():
              assert len(commit) == 40 and all(c in "0123456789abcdef" for c in commit), commit
              print(f"{env_name}={commit}")
          PY

      - name: Checkout pinned XMage
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: moeendres-png/mage
          ref: ${{ env.XMAGE_COMMIT }}
          path: vendor/engine-source/xmage
          fetch-depth: 1

      - name: Checkout admitted Forge bridge/materialization source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: moeendres-png/forge
          ref: ${{ env.FORGE_BRIDGE_COMMIT }}
          path: vendor/engine-source/forge
          fetch-depth: 0
          # Partial clone: the full commit graph and every tree (what the
          # dual-source binding below verifies: ancestry and the Rules-Core path
          # diff), with file contents only for the checked-out commit. Measured
          # 38 s instead of 5.7 min; the verification commands are unchanged.
          filter: blob:none

      - name: Bind external candidate workspaces without polluting Lab identity
        run: |
          set -euo pipefail
          printf '/vendor/engine-source/\n' >> .git/info/exclude
          test -z "$(git status --porcelain -- vendor/engine-source/)"
          echo "FORGE_WORKSPACE=$GITHUB_WORKSPACE/vendor/engine-source/forge" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify immutable XMage pin
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$XMAGE_COMMIT"

      - name: Verify immutable Forge dual-source binding
        working-directory: vendor/engine-source/forge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORGE_BRIDGE_COMMIT"
          git merge-base --is-ancestor "$FORGE_RULES_COMMIT" "$FORGE_BRIDGE_COMMIT"
          test -z "$(git diff --name-only "$FORGE_RULES_COMMIT" "$FORGE_BRIDGE_COMMIT" --             forge-game forge-core forge-ai forge-gui forge-gui-desktop adventure-editor)"
          test -z "$(git status --porcelain)"

      - name: Build pinned XMage
        working-directory: vendor/engine-source/xmage
        run: |
          set -euo pipefail
          if test -x ./mvnw; then
            ./mvnw -B -ntp -DskipTests install
          else
            mvn -B -ntp -DskipTests install
          fi

      - name: Build and warm admitted Forge exact source
        working-directory: vendor/engine-source/forge
        run: |
          set -euo pipefail
          # Forge's own CI validates under a headless X server. Warm the exact
          # test-phase dependencies online; the credited runner executes the
          # selected native suites offline afterwards.
          command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
          export DISPLAY=:99
          Xvfb :99 -screen 0 800x600x8 >/tmp/forge-xvfb.log 2>&1 &
          mvn -U -B -ntp -DskipTests -Dcheckstyle.skip=true install
          mvn -U -B -ntp -Dcheckstyle.skip=true -DfailIfNoTests=false             -Dsurefire.failIfNoSpecifiedTests=false test -Dtest=BridgeEngineTest
          # Resolve the bridge classpath inside the reactor (-am, packaged in the same
          # invocation): the sibling modules then resolve to the jars built from this
          # exact checkout. Without -am Maven reads them from ~/.m2, whose installed
          # POMs keep the parent version as ${revision} and cannot be resolved.
          mvn -B -ntp -pl forge-protocol2-bridge -am -DskipTests -Dcheckstyle.skip=true \
            package dependency:build-classpath -Dmdep.outputFile=target/cp-wsr22.txt
          test -s forge-protocol2-bridge/target/cp-wsr22.txt

      - name: Resolve the runtime evidence epoch
        run: |
          set -euo pipefail
          # The runner and assembler resolve the epoch from the producing source
          # (commit+tree) under qualification/current-boundary-epochs/. Nothing
          # here may hard-code the historical WSR22 epoch: CI must consume the
          # epoch this run produced, so the path is resolved by the same function
          # the runner and assembler use.
          epoch="$(PYTHONPATH=src python3 -c 'from pathlib import Path; from commander_lab.qualification.current_boundary import evidence_epoch; print(evidence_epoch.relative_epoch_root(Path(".")))')"
          test -n "$epoch"
          echo "CURRENT_BOUNDARY_EVIDENCE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "resolved evidence epoch: $epoch"

      - name: Build current XMage bridge and exact classpath
        working-directory: engine-bridge
        run: |
          set -euo pipefail
          # Online warm-up: execute one small bound test class so the surefire
          # provider and every test-phase dependency are resolved into the local
          # Maven cache. The qualification runner executes its suites with
          # `mvn -o` (hermetic, no network during a credited run), so the cache
          # must be complete before it starts.
          mvn -B -ntp -Dcheckstyle.skip=true -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false test -Dtest=XmageCandidateEngineFingerprintTest
          mvn -B -ntp -DskipTests -Dcheckstyle.skip=true dependency:build-classpath -Dmdep.outputFile=target/cp-wsr22.txt
          test -s target/cp-wsr22.txt

      - name: Execute the production-reachable mid-game probe
        run: |
          set -euo pipefail
          python scripts/run_midgame_capability_probe.py --out "$CURRENT_BOUNDARY_EVIDENCE_EPOCH/LIVE_MIDGAME_CAPABILITY_PROBE.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          from commander_lab.qualification.current_boundary import bridge_launcher

          receipt = json.loads(
              (Path(os.environ["CURRENT_BOUNDARY_EVIDENCE_EPOCH"]) / "LIVE_MIDGAME_CAPABILITY_PROBE.json").read_text()
          )
          expected_engine = bridge_launcher.canonical_xmage_engine_pin()
          assert receipt["engine_commit"] == expected_engine, receipt["engine_commit"]
          assert receipt["engine_artifact_kind"] == "file", receipt["engine_artifact_kind"]
          assert re.fullmatch(r"[0-9a-f]{64}", receipt["engine_artifact_sha256"] or "")
          assert receipt["counts"]["probed"] == len(receipt["rows"])
          assert receipt["counts"]["transport_failure"] == 0, receipt["counts"]
          print(
              json.dumps(
                  {
                      "engine_commit": receipt["engine_commit"],
                      "engine_artifact_sha256": receipt["engine_artifact_sha256"],
                      "counts": receipt["counts"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Execute authoritative two-candidate current-boundary runner
        env:
          # #479 E2: overlap the Forge native suites with the XMage-only phases.
          # Promoted after 3 consecutive paired serial/shadow runs with 0
          # compare_pb03_shadow.py differences (37609639402/37609636008,
          # 37636020029/37636015934, 37655739220/37655726198). Unset the
          # variable to restore the serial order; receipts are identical.
          PB03_SHADOW_PARALLEL_FORGE_NATIVE: "1"
        run: python scripts/run_current_boundary_qualification.py --candidate all

      - name: Assemble source-bound current-boundary evidence
        run: python scripts/assemble_current_boundary_evidence.py

      - name: Assert PB-03 evidence boundaries
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from commander_lab.qualification.current_boundary import bridge_launcher
          from commander_lab.qualification.current_boundary import midgame_lane as ml
          from commander_lab.qualification.current_boundary import receipts as receipt_mod

          root = Path(os.environ["CURRENT_BOUNDARY_EVIDENCE_EPOCH"])
          admission = json.loads((root / "PB03_DIMENSION_ADMISSION.json").read_text())
          execution = json.loads((root / "PB03_RUNTIME_EXECUTION.json").read_text())
          matrix = json.loads((root / "PB03_RUNTIME_EXECUTION_MATRIX.json").read_text())
          expected_engine = bridge_launcher.canonical_xmage_engine_pin()

          assert admission["rows_total"] == 30
          assert admission["counts"] == {"admitted": 13, "blocked": 17}
          assert admission["classification"] == "TECHNICALLY_CONFORMANT"
          assert admission["manifest_source"].endswith("state_restoration_dimensions")

          # The loaded engine artifact identity is provider-reported and must be
          # a file-backed 64-hex digest, consistent across the admission
          # handshake, the runtime ledger and the assembled matrix.
          provider = admission["provider_identity"]
          artifact_digest = provider["engine_artifact_sha256"]
          assert provider["engine_artifact_kind"] == "file"
          assert re.fullmatch(r"[0-9a-f]{64}", artifact_digest)
          assert provider["engine_commit"] == expected_engine
          assert execution["engine_artifact_sha256"] == artifact_digest
          assert execution["engine_artifact_kind"] == "file"
          assert matrix["engine_artifact"]["sha256"] == artifact_digest
          assert matrix["artifact_identity_consistent"] is True

          assert execution["rows_total"] == 30
          assert execution["executed_pass"] == 30
          assert execution["not_run_or_failed"] == 0
          assert execution["classification"] == "PASS"
          assert all(row["runtime_execution"] == "PASS" for row in execution["rows"])

          # The ledger and the matrix are bound to the exact executing runner and
          # to the canonical engine pin. A stale ledger earns zero runtime credit.
          live_runner_digest = receipt_mod.capture_runner_identity(Path(".")).digest()
          assert execution["runner_digest"] == live_runner_digest
          assert execution["candidate_commit"] == expected_engine

          # The live probe receipt must name the exact same run identity and
          # loaded artifact as the admission handshake. A well-formed digest of a
          # different artifact is STALE, never fresh.
          live_receipt = json.loads(
              (Path(os.environ["CURRENT_BOUNDARY_EVIDENCE_EPOCH"]) / "LIVE_MIDGAME_CAPABILITY_PROBE.json").read_text()
          )
          assert (
              ml.receipt_freshness(
                  live_receipt,
                  expected_runner_digest=live_runner_digest,
                  expected_engine_commit=expected_engine,
                  expected_engine_artifact_sha256=artifact_digest,
              )
              == ml.MIDGAME_RECEIPT_FRESH
          )

          assert matrix["PB03_DIMENSION_ADMISSION"] == "TECHNICALLY_CONFORMANT"
          assert matrix["PB03_RUNTIME_EXECUTION"] == "PASS"
          assert matrix["native_receipt"] == "FRESH_EXACT"
          assert matrix["runtime_credit"] == "EXECUTED_PASS"
          assert matrix["rows_total"] == 30
          assert matrix["architecture_freeze"] == "NOT_CLAIMED"
          assert matrix["production_provider"] == "NOT_SELECTED"
          assert all(row["full107_credit"] == "NONE_FROM_PB03_MATRIX" for row in matrix["rows"])

          by_id = {row["fixture_id"]: row for row in matrix["rows"]}
          for fixture_id in (
              "MICRO_RULES_RANDOMNESS",
              "WS05-MP-ELIM-STACK-3",
              "WS05-MP-TURN-5",
              "WS05-CMD-ZONE-LIB-YES",
          ):
              assert by_id[fixture_id]["admission_verdict"] != "ADMITTED_TO_NATIVE_RESTORATION"
              assert by_id[fixture_id]["runtime_execution"] == "PASS"

          print(json.dumps({
              "admission_counts": admission["counts"],
              "runtime_classification": execution["classification"],
              "runtime_executed_pass": execution["executed_pass"],
              "native_receipt": matrix["native_receipt"],
              "runtime_credit": matrix["runtime_credit"],
          }, sort_keys=True))
          PY

      - name: Assert R-3/R-4 two-candidate current-boundary invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CURRENT_BOUNDARY_EVIDENCE_EPOCH"])
          expected = {
              "xmage": os.environ["XMAGE_COMMIT"],
              "forge": os.environ["FORGE_RULES_COMMIT"],
          }

          gate_summary = {}
          for candidate, commit in expected.items():
              upper = candidate.upper()
              full107 = json.loads((root / f"FULL107_{upper}_RESULTS.json").read_text())
              assert not full107.get("carried_forward"), (candidate, full107.get("carried_forward"))
              assert full107["runtime_identity"]["engine_candidate_commit"] == commit
              assert full107["r4_unreceipted_pass_demotions"] == 0, (
                  candidate,
                  full107["r4_unreceipted_pass_demotions"],
              )
              pass_rows = [row for row in full107["rows"] if row["exit_state"] == "PASS"]
              assert len(pass_rows) == full107["counts"]["PASS"]
              assert all(row.get("positive_receipt_identities") for row in pass_rows), (
                  candidate,
                  [row["fixture_id"] for row in pass_rows if not row.get("positive_receipt_identities")],
              )

              af = json.loads((root / f"AF00_AF11_{upper}.json").read_text())
              assert af["boundary"] == "FRESH_CURRENT_BOUNDARY_EXECUTION", candidate
              gates = {gate["gate"]: gate for gate in af["gates"]}
              assert set(f"AF{i:02d}" for i in range(11)).issubset(gates), sorted(gates)
              # The gate verdicts are printed so a reviewer can read them from
              # the job log; the packet remains the evidence of record.
              gate_summary[candidate] = {
                  name: {
                      "verdict": gate["verdict"],
                      "blocking_rows": len(gate.get("blocking_rows") or ()),
                  }
                  for name, gate in sorted(gates.items())
              }
              gate_summary[candidate]["AF07_evidence"] = gates["AF07"].get("evidence")
              # Every non-PASS FULL107 row with its state, execution mode and
              # reason, and the rows each AF gate names as blocking, so a
              # residual partition can be read from the log.
              gate_summary[candidate]["blocking_row_ids"] = {
                  name: sorted(gate.get("blocking_rows") or ())
                  for name, gate in sorted(gates.items())
                  if gate.get("blocking_rows")
              }
              gate_summary[candidate]["non_pass_rows"] = [
                  {
                      "fixture_id": row["fixture_id"],
                      "exit_state": row["exit_state"],
                      "execution_mode": row.get("execution_mode"),
                      "reason": str(row.get("failure_reason") or row.get("reason") or "")[:240],
                  }
                  for row in full107["rows"]
                  if row["exit_state"] != "PASS"
              ]

          forge_af01 = json.loads((root / "AF01_FORGE.json").read_text())
          invariants = forge_af01["invariants"]
          assert len(invariants) == 20, len(invariants)
          assert all(item["verdict"] == "PASS" for item in invariants), [
              item for item in invariants if item["verdict"] != "PASS"
          ]
          assert forge_af01["verdict"] == "PASS", forge_af01["verdict"]

          packet = json.loads((root / "PROVIDER_READINESS_CURRENT.json").read_text())
          assert packet["production_provider"] == "NOT_SELECTED"
          assert packet["architecture_freeze"] == "NOT_CLAIMED"
          assert packet["ranking"] == "NONE"
          assert set(packet["candidates"]) == {"xmage", "forge"}
          assert all(
              data["column_provenance"]["class"] == "FRESH_CURRENT_BOUNDARY_EXECUTION"
              for data in packet["candidates"].values()
          )

          print(json.dumps({
              "xmage_full107": packet["candidates"]["xmage"]["full107_counts"],
              "forge_full107": packet["candidates"]["forge"]["full107_counts"],
              "forge_af01": forge_af01["verdict"],
              "provider": packet["production_provider"],
              "freeze": packet["architecture_freeze"],
          }, sort_keys=True))
          print(json.dumps({"af_gates": gate_summary}, indent=1, sort_keys=True))
          PY

      - name: Hash current-boundary packet
        run: |
          set -euo pipefail
          root="$CURRENT_BOUNDARY_EVIDENCE_EPOCH"
          find "$root" -type f ! -name CURRENT_BOUNDARY_SHA256SUMS -print0             | sort -z             | xargs -0 sha256sum > "$root/CURRENT_BOUNDARY_SHA256SUMS"

      - name: Upload complete source-bound current-boundary packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        # Never with an unresolved epoch: an empty path expands to "/" (the runner's
        # whole filesystem), as seen when an earlier step failed.
        if: always() && env.CURRENT_BOUNDARY_EVIDENCE_EPOCH != ''
        with:
          name: current-boundary-two-candidate-${{ github.sha }}
          path: |
            ${{ env.CURRENT_BOUNDARY_EVIDENCE_EPOCH }}/
          if-no-files-found: error
          retention-days: 90
