name: J-FINAL Scope Repair Materializer

on:
  push:
    branches:
      - agent/priority-context-feature-fusion

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Materialize exact J-FINAL scope repair
        run: python tools/j_final_scope_repair.py
      - name: Pre-commit syntax and whitespace check
        run: |
          git diff --check
          python -m compileall -q src
      - name: Commit materialized repair
        run: |
          if git diff --quiet; then
            echo 'No materialization changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commander_lab/tools/service.py src/commander_lab/tools/candidates.py
          git commit -m 'J-FINAL: reconcile active scope and Fresh-Rebuild discovery'
          git push
