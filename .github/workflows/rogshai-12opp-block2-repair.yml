name: RogShai Structural 12-Opponent Block 2 Repair

on:
  push:
    branches:
      - runs/rogshai-48-structural-12opp-20260825
    paths:
      - '.github/workflows/rogshai-12opp-block2-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-12opp-block2-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Commander Lab
        run: python -m pip install -e '.[dev]'
      - name: Decode fixed inputs
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          for source, target in [
              ('artifacts/rogshai-structural-broad-screen-2026-08-25/input/CANDIDATES.json.gz.b64', '/tmp/CANDIDATES.json'),
              ('scripts/run_rogshai_structural_12opp_screen.py.gz.b64', '/tmp/run_rogshai_structural_12opp_screen.py'),
          ]:
              Path(target).write_bytes(gzip.decompress(base64.b64decode(Path(source).read_text().strip())))
          PY
          cat > /tmp/SEED_SCHEDULE.json <<'JSON'
{
  "balance": {
    "candidate_seat_counts": {"1": 4, "2": 4, "3": 4, "4": 4},
