    {"candidate_seat":1,"master_seed":2026090316,"opponent_by_seat":{"2":"turtle","3":"fantastic","4":"dance"},"opponent_triplet":["dance","fantastic","turtle"],"seed_index":16,"triplet_contract":"EXT12-B02","xmage_starting_player_seat_0_based":3,"xmage_starting_player_seat_1_based":4}
