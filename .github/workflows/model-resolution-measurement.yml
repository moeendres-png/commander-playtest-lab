name: Model Resolution Measurement

on:
  pull_request:
    paths:
      - "src/commander_lab/model_resolution_measurement.py"
      - "src/commander_lab/model_resolution_software_identity.py"
      - "src/commander_lab/current_model_resolution.py"
      - "src/commander_lab/whole_deck/**"
      - "src/commander_lab/optimizer_v2_cli.py"
      - "tests/unit/test_model_resolution_measurement.py"
      - "tests/unit/test_model_resolution_software_identity.py"
      - "tests/unit/test_current_model_resolution.py"
      - "tests/unit/test_optimizer_v2_decision_runtime.py"
      - "data/diagnostics/MODEL_RESOLUTION_CURRENT.json"
      - "data/decision/DECISION_CONTRACT_CURRENT.json"
      - "docs/decision_quality/MODEL_PRECISION_POLICY_CURRENT.md"
      - ".github/workflows/model-resolution-measurement.yml"
      - "src/commander_lab/__init__.py"
      - "src/commander_lab/agents/**"
      - "src/commander_lab/candidates/**"
      - "src/commander_lab/canonical_features.py"
      - "src/commander_lab/cards/**"
      - "src/commander_lab/counterfactual.py"
      - "src/commander_lab/decision_statistics.py"
      - "src/commander_lab/deck_registry.py"
      - "src/commander_lab/engine/**"
      - "src/commander_lab/fresh_rebuild.py"
      - "src/commander_lab/mana_analysis.py"
      - "src/commander_lab/meta/**"
      - "src/commander_lab/models/**"
      - "src/commander_lab/mulligan/**"
      - "src/commander_lab/optimization/**"
      - "src/commander_lab/pod_scheduling.py"
      - "src/commander_lab/pod_scheduling_5p.py"
      - "src/commander_lab/project_context.py"
      - "src/commander_lab/repositories/**"
      - "src/commander_lab/semantic_features.py"
      - "src/commander_lab/storage/**"
      - "src/commander_lab/technical_truth.py"
      - "tests/conftest.py"
      - "src/commander_lab/semantic_replay/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes its obsolete run. Every other run
  # (each push to main, each manual dispatch) has its own group, so every
  # merged head keeps its own evidence instead of being cancelled by the next.
  group: model-resolution-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  legacy-resolution-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Preserve legacy measurement implementation as provenance
        run: >-
          pytest -q
          tests/unit/test_model_resolution_measurement.py
          tests/unit/test_model_resolution_software_identity.py
          tests/unit/test_current_model_resolution.py
      - name: Verify 2F replaces the legacy hard gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('data/decision/DECISION_CONTRACT_CURRENT.json').read_text())
          if contract.get('precision_contract_id') != 'rogshai-hybrid-sequential-2F-v1':
              raise SystemExit('current decision contract is not 2F')
          practical = contract.get('practical_effect')
          if not isinstance(practical, dict) or practical.get('sesoi_is_model_precision') is not False:
              raise SystemExit('SESOI and Model Precision were re-coupled')

          policy = Path('docs/decision_quality/MODEL_PRECISION_POLICY_CURRENT.md').read_text()
          required = (
              'The former single hard gate',
              'is retired for candidate promotion, elimination and equivalence decisions',
              'instead of one scalar resolution number',
          )
          for marker in required:
              if marker not in policy:
                  raise SystemExit(f'precision policy lost retirement marker: {marker}')

          runtime = Path(
              'src/commander_lab/whole_deck/optimizer_v2_decision_runtime.py'
          ).read_text()
          forbidden = (
              'load_current_model_resolution',
              'CURRENT_MODEL_RESOLUTION_PATH',
              'effective_resolution',
          )
          for marker in forbidden:
              if marker in runtime:
                  raise SystemExit(f'legacy resolution hard gate leaked into 1E/2F runtime: {marker}')

          historical = json.loads(Path('data/diagnostics/MODEL_RESOLUTION_CURRENT.json').read_text())
          if historical.get('evidence_class') != 'structural_model_estimates':
              raise SystemExit('legacy measurement lost its evidence boundary')
          if historical.get('sealed_holdout_evidence_consumed') is not False:
              raise SystemExit('legacy measurement consumed sealed holdout evidence')
          if historical.get('candidate_search_performed') is not False:
              raise SystemExit('legacy measurement performed candidate search')
          PY
      - name: Assert tracked repository remains clean
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
