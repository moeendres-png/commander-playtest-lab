name: WS-29 Wizards Authority Acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - ws29/canonical-authority-closure
    paths:
      - '.github/workflows/ws29-wizards-authority.yml'
      - 'scripts/ws29_fetch_wizards_authority.py'
      - 'scripts/ws29_fetch_gatherer_corpus.py'

permissions:
  contents: read

jobs:
  direct-wizards-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire raw official CR bytes and probe Gatherer
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws29/network
          python scripts/ws29_fetch_wizards_authority.py artifacts/ws29/network | tee artifacts/ws29/network/RUN_OUTPUT.json

      - name: Acquire 29-card current Oracle corpus from public Gatherer
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws29/gatherer
          python scripts/ws29_fetch_gatherer_corpus.py artifacts/ws29/gatherer | tee artifacts/ws29/gatherer/RUN_OUTPUT.txt

      - name: Validate metadata-only evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/ws29')
          cr = json.loads((root / 'network' / 'CR_RAW_ACQUISITION.json').read_text())
          gatherer = json.loads((root / 'network' / 'GATHERER_ACCESS.json').read_text())
          corpus = json.loads((root / 'gatherer' / 'GATHERER_29_CARD_ORACLE_LOCK.json').read_text())
          assert cr['official_cr_raw_bytes'] in {'PASS', 'UNKNOWN'}, cr
          for source in cr['sources'].values():
              if source.get('sha256') is not None:
                  assert len(source['sha256']) == 64, source
          assert gatherer['gatherer_direct_access'] == 'PASS', gatherer
          assert corpus['card_count'] == 29, corpus
          assert len(corpus['records']) == 29, corpus
          assert [r['fixture_id'] for r in corpus['records']] == [f'CARD_{i:02d}' for i in range(1, 30)]
          for r in corpus['records']:
              assert r['search']['requested_url'].startswith('https://gatherer.wizards.com/')
              if r['current_oracle_fetch_status'] == 'FULL_CURRENT_ORACLE_LOCK':
                  assert r['detail']['http_status'] == 200
                  assert r['detail']['extracted']['expected_name_present'] is True
                  assert r['detail']['extracted']['rules_text_label_present'] is True
                  assert len(r['detail']['sha256']) == 64
          print('WS29 terminal metadata validation PASS')
          print('FULL_CURRENT_ORACLE_LOCK', corpus['full_current_oracle_lock_count'], '/ 29')
          PY

      - name: Prove no raw CR or raw HTML is retained
        run: |
          set -euo pipefail
          if find artifacts/ws29 -type f \( -iname '*.pdf' -o -iname '*.html' -o -iname '*.htm' -o -iname '*.docx' \) | grep -q .; then
            echo 'Raw copyrighted/network document unexpectedly retained' >&2
            find artifacts/ws29 -type f -maxdepth 3 -print >&2
            exit 1
          fi

      - name: Upload metadata-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws29-wizards-authority-evidence
          path: artifacts/ws29/
          if-no-files-found: error
          retention-days: 30
