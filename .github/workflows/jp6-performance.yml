name: Historical J-P6 Performance Evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with: {python-version: '3.12'}
      - name: Install project
        run: python -m pip install -e .
      - name: Verify historical benchmark policy and baseline identity
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path('config/J_P6_BENCHMARK_POLICY_v1.json').read_text())
          f=json.loads(Path('docs/J_P6_BASELINE_FREEZE.json').read_text())
          assert p['baseline_main_commit']=='0d5dbc633d0776f72e80e271e52234018e80e307'
          assert p['baseline_main_tree']=='169fee0f88b550f5897324b14451b1086c0b3617'
          assert f['p5_holdout_evaluation_count']==1
          assert f['p5_post_holdout_tuning'] is False
          assert f['p5_holdout_sha256']=='b75e8622097221b00ad51322e2ad13fe5158cfd8647e92d2cb21a0d65b447203'
          print('historical_evidence_only=true')
          print('head', subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY
      - name: Run reproducible historical policy profile on requested ref
        run: python scripts/run_j_p6_profile.py --label final_branch --output J_P6_FINAL_PROFILE.json
      - name: Assert profiler leaves tracked tree clean
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: historical-jp6-performance-${{ github.sha }}
          path: artifacts/j_p6/J_P6_FINAL_PROFILE.json
          if-no-files-found: error
