name: Materialize validated post-1.17 fixes

on:
  push:
    branches:
      - fix/post-117-semantic-execution

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Fix semantic frontier and execution envelope [fix54-55-applied]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_post117_fixes.py
      - name: Install dev package
        run: python -m pip install -e '.[dev]'
      - name: Normalize generated regression test
        run: |
          ruff check --fix tests/unit/test_post117_semantic_execution_fixes.py
          ruff format tests/unit/test_post117_semantic_execution_fixes.py
      - name: Focused validation
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy --strict src
          python -m compileall -q src tests
          pytest -q tests/unit/test_candidate_screening.py tests/unit/test_semantic_evidence.py tests/unit/test_priority_workflows.py tests/unit/test_post117_semantic_execution_fixes.py
      - name: Commit validated fixes
        shell: bash
        run: |
          git diff --check
          git config user.name 'OpenAI project agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml CHANGELOG.md src tests/unit/test_post117_semantic_execution_fixes.py
          git commit -m 'Fix semantic frontier and execution envelope [fix54-55-applied]'
          git push origin HEAD:fix/post-117-semantic-execution
