name: J-P2 Ruff Format Diagnostic

on:
  push:
    branches:
      - diag/j-p2-ruff-format

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Install exact formatter
        run: python -m pip install ruff==0.16.2
      - name: Format lifecycle test and remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          ruff format tests/unit/test_j_p0_run_identity.py
          git rm .github/workflows/j-p2-ruff-format-diagnostic.yml
          ruff format --check tests/unit/test_j_p0_run_identity.py
          git diff --check
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(J-P2): materialize exact Ruff formatting'
          git push origin HEAD:diag/j-p2-ruff-format
