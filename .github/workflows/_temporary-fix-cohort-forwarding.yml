name: Temporary cohort diagnose forwarding patch

on:
  push:
    branches:
      - fix/cohort-diagnose-forwarding-1181

permissions:
  contents: write

concurrency:
  group: temporary-cohort-forwarding-1181
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/cohort-diagnose-forwarding-1181
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply narrowly scoped patch and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          service_path = Path('src/commander_lab/tools/service.py')
          service = service_path.read_text(encoding='utf-8')
          pattern = r'PriorityWorkflowFacade\.diagnose_next_experiment\(request\.comparison\)'
          replacement = '''PriorityWorkflowFacade.diagnose_next_experiment(
                        request.comparison,
                        cohort_comparisons=tuple(request.cohort_comparisons),
                        opponent_evidence_quality=dict(request.opponent_evidence_quality),
                        failure_mode_metrics=tuple(request.failure_mode_metrics),
                    )'''
          service, count = re.subn(pattern, replacement, service)
          if count != 1:
              raise SystemExit(f'expected exactly one public diagnose forwarding call, found {count}')
          service_path.write_text(service, encoding='utf-8')

          init_path = Path('src/commander_lab/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          if init_text.count('__version__ = "1.18.0"') != 1:
              raise SystemExit('unexpected package __version__ before 1.18.1 patch')
          init_path.write_text(
              init_text.replace('__version__ = "1.18.0"', '__version__ = "1.18.1"'),
              encoding='utf-8',
          )

          pyproject_path = Path('pyproject.toml')
          pyproject = pyproject_path.read_text(encoding='utf-8')
          if pyproject.count('version = "1.18.0"') != 1:
              raise SystemExit('unexpected pyproject version before 1.18.1 patch')
          pyproject_path.write_text(
              pyproject.replace('version = "1.18.0"', 'version = "1.18.1"'),
              encoding='utf-8',
          )

          test_lines = [
              'from __future__ import annotations',
              '',
              'from commander_lab.models.tooling import DeckDecisionDiagnoseInput',
              'from commander_lab.tools import CommanderToolService',
              '',
              '',
              'def test_public_diagnose_forwards_cohort_context(repo_root):',
              '    service = CommanderToolService(repo_root)',
              '    comparison = {',
              '        "status": "completed",',
              '        "paired": {',
              '            "placement_improvement": 0.0,',
              '            "confidence_interval": [-0.10, 0.10],',
              '            "monte_carlo_standard_error": 0.05,',
              '            "baseline_place_1_share": 0.95,',
              '        },',
              '        "paired_observations": [',
              '            {"starting_player_seat": 1, "baseline_placement": 1},',
              '            {"starting_player_seat": 2, "baseline_placement": 1},',
              '        ],',
              '        "precision_context": {',
              '            "current_iterations": 64,',
              '            "preregistered_precision_ceiling": 1024,',
              '            "additional_precision_authorized": False,',
              '        },',
              '    }',
              '    cohort = tuple(dict(comparison) for _ in range(8))',
              '    request = DeckDecisionDiagnoseInput(',
              '        comparison=comparison,',
              '        cohort_comparisons=cohort,',
              '        opponent_evidence_quality={"synthetic_assumption": 8},',
              '        failure_mode_metrics=("average_placement", "average_commander_damage"),',
              '    )',
              '',
              '    response = service.deck_decision_diagnose(request)',
              '',
              '    assert response.status.value == "completed"',
              '    assert response.result["model_informativeness"]["status"] == "MODEL_INFORMATION_LIMIT"',
              '    assert (',
              '        response.result["decision_information_state"]["status"]',
              '        == "MODEL_NEEDS_DIFFERENT_METRIC"',
              '    )',
              '    assert response.result["next_experiment"] == "diagnose_model_information_before_more_seed_work"',
          ]
          test_path = Path('tests/regressions/test_public_diagnose_cohort_forwarding.py')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('\n'.join(test_lines) + '\n', encoding='utf-8')

          Path('.github/workflows/_temporary-fix-cohort-forwarding.yml').unlink()
          PY
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format and statically validate patch
        run: |
          python -m ruff format src/commander_lab/tools/service.py tests/regressions/test_public_diagnose_cohort_forwarding.py src/commander_lab/__init__.py
          python -m ruff check src/commander_lab/tools/service.py tests/regressions/test_public_diagnose_cohort_forwarding.py src/commander_lab/__init__.py
          python -m ruff format --check src/commander_lab/tools/service.py tests/regressions/test_public_diagnose_cohort_forwarding.py src/commander_lab/__init__.py
          python -m compileall -q src/commander_lab
      - name: Create clean local checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix cohort diagnose context forwarding'
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run regression and focused decision tests
        run: |
          pytest -q tests/regressions/test_public_diagnose_cohort_forwarding.py
          pytest -q -k 'decision_information or model_informativeness or priority_workflow'
      - name: Verify package version
        run: |
          python - <<'PY'
          import commander_lab
          assert commander_lab.__version__ == '1.18.1'
          print(commander_lab.__version__)
          PY
      - name: Push validated patch commit
        run: git push origin HEAD:fix/cohort-diagnose-forwarding-1181
