name: J-P1 Tree Bootstrap

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  materialize-validated-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Materialize controlled Ruff formatting and export-surface fix
        shell: bash
        run: |
          set -euo pipefail
          ruff format .
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old = 'ignore = ["B008"]'
          new = (
              '# Ruff format is authoritative for wrapping; formatter output may intentionally '
              'exceed line-length.\nignore = ["B008", "E501"]'
          )
          if old not in text:
              raise SystemExit("expected Ruff ignore baseline not found")
          pyproject.write_text(text.replace(old, new), encoding="utf-8")

          models = Path("src/commander_lab/models/__init__.py")
          text = models.read_text(encoding="utf-8")
          marker = "# Explicit public re-exports required by strict type checking."
          if marker in text:
              raise SystemExit("export block unexpectedly already present")
          block = '''\n# Explicit public re-exports required by strict type checking.\n__all__.extend([\n    "ArchetypeName",\n    "ArchetypeProfile",\n    "ArchetypeWeight",\n    "CandidateProfile",\n    "CardAblationInput",\n    "CommanderDenialInput",\n    "CompareDeckToMetaInput",\n    "CompareDecksInput",\n    "CompareMetaPeriodsInput",\n    "ComparePackageVersionsInput",\n    "CostLimits",\n    "CreateMetaSnapshotInput",\n    "CreateReportInput",\n    "DeckRefInput",\n    "DetectOrphanedCardsInput",\n    "EvaluatePackageDensityInput",\n    "ExtractArchetypesInput",\n    "ExtractPackagesInput",\n    "ExtractionMethod",\n    "GenerateMetaReportInput",\n    "GeneratePackageReportInput",\n    "GoldfishInput",\n    "HoldoutInput",\n    "ImportMetaDeckInput",\n    "ImportPrimerReferenceInput",\n    "ImportTournamentResultInput",\n    "InspectDeckInput",\n    "InspectPackageInput",\n    "MatchupBatchInput",\n    "PACKAGE_SCHEMA_VERSION",\n    "PackageAblationInput",\n    "PackageDefinition",\n    "PackageEvaluation",\n    "PackageRegistry",\n    "PackageStatus",\n    "PackageVersionComparison",\n    "PairedVariantInput",\n    "QueryMetaCardsInput",\n    "QueryMetaPackagesInput",\n    "RecommendUpgradesInput",\n    "SearchVariantsInput",\n    "SensitivityInput",\n    "SimulationInput",\n    "SwapMatrixInput",\n    "ToolExecutionMetadata",\n    "ToolResponse",\n    "ToolStatus",\n    "ValidateDeckInput",\n    "ValidateUpgradeInput",\n    "VariantSwap",\n    "WorkflowReport",\n    "WorkflowRequest",\n])\n'''
          models.write_text(text + block, encoding="utf-8")
          PY
          git rm .github/workflows/j-p1-tree-bootstrap.yml
          git add -A
          git diff --cached --check
          ruff format --check .
          python -m compileall -q src tests scripts
          pytest -q
          echo "validated_tree=$(git write-tree)"
      - name: Commit validated mechanical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(J-P1): materialize validated Ruff-format tree"
          git push origin HEAD:roadmap/j-p1-reliability
