name: J-P1 Controlled Quality Materialization

on:
  push:
    branches:
      - roadmap/j-p1-reliability

permissions:
  contents: write

jobs:
  materialize-controlled-quality-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5 immutable revision
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify expected starting lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2ebaba6c8058a95adeb3532c871bf86de91a7489"
      - name: Install exact project quality toolchain
        run: python -m pip install -e '.[dev,api,openai]'
      - name: Materialize controlled quality-only transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old = 'ignore = ["B008"]'
          new = (
              '# Ruff format is authoritative for wrapping; E501 can conflict with formatter output.\n'
              'ignore = ["B008", "E501"]'
          )
          if old in text:
              text = text.replace(old, new)
          elif 'ignore = ["B008", "E501"]' not in text:
              raise SystemExit("unexpected Ruff ignore configuration")
          pyproject.write_text(text, encoding="utf-8")

          models = Path("src/commander_lab/models/__init__.py")
          text = models.read_text(encoding="utf-8")
          marker = "# Explicit public re-exports required by strict type checking."
          if marker not in text:
              block = '''\n# Explicit public re-exports required by strict type checking.\n__all__.extend([\n    "ArchetypeName",\n    "ArchetypeProfile",\n    "ArchetypeWeight",\n    "CandidateProfile",\n    "CardAblationInput",\n    "CommanderDenialInput",\n    "CompareDeckToMetaInput",\n    "CompareDecksInput",\n    "CompareMetaPeriodsInput",\n    "ComparePackageVersionsInput",\n    "CostLimits",\n    "CreateMetaSnapshotInput",\n    "CreateReportInput",\n    "DeckRefInput",\n    "DetectOrphanedCardsInput",\n    "EvaluatePackageDensityInput",\n    "ExtractArchetypesInput",\n    "ExtractPackagesInput",\n    "ExtractionMethod",\n    "GenerateMetaReportInput",\n    "GeneratePackageReportInput",\n    "GoldfishInput",\n    "HoldoutInput",\n    "ImportMetaDeckInput",\n    "ImportPrimerReferenceInput",\n    "ImportTournamentResultInput",\n    "InspectDeckInput",\n    "InspectPackageInput",\n    "MatchupBatchInput",\n    "PACKAGE_SCHEMA_VERSION",\n    "PackageAblationInput",\n    "PackageDefinition",\n    "PackageEvaluation",\n    "PackageRegistry",\n    "PackageStatus",\n    "PackageVersionComparison",\n    "PairedVariantInput",\n    "QueryMetaCardsInput",\n    "QueryMetaPackagesInput",\n    "RecommendUpgradesInput",\n    "SearchVariantsInput",\n    "SensitivityInput",\n    "SimulationInput",\n    "SwapMatrixInput",\n    "ToolExecutionMetadata",\n    "ToolResponse",\n    "ToolStatus",\n    "ValidateDeckInput",\n    "ValidateUpgradeInput",\n    "VariantSwap",\n    "WorkflowReport",\n    "WorkflowRequest",\n])\n'''
              models.write_text(text + block, encoding="utf-8")
          PY

          # Mechanical formatter plus Ruff's safe fixes only.
          ruff format .
          ruff check . --fix || true
          ruff format .

          # Bootstrap is temporary and must not survive in the product tree.
          git rm .github/workflows/j-p1-tree-bootstrap.yml
          git add -A
          git diff --cached --check
          ruff format --check .

          # Canonical RunIdentity tests require a clean committed software tree.
          # Create the candidate commit locally first; do not push until every gate below passes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(J-P1): materialize tested Ruff quality cleanup"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
      - name: Compile candidate clean tree
        run: python -m compileall -q src tests scripts
      - name: Test candidate clean tree
        run: pytest -q
      - name: Record remaining strict-quality diagnostics
        shell: bash
        run: |
          set +e
          ruff check . --statistics
          mypy src/commander_lab
          exit 0
      - name: Push tested candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:roadmap/j-p1-reliability
