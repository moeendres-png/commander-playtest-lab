name: J-FINAL Scope Repair Materializer

on:
  push:
    branches:
      - j-final/rogshai-scope-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: j-final/rogshai-scope-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize bounded J-FINAL repair
        run: |
          python scripts/j_final_scope_materialize.py
          python scripts/j_final_scope_materialize_models.py
      - name: Commit materialized changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No materialized changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commander_lab/tools/service.py src/commander_lab/fresh_rebuild.py src/commander_lab/priority_workflows.py src/commander_lab/models/tooling.py
          git diff --cached --check
          git commit -m "J-FINAL: materialize RogShai-only scope repair"
          git push origin HEAD:j-final/rogshai-scope-repair
