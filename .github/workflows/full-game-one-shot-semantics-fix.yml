name: Full Game One-Shot Semantics Hardening

on:
  push:
    branches:
      - engine/xmage-full-game-external-pilots
    paths:
      - .github/workflows/full-game-one-shot-semantics-fix.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: engine/xmage-full-game-external-pilots
          fetch-depth: 0
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - name: Apply reproducibility, pilot-authority, and transcript-redaction hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          py = Path('src/commander_lab/engine/rules/full_game.py')
          text = py.read_text(encoding='utf-8')
          text = text.replace(
              '        rng = self._rng(decision_id, seat)\n',
              '        decision_offset = int(request.get("decision_offset", -1))\n'
              '        if decision_offset < 1:\n'
              '            raise FullGameProtocolError("decision_offset must be a positive integer")\n'
              '        rng = self._rng(decision_offset, decision_class, seat)\n',
              1,
          )
          text = text.replace(
              '        elif decision_class in {"announce_x", "amount", "multi_amount"}:\n'
              '            numeric_choice = self._decide_numeric(context)\n'
              '        elif decision_class == "mana_payment":\n'
              '            selected = [self._decide_mana(options)]\n'
              '        elif decision_class == "choose_use":\n'
              '            selected = [self._decide_boolean(options, context)]\n'
              '        elif decision_class == "pile":\n'
              '            selected = [self._decide_pile(options, context)]\n',
              '        elif decision_class in {"announce_x", "amount", "multi_amount"}:\n'
              '            numeric_choice = self._decide_numeric(runtime, pilot_state, context, rng)\n'
              '        elif decision_class == "mana_payment":\n'
              '            selected = [self._decide_mana(runtime, pilot_state, options, rng)]\n'
              '        elif decision_class == "choose_use":\n'
              '            selected = [\n'
              '                self._decide_boolean(runtime, pilot_state, options, context, rng)\n'
              '            ]\n'
              '        elif decision_class == "pile":\n'
              '            selected = [self._decide_pile(runtime, pilot_state, options, context, rng)]\n',
              1,
          )
          text = text.replace(
              '            if decision_class == "target_amount":\n'
              '                numeric_choice = self._decide_numeric(context)\n',
              '            if decision_class == "target_amount":\n'
              '                numeric_choice = self._decide_numeric(runtime, pilot_state, context, rng)\n',
              1,
          )
          text = text.replace(
              '        desired = "keep" if keep else "mulligan"\n',
              '        if self._mulligan_count[seat] >= 3:\n'
              '            keep = True\n'
              '        desired = "keep" if keep else "mulligan"\n',
              1,
          )

          start = text.index('    def _decide_boolean(')
          end = text.index('    def _decide_attack(', start)
          replacement = '''    def _decide_boolean(\n        self,\n        runtime: _RuntimePilot,\n        state: dict[str, Any],\n        options: list[dict[str, Any]],\n        context: dict[str, Any],\n        rng: random.Random,\n    ) -> str:\n        if not options:\n            raise FullGameProtocolError("boolean decision has no legal options")\n        outcome = str(context.get("outcome", "neutral")).casefold()\n        actions: list[PilotActionView] = []\n        for option in options:\n            metadata = option.get("metadata")\n            value = metadata.get("value") if isinstance(metadata, dict) else None\n            if not isinstance(value, bool):\n                raise FullGameProtocolError("boolean option is missing explicit boolean value")\n            aligned = (\n                (value and outcome in {"benefit", "benefit_to_controller"})\n                or (not value and outcome in {"detriment", "detriment_to_controller"})\n            )\n            actions.append(\n                PilotActionView(\n                    action_id=self._required_text(option, "option_id"),\n                    action_kind="card",\n                    card_name=str(option.get("label", value)),\n                    floor_value=0.8 if aligned else 0.35,\n                    immediate_impact=0.45 if aligned else 0.15,\n                    metadata={"boolean_value": value, "decision_outcome": outcome},\n                )\n            )\n        decision = runtime.pilot.choose_action(self._pilot_state(runtime, state), actions, rng)\n        if decision.selected_action_id is None:\n            raise FullGameProtocolError("Commander Lab pilot returned no boolean decision")\n        return decision.selected_action_id\n\n    def _decide_pile(\n        self,\n        runtime: _RuntimePilot,\n        state: dict[str, Any],\n        options: list[dict[str, Any]],\n        context: dict[str, Any],\n        rng: random.Random,\n    ) -> str:\n        if not options:\n            raise FullGameProtocolError("pile decision has no legal options")\n        outcome = str(context.get("outcome", "benefit")).casefold()\n        benefit = outcome not in {"detriment", "detriment_to_controller"}\n        actions: list[PilotActionView] = []\n        for option in options:\n            metadata = option.get("metadata")\n            cards = metadata.get("cards", []) if isinstance(metadata, dict) else []\n            size = len(cards) if isinstance(cards, list) else 0\n            scaled = min(2.0, size / 4.0)\n            actions.append(\n                PilotActionView(\n                    action_id=self._required_text(option, "option_id"),\n                    action_kind="card",\n                    card_name=str(option.get("label", "Pile")),\n                    floor_value=(0.4 + scaled * 0.25) if benefit else max(0.0, 0.9 - scaled * 0.25),\n                    immediate_impact=(0.3 + scaled * 0.2) if benefit else max(0.0, 0.7 - scaled * 0.2),\n                    metadata={"pile_size": size, "decision_outcome": outcome},\n                )\n            )\n        decision = runtime.pilot.choose_action(self._pilot_state(runtime, state), actions, rng)\n        if decision.selected_action_id is None:\n            raise FullGameProtocolError("Commander Lab pilot returned no pile decision")\n        return decision.selected_action_id\n\n    def _decide_mana(\n        self,\n        runtime: _RuntimePilot,\n        state: dict[str, Any],\n        options: list[dict[str, Any]],\n        rng: random.Random,\n    ) -> str:\n        if not options:\n            raise FullGameProtocolError("mana decision has no legal options")\n        actions: list[PilotActionView] = []\n        for option in options:\n            option_type = self._required_text(option, "option_type")\n            actions.append(\n                PilotActionView(\n                    action_id=self._required_text(option, "option_id"),\n                    action_kind="pass" if option_type == "cancel_mana_payment" else "card",\n                    card_name=str(option.get("label", option_type)),\n                    floor_value=0.1 if option_type == "cancel_mana_payment" else 0.75,\n                    immediate_impact=0.0 if option_type == "cancel_mana_payment" else 0.55,\n                    metadata={"xmage_option_type": option_type},\n                )\n            )\n        decision = runtime.pilot.choose_action(self._pilot_state(runtime, state), actions, rng)\n        if decision.selected_action_id is None:\n            raise FullGameProtocolError("Commander Lab pilot returned no mana decision")\n        return decision.selected_action_id\n\n    def _decide_numeric(\n        self,\n        runtime: _RuntimePilot,\n        state: dict[str, Any],\n        context: dict[str, Any],\n        rng: random.Random,\n    ) -> int:\n        if "numeric_min" not in context or "numeric_max" not in context:\n            raise FullGameProtocolError("numeric decision missing explicit bounds")\n        minimum = int(context["numeric_min"])\n        maximum = int(context["numeric_max"])\n        if maximum < minimum:\n            raise FullGameProtocolError("numeric decision has reversed bounds")\n        outcome = str(context.get("outcome", "benefit")).casefold()\n        if maximum - minimum <= 16:\n            values = list(range(minimum, maximum + 1))\n        else:\n            midpoint = minimum + (maximum - minimum) // 2\n            values = sorted({minimum, midpoint, maximum})\n        benefit = outcome not in {"detriment", "detriment_to_controller"}\n        span = max(1, maximum - minimum)\n        actions = [\n            PilotActionView(\n                action_id=f"numeric:{value}",\n                action_kind="card",\n                card_name=f"Choose {value}",\n                floor_value=(value - minimum) / span if benefit else (maximum - value) / span,\n                immediate_impact=0.5,\n                metadata={"numeric_value": value, "decision_outcome": outcome},\n            )\n            for value in values\n        ]\n        decision = runtime.pilot.choose_action(self._pilot_state(runtime, state), actions, rng)\n        if decision.selected_action_id is None:\n            raise FullGameProtocolError("Commander Lab pilot returned no numeric decision")\n        try:\n            return int(decision.selected_action_id.split(":", 1)[1])\n        except (IndexError, ValueError) as exc:\n            raise FullGameProtocolError("pilot returned malformed numeric decision") from exc\n\n'''
          text = text[:start] + replacement + text[end:]
          old_rng = '''    def _rng(self, decision_id: str, seat: int) -> random.Random:\n        digest = hashlib.sha256(f"{self.scenario_seed}:{seat}:{decision_id}".encode()).digest()\n        return random.Random(int.from_bytes(digest[:8], "big"))\n'''
          new_rng = '''    def _rng(self, decision_offset: int, decision_class: str, seat: int) -> random.Random:\n        material = f"{self.scenario_seed}:{seat}:{decision_offset}:{decision_class}"\n        digest = hashlib.sha256(material.encode()).digest()\n        return random.Random(int.from_bytes(digest[:8], "big"))\n'''
          if old_rng not in text:
              raise SystemExit('expected old rng block not found')
          py.write_text(text.replace(old_rng, new_rng, 1), encoding='utf-8')

          java = Path('engine-bridge/src/main/java/org/commanderlab/xmage/XmageFullGameDecisionController.java')
          j = java.read_text(encoding='utf-8')
          if 'recordTranscript("decision_requested", request);' not in j:
              raise SystemExit('decision request transcript marker missing')
          j = j.replace('        recordTranscript("decision_requested", request);\n', '        recordDecisionRequested(request);\n', 1)
          old_accept = '''        JsonObject accepted = new JsonObject();\n        accepted.addProperty("decision_id", decisionId);\n        accepted.addProperty("actor_id", actorId);\n        JsonArray selectedJson = new JsonArray();\n        selected.forEach(selectedJson::add);\n        accepted.add("selected_option_ids", selectedJson);\n        JsonArray orderingJson = new JsonArray();\n        ordering.forEach(orderingJson::add);\n        accepted.add("ordering", orderingJson);\n        if (numeric == null) {\n            accepted.add("numeric_choice", JsonNull.INSTANCE);\n        } else {\n            accepted.addProperty("numeric_choice", numeric);\n        }\n        recordTranscript("decision_accepted", accepted);\n'''
          new_accept = '''        recordDecisionAccepted(pendingRequest, selected, numeric);\n'''
          if old_accept not in j:
              raise SystemExit('decision accepted transcript block missing')
          j = j.replace(old_accept, new_accept, 1)
          marker = '    private void recordFailure(String message) {\n'
          helpers = '''    private void recordDecisionRequested(JsonObject request) {\n        JsonObject event = new JsonObject();\n        event.addProperty("sequence", transcript.size() + 1L);\n        event.addProperty("kind", "decision_requested");\n        event.addProperty("decision_class", request.get("decision_class").getAsString());\n        event.addProperty("actor_seat", request.get("seat").getAsInt());\n        event.addProperty("prompt", request.get("prompt").getAsString());\n        event.addProperty(\n                "public_state_reference",\n                request.get("public_state_reference").getAsString()\n        );\n        event.addProperty(\n                "private_actor_state_reference",\n                request.get("private_actor_state_reference").getAsString()\n        );\n        JsonArray types = new JsonArray();\n        JsonArray labels = new JsonArray();\n        for (JsonElement element : request.getAsJsonArray("legal_options")) {\n            JsonObject option = element.getAsJsonObject();\n            types.add(option.has("option_type") ? option.get("option_type").getAsString() : "generic");\n            labels.add(option.has("label") ? option.get("label").getAsString() : "");\n        }\n        event.add("legal_option_types", types);\n        event.add("legal_option_labels", labels);\n        transcript.add(event);\n    }\n\n    private void recordDecisionAccepted(\n            JsonObject request,\n            List<String> selected,\n            Integer numeric\n    ) {\n        JsonObject event = new JsonObject();\n        event.addProperty("sequence", transcript.size() + 1L);\n        event.addProperty("kind", "decision_accepted");\n        event.addProperty("decision_class", request.get("decision_class").getAsString());\n        event.addProperty("actor_seat", request.get("seat").getAsInt());\n        event.addProperty("prompt", request.get("prompt").getAsString());\n        JsonArray selectedTypes = new JsonArray();\n        JsonArray selectedLabels = new JsonArray();\n        for (String selectedId : selected) {\n            for (JsonElement element : request.getAsJsonArray("legal_options")) {\n                JsonObject option = element.getAsJsonObject();\n                if (option.has("option_id")\n                        && selectedId.equals(option.get("option_id").getAsString())) {\n                    selectedTypes.add(\n                            option.has("option_type")\n                                    ? option.get("option_type").getAsString()\n                                    : "generic"\n                    );\n                    selectedLabels.add(\n                            option.has("label") ? option.get("label").getAsString() : ""\n                    );\n                    break;\n                }\n            }\n        }\n        event.add("selected_option_types", selectedTypes);\n        event.add("selected_option_labels", selectedLabels);\n        if (numeric == null) {\n            event.add("numeric_choice", JsonNull.INSTANCE);\n        } else {\n            event.addProperty("numeric_choice", numeric);\n        }\n        transcript.add(event);\n    }\n\n'''
          if marker not in j:
              raise SystemExit('recordFailure marker missing')
          java.write_text(j.replace(marker, helpers + marker, 1), encoding='utf-8')

          player = Path('engine-bridge/src/main/java/org/commanderlab/xmage/XmageFullGamePlayer.java')
          p = player.read_text(encoding='utf-8')
          p = p.replace('return chooseTargetInternal(false, target, source, game, null, null);', 'return chooseTargetInternal(outcome, false, target, source, game, null, null);')
          p = p.replace('return chooseTargetInternal(false, target, source, game, null, context);', 'context.addProperty("outcome", outcome == null ? "neutral" : outcome.name().toLowerCase());\n        return chooseTargetInternal(outcome, false, target, source, game, null, context);')
          p = p.replace('return chooseTargetInternal(false, target, source, game, cards, null);', 'return chooseTargetInternal(outcome, false, target, source, game, cards, null);')
          p = p.replace('return chooseTargetInternal(true, target, source, game, null, null);', 'return chooseTargetInternal(outcome, true, target, source, game, null, null);')
          p = p.replace('return chooseTargetInternal(true, target, source, game, cards, null);', 'return chooseTargetInternal(outcome, true, target, source, game, cards, null);')
          p = p.replace('        context.addProperty("amount_remaining", remaining);\n', '        context.addProperty("amount_remaining", remaining);\n        context.addProperty("outcome", outcome == null ? "neutral" : outcome.name().toLowerCase());\n', 1)
          p = p.replace('        return chooseBoolean(message, "choose_use", "Yes", "No", source, game);\n', '        JsonObject context = new JsonObject();\n        context.addProperty("outcome", outcome == null ? "neutral" : outcome.name().toLowerCase());\n        return chooseBoolean(message, "choose_use", "Yes", "No", source, game, context);\n', 1)
          p = p.replace('        JsonObject context = new JsonObject();\n        if (secondMessage != null) {', '        JsonObject context = new JsonObject();\n        context.addProperty("outcome", outcome == null ? "neutral" : outcome.name().toLowerCase());\n        if (secondMessage != null) {', 1)
          p = p.replace('                options,\n                new JsonObject(),\n                null\n        ));\n        String value = choices.get(selected);', '                options,\n                outcomeContext(outcome),\n                null\n        ));\n        String value = choices.get(selected);', 1)
          p = p.replace('                options,\n                new JsonObject(),\n                null\n        ));\n        return first.equals(selected);', '                options,\n                outcomeContext(outcome),\n                null\n        ));\n        return first.equals(selected);', 1)
          p = p.replace('    private boolean chooseTargetInternal(\n            boolean targeted,', '    private boolean chooseTargetInternal(\n            Outcome outcome,\n            boolean targeted,', 1)
          p = p.replace('        context.addProperty("targeted", targeted);\n', '        context.addProperty("targeted", targeted);\n        context.addProperty("outcome", outcome == null ? "neutral" : outcome.name().toLowerCase());\n', 1)
          helper_marker = '    private boolean chooseBoolean(\n'
          helper = '''    private static JsonObject outcomeContext(Outcome outcome) {\n        JsonObject context = new JsonObject();\n        context.addProperty(\n                "outcome",\n                outcome == null ? "neutral" : outcome.name().toLowerCase()\n        );\n        return context;\n    }\n\n'''
          if helper_marker not in p:
              raise SystemExit('chooseBoolean marker missing')
          player.write_text(p.replace(helper_marker, helper + helper_marker, 1), encoding='utf-8')
          PY
          python -m pip install 'ruff==0.16.4'
          ruff check --fix src/commander_lab/engine/rules/full_game.py
          ruff format src/commander_lab/engine/rules/full_game.py
          rm .github/workflows/full-game-one-shot-semantics-fix.yml
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/commander_lab/engine/rules/full_game.py engine-bridge/src/main/java/org/commanderlab/xmage/XmageFullGameDecisionController.java engine-bridge/src/main/java/org/commanderlab/xmage/XmageFullGamePlayer.java .github/workflows/full-game-one-shot-semantics-fix.yml
          git diff --cached --check
          git commit -m 'fix: harden full-game pilot semantics and transcript privacy'
          git push origin HEAD:engine/xmage-full-game-external-pilots
