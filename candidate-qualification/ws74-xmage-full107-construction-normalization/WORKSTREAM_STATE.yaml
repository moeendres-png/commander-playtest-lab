- D4_SINGLE_JVM_SEQUENTIAL: one JVM constructs all 107 in fresh games each
  (WS54-proven cross-game isolation) plus isolated single-fixture JVM spot checks.
- D5_LOAD_BOUNDARY: external-control lane paused at the first precombat-main
  priority (turn 1, active P1, priority P1).
- D6_STARTUP_PASSES: resolving pre-boundary upkeep/draw priorities through qualified
  provider pass machinery is game-startup completion, not Full107 behavior; the
  pending boundary decision is never resolved by staging.
- D7_MODE_LABEL: requested stack mode labels derive from native engine mode texts
  by a fixed token-subset rule on both sides.
- D8_ACQUIRED_KNOWLEDGE: known lists derive from native knowledge traces
  (lookedAt per viewer, grant-backed revealed membership); ambient public
  visibility stays implicit per the contract's empty rows.
- D10_LOOK_TRACES: acquisition looks recorded via the public lookedAt container
  API (the UI-update event path clears traces immediately); no game action
  intervenes before readback. Permission-exercise looks leave no trace.
- D9_ZERO_COUNTERS: zero-valued requested counters with natively absent counters
  are carried as confirmed-absent; every nonzero counter compares exactly.
