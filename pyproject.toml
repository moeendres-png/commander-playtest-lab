[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-collection-deckbuilder"
version = "0.1.0"
description = "Standalone local MTG Commander deckbuilder, collection import, Scryfall normalization and cache"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["openpyxl>=3.1,<4", "python-multipart>=0.0.20,<1", "ijson>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.27,<1"]

[project.scripts]
mtg-deckbuilder = "commander_lab.studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"commander_lab.studio" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
