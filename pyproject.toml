[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-playtest-lab"
version = "1.20.3"
description = "Reproducible Commander deck import, validation, simulation, and optimization laboratory."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Moritz Endres" }]
dependencies = [
  "pydantic>=2.10,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.4,<2",
  "hypothesis>=6.120,<7",
  "httpx2>=2.7,<3",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-openpyxl>=3.1,<4",
  "types-PyYAML>=6.0,<7",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
openai = [
  "openai>=2.45,<3",
  "openai-agents>=0.18.3,<0.19",
]

[project.scripts]
commander-lab = "commander_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commander_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: opt-in live integration test requiring external services",
]
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
  "ignore::DeprecationWarning:pydantic_core.*",
  "ignore::DeprecationWarning:fastapi.*",
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["commander_lab"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
