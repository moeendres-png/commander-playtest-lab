[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-playtest-lab"
version = "1.14.1"
description = "Reproducible Commander deck import, validation, simulation, and optimization laboratory."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Moritz Endres" }]
dependencies = [
  "pydantic>=2.10,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.4,<2",
  "hypothesis>=6.120,<7",
  "httpx2>=2.7,<3",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-openpyxl>=3.1,<4",
  "types-PyYAML>=6.0,<7",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
openai = [
  "openai>=2.45,<3",
  "openai-agents>=0.18.3,<0.19",
]

[project.scripts]
commander-lab = "commander_lab.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "property: deterministic property-style tests",
  "integration: local integration tests",
  "golden: fixed expected-decision regression tests",
  "differential: comparisons against external or normalized rule backends",
  "agent_eval: agent trajectory and report evaluation tests",
  "external: requires a configured XMage or Forge backend",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Ruff format is authoritative for wrapping; E501 can conflict with formatter output.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Re-export aggregator: imports are the public API and are intentionally staged.
"src/commander_lab/models/__init__.py" = ["F401", "E402"]
# Script bootstraps src/ before importing the package.
"scripts/run_phase86_acceptance.py" = ["E402"]
# Unicode below is intentional normalization/fuzz/fixture input.
"src/commander_lab/cards/normalize.py" = ["RUF001"]
"scripts/complete_phase12_8_10.py" = ["RUF001"]
"tests/fuzz/test_boundary_fuzz.py" = ["RUF001"]
"tests/property/test_normalization_properties.py" = ["RUF001"]
"tests/unit/test_plaintext_importer.py" = ["RUF001"]
"tests/unit/test_phase1214_rules_coverage.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["commander_lab"]

[tool.coverage.run]
source = ["commander_lab"]
branch = true
