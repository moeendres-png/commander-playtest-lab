[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-playtest-lab"
version = "1.10.3"
description = "Reproducible Commander deck import, validation, simulation, and optimization laboratory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private project - no redistribution license granted" }
authors = [{ name = "Moritz Endres" }]
dependencies = [
  "pydantic>=2.10,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "hypothesis>=6.120,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
openai = [
  "openai>=2.45,<3",
  "openai-agents>=0.18.3,<0.19",
]

[project.scripts]
commander-lab = "commander_lab.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "property: deterministic property-style tests",
  "integration: local integration tests",
  "golden: fixed expected-decision regression tests",
  "differential: comparisons against external or normalized rule backends",
  "agent_eval: agent trajectory and report evaluation tests",
  "external: requires a configured XMage or Forge backend",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["commander_lab"]

[tool.coverage.run]
source = ["commander_lab"]
branch = true
